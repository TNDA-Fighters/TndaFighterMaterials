境","ID 6 的 Opener","出哪一招？","原因"],"rows":[["空檔按 4X","空白","ID 6：後退踢","空白可起手；有方向的 ID 6 優先。"],["空檔按 4X","FALSE","ID 1：第一段","ID 6 不能起手，改選 ID 1。"],["第一段中接 4X","空白或 FALSE","ID 6：後退踢","只看 Link；4,3,6 中的 ID 6 符合輸入。"]]},"note":"ID 1 只要求 X，也符合 4X；兩列都能起手時，有方向條件的 ID 6 先被選到。"}],"topicLabel":"想一想"},{"page":14,"title":"示範需求：三段連段","demo":1,"kind":"prompt","key":"貼上需求後，依共用流程討論、確認 SPEC、實作與驗收。","location":"無","lessonRefs":[],"steps":[{"title":"本頁重點","detail":"貼上需求後，依共用流程討論、確認 SPEC、實作與驗收。","focus":[]}],"topicLabel":"示範需求","supplement":{"title":"AI實作示範","format":"conversation","markdownFile":"TNDA-week-11-講義-示範1-AI實作示範.md","markdown":"# TNDA Week 11 講義示範 1：AI 實作示範（三段連段與起手限制）\n\n> 本文件為 Unreal Engine C++ 格鬥遊戲專案（TndaFighter）中，使用者與 AI助手協作開發「三段連段與起手限制」功能的完整對話歷程記錄。\n> 涵蓋流程：專案導讀 → unreal-mcp 基準查驗 → 4 段協作提示詞規範 → 需求澄清與未決問題討論 → SPEC 規格確認 → 工單 1 C++ 實作與編譯測試（含報錯排查與修正） → 工單 2 資料表與資產 Reimport 驗收。\n\n---\n\n## 【對話 1】使用者（User）\n\n# 專案與工作範圍\n以目前資料夾的 TndaFighter.uproject 為根目錄；主要模組是 TndaFighter。\n這是 Unreal Engine C++ 格鬥遊戲；引擎版本讀 EngineAssociation。\n# 先讀文件，再對照程式\n先讀 Source/AGENTS.md 與 Source/TndaFighter/Fighting/AGENTS.md。\n接著讀 Source/TndaFighter/ 下 Fighting/README.md、DataTable/README.md，\n再依功能讀 Fighting/Docs 與相關原始碼。\n文件缺失或與程式不一致時，先查原始碼與設定；資產查詢等下一頁確認 unreal-mcp 後進行。\n# 操作與資料入口\n關卡：/Game/Fighting/stage1。U 是 X，I 是 Y；6 朝向對手、4 遠離對手。\nCSV：_DataTable/CommandTable.csv、_DataTable/DamageTable.csv。\n對應 /Game/DataTable/DT_Command、/Game/DataTable/DT_Damage；改 CSV 後 Reimport。\n動畫：/Game/Fighting/Anims/AM_Attack_01～03；右 Ctrl＋F12 切換 Combat Debug。\n# 本輪回覆格式\n成功只回一句：「專案導讀完成，可以提供需求。」\n受阻只回兩行：「阻礙：…」「下一步：…」。先完成查證，不改檔，不附摘要或重述規則。\n\n---\n\n## 【對話 2】AI助手\n\n專案導讀完成，可以提供需求。\n\n---\n\n## 【對話 3】使用者（User）\n\n# 開工前確認 unreal-mcp\n使用 unreal-mcp：http://127.0.0.1:8000/mcp。\n1. 完成 MCP 連線、取得工具並執行 Editor 唯讀查詢；只有 HTTP 回應不算通過。\n2. 透過 unreal-mcp 取得 Editor 開啟的 .uproject 完整路徑，\n   與工作資料夾的 TndaFighter.uproject 比對；只核對檔名不夠。\n3. 連線失敗、專案不符或無法確認時停止實作，排除後重新驗證。\n# 資產操作規則\n.uasset 的查詢、建立、修改、Reimport 與儲存，一律透過 unreal-mcp。\n修改前查現況，修改後回讀確認。C++、CSV 與設定文字檔使用檔案工具；\nCSV 改完後，DataTable 的 Reimport 與儲存仍透過 unreal-mcp。\n缺少所需能力時先回報並討論，不改用其他方式操作資產。\n本輪不修改功能；連線與專案確認後，接著貼四段共用提示詞。\n# 本輪回覆格式：固定三行\nunreal-mcp：可用／不可用／未確認\nEditor 專案：完整 .uproject 路徑；與工作資料夾一致／不一致／無法確認\n開工條件：已就緒／受阻；受阻時附原因與下一步\n受阻原因與下一步寫在第三行；不附前言、結語、清單或過程。未查證就寫「未確認」。\n\n---\n\n## 【對話 4】AI助手\n\nunreal-mcp：可用\nEditor 專案：D:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/TndaFighter.uproject；與工作資料夾一致\n開工條件：已就緒\n\n---\n\n## 【對話 5】使用者（User）\n\n# 共用提示詞（1／4）\n接下來四段是同一套規則，適用於後續每個功能；收到完整規則與功能需求才開始。\n本段先記住規則，等待下一段，不修改檔案。\n# 收到功能需求後\n先讀指定文件與程式，用 unreal-mcp 查相關資產，再提出尚未決定的問題。\n能自行查證的事實先查；每題附建議，一輪只問現在能回答的題目。\n我回答後再問衍生問題，全部確認後才依接下來的格式整理 SPEC。\nSPEC 給我看，我確認後才存檔；每張工單由你實作，我檢查異動並手動確認功能。\n# 開始功能前先確認基準\n保留既有改動；確認引擎、編譯工具與 TndaFighterEditor Win64 Development 建置方式。\n先讀啟動腳本，給我建置與進入 stage1 的操作步驟；等我回報基準結果，不自行執行。\n基準失敗先說明原因與下一步，不把既有問題當成本次修改造成。\n# 回覆與接續\n正常進度簡短回報；討論只列待決定問題，SPEC、異動導覽與手動驗證步驟依格式提供。\n換新對話時重貼共用開場、這四段規則與已確認 SPEC，交代目前工單進度。\n# 本輪回覆格式\n成功只回一句：「收到共用提示詞 1／4。」\n受阻只回兩行：「阻礙：…」「下一步：…」。不附摘要、解釋、重述規則或額外提問。\n\n---\n\n## 【對話 6】AI助手\n\n收到共用提示詞 1／4。\n\n---\n\n## 【對話 7】使用者（User）\n\n# 共用提示詞（2／4）：SPEC 固定格式前半\n討論完成後，SPEC 使用 Markdown，標題為「# SPEC｜功能名稱」。\n## 1. 目標與範圍\n寫目前問題、完成後的遊戲行為、本次包含與不包含的工作。\n## 2. 現況與已確認規則\n列程式與資產查證依據；規則用「條件 → 行為」表格。\n數值寫單位、方向基準與起算點，區分既有值與本次決定；未決事項不能當成已確認。\n## 3. 實作設計\n每套功能各開小節，完整展開以下五步，不能只列標題：\n1. 資料與介面：型別、初始值、單位、擁有者、公開／私有方法與輸入輸出。\n   涉及表格時列 CSV、Row、執行期副本、Reader、驗證與舊資料相容方式。\n2. Init：觸發條件、資料準備、清除舊狀態、無效輸入與重複啟動的處理。\n3. Tick：更新時機、時間來源、狀態推進與停止條件；公式附符號、單位與小算例。\n4. End：正常結束、中斷、停用與生命週期清理；哪些歸零、哪些保留、如何重啟。\n5. 接入與手動確認：呼叫者、插入位置、先後順序、保留的既有行為與建置／資產更新順序。\n# 本輪回覆格式\n成功只回一句：「收到共用提示詞 2／4。」\n受阻只回兩行：「阻礙：…」「下一步：…」。不加摘要、解釋或提問；等待下一段，不動工。\n\n---\n\n## 【對話 8】AI助手\n\n收到共用提示詞 2／4。\n\n---\n\n## 【對話 9】使用者（User）\n\n# 共用提示詞（2／4）：SPEC 固定格式前半\n討論完成後，SPEC 使用 Markdown，標題為「# SPEC｜功能名稱」。\n## 1. 目標與範圍\n寫目前問題、完成後的遊戲行為、本次包含與不包含的工作。\n## 2. 現況與已確認規則\n列程式與資產查證依據；規則用「條件 → 行為」表格。\n數值寫單位、方向基準與起算點，區分既有值與本次決定；未決事項不能當成已確認。\n## 3. 實作設計\n每套功能各開小節，完整展開以下五步，不能只列標題：\n1. 資料與介面：型別、初始值、單位、擁有者、公開／私有方法與輸入輸出。\n   涉及表格時列 CSV、Row、執行期副本、Reader、驗證與舊資料相容方式。\n2. Init：觸發條件、資料準備、清除舊狀態、無效輸入與重複啟動的處理。\n3. Tick：更新時機、時間來源、狀態推進與停止條件；公式附符號、單位與小算例。\n4. End：正常結束、中斷、停用與生命週期清理；哪些歸零、哪些保留、如何重啟。\n5. 接入與手動確認：呼叫者、插入位置、先後順序、保留的既有行為與建置／資產更新順序。\n# 本輪回覆格式\n成功只回一句：「收到共用提示詞 2／4。」\n受阻只回兩行：「阻礙：…」「下一步：…」。不加摘要、解釋或提問；等待下一段，不動工。\n\n---\n\n## 【對話 10】AI助手\n\n收到共用提示詞 2／4。\n\n---\n\n## 【對話 11】使用者（User）\n\n# 共用提示詞（4／4）：每張工單的執行方式\n# 規格確認後\n讀 SPEC 與目前工單，簡述本批範圍，等我確認後只實作這張工單。\n保留既有改動，依專案規則處理註解、行尾與文件；完成後閱讀 diff，整理異動導覽。\n資產查詢、修改、儲存、回讀與 CSV Reimport 都走 unreal-mcp；重連後核對 .uproject 完整路徑。\n需要停止 PIE、建置或重啟 Editor 時，先給我操作步驟，等我回報後繼續。\n# 完成實作後，固定交付兩段\n1. 異動導覽：檔案／資產、修改位置、改前與改後的差異、原因；指出我應檢查的內容。\n2. 手動驗證：依 SPEC 列出本批項目，包含準備、逐步操作、預期畫面或 Log、還原步驟。\n步驟要能照做，交付後等我回報；不自行跑測試、遊戲驗證或自動驗收腳本。\n# 收到我的結果後\n依回報記錄通過／失敗／未確認；沒有回報的項目不能自行判定通過。\n失敗時先問實際現象與錯誤，查原因並提出修正；修正後再給我重測步驟。\n我還原 Debug，你透過 MCP 還原測試資產；我確認後才 commit、做下一張，無 Git 則先備份。\nunreal-mcp 受阻先停止並排除，不改用其他方式操作資產。\n# 本輪回覆格式\n成功只回一句：「共用提示詞已就緒，請提供功能需求。」\n受阻只回兩行：「阻礙：…」「下一步：…」。不加摘要、解釋或提問；等待功能需求，不動工。\n\n---\n\n## 【對話 12】AI助手\n\n共用提示詞已就緒，請提供功能需求。\n\n---\n\n## 【對話 13】使用者（User）\n\n# 需求：三段連段\n我想讓玩家連按 X 打出三段，也能在第一段後改接 Y。\n請在招式表 _DataTable/CommandTable.csv（對應 DT_Command）新增 Opener，指定哪些招式可起手、哪些只能接在連段裡。\n# 規格\n- Opener 空白或 TRUE 可以起手，FALSE 只能由 Link 接出；區分大小寫，其他值視為錯誤。\n- 空檔選招看 Opener；連段中只看目前招式的 Link。\n- 按一下 X 只打一段，繼續按才接下一段；第二、三段不能單獨起手，第三段打完收招。\n- 可重用既有動畫，以不同 Command ID 區分連段步驟；保留原本其他招式。\n- 近距離第一下命中、後續順利接上時，對手來不及在中間還手。\n# 驗收目標\n- 單按 X、X→X→X、X→Y 都能正常使用；中斷後可重新起手。\n- FALSE 的招式無法從空檔使出，但能經 Link 接出；命中連段中間沒有還手空隙。\n- Opener 填錯、Link 接自己、接相同動畫或形成循環時，整表驗證失敗；無入口的 FALSE 招式只警告。\n- Reimport 後下次選招就使用新資料，原本其他招式仍正常。\n# 現在開始\n依共用提示詞先查專案，提出招式資料、接招時間與實作方案，讓我確認。\n只問未決問題並附建議；確認後整理 SPEC，再等我確認實作。\n\n---\n\n## 【對話 14】AI助手\n\n## 1. 基準確認與操作步驟\n\n依專案 [TndaFighter.uproject](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/TndaFighter.uproject) 與啟動腳本 [BuildAndLaunchGame.ps1](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Plugins/VibeUE/BuildAndLaunchGame.ps1) 查證：\n- **引擎版本**：Unreal Engine 5.8\n- **建置目標**：`TndaFighterEditor`、平台 `Win64`、組態 `Development`\n- **編譯工具**：UnrealBuildTool (`Engine\\Build\\BatchFiles\\Build.bat`)\n\n請手動執行以下步驟確認目前基準，我不會自行啟動：\n\n1. **關閉現有 Editor**（若有執行中程序）。\n2. **建置並啟動 stage1**：\n   在 PowerShell 執行：\n   ```powershell\n   powershell -ExecutionPolicy Bypass -File Plugins\\VibeUE\\BuildAndLaunchGame.ps1 -Map /Game/Fighting/stage1\n   ```\n   *（或在 Visual Studio 中選取 `Development Editor` / `Win64` 建置 `TndaFighter` 後啟動 Editor 並載入 `/Game/Fighting/stage1`）*\n3. **驗證基準**：\n   在 `/Game/Fighting/stage1` 啟動 PIE，確認目前既有功能運作正常（單按 U/X 出拳、6+U/X 踢腿、I/Y 特寫重拳、U 後接 I 銜接 Y 等）。\n4. **請回報基準測試結果**。\n\n---\n\n## 2. 現況查證摘要\n\n1. **招式表現狀**（[CommandTable.csv](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/CommandTable.csv)）：\n   - 目前為 11 欄：`ID,Title,Keys,Montage,PlayRate,Priority,CameraShot,Damage,Hitbox,Hurtboxes,Link`。\n   - ID 1（基本攻擊，X，`AM_Attack_01`）接 Link 3（第二攻擊，Y，`AM_Attack_02`）。\n   - ID 2（右腳踢頭，6,X，`AM_Attack_03`）無 Link。\n2. **動畫與 Frame Data**（[Notify對齊設計幀.md](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_Wiki/Notify對齊設計幀.md)）：\n   - `AM_Attack_01`（右拳）：Preorder 16 幀，Active 22–30 幀（8 幀），Enable 36 幀，Disable 44 幀。\n   - `AM_Attack_02`（左拳）：Preorder 20 幀，Active 26–30 幀（4 幀），Enable 38 幀，Disable 46 幀。\n   - `AM_Attack_03`（右腳）：Preorder 10 幀，Active 20–28 幀（8 幀），Enable 40 幀，Disable 50 幀。\n3. **傷害與硬直**（[DamageTable.csv](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/DamageTable.csv)）：\n   - ID 1（輕擊）：Damage 10, Hitstun 12 幀, Blockstun 8 幀。\n   - ID 2（右腳踢頭）：Damage 15, Hitstun 18 幀, Blockstun 12 幀。\n   - ID 3（第二攻擊）：Damage 20, Hitstun 16 幀, Blockstun 10 幀。\n4. **Link 規則約束**（[TndaCommandValidation.cpp](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandValidation.cpp#L41-L45)）：\n   - 相鄰 Link 禁止使用相同 Montage（如 01 不能直接接 01）。\n\n---\n\n## 3. 待決定問題與建議方案\n\n### 問題 1：三段連段的動畫與 Command ID 配置\n需求指出「連按 X 打出三段，第一段後可改接 Y」、「重用既有動畫以不同 ID 區分步驟」、「保留原本其他招式」，且專案禁止相鄰 Link 共用同一 Montage。\n\n- **建議配置**：\n  - **ID 1（一段，X）**：`AM_Attack_01`（右拳），`Opener=TRUE`，`Link=\"3,4\"`。\n  - **ID 4（二段，X）**：`AM_Attack_02`（左拳），`Opener=FALSE`，`Link=\"5\"`。\n  - **ID 5（三段，X）**：`AM_Attack_03`（右腳踢），`Opener=FALSE`，`Link=\"\"`（收招）。\n  - **ID 3（分支，Y）**：`AM_Attack_02`（左拳），`Opener=TRUE`（保留空檔單按 Y 起手），`Link=\"\"`。\n  - **ID 2（6,X）**：`AM_Attack_03`，`Opener=TRUE`，`Link=\"\"`。\n  *這樣 X→X→X 的動畫走向為「右拳(01) → 左拳(02) → 右腳(03)」，X→Y 為「右拳(01) → 左拳(02)」，相鄰完全不重複 Montage，且保留原本所有按鍵語意。*\n- **請確認**：是否採用此招式動畫配置？\n\n---\n\n### 問題 2：連段命中時對手硬直（Hitstun）與無縫銜接\n需求指出：「近距離第一下命中、後續順利接上時，對手來不及在中間還手」、「命中連段中間沒有還手空隙」。\n- **查證差距**：\n  若 ID 1 在第 22–24 幀擊中對手，對手目前僅承受 12 幀 Hitstun（於第 34–36 幀醒來）。而 ID 1 的接招窗口在第 36 幀才開啟（Enable=36），接出的 ID 4（`AM_Attack_02`）尚有 26 幀 Startup 才能判定。因此若維持原 12 幀 Hitstun，中間會有約 26 幀空檔，對手完全有時間反擊。\n- **建議方案**：\n  在 [DamageTable.csv](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/DamageTable.csv) 為連段步驟調整或新增 Hitstun：\n  - 例如 ID 1（一段命中）的 Hitstun 調高至 **38 幀**（使對手硬直到第 60–62 幀，涵蓋到二段在第 36+26=62 幀發生打擊判定）。\n  - ID 4（二段命中）若使用 Damage 4，Hitstun 設為 **36 幀**（使對手硬直涵蓋到三段第 38+20=58 幀發生打擊判定）。\n- **請確認**：是否在 [DamageTable.csv](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/DamageTable.csv) 調整 ID 1 Hitstun 並新增對應連段各段的 Damage 數值？\n\n---\n\n### 問題 3：`CommandTable.csv` 的欄位定義與順序\n- **建議方案**：\n  將 `Opener` 欄位作為第 12 欄加在末尾：\n  `ID,Title,Keys,Montage,PlayRate,Priority,CameraShot,Damage,Hitbox,Hurtboxes,Link,Opener`\n  - 填值規則：空白或 `TRUE` 為可起手，`FALSE` 為不可起手；嚴格區分大小寫，其餘值驗證報錯。\n- **請確認**：是否同意將 `Opener` 定義為第 12 欄？\n\n---\n\n### 問題 4：CPU 的選招與 Opener 約束\n- **建議方案**：\n  - `UTndaCommandReader::TrySelectCommand`（空檔選招）：過濾掉 `Opener == FALSE` 的招式。\n  - `UTndaCommandReader::GetCommandCandidates`（起手候選列表）：當 `Link == nullptr` 時，同樣過濾掉 `Opener == FALSE` 的招式，使 CPU 不會在一般起手隨機抽到二、三段。\n  - `UTndaCommandReader::TrySelectLinkedCommand`（接招選招）：只依據目前攻擊的 `Link` 集合篩選，不限制 `Opener`。\n- **請確認**：CPU 起手候選是否與玩家一致遵循 `Opener` 過濾？\n\n---\n\n## 【對話 15】使用者（User）\n\n以上依建議\n\n---\n\n## 【對話 16】AI助手\n\n# SPEC｜三段連段與起手限制\n\n---\n\n## 1. 目標與範圍\n\n### 1.1 目前問題\n- 現行招式表僅支援透過 `Link` 登記單一步驟後續（如 X→Y），且缺乏「限制招式只能在連段中使出」的機制。若直接在招式表登記連段專用招式，該招式在空檔時也會被一般輸入起手使出。\n- 現行 Damage 表中輕擊（ID 1）命中後的 `Hitstun` 僅有 12 設計幀（0.2 秒）。而一段動作 `AM_Attack_01` 的接招啟用點在第 36 幀（Enable=36），接出二段 `AM_Attack_02` 的打擊判定點在第 26 幀。12 幀的受擊硬直使對手過早恢復行動（第 36 幀醒來），在二段判定到達前（約第 62 幀）有高達約 26 幀的空檔，無法形成真正的連續技（Hit combo）。\n\n### 1.2 完成後的遊戲行為\n- 招式表 `_DataTable/CommandTable.csv`（及資產 `DT_Command`）新增 `Opener` 欄位。\n- 玩家於空檔輸入 X 啟動一段攻擊（`AM_Attack_01`）；在預約或接招窗口內持續按 X，可無縫銜接二段（`AM_Attack_02`）與三段（`AM_Attack_03`）；三段播放完畢後自然收招。\n- 玩家在第一段後若改按 Y，可順利接出 Y 招式（`AM_Attack_02`）。\n- 單按一次 X 僅執行一段，不會自動打出後續；招式被中斷（如出招前受擊或動作完全結束收尾）後，可重回空檔重新起手。\n- 二段與三段招式的 `Opener` 設為 `FALSE`，在空檔無法直接輸入使出，只能透過一段與二段的 `Link` 接出。\n- 近距離第一擊命中且玩家順利接招時，對手全程處於受擊硬直中，沒有任何空隙可還手或插招。\n- 表格驗證時，若 `Opener` 填寫非 `\"\"`、`\"TRUE\"`、`\"FALSE\"`，或 Link 自接、成環、相鄰同 Montage 則整表驗證失敗並阻止 PIE；若有 `Opener=FALSE` 但無任何招式指向它的孤兒招式，僅提出 Warning 警告。\n\n### 1.3 本次包含與不包含\n- **包含**：\n  - C++ `FTndaCommandRow` 與 `FTndaCommand` 新增 `Opener` 支援。\n  - C++ `UTndaCommandReader` 在空檔起手選招與候選清單中排除 `Opener == false` 的招式。\n  - C++ `TndaCommandValidation` 擴充 `Opener` 原文與有效值驗證，以及孤兒招式警告。\n  - `_DataTable/CommandTable.csv` 增加第 12 欄 `Opener`，並配置三段連段（ID 1、ID 4、ID 5）與既有招式（ID 2、ID 3）。\n  - `_DataTable/DamageTable.csv` 調整/新增連段各段命中 Hitstun，確保連段無縫成立。\n  - 透過 unreal-mcp Reimport 與儲存 `DT_Command` 與 `DT_Damage`。\n  - 單元測試與功能手動驗收。\n- **不包含**：\n  - 擊退位移（Knockback）、浮空受擊或倒地追擊。\n  - 防禦崩解值（Guard Meter）、上中下段判定或特殊不可防禦技。\n  - 匯入新動畫資產（完全沿用既有 `AM_Attack_01`～`03`）。\n\n---\n\n## 2. 現況與已確認規則\n\n### 2.1 查證依據\n- 原始碼：\n  - [TndaCommandData.h](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandData.h)\n  - [TndaCommandReader.h](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandReader.h) / [TndaCommandReader.cpp](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandReader.cpp)\n  - [TndaCommandValidation.h](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandValidation.h) / [TndaCommandValidation.cpp](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandValidation.cpp)\n  - [FightingCharacter.cpp](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/Fighting/FightingCharacter.cpp)\n- 資料與文件：\n  - [CommandTable.csv](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/CommandTable.csv)\n  - [DamageTable.csv](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/DamageTable.csv)\n  - [Notify對齊設計幀.md](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_Wiki/Notify對齊設計幀.md)\n\n### 2.2 條件 → 行為規則表\n\n| 狀態 / 階段 | 觸發條件 | 系統行為 | 依據與說明 |\n|---|---|---|---|\n| **空檔選招（玩家）** | 角色落地且處於正常地面待機，收到輸入 X | 呼叫 `TrySelectCommand`，只從 `bOpener == true` 的候選中依優先度仲裁；選中 ID 1 並啟動 `AM_Attack_01`；ID 4、ID 5 因 `Opener=FALSE` 被略過 | 本次決定 |\n| **空檔選招（CPU）** | CPU 處於 Neutral / 待機，取得候選招式 | `GetCommandCandidates(Link=nullptr)` 僅回傳 `bOpener == true` 的招式，CPU 不會在起手抽出二、三段 | 本次決定 |\n| **一段預約窗口** | 一段播放進度在 Preorder（第 16 幀）～ Enable（第 36 幀）之間，收到輸入 X | 寫入 `CommandBuffer`，保存語意 X 與當下方向，設定 0.5 秒過期計時器 | 既有規則 |\n| **一段接招窗口** | 一段播放進度達 Enable（第 36 幀）且已有 X 預約，或在第 36～44 幀新按 X | 呼叫 `TrySelectLinkedCommand`，以一段的 `Link={\"3\",\"4\"}` 查詢；Attack=X 匹配到 ID 4，立即以自身 BlendIn（0.1s）接出二段 `AM_Attack_02` | 既有規則 + 本次配置 |\n| **一段改接 Y** | 一段預約或接招窗口內收到輸入 Y | `TrySelectLinkedCommand` 從 `Link={\"3\",\"4\"}` 匹配到 ID 3（Keys=Y），接出 Y（`AM_Attack_02`） | 既有規則 + 本次配置 |\n| **二段接三段** | 二段在 Enable（第 38 幀）前收到 X 預約或窗口內按 X | 以二段的 `Link={\"5\"}` 查出 ID 5，接出三段 `AM_Attack_03` | 本次配置 |\n| **三段收招** | 三段 `Link=\"\"`，播放至自然結束 | 自然收尾進入 Recovery 並完全解鎖，回到待機狀態 | 既有規則 |\n| **連段無縫命中** | 一段於第 22–30 幀近距離擊中對手 | 對手承受 38 幀 Hitstun，硬直持續至第 60–68 幀；二段於第 36 幀接出並於第 62 幀（36+26）擊中，對手全程無空檔 | 本次決定數值 |\n| **CSV 驗證** | `Opener` 欄位為空或 `TRUE` | `bOpener = true`，允許作為起手 | 本次決定 |\n| **CSV 驗證** | `Opener` 欄位為 `FALSE` | `bOpener = false`，禁止作為起手，僅能由 Link 接出 | 本次決定 |\n| **CSV 驗證** | `Opener` 欄位為其他字串（如 `True`、`false`、`1`） | 視為驗證錯誤，列入 `OutErrors`，停止 PIE | 需求要求嚴格區分大小寫 |\n| **孤兒招式警告** | `bOpener == false` 但全表無其他招式的 Link 包含其 ID | 記入 Warning Log，不使整表驗證失敗 | 需求明訂 |\n\n### 2.3 招式與傷害數值定義表\n\n#### Command 表規劃（[CommandTable.csv](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/CommandTable.csv)）\n- 基準起算點：動畫時間 0 秒，設計幀率 60 FPS。\n\n| ID | Title | Keys | Montage | PlayRate | Priority | CameraShot | Damage | Hitbox | Hurtboxes | Link | Opener | 說明 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| **1** | 基本攻擊 | X | AM_Attack_01 | 1.0 | 0 | None | 1 | hand_r | \"head,pelvis,calf_l,calf_r\" | \"3,4\" | TRUE | 一段，可接 3(Y) 或 4(X) |\n| **2** | 右腳踢頭 | 6,X | AM_Attack_03 | 1.0 | 0 | None | 2 | foot_r | \"head\" | | TRUE | 保留既有招式 |\n| **3** | 第二攻擊 | Y | AM_Attack_02 | 1.0 | 0 | UpperBodyCloseUp | 3 | hand_l | \"head,pelvis,calf_l,calf_r\" | | TRUE | 保留既有 Y 起手與一段改接 |\n| **4** | 連段二段 | X | AM_Attack_02 | 1.0 | 0 | None | 4 | hand_l | \"head,pelvis,calf_l,calf_r\" | 5 | FALSE | 二段，左拳，只能接出，後接 5 |\n| **5** | 連段三段 | X | AM_Attack_03 | 1.0 | 0 | None | 5 | foot_r | \"head,pelvis,calf_l,calf_r\" | | FALSE | 三段，右腳，只能接出，收招 |\n\n#### Damage 表規劃（[DamageTable.csv](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/DamageTable.csv)）\n- 設計幀率：60 FPS（1 幀 = 1/60 秒 ≈ 0.016667 秒）。\n\n| ID | Title | Damage | Hitstun（幀） | Blockstun（幀） | 說明與銜接計算依據 |\n|---|---|---|---|---|---|\n| **1** | 輕擊（一段） | 10 | **38** | 8 | 擊中點約第 24 幀，硬直到第 62 幀；涵蓋二段判定（36+26=62 幀） |\n| **2** | 右腳踢頭 | 15 | 18 | 12 | 既有數值保持 |\n| **3** | 第二攻擊（Y） | 20 | 16 | 10 | 既有數值保持 |\n| **4** | 連段二段 | 10 | **36** | 8 | 二段於第 26 幀擊中，硬直涵蓋三段判定（38+20=58 幀） |\n| **5** | 連段三段 | 15 | 18 | 12 | 三段終結擊 |\n\n---\n\n## 3. 實作設計\n\n### 3.1 功能模組：招式資料結構與 Opener 規則\n\n#### 1. 資料與介面\n- **`FTndaCommandRow`**（[TndaCommandData.h](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandData.h)）：\n  - 新增屬性：\n    ```cpp\n    UPROPERTY(EditAnywhere, BlueprintReadOnly, Category=\"Command\")\n    FString Opener;\n    ```\n- **`FTndaCommand`**（[TndaCommandData.h](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandData.h)）：\n  - 新增屬性：\n    ```cpp\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"Command\")\n    bool bOpener = true;\n    ```\n- **輔助解析函式** `TndaCommandData::ParseOpener`：\n  - 輸入：`const FString& Text, bool& OutbOpener`\n  - 規則：裁切前後空白後，空字串或 `\"TRUE\"` 輸出 `true`，`\"FALSE\"` 輸出 `false`；其他字串回傳 `false`（解析失敗）。\n\n#### 2. Init\n- **觸發時機**：GameInstance 啟動或 DataTable Reimport 觸發 `UTndaCommandReader::Prepare`。\n- **資料準備**：\n  - 走訪各 Row，呼叫 `TndaCommandData::ParseOpener(Row.Opener, Command.bOpener)`。\n  - Editor 檢查：若解析失敗，追加錯誤字串：`Row=\u003cID> Field=Opener: 必須為空白、TRUE 或 FALSE（區分大小寫）。`\n  - 孤兒檢查：在 `ValidateLinks` 完成後，針對 `!Command.bOpener` 且 `Incoming[*Target] == 0` 的招式，輸出 Warning Log：\n    `UE_LOG(LogTndaFighter, Warning, TEXT(\"DataTables TableId=Command Row=%d: Opener 為 FALSE 但無任何招式 Link 指向此招，此招無法被使出。\"), Command.Id)`。\n- **清除舊狀態**：`Reset()` 時清空 `Commands` 容器。\n\n#### 3. Tick / 查詢時機\n- **更新時機**：角色出招呼叫 `UTndaCommandReader::SelectCommand`。\n- **空檔選招推進條件**（`Link == nullptr`）：\n  - 走訪排序後的候選招式，除了原本的 `Attack` 與 `Direction` 判定外，增加：\n    ```cpp\n    if (Link == nullptr && !Candidate.bOpener)\n    {\n        continue; // 禁止非 Opener 招式在空檔起手\n    }\n    ```\n- **接招推進條件**（`Link != nullptr`）：\n  - 嚴格依照 `Link` 包含的 ID 進行候選，不受 `Candidate.bOpener` 限制。\n- **CPU 候選清單**（`UTndaCommandReader::GetCommandCandidates`）：\n  - 當 `Link == nullptr` 時，`SelectCommand` 自動過濾掉 `bOpener == false`，因此回傳的起手候選只包含可起手招式。\n\n#### 4. End\n- **生命週期清理**：\n  - 隨 Reader 既有 `Reset()` 與 Subsystem 統一銷毀，無額外動態記憶體。\n  - 招式被中斷（`CancelAttack` / 受擊進入 Stun）時，角色的 `CurrentAttack` 被清空，角色回到 Normal Ground State，下次輸入再次從 `SelectCommand(Link=nullptr)` 重新依照 Opener 仲裁起手。\n\n#### 5. 接入與手動確認\n- **檔案修改位置**：\n  - `Source/TndaFighter/DataTable/TndaCommandData.h` 與 `.cpp`\n  - `Source/TndaFighter/DataTable/TndaCommandReader.cpp`\n  - `Source/TndaFighter/DataTable/TndaCommandValidation.h` 與 `.cpp`\n  - `_DataTable/CommandTable.csv`\n  - `_DataTable/DamageTable.csv`\n- **建置與資產更新順序**：\n  1. 修改 C++ 原始碼並編譯 `TndaFighterEditor Win64 Development`。\n  2. 修改 `_DataTable/CommandTable.csv` 與 `_DataTable/DamageTable.csv`。\n  3. 透過 `unreal-mcp` 對 `DT_Command` 與 `DT_Damage` 執行 Reimport 並儲存資產。\n\n---\n\n## 4. 工單劃分規劃\n\n- **工單 1：C++ 資料欄位、Opener 解析、起手過濾與驗證實作**\n  - 在 `TndaCommandData`、`TndaCommandReader`、`TndaCommandValidation` 實作 `Opener` 欄位、解析、起手過濾與孤兒警告。\n  - 編譯確認無錯誤。\n- **工單 2：資料表更新與 MCP Reimport**\n  - 修改 `_DataTable/CommandTable.csv`（增加第 12 欄與連段 ID 4、5）與 `_DataTable/DamageTable.csv`（調整與新增 Hitstun 數值）。\n  - 透過 `unreal-mcp` 執行 Reimport 與儲存，確認驗證通過無報錯。\n- **工單 3：三段連段手動驗證與驗收**\n  - 於 stage1 執行 PIE 手動驗收：單按 X、連按 X→X→X、X→Y、空檔單按二/三段被拒絕、命中對手無法還手、中斷後重新起手。\n\n---\n\n請確認上述 SPEC 規格與設計。若確認無誤，我將把此 SPEC 存檔並進入工單 1 實作。\n\n---\n\n## 【對話 17】使用者（User）\n\n確認無誤，把此 SPEC 存檔並進入工單 1 實作\n\n---\n\n## 【對話 18】AI助手\n\n已將 SPEC 存檔至 [.scratch/three-stage-combo/spec.md](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/.scratch/three-stage-combo/spec.md)。\n\n---\n\n## 本批工單範圍：工單 1（C++ 資料欄位、Opener 解析、起手過濾與驗證實作）\n\n依據 SPEC，本張工單只處理 C++ 程式碼與驗證邏輯，不修改 CSV、資產或遊戲功能：\n\n1. **`FTndaCommandRow` 與 `FTndaCommand` 擴充**（[TndaCommandData.h](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandData.h)）：\n   - `FTndaCommandRow` 新增 `FString Opener` 欄位。\n   - `FTndaCommand` 新增 `bool bOpener = true`。\n   - 新增 `TndaCommandData::ParseOpener`，嚴格解析空白、`\"TRUE\"`（`true`）與 `\"FALSE\"`（`false`），其餘視為非法。\n2. **起手選招與候選過濾**（[TndaCommandReader.cpp](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandReader.cpp)）：\n   - `Prepare` 走訪時解析 `Row.Opener`，非法時於 Editor 列入 `OutErrors`。\n   - `SelectCommand` 在 `Link == nullptr`（空檔起手）時略過 `bOpener == false tstun 為 `38` 幀（Blockstun=`8`）。\n   - 新增 ID 4（連段二段）：Damage=`10`、Hitstun=`36` 幀、Blockstun=`8` 幀。\n   - 新增 ID 5（連段三段）：Damage=`15`、Hitstun=`18` 幀、Blockstun=`12` 幀。\n3. **透過 `unreal-mcp` 執行 Reimport 與儲存**：\n   - 對 `/Game/DataTable/DT_Command` 與 `/Game/DataTable/DT_Damage` 執行 Reimport 並儲存資產。\n\n請確認是否 commit 工單 1 的異動，並指示開始執行工單 2。\n\n---\n\n## 【對話 30】使用者（User）\n\ncommit 工單 1 的異動，並指示開始執行工單 2\n\n---\n\n## 【對話 31】AI助手\n\n## 1. 異動導覽\n\n本次工單完成「資料表更新與 MCP Reimport」，所有資產操作均透過 `unreal-mcp` 完成 Reimport、驗證、儲存與回讀：\n\n1. **[_DataTable/DamageTable.csv](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/DamageTable.csv)**\n   - **修改位置**：ID 1 列，以及新增 ID 4、ID 5 列。\n   - **差異**：\n     - ID 1（輕擊）：Hitstun 由 `12` 幀調高至 `38` 幀（Blockstun=`8`）。\n     - 新增 ID 4（連段二段）：Damage=`10`、Hitstun=`36` 幀、Blockstun=`8` 幀。\n     - 新增 ID 5（連段三段）：Damage=`15`、Hitstun=`18` 幀、Blockstun=`12` 幀。\n   - **原因**：提供三段連段命中時足夠的受擊硬直，確保接招動作啟動判定時對手無空隙還手。\n\n2. **[_DataTable/CommandTable.csv](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/CommandTable.csv)**\n   - **修改位置**：表頭新增第 12 欄 `Opener`；修改 ID 1 列；新增 ID 4、ID 5 列。\n   - **差異**：\n     - 表頭：由 11 欄擴充為 12 欄（新增 `Opener`）。\n     - ID 1（基本攻擊）：`Link` 由 `\"3\"` 改為 `\"3,4\"`（支援改接 Y 或續按 X）；`Opener` 設為 `TRUE`。\n     - ID 2（右腳踢頭）：`Opener` 設為 `TRUE`（保留原 6,X 起手）。\n     - ID 3（第二攻擊）：`Opener` 設為 `TRUE`（保留原 Y 起手）。\n     - 新增 ID 4（連段二段）：Keys=`X`、Montage=`AM_Attack_02`、Damage=`4`、Hitbox=`hand_l`、Hurtboxes=`\"head,pelvis,calf_l,calf_r\"`、Link=`5`、Opener=`FALSE`。\n     - 新增 ID 5（連段三段）：Keys=`X`、Montage=`AM_Attack_03`、Damage=`5`、Hitbox=`foot_r`、Hurtboxes=`\"head,pelvis,calf_l,calf_r\"`、Link=`\"\"`、Opener=`FALSE`。\n   - **原因**：落實 X→X→X 三段連段與 X→Y 分支配置，並指定二、三段為不可單獨起手（`Opener=FALSE`）。\n\n3. **[/Game/DataTable/DT_Damage](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Content/DataTable/DT_Damage.uasset) 與 [/Game/DataTable/DT_Command](file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Content/DataTable/DT_Command.uasset)**\n   - **操作方式**：透過 `unreal-mcp` 執行 `fill_data_table_from_csv_file` 重新匯入，並以 `EditorAssetLibrary.save_loaded_asset` 儲存 package。\n   - **回讀確認**：\n     - `DT_Damage` 回讀確認包含 5 列，ID 1 的 Hitstun 為 38。\n     - `DT_Command` 回讀確認包含 5 列，第 12 欄為 Opener，ID 4、5 為 FALSE。\n   - **請檢查**：可在 Content Browser 打開 `DT_Command` 與 `DT_Damage` 查看 Row Name 與各欄位數值。\n\n---\n\n## 2. 手動驗證\n\n### 準備工作\n1. 確保 Editor 處於開啟狀態（關卡為 `/Game/Fighting/stage1`）。\n2. 在關卡中按下 **Play in Editor (PIE)** 進入遊戲。\n\n### 逐步操作與驗收項目\n\n1. **單按 X（一段攻擊）**：\n   - 操作：在空檔按一下 `U` 鍵（送出語意 X）。\n   - 預期：只打出一拳（`AM_Attack_01` 右拳），打完後自然收招，不會自動打出二段或三段。\n\n2. **連按 X→X→X（三段完整連段）**：\n   - 操作：靠近 CPU，連續節奏按 `U` 鍵（X → X → X）。\n   - 預期：\n     - 第一段（右拳 `AM_Attack_01`）命中。\n     - 順利接出第二段（左拳 `AM_Attack_02`）並命中。\n     - 順利接出第三段（右腳 `AM_Attack_03`）擊中對手。\n     - 命中期間對手全程處於受擊硬直（`Hitstun` 播放挨打動畫），無法插招反擊。\n     - 第三段踢完後自然收招，解鎖移動與轉向。\n\n3. **第一段改接 Y（X→Y 分支）**：\n   - 操作：按 `U` 鍵出 X，於接招窗口內改按 `I` 鍵（送出語意 Y）。\n   - 預期：第一段（右拳）後順利接出第二攻擊（左拳 `AM_Attack_02`，觸發特寫鏡頭）。\n\n4. **二段／三段不可空檔起手**：\n   - 預期：在一般地面待機時，按 `U` 只會發動一段（ID 1 基本攻擊），絕不會直接出二段（ID 4）或三段（ID 5）。\n\n5. **中斷後重新起手**：\n   - 操作：打出 X 或 X→X 後停止按鍵，等動作完全收尾回到待機；或出招前受擊被打斷。\n   - 預期：收招或硬直結束後，再次按 `U` 依然能從第一段正常起手。\n\n### 還原步驟\n若需還原測試前的資料表，可透過 `git checkout -- _DataTable/ Content/DataTable/` 還原 CSV 與資產。\n\n---\n\n請於執行上述 PIE 手動驗收後回報結果。\n\n---\n\n## 【對話 32】使用者（User）\n\n以上確認無誤\n\n---\n\n## 【對話 33】AI助手\n\n### 驗證與結果記錄\n- **單按 X（一段攻擊）**：**通過**\n- **連按 X→X→X（三段完整連段）**：**通過**\n- **第一段改接 Y（X→Y 分支）**：**通過**\n- **二段／三段不可空檔起手**：**通過**\n- **中斷後重新起手**：**通過**\n\n---\n\n### Commit 完成紀錄\n已將工單 2 之修改（包含資料表、資產 Reimport 與模組文件更新）提交至 Git：\n- `f0c22f2` (`feat: 工單 2 完成 Command 與 Damage 資料表更新與資產 Reimport`)\n\n目前 working tree clean，本次需求「三段連段與起手限制」已完整實作並驗收完畢。\n\n---\n\n","html":"\u003c!doctype html>\u003chtml lang=\"zh-Hant\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cstyle>\n.paper pre.syntax-pre{background:#f5f7fa;border-color:#cedae5;color:#243746;font-family:Consolas,'Microsoft JhengHei',monospace;font-size:16px;line-height:1.7}\n.paper pre.syntax-pre code.syntax-code{background:none;color:#243746;padding:0;font:inherit}\n.syn-comment{color:#54705b}.syn-type{color:#006b73;font-weight:650}.syn-declaration{color:#174c99;font-weight:750;text-decoration:underline;text-underline-offset:3px}.syn-keyword{color:#8035a3;font-weight:650}.syn-string{color:#a23a26}.syn-number,.syn-constant{color:#865800}.syn-function{color:#795200}.syn-macro{color:#8035a3}.syn-prefix{color:#64717e}.syn-added{color:#1c7051;font-weight:650}.syn-removed{color:#ab3535;font-weight:650}\n*{box-sizing:border-box}body{margin:0;padding:24px;color:#19364e;background:#fff;font:20px/1.7 'Microsoft JhengHei','Segoe UI',sans-serif}article{max-width:1120px;margin:auto}h1{font-size:30px}h2{font-size:26px;color:#087481;margin-top:1.8em}h3{font-size:23px;margin-top:1.5em}pre{padding:18px;background:#f2f6f7;border-left:4px solid #087f8c;white-space:pre-wrap;overflow-wrap:anywhere;font:19px/1.6 Consolas,'Microsoft JhengHei',monospace}code{font-family:Consolas,'Microsoft JhengHei',monospace}p,li{overflow-wrap:anywhere}.conversation-message{font-size:17px;line-height:1.7;border:1px solid;border-left-width:4px;border-radius:8px;padding:18px 24px;margin:14px 0 30px}.user-prompt{background:#eef4fa;border-color:#c4d6e6;border-left-color:#678eae}.ai-reply{background:#f0f6ee;border-color:#cbdcc3;border-left-color:#7d9c6d}.conversation-message h1{font-size:22px}.conversation-message h2{font-size:20px;margin-top:1.2em}.conversation-message h3{font-size:18px}.conversation-message pre{font-size:16px}.user-prompt pre{background:#e3edf6}.ai-reply pre{background:#e5efdf}.conversation-message>:first-child{margin-top:0}.conversation-message>:last-child{margin-bottom:0}.conversation-message>hr:last-of-type{display:none}@media(max-width:800px){body{padding:14px}}\u003c/style>\u003c/head>\u003cbody>\u003carticle>\u003ch1>TNDA Week 11 講義示範 1：AI 實作示範（三段連段與起手限制）\u003c/h1>\n\u003cblockquote>\n\u003cp>本文件為 Unreal Engine C++ 格鬥遊戲專案（TndaFighter）中，使用者與 AI助手協作開發「三段連段與起手限制」功能的完整對話歷程記錄。\n涵蓋流程：專案導讀 → unreal-mcp 基準查驗 → 4 段協作提示詞規範 → 需求澄清與未決問題討論 → SPEC 規格確認 → 工單 1 C++ 實作與編譯測試（含報錯排查與修正） → 工單 2 資料表與資產 Reimport 驗收。\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2>【對話 1】使用者（User）\u003c/h2>\u003csection class=\"conversation-message user-prompt\">\n\u003ch1>專案與工作範圍\u003c/h1>\n\u003cp>以目前資料夾的 TndaFighter.uproject 為根目錄；主要模組是 TndaFighter。\n這是 Unreal Engine C++ 格鬥遊戲；引擎版本讀 EngineAssociation。\u003c/p>\n\u003ch1>先讀文件，再對照程式\u003c/h1>\n\u003cp>先讀 Source/AGENTS.md 與 Source/TndaFighter/Fighting/AGENTS.md。\n接著讀 Source/TndaFighter/ 下 Fighting/README.md、DataTable/README.md，\n再依功能讀 Fighting/Docs 與相關原始碼。\n文件缺失或與程式不一致時，先查原始碼與設定；資產查詢等下一頁確認 unreal-mcp 後進行。\u003c/p>\n\u003ch1>操作與資料入口\u003c/h1>\n\u003cp>關卡：/Game/Fighting/stage1。U 是 X，I 是 Y；6 朝向對手、4 遠離對手。\nCSV：_DataTable/CommandTable.csv、_DataTable/DamageTable.csv。\n對應 /Game/DataTable/DT_Command、/Game/DataTable/DT_Damage；改 CSV 後 Reimport。\n動畫：/Game/Fighting/Anims/AM_Attack_01～03；右 Ctrl＋F12 切換 Combat Debug。\u003c/p>\n\u003ch1>本輪回覆格式\u003c/h1>\n\u003cp>成功只回一句：「專案導讀完成，可以提供需求。」\n受阻只回兩行：「阻礙：…」「下一步：…」。先完成查證，不改檔，不附摘要或重述規則。\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 2】AI助手\u003c/h2>\u003csection class=\"conversation-message ai-reply\">\n\u003cp>專案導讀完成，可以提供需求。\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 3】使用者（User）\u003c/h2>\u003csection class=\"conversation-message user-prompt\">\n\u003ch1>開工前確認 unreal-mcp\u003c/h1>\n\u003cp>使用 unreal-mcp：\u003ca href=\"http://127.0.0.1:8000/mcp%E3%80%82\">http://127.0.0.1:8000/mcp。\u003c/a>\u003c/p>\n\u003col>\n\u003cli>完成 MCP 連線、取得工具並執行 Editor 唯讀查詢；只有 HTTP 回應不算通過。\u003c/li>\n\u003cli>透過 unreal-mcp 取得 Editor 開啟的 .uproject 完整路徑，\n與工作資料夾的 TndaFighter.uproject 比對；只核對檔名不夠。\u003c/li>\n\u003cli>連線失敗、專案不符或無法確認時停止實作，排除後重新驗證。\u003c/li>\n\u003c/ol>\n\u003ch1>資產操作規則\u003c/h1>\n\u003cp>.uasset 的查詢、建立、修改、Reimport 與儲存，一律透過 unreal-mcp。\n修改前查現況，修改後回讀確認。C++、CSV 與設定文字檔使用檔案工具；\nCSV 改完後，DataTable 的 Reimport 與儲存仍透過 unreal-mcp。\n缺少所需能力時先回報並討論，不改用其他方式操作資產。\n本輪不修改功能；連線與專案確認後，接著貼四段共用提示詞。\u003c/p>\n\u003ch1>本輪回覆格式：固定三行\u003c/h1>\n\u003cp>unreal-mcp：可用／不可用／未確認\nEditor 專案：完整 .uproject 路徑；與工作資料夾一致／不一致／無法確認\n開工條件：已就緒／受阻；受阻時附原因與下一步\n受阻原因與下一步寫在第三行；不附前言、結語、清單或過程。未查證就寫「未確認」。\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 4】AI助手\u003c/h2>\u003csection class=\"conversation-message ai-reply\">\n\u003cp>unreal-mcp：可用\nEditor 專案：D:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/TndaFighter.uproject；與工作資料夾一致\n開工條件：已就緒\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 5】使用者（User）\u003c/h2>\u003csection class=\"conversation-message user-prompt\">\n\u003ch1>共用提示詞（1／4）\u003c/h1>\n\u003cp>接下來四段是同一套規則，適用於後續每個功能；收到完整規則與功能需求才開始。\n本段先記住規則，等待下一段，不修改檔案。\u003c/p>\n\u003ch1>收到功能需求後\u003c/h1>\n\u003cp>先讀指定文件與程式，用 unreal-mcp 查相關資產，再提出尚未決定的問題。\n能自行查證的事實先查；每題附建議，一輪只問現在能回答的題目。\n我回答後再問衍生問題，全部確認後才依接下來的格式整理 SPEC。\nSPEC 給我看，我確認後才存檔；每張工單由你實作，我檢查異動並手動確認功能。\u003c/p>\n\u003ch1>開始功能前先確認基準\u003c/h1>\n\u003cp>保留既有改動；確認引擎、編譯工具與 TndaFighterEditor Win64 Development 建置方式。\n先讀啟動腳本，給我建置與進入 stage1 的操作步驟；等我回報基準結果，不自行執行。\n基準失敗先說明原因與下一步，不把既有問題當成本次修改造成。\u003c/p>\n\u003ch1>回覆與接續\u003c/h1>\n\u003cp>正常進度簡短回報；討論只列待決定問題，SPEC、異動導覽與手動驗證步驟依格式提供。\n換新對話時重貼共用開場、這四段規則與已確認 SPEC，交代目前工單進度。\u003c/p>\n\u003ch1>本輪回覆格式\u003c/h1>\n\u003cp>成功只回一句：「收到共用提示詞 1／4。」\n受阻只回兩行：「阻礙：…」「下一步：…」。不附摘要、解釋、重述規則或額外提問。\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 6】AI助手\u003c/h2>\u003csection class=\"conversation-message ai-reply\">\n\u003cp>收到共用提示詞 1／4。\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 7】使用者（User）\u003c/h2>\u003csection class=\"conversation-message user-prompt\">\n\u003ch1>共用提示詞（2／4）：SPEC 固定格式前半\u003c/h1>\n\u003cp>討論完成後，SPEC 使用 Markdown，標題為「# SPEC｜功能名稱」。\u003c/p>\n\u003ch2>1. 目標與範圍\u003c/h2>\n\u003cp>寫目前問題、完成後的遊戲行為、本次包含與不包含的工作。\u003c/p>\n\u003ch2>2. 現況與已確認規則\u003c/h2>\n\u003cp>列程式與資產查證依據；規則用「條件 → 行為」表格。\n數值寫單位、方向基準與起算點，區分既有值與本次決定；未決事項不能當成已確認。\u003c/p>\n\u003ch2>3. 實作設計\u003c/h2>\n\u003cp>每套功能各開小節，完整展開以下五步，不能只列標題：\u003c/p>\n\u003col>\n\u003cli>資料與介面：型別、初始值、單位、擁有者、公開／私有方法與輸入輸出。\n涉及表格時列 CSV、Row、執行期副本、Reader、驗證與舊資料相容方式。\u003c/li>\n\u003cli>Init：觸發條件、資料準備、清除舊狀態、無效輸入與重複啟動的處理。\u003c/li>\n\u003cli>Tick：更新時機、時間來源、狀態推進與停止條件；公式附符號、單位與小算例。\u003c/li>\n\u003cli>End：正常結束、中斷、停用與生命週期清理；哪些歸零、哪些保留、如何重啟。\u003c/li>\n\u003cli>接入與手動確認：呼叫者、插入位置、先後順序、保留的既有行為與建置／資產更新順序。\u003c/li>\n\u003c/ol>\n\u003ch1>本輪回覆格式\u003c/h1>\n\u003cp>成功只回一句：「收到共用提示詞 2／4。」\n受阻只回兩行：「阻礙：…」「下一步：…」。不加摘要、解釋或提問；等待下一段，不動工。\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 8】AI助手\u003c/h2>\u003csection class=\"conversation-message ai-reply\">\n\u003cp>收到共用提示詞 2／4。\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 9】使用者（User）\u003c/h2>\u003csection class=\"conversation-message user-prompt\">\n\u003ch1>共用提示詞（2／4）：SPEC 固定格式前半\u003c/h1>\n\u003cp>討論完成後，SPEC 使用 Markdown，標題為「# SPEC｜功能名稱」。\u003c/p>\n\u003ch2>1. 目標與範圍\u003c/h2>\n\u003cp>寫目前問題、完成後的遊戲行為、本次包含與不包含的工作。\u003c/p>\n\u003ch2>2. 現況與已確認規則\u003c/h2>\n\u003cp>列程式與資產查證依據；規則用「條件 → 行為」表格。\n數值寫單位、方向基準與起算點，區分既有值與本次決定；未決事項不能當成已確認。\u003c/p>\n\u003ch2>3. 實作設計\u003c/h2>\n\u003cp>每套功能各開小節，完整展開以下五步，不能只列標題：\u003c/p>\n\u003col>\n\u003cli>資料與介面：型別、初始值、單位、擁有者、公開／私有方法與輸入輸出。\n涉及表格時列 CSV、Row、執行期副本、Reader、驗證與舊資料相容方式。\u003c/li>\n\u003cli>Init：觸發條件、資料準備、清除舊狀態、無效輸入與重複啟動的處理。\u003c/li>\n\u003cli>Tick：更新時機、時間來源、狀態推進與停止條件；公式附符號、單位與小算例。\u003c/li>\n\u003cli>End：正常結束、中斷、停用與生命週期清理；哪些歸零、哪些保留、如何重啟。\u003c/li>\n\u003cli>接入與手動確認：呼叫者、插入位置、先後順序、保留的既有行為與建置／資產更新順序。\u003c/li>\n\u003c/ol>\n\u003ch1>本輪回覆格式\u003c/h1>\n\u003cp>成功只回一句：「收到共用提示詞 2／4。」\n受阻只回兩行：「阻礙：…」「下一步：…」。不加摘要、解釋或提問；等待下一段，不動工。\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 10】AI助手\u003c/h2>\u003csection class=\"conversation-message ai-reply\">\n\u003cp>收到共用提示詞 2／4。\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 11】使用者（User）\u003c/h2>\u003csection class=\"conversation-message user-prompt\">\n\u003ch1>共用提示詞（4／4）：每張工單的執行方式\u003c/h1>\n\u003ch1>規格確認後\u003c/h1>\n\u003cp>讀 SPEC 與目前工單，簡述本批範圍，等我確認後只實作這張工單。\n保留既有改動，依專案規則處理註解、行尾與文件；完成後閱讀 diff，整理異動導覽。\n資產查詢、修改、儲存、回讀與 CSV Reimport 都走 unreal-mcp；重連後核對 .uproject 完整路徑。\n需要停止 PIE、建置或重啟 Editor 時，先給我操作步驟，等我回報後繼續。\u003c/p>\n\u003ch1>完成實作後，固定交付兩段\u003c/h1>\n\u003col>\n\u003cli>異動導覽：檔案／資產、修改位置、改前與改後的差異、原因；指出我應檢查的內容。\u003c/li>\n\u003cli>手動驗證：依 SPEC 列出本批項目，包含準備、逐步操作、預期畫面或 Log、還原步驟。\n步驟要能照做，交付後等我回報；不自行跑測試、遊戲驗證或自動驗收腳本。\u003c/li>\n\u003c/ol>\n\u003ch1>收到我的結果後\u003c/h1>\n\u003cp>依回報記錄通過／失敗／未確認；沒有回報的項目不能自行判定通過。\n失敗時先問實際現象與錯誤，查原因並提出修正；修正後再給我重測步驟。\n我還原 Debug，你透過 MCP 還原測試資產；我確認後才 commit、做下一張，無 Git 則先備份。\nunreal-mcp 受阻先停止並排除，不改用其他方式操作資產。\u003c/p>\n\u003ch1>本輪回覆格式\u003c/h1>\n\u003cp>成功只回一句：「共用提示詞已就緒，請提供功能需求。」\n受阻只回兩行：「阻礙：…」「下一步：…」。不加摘要、解釋或提問；等待功能需求，不動工。\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 12】AI助手\u003c/h2>\u003csection class=\"conversation-message ai-reply\">\n\u003cp>共用提示詞已就緒，請提供功能需求。\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 13】使用者（User）\u003c/h2>\u003csection class=\"conversation-message user-prompt\">\n\u003ch1>需求：三段連段\u003c/h1>\n\u003cp>我想讓玩家連按 X 打出三段，也能在第一段後改接 Y。\n請在招式表 _DataTable/CommandTable.csv（對應 DT_Command）新增 Opener，指定哪些招式可起手、哪些只能接在連段裡。\u003c/p>\n\u003ch1>規格\u003c/h1>\n\u003cul>\n\u003cli>Opener 空白或 TRUE 可以起手，FALSE 只能由 Link 接出；區分大小寫，其他值視為錯誤。\u003c/li>\n\u003cli>空檔選招看 Opener；連段中只看目前招式的 Link。\u003c/li>\n\u003cli>按一下 X 只打一段，繼續按才接下一段；第二、三段不能單獨起手，第三段打完收招。\u003c/li>\n\u003cli>可重用既有動畫，以不同 Command ID 區分連段步驟；保留原本其他招式。\u003c/li>\n\u003cli>近距離第一下命中、後續順利接上時，對手來不及在中間還手。\u003c/li>\n\u003c/ul>\n\u003ch1>驗收目標\u003c/h1>\n\u003cul>\n\u003cli>單按 X、X→X→X、X→Y 都能正常使用；中斷後可重新起手。\u003c/li>\n\u003cli>FALSE 的招式無法從空檔使出，但能經 Link 接出；命中連段中間沒有還手空隙。\u003c/li>\n\u003cli>Opener 填錯、Link 接自己、接相同動畫或形成循環時，整表驗證失敗；無入口的 FALSE 招式只警告。\u003c/li>\n\u003cli>Reimport 後下次選招就使用新資料，原本其他招式仍正常。\u003c/li>\n\u003c/ul>\n\u003ch1>現在開始\u003c/h1>\n\u003cp>依共用提示詞先查專案，提出招式資料、接招時間與實作方案，讓我確認。\n只問未決問題並附建議；確認後整理 SPEC，再等我確認實作。\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 14】AI助手\u003c/h2>\u003csection class=\"conversation-message ai-reply\">\n\u003ch2>1. 基準確認與操作步驟\u003c/h2>\n\u003cp>依專案 \u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/TndaFighter.uproject\">TndaFighter.uproject\u003c/a> 與啟動腳本 \u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Plugins/VibeUE/BuildAndLaunchGame.ps1\">BuildAndLaunchGame.ps1\u003c/a> 查證：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>引擎版本\u003c/strong>：Unreal Engine 5.8\u003c/li>\n\u003cli>\u003cstrong>建置目標\u003c/strong>：\u003ccode>TndaFighterEditor\u003c/code>、平台 \u003ccode>Win64\u003c/code>、組態 \u003ccode>Development\u003c/code>\u003c/li>\n\u003cli>\u003cstrong>編譯工具\u003c/strong>：UnrealBuildTool (\u003ccode>Engine\\Build\\BatchFiles\\Build.bat\u003c/code>)\u003c/li>\n\u003c/ul>\n\u003cp>請手動執行以下步驟確認目前基準，我不會自行啟動：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>關閉現有 Editor\u003c/strong>（若有執行中程序）。\u003c/li>\n\u003cli>\u003cstrong>建置並啟動 stage1\u003c/strong>：\n在 PowerShell 執行：\u003cpre>\u003ccode class=\"language-powershell\">powershell -ExecutionPolicy Bypass -File Plugins\\VibeUE\\BuildAndLaunchGame.ps1 -Map /Game/Fighting/stage1\n\u003c/code>\u003c/pre>\n\u003cem>（或在 Visual Studio 中選取 \u003ccode>Development Editor\u003c/code> / \u003ccode>Win64\u003c/code> 建置 \u003ccode>TndaFighter\u003c/code> 後啟動 Editor 並載入 \u003ccode>/Game/Fighting/stage1\u003c/code>）\u003c/em>\u003c/li>\n\u003cli>\u003cstrong>驗證基準\u003c/strong>：\n在 \u003ccode>/Game/Fighting/stage1\u003c/code> 啟動 PIE，確認目前既有功能運作正常（單按 U/X 出拳、6+U/X 踢腿、I/Y 特寫重拳、U 後接 I 銜接 Y 等）。\u003c/li>\n\u003cli>\u003cstrong>請回報基準測試結果\u003c/strong>。\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch2>2. 現況查證摘要\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>招式表現狀\u003c/strong>（\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/CommandTable.csv\">CommandTable.csv\u003c/a>）：\u003cul>\n\u003cli>目前為 11 欄：\u003ccode>ID,Title,Keys,Montage,PlayRate,Priority,CameraShot,Damage,Hitbox,Hurtboxes,Link\u003c/code>。\u003c/li>\n\u003cli>ID 1（基本攻擊，X，\u003ccode>AM_Attack_01\u003c/code>）接 Link 3（第二攻擊，Y，\u003ccode>AM_Attack_02\u003c/code>）。\u003c/li>\n\u003cli>ID 2（右腳踢頭，6,X，\u003ccode>AM_Attack_03\u003c/code>）無 Link。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>動畫與 Frame Data\u003c/strong>（\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_Wiki/Notify%E5%B0%8D%E9%BD%8A%E8%A8%AD%E8%A8%88%E5%B9%80.md\">Notify對齊設計幀.md\u003c/a>）：\u003cul>\n\u003cli>\u003ccode>AM_Attack_01\u003c/code>（右拳）：Preorder 16 幀，Active 22–30 幀（8 幀），Enable 36 幀，Disable 44 幀。\u003c/li>\n\u003cli>\u003ccode>AM_Attack_02\u003c/code>（左拳）：Preorder 20 幀，Active 26–30 幀（4 幀），Enable 38 幀，Disable 46 幀。\u003c/li>\n\u003cli>\u003ccode>AM_Attack_03\u003c/code>（右腳）：Preorder 10 幀，Active 20–28 幀（8 幀），Enable 40 幀，Disable 50 幀。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>傷害與硬直\u003c/strong>（\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/DamageTable.csv\">DamageTable.csv\u003c/a>）：\u003cul>\n\u003cli>ID 1（輕擊）：Damage 10, Hitstun 12 幀, Blockstun 8 幀。\u003c/li>\n\u003cli>ID 2（右腳踢頭）：Damage 15, Hitstun 18 幀, Blockstun 12 幀。\u003c/li>\n\u003cli>ID 3（第二攻擊）：Damage 20, Hitstun 16 幀, Blockstun 10 幀。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Link 規則約束\u003c/strong>（\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandValidation.cpp#L41-L45\">TndaCommandValidation.cpp\u003c/a>）：\u003cul>\n\u003cli>相鄰 Link 禁止使用相同 Montage（如 01 不能直接接 01）。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch2>3. 待決定問題與建議方案\u003c/h2>\n\u003ch3>問題 1：三段連段的動畫與 Command ID 配置\u003c/h3>\n\u003cp>需求指出「連按 X 打出三段，第一段後可改接 Y」、「重用既有動畫以不同 ID 區分步驟」、「保留原本其他招式」，且專案禁止相鄰 Link 共用同一 Montage。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>建議配置\u003c/strong>：\u003cul>\n\u003cli>\u003cstrong>ID 1（一段，X）\u003c/strong>：\u003ccode>AM_Attack_01\u003c/code>（右拳），\u003ccode>Opener=TRUE\u003c/code>，\u003ccode>Link=\"3,4\"\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>ID 4（二段，X）\u003c/strong>：\u003ccode>AM_Attack_02\u003c/code>（左拳），\u003ccode>Opener=FALSE\u003c/code>，\u003ccode>Link=\"5\"\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>ID 5（三段，X）\u003c/strong>：\u003ccode>AM_Attack_03\u003c/code>（右腳踢），\u003ccode>Opener=FALSE\u003c/code>，\u003ccode>Link=\"\"\u003c/code>（收招）。\u003c/li>\n\u003cli>\u003cstrong>ID 3（分支，Y）\u003c/strong>：\u003ccode>AM_Attack_02\u003c/code>（左拳），\u003ccode>Opener=TRUE\u003c/code>（保留空檔單按 Y 起手），\u003ccode>Link=\"\"\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>ID 2（6,X）\u003c/strong>：\u003ccode>AM_Attack_03\u003c/code>，\u003ccode>Opener=TRUE\u003c/code>，\u003ccode>Link=\"\"\u003c/code>。\n\u003cem>這樣 X→X→X 的動畫走向為「右拳(01) → 左拳(02) → 右腳(03)」，X→Y 為「右拳(01) → 左拳(02)」，相鄰完全不重複 Montage，且保留原本所有按鍵語意。\u003c/em>\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>請確認\u003c/strong>：是否採用此招式動畫配置？\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>問題 2：連段命中時對手硬直（Hitstun）與無縫銜接\u003c/h3>\n\u003cp>需求指出：「近距離第一下命中、後續順利接上時，對手來不及在中間還手」、「命中連段中間沒有還手空隙」。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>查證差距\u003c/strong>：\n若 ID 1 在第 22–24 幀擊中對手，對手目前僅承受 12 幀 Hitstun（於第 34–36 幀醒來）。而 ID 1 的接招窗口在第 36 幀才開啟（Enable=36），接出的 ID 4（\u003ccode>AM_Attack_02\u003c/code>）尚有 26 幀 Startup 才能判定。因此若維持原 12 幀 Hitstun，中間會有約 26 幀空檔，對手完全有時間反擊。\u003c/li>\n\u003cli>\u003cstrong>建議方案\u003c/strong>：\n在 \u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/DamageTable.csv\">DamageTable.csv\u003c/a> 為連段步驟調整或新增 Hitstun：\u003cul>\n\u003cli>例如 ID 1（一段命中）的 Hitstun 調高至 \u003cstrong>38 幀\u003c/strong>（使對手硬直到第 60–62 幀，涵蓋到二段在第 36+26=62 幀發生打擊判定）。\u003c/li>\n\u003cli>ID 4（二段命中）若使用 Damage 4，Hitstun 設為 \u003cstrong>36 幀\u003c/strong>（使對手硬直涵蓋到三段第 38+20=58 幀發生打擊判定）。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>請確認\u003c/strong>：是否在 \u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/DamageTable.csv\">DamageTable.csv\u003c/a> 調整 ID 1 Hitstun 並新增對應連段各段的 Damage 數值？\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>問題 3：\u003ccode>CommandTable.csv\u003c/code> 的欄位定義與順序\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>建議方案\u003c/strong>：\n將 \u003ccode>Opener\u003c/code> 欄位作為第 12 欄加在末尾：\n\u003ccode>ID,Title,Keys,Montage,PlayRate,Priority,CameraShot,Damage,Hitbox,Hurtboxes,Link,Opener\u003c/code>\u003cul>\n\u003cli>填值規則：空白或 \u003ccode>TRUE\u003c/code> 為可起手，\u003ccode>FALSE\u003c/code> 為不可起手；嚴格區分大小寫，其餘值驗證報錯。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>請確認\u003c/strong>：是否同意將 \u003ccode>Opener\u003c/code> 定義為第 12 欄？\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>問題 4：CPU 的選招與 Opener 約束\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>建議方案\u003c/strong>：\u003cul>\n\u003cli>\u003ccode>UTndaCommandReader::TrySelectCommand\u003c/code>（空檔選招）：過濾掉 \u003ccode>Opener == FALSE\u003c/code> 的招式。\u003c/li>\n\u003cli>\u003ccode>UTndaCommandReader::GetCommandCandidates\u003c/code>（起手候選列表）：當 \u003ccode>Link == nullptr\u003c/code> 時，同樣過濾掉 \u003ccode>Opener == FALSE\u003c/code> 的招式，使 CPU 不會在一般起手隨機抽到二、三段。\u003c/li>\n\u003cli>\u003ccode>UTndaCommandReader::TrySelectLinkedCommand\u003c/code>（接招選招）：只依據目前攻擊的 \u003ccode>Link\u003c/code> 集合篩選，不限制 \u003ccode>Opener\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>請確認\u003c/strong>：CPU 起手候選是否與玩家一致遵循 \u003ccode>Opener\u003c/code> 過濾？\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003c/section>\u003ch2>【對話 15】使用者（User）\u003c/h2>\u003csection class=\"conversation-message user-prompt\">\n\u003cp>以上依建議\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 16】AI助手\u003c/h2>\u003csection class=\"conversation-message ai-reply\">\n\u003ch1>SPEC｜三段連段與起手限制\u003c/h1>\n\u003chr>\n\u003ch2>1. 目標與範圍\u003c/h2>\n\u003ch3>1.1 目前問題\u003c/h3>\n\u003cul>\n\u003cli>現行招式表僅支援透過 \u003ccode>Link\u003c/code> 登記單一步驟後續（如 X→Y），且缺乏「限制招式只能在連段中使出」的機制。若直接在招式表登記連段專用招式，該招式在空檔時也會被一般輸入起手使出。\u003c/li>\n\u003cli>現行 Damage 表中輕擊（ID 1）命中後的 \u003ccode>Hitstun\u003c/code> 僅有 12 設計幀（0.2 秒）。而一段動作 \u003ccode>AM_Attack_01\u003c/code> 的接招啟用點在第 36 幀（Enable=36），接出二段 \u003ccode>AM_Attack_02\u003c/code> 的打擊判定點在第 26 幀。12 幀的受擊硬直使對手過早恢復行動（第 36 幀醒來），在二段判定到達前（約第 62 幀）有高達約 26 幀的空檔，無法形成真正的連續技（Hit combo）。\u003c/li>\n\u003c/ul>\n\u003ch3>1.2 完成後的遊戲行為\u003c/h3>\n\u003cul>\n\u003cli>招式表 \u003ccode>_DataTable/CommandTable.csv\u003c/code>（及資產 \u003ccode>DT_Command\u003c/code>）新增 \u003ccode>Opener\u003c/code> 欄位。\u003c/li>\n\u003cli>玩家於空檔輸入 X 啟動一段攻擊（\u003ccode>AM_Attack_01\u003c/code>）；在預約或接招窗口內持續按 X，可無縫銜接二段（\u003ccode>AM_Attack_02\u003c/code>）與三段（\u003ccode>AM_Attack_03\u003c/code>）；三段播放完畢後自然收招。\u003c/li>\n\u003cli>玩家在第一段後若改按 Y，可順利接出 Y 招式（\u003ccode>AM_Attack_02\u003c/code>）。\u003c/li>\n\u003cli>單按一次 X 僅執行一段，不會自動打出後續；招式被中斷（如出招前受擊或動作完全結束收尾）後，可重回空檔重新起手。\u003c/li>\n\u003cli>二段與三段招式的 \u003ccode>Opener\u003c/code> 設為 \u003ccode>FALSE\u003c/code>，在空檔無法直接輸入使出，只能透過一段與二段的 \u003ccode>Link\u003c/code> 接出。\u003c/li>\n\u003cli>近距離第一擊命中且玩家順利接招時，對手全程處於受擊硬直中，沒有任何空隙可還手或插招。\u003c/li>\n\u003cli>表格驗證時，若 \u003ccode>Opener\u003c/code> 填寫非 \u003ccode>\"\"\u003c/code>、\u003ccode>\"TRUE\"\u003c/code>、\u003ccode>\"FALSE\"\u003c/code>，或 Link 自接、成環、相鄰同 Montage 則整表驗證失敗並阻止 PIE；若有 \u003ccode>Opener=FALSE\u003c/code> 但無任何招式指向它的孤兒招式，僅提出 Warning 警告。\u003c/li>\n\u003c/ul>\n\u003ch3>1.3 本次包含與不包含\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>包含\u003c/strong>：\u003cul>\n\u003cli>C++ \u003ccode>FTndaCommandRow\u003c/code> 與 \u003ccode>FTndaCommand\u003c/code> 新增 \u003ccode>Opener\u003c/code> 支援。\u003c/li>\n\u003cli>C++ \u003ccode>UTndaCommandReader\u003c/code> 在空檔起手選招與候選清單中排除 \u003ccode>Opener == false\u003c/code> 的招式。\u003c/li>\n\u003cli>C++ \u003ccode>TndaCommandValidation\u003c/code> 擴充 \u003ccode>Opener\u003c/code> 原文與有效值驗證，以及孤兒招式警告。\u003c/li>\n\u003cli>\u003ccode>_DataTable/CommandTable.csv\u003c/code> 增加第 12 欄 \u003ccode>Opener\u003c/code>，並配置三段連段（ID 1、ID 4、ID 5）與既有招式（ID 2、ID 3）。\u003c/li>\n\u003cli>\u003ccode>_DataTable/DamageTable.csv\u003c/code> 調整/新增連段各段命中 Hitstun，確保連段無縫成立。\u003c/li>\n\u003cli>透過 unreal-mcp Reimport 與儲存 \u003ccode>DT_Command\u003c/code> 與 \u003ccode>DT_Damage\u003c/code>。\u003c/li>\n\u003cli>單元測試與功能手動驗收。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>不包含\u003c/strong>：\u003cul>\n\u003cli>擊退位移（Knockback）、浮空受擊或倒地追擊。\u003c/li>\n\u003cli>防禦崩解值（Guard Meter）、上中下段判定或特殊不可防禦技。\u003c/li>\n\u003cli>匯入新動畫資產（完全沿用既有 \u003ccode>AM_Attack_01\u003c/code>～\u003ccode>03\u003c/code>）。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2>2. 現況與已確認規則\u003c/h2>\n\u003ch3>2.1 查證依據\u003c/h3>\n\u003cul>\n\u003cli>原始碼：\u003cul>\n\u003cli>\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandData.h\">TndaCommandData.h\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandReader.h\">TndaCommandReader.h\u003c/a> / \u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandReader.cpp\">TndaCommandReader.cpp\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandValidation.h\">TndaCommandValidation.h\u003c/a> / \u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandValidation.cpp\">TndaCommandValidation.cpp\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/Fighting/FightingCharacter.cpp\">FightingCharacter.cpp\u003c/a>\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>資料與文件：\u003cul>\n\u003cli>\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/CommandTable.csv\">CommandTable.csv\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/DamageTable.csv\">DamageTable.csv\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_Wiki/Notify%E5%B0%8D%E9%BD%8A%E8%A8%AD%E8%A8%88%E5%B9%80.md\">Notify對齊設計幀.md\u003c/a>\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch3>2.2 條件 → 行為規則表\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>狀態 / 階段\u003c/th>\n\u003cth>觸發條件\u003c/th>\n\u003cth>系統行為\u003c/th>\n\u003cth>依據與說明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>空檔選招（玩家）\u003c/strong>\u003c/td>\n\u003ctd>角色落地且處於正常地面待機，收到輸入 X\u003c/td>\n\u003ctd>呼叫 \u003ccode>TrySelectCommand\u003c/code>，只從 \u003ccode>bOpener == true\u003c/code> 的候選中依優先度仲裁；選中 ID 1 並啟動 \u003ccode>AM_Attack_01\u003c/code>；ID 4、ID 5 因 \u003ccode>Opener=FALSE\u003c/code> 被略過\u003c/td>\n\u003ctd>本次決定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>空檔選招（CPU）\u003c/strong>\u003c/td>\n\u003ctd>CPU 處於 Neutral / 待機，取得候選招式\u003c/td>\n\u003ctd>\u003ccode>GetCommandCandidates(Link=nullptr)\u003c/code> 僅回傳 \u003ccode>bOpener == true\u003c/code> 的招式，CPU 不會在起手抽出二、三段\u003c/td>\n\u003ctd>本次決定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>一段預約窗口\u003c/strong>\u003c/td>\n\u003ctd>一段播放進度在 Preorder（第 16 幀）～ Enable（第 36 幀）之間，收到輸入 X\u003c/td>\n\u003ctd>寫入 \u003ccode>CommandBuffer\u003c/code>，保存語意 X 與當下方向，設定 0.5 秒過期計時器\u003c/td>\n\u003ctd>既有規則\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>一段接招窗口\u003c/strong>\u003c/td>\n\u003ctd>一段播放進度達 Enable（第 36 幀）且已有 X 預約，或在第 36～44 幀新按 X\u003c/td>\n\u003ctd>呼叫 \u003ccode>TrySelectLinkedCommand\u003c/code>，以一段的 \u003ccode>Link={\"3\",\"4\"}\u003c/code> 查詢；Attack=X 匹配到 ID 4，立即以自身 BlendIn（0.1s）接出二段 \u003ccode>AM_Attack_02\u003c/code>\u003c/td>\n\u003ctd>既有規則 + 本次配置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>一段改接 Y\u003c/strong>\u003c/td>\n\u003ctd>一段預約或接招窗口內收到輸入 Y\u003c/td>\n\u003ctd>\u003ccode>TrySelectLinkedCommand\u003c/code> 從 \u003ccode>Link={\"3\",\"4\"}\u003c/code> 匹配到 ID 3（Keys=Y），接出 Y（\u003ccode>AM_Attack_02\u003c/code>）\u003c/td>\n\u003ctd>既有規則 + 本次配置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>二段接三段\u003c/strong>\u003c/td>\n\u003ctd>二段在 Enable（第 38 幀）前收到 X 預約或窗口內按 X\u003c/td>\n\u003ctd>以二段的 \u003ccode>Link={\"5\"}\u003c/code> 查出 ID 5，接出三段 \u003ccode>AM_Attack_03\u003c/code>\u003c/td>\n\u003ctd>本次配置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>三段收招\u003c/strong>\u003c/td>\n\u003ctd>三段 \u003ccode>Link=\"\"\u003c/code>，播放至自然結束\u003c/td>\n\u003ctd>自然收尾進入 Recovery 並完全解鎖，回到待機狀態\u003c/td>\n\u003ctd>既有規則\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>連段無縫命中\u003c/strong>\u003c/td>\n\u003ctd>一段於第 22–30 幀近距離擊中對手\u003c/td>\n\u003ctd>對手承受 38 幀 Hitstun，硬直持續至第 60–68 幀；二段於第 36 幀接出並於第 62 幀（36+26）擊中，對手全程無空檔\u003c/td>\n\u003ctd>本次決定數值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>CSV 驗證\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>Opener\u003c/code> 欄位為空或 \u003ccode>TRUE\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>bOpener = true\u003c/code>，允許作為起手\u003c/td>\n\u003ctd>本次決定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>CSV 驗證\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>Opener\u003c/code> 欄位為 \u003ccode>FALSE\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>bOpener = false\u003c/code>，禁止作為起手，僅能由 Link 接出\u003c/td>\n\u003ctd>本次決定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>CSV 驗證\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>Opener\u003c/code> 欄位為其他字串（如 \u003ccode>True\u003c/code>、\u003ccode>false\u003c/code>、\u003ccode>1\u003c/code>）\u003c/td>\n\u003ctd>視為驗證錯誤，列入 \u003ccode>OutErrors\u003c/code>，停止 PIE\u003c/td>\n\u003ctd>需求要求嚴格區分大小寫\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>孤兒招式警告\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>bOpener == false\u003c/code> 但全表無其他招式的 Link 包含其 ID\u003c/td>\n\u003ctd>記入 Warning Log，不使整表驗證失敗\u003c/td>\n\u003ctd>需求明訂\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>2.3 招式與傷害數值定義表\u003c/h3>\n\u003ch4>Command 表規劃（\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/CommandTable.csv\">CommandTable.csv\u003c/a>）\u003c/h4>\n\u003cul>\n\u003cli>基準起算點：動畫時間 0 秒，設計幀率 60 FPS。\u003c/li>\n\u003c/ul>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Title\u003c/th>\n\u003cth>Keys\u003c/th>\n\u003cth>Montage\u003c/th>\n\u003cth>PlayRate\u003c/th>\n\u003cth>Priority\u003c/th>\n\u003cth>CameraShot\u003c/th>\n\u003cth>Damage\u003c/th>\n\u003cth>Hitbox\u003c/th>\n\u003cth>Hurtboxes\u003c/th>\n\u003cth>Link\u003c/th>\n\u003cth>Opener\u003c/th>\n\u003cth>說明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>1\u003c/strong>\u003c/td>\n\u003ctd>基本攻擊\u003c/td>\n\u003ctd>X\u003c/td>\n\u003ctd>AM_Attack_01\u003c/td>\n\u003ctd>1.0\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>hand_r\u003c/td>\n\u003ctd>\"head,pelvis,calf_l,calf_r\"\u003c/td>\n\u003ctd>\"3,4\"\u003c/td>\n\u003ctd>TRUE\u003c/td>\n\u003ctd>一段，可接 3(Y) 或 4(X)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>2\u003c/strong>\u003c/td>\n\u003ctd>右腳踢頭\u003c/td>\n\u003ctd>6,X\u003c/td>\n\u003ctd>AM_Attack_03\u003c/td>\n\u003ctd>1.0\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>foot_r\u003c/td>\n\u003ctd>\"head\"\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>TRUE\u003c/td>\n\u003ctd>保留既有招式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>3\u003c/strong>\u003c/td>\n\u003ctd>第二攻擊\u003c/td>\n\u003ctd>Y\u003c/td>\n\u003ctd>AM_Attack_02\u003c/td>\n\u003ctd>1.0\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>UpperBodyCloseUp\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>hand_l\u003c/td>\n\u003ctd>\"head,pelvis,calf_l,calf_r\"\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>TRUE\u003c/td>\n\u003ctd>保留既有 Y 起手與一段改接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>4\u003c/strong>\u003c/td>\n\u003ctd>連段二段\u003c/td>\n\u003ctd>X\u003c/td>\n\u003ctd>AM_Attack_02\u003c/td>\n\u003ctd>1.0\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>hand_l\u003c/td>\n\u003ctd>\"head,pelvis,calf_l,calf_r\"\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>FALSE\u003c/td>\n\u003ctd>二段，左拳，只能接出，後接 5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>5\u003c/strong>\u003c/td>\n\u003ctd>連段三段\u003c/td>\n\u003ctd>X\u003c/td>\n\u003ctd>AM_Attack_03\u003c/td>\n\u003ctd>1.0\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>foot_r\u003c/td>\n\u003ctd>\"head,pelvis,calf_l,calf_r\"\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>FALSE\u003c/td>\n\u003ctd>三段，右腳，只能接出，收招\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch4>Damage 表規劃（\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/_DataTable/DamageTable.csv\">DamageTable.csv\u003c/a>）\u003c/h4>\n\u003cul>\n\u003cli>設計幀率：60 FPS（1 幀 = 1/60 秒 ≈ 0.016667 秒）。\u003c/li>\n\u003c/ul>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Title\u003c/th>\n\u003cth>Damage\u003c/th>\n\u003cth>Hitstun（幀）\u003c/th>\n\u003cth>Blockstun（幀）\u003c/th>\n\u003cth>說明與銜接計算依據\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>1\u003c/strong>\u003c/td>\n\u003ctd>輕擊（一段）\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>\u003cstrong>38\u003c/strong>\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>擊中點約第 24 幀，硬直到第 62 幀；涵蓋二段判定（36+26=62 幀）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>2\u003c/strong>\u003c/td>\n\u003ctd>右腳踢頭\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>既有數值保持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>3\u003c/strong>\u003c/td>\n\u003ctd>第二攻擊（Y）\u003c/td>\n\u003ctd>20\u003c/td>\n\u003ctd>16\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>既有數值保持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>4\u003c/strong>\u003c/td>\n\u003ctd>連段二段\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>\u003cstrong>36\u003c/strong>\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>二段於第 26 幀擊中，硬直涵蓋三段判定（38+20=58 幀）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>5\u003c/strong>\u003c/td>\n\u003ctd>連段三段\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>三段終結擊\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n\u003ch2>3. 實作設計\u003c/h2>\n\u003ch3>3.1 功能模組：招式資料結構與 Opener 規則\u003c/h3>\n\u003ch4>1. 資料與介面\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>\u003ccode>FTndaCommandRow\u003c/code>\u003c/strong>（\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandData.h\">TndaCommandData.h\u003c/a>）：\u003cul>\n\u003cli>新增屬性：\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-cpp syntax-code\">\u003cspan class=\"syn-macro\">UPROPERTY\u003c/span>(EditAnywhere, BlueprintReadOnly, Category=\u003cspan class=\"syn-string\">\"Command\"\u003c/span>)\n\u003cspan class=\"syn-type\">FString\u003c/span> \u003cspan class=\"syn-declaration\">Opener\u003c/span>;\n\u003c/code>\u003c/pre>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>FTndaCommand\u003c/code>\u003c/strong>（\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandData.h\">TndaCommandData.h\u003c/a>）：\u003cul>\n\u003cli>新增屬性：\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-cpp syntax-code\">\u003cspan class=\"syn-macro\">UPROPERTY\u003c/span>(VisibleAnywhere, BlueprintReadOnly, Category=\u003cspan class=\"syn-string\">\"Command\"\u003c/span>)\n\u003cspan class=\"syn-type\">bool\u003c/span> \u003cspan class=\"syn-declaration\">bOpener\u003c/span> = \u003cspan class=\"syn-keyword\">true\u003c/span>;\n\u003c/code>\u003c/pre>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>輔助解析函式\u003c/strong> \u003ccode>TndaCommandData::ParseOpener\u003c/code>：\u003cul>\n\u003cli>輸入：\u003ccode>const FString&amp; Text, bool&amp; OutbOpener\u003c/code>\u003c/li>\n\u003cli>規則：裁切前後空白後，空字串或 \u003ccode>\"TRUE\"\u003c/code> 輸出 \u003ccode>true\u003c/code>，\u003ccode>\"FALSE\"\u003c/code> 輸出 \u003ccode>false\u003c/code>；其他字串回傳 \u003ccode>false\u003c/code>（解析失敗）。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch4>2. Init\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>觸發時機\u003c/strong>：GameInstance 啟動或 DataTable Reimport 觸發 \u003ccode>UTndaCommandReader::Prepare\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>資料準備\u003c/strong>：\u003cul>\n\u003cli>走訪各 Row，呼叫 \u003ccode>TndaCommandData::ParseOpener(Row.Opener, Command.bOpener)\u003c/code>。\u003c/li>\n\u003cli>Editor 檢查：若解析失敗，追加錯誤字串：\u003ccode>Row=&lt;ID&gt; Field=Opener: 必須為空白、TRUE 或 FALSE（區分大小寫）。\u003c/code>\u003c/li>\n\u003cli>孤兒檢查：在 \u003ccode>ValidateLinks\u003c/code> 完成後，針對 \u003ccode>!Command.bOpener\u003c/code> 且 \u003ccode>Incoming[*Target] == 0\u003c/code> 的招式，輸出 Warning Log：\n\u003ccode>UE_LOG(LogTndaFighter, Warning, TEXT(\"DataTables TableId=Command Row=%d: Opener 為 FALSE 但無任何招式 Link 指向此招，此招無法被使出。\"), Command.Id)\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>清除舊狀態\u003c/strong>：\u003ccode>Reset()\u003c/code> 時清空 \u003ccode>Commands\u003c/code> 容器。\u003c/li>\n\u003c/ul>\n\u003ch4>3. Tick / 查詢時機\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>更新時機\u003c/strong>：角色出招呼叫 \u003ccode>UTndaCommandReader::SelectCommand\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>空檔選招推進條件\u003c/strong>（\u003ccode>Link == nullptr\u003c/code>）：\u003cul>\n\u003cli>走訪排序後的候選招式，除了原本的 \u003ccode>Attack\u003c/code> 與 \u003ccode>Direction\u003c/code> 判定外，增加：\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-cpp syntax-code\">\u003cspan class=\"syn-keyword\">if\u003c/span> (Link == \u003cspan class=\"syn-keyword\">nullptr\u003c/span> &amp;&amp; !Candidate.bOpener)\n{\n    \u003cspan class=\"syn-keyword\">continue\u003c/span>; \u003cspan class=\"syn-comment\">// 禁止非 Opener 招式在空檔起手\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>接招推進條件\u003c/strong>（\u003ccode>Link != nullptr\u003c/code>）：\u003cul>\n\u003cli>嚴格依照 \u003ccode>Link\u003c/code> 包含的 ID 進行候選，不受 \u003ccode>Candidate.bOpener\u003c/code> 限制。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>CPU 候選清單\u003c/strong>（\u003ccode>UTndaCommandReader::GetCommandCandidates\u003c/code>）：\u003cul>\n\u003cli>當 \u003ccode>Link == nullptr\u003c/code> 時，\u003ccode>SelectCommand\u003c/code> 自動過濾掉 \u003ccode>bOpener == false\u003c/code>，因此回傳的起手候選只包含可起手招式。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch4>4. End\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>生命週期清理\u003c/strong>：\u003cul>\n\u003cli>隨 Reader 既有 \u003ccode>Reset()\u003c/code> 與 Subsystem 統一銷毀，無額外動態記憶體。\u003c/li>\n\u003cli>招式被中斷（\u003ccode>CancelAttack\u003c/code> / 受擊進入 Stun）時，角色的 \u003ccode>CurrentAttack\u003c/code> 被清空，角色回到 Normal Ground State，下次輸入再次從 \u003ccode>SelectCommand(Link=nullptr)\u003c/code> 重新依照 Opener 仲裁起手。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch4>5. 接入與手動確認\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>檔案修改位置\u003c/strong>：\u003cul>\n\u003cli>\u003ccode>Source/TndaFighter/DataTable/TndaCommandData.h\u003c/code> 與 \u003ccode>.cpp\u003c/code>\u003c/li>\n\u003cli>\u003ccode>Source/TndaFighter/DataTable/TndaCommandReader.cpp\u003c/code>\u003c/li>\n\u003cli>\u003ccode>Source/TndaFighter/DataTable/TndaCommandValidation.h\u003c/code> 與 \u003ccode>.cpp\u003c/code>\u003c/li>\n\u003cli>\u003ccode>_DataTable/CommandTable.csv\u003c/code>\u003c/li>\n\u003cli>\u003ccode>_DataTable/DamageTable.csv\u003c/code>\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>建置與資產更新順序\u003c/strong>：\u003col>\n\u003cli>修改 C++ 原始碼並編譯 \u003ccode>TndaFighterEditor Win64 Development\u003c/code>。\u003c/li>\n\u003cli>修改 \u003ccode>_DataTable/CommandTable.csv\u003c/code> 與 \u003ccode>_DataTable/DamageTable.csv\u003c/code>。\u003c/li>\n\u003cli>透過 \u003ccode>unreal-mcp\u003c/code> 對 \u003ccode>DT_Command\u003c/code> 與 \u003ccode>DT_Damage\u003c/code> 執行 Reimport 並儲存資產。\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2>4. 工單劃分規劃\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>工單 1：C++ 資料欄位、Opener 解析、起手過濾與驗證實作\u003c/strong>\u003cul>\n\u003cli>在 \u003ccode>TndaCommandData\u003c/code>、\u003ccode>TndaCommandReader\u003c/code>、\u003ccode>TndaCommandValidation\u003c/code> 實作 \u003ccode>Opener\u003c/code> 欄位、解析、起手過濾與孤兒警告。\u003c/li>\n\u003cli>編譯確認無錯誤。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>工單 2：資料表更新與 MCP Reimport\u003c/strong>\u003cul>\n\u003cli>修改 \u003ccode>_DataTable/CommandTable.csv\u003c/code>（增加第 12 欄與連段 ID 4、5）與 \u003ccode>_DataTable/DamageTable.csv\u003c/code>（調整與新增 Hitstun 數值）。\u003c/li>\n\u003cli>透過 \u003ccode>unreal-mcp\u003c/code> 執行 Reimport 與儲存，確認驗證通過無報錯。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>工單 3：三段連段手動驗證與驗收\u003c/strong>\u003cul>\n\u003cli>於 stage1 執行 PIE 手動驗收：單按 X、連按 X→X→X、X→Y、空檔單按二/三段被拒絕、命中對手無法還手、中斷後重新起手。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cp>請確認上述 SPEC 規格與設計。若確認無誤，我將把此 SPEC 存檔並進入工單 1 實作。\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 17】使用者（User）\u003c/h2>\u003csection class=\"conversation-message user-prompt\">\n\u003cp>確認無誤，把此 SPEC 存檔並進入工單 1 實作\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 18】AI助手\u003c/h2>\u003csection class=\"conversation-message ai-reply\">\n\u003cp>已將 SPEC 存檔至 \u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/.scratch/three-stage-combo/spec.md\">.scratch/three-stage-combo/spec.md\u003c/a>。\u003c/p>\n\u003chr>\n\u003ch2>本批工單範圍：工單 1（C++ 資料欄位、Opener 解析、起手過濾與驗證實作）\u003c/h2>\n\u003cp>依據 SPEC，本張工單只處理 C++ 程式碼與驗證邏輯，不修改 CSV、資產或遊戲功能：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>\u003ccode>FTndaCommandRow\u003c/code> 與 \u003ccode>FTndaCommand\u003c/code> 擴充\u003c/strong>（\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandData.h\">TndaCommandData.h\u003c/a>）：\u003cul>\n\u003cli>\u003ccode>FTndaCommandRow\u003c/code> 新增 \u003ccode>FString Opener\u003c/code> 欄位。\u003c/li>\n\u003cli>\u003ccode>FTndaCommand\u003c/code> 新增 \u003ccode>bool bOpener = true\u003c/code>。\u003c/li>\n\u003cli>新增 \u003ccode>TndaCommandData::ParseOpener\u003c/code>，嚴格解析空白、\u003ccode>\"TRUE\"\u003c/code>（\u003ccode>true\u003c/code>）與 \u003ccode>\"FALSE\"\u003c/code>（\u003ccode>false\u003c/code>），其餘視為非法。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>起手選招與候選過濾\u003c/strong>（\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandReader.cpp\">TndaCommandReader.cpp\u003c/a>）：\u003cul>\n\u003cli>\u003ccode>Prepare\u003c/code> 走訪時解析 \u003ccode>Row.Opener\u003c/code>，非法時於 Editor 列入 \u003ccode>OutErrors\u003c/code>。\u003c/li>\n\u003cli>\u003ccode>SelectCommand\u003c/code> 在 \u003ccode>Link == nullptr\u003c/code>（空檔起手）時略過 \u003ccode>bOpener == false\u003c/code> 的招式；連段（\u003ccode>Link != nullptr\u003c/code>）則僅看 Link 清單。\u003c/li>\n\u003cli>\u003ccode>GetCommandCandidates\u003c/code> 沿用空檔規則，使 CPU 起手候選自動排除 \u003ccode>bOpener == false\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>表格來源與孤兒招式檢查\u003c/strong>（\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandValidation.cpp\">TndaCommandValidation.cpp\u003c/a>）：\u003cul>\n\u003cli>\u003ccode>ValidateSource\u003c/code> 擴充契約為 12 欄（第 12 欄 \u003ccode>Opener\u003c/code>），並檢查原文內容。\u003c/li>\n\u003cli>\u003ccode>ValidateLinks\u003c/code> 增加孤兒招式判定：若招式 \u003ccode>bOpener == false\u003c/code> 且無任何招式 Link 指向它，記錄 Warning Log（不使整表驗證失敗）。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>程式碼規範\u003c/strong>：手寫繁體中文註解、維持 CRLF 換行符號。\u003c/li>\n\u003c/ol>\n\u003cp>請確認是否開始執行工單 1。\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 19】使用者（User）\u003c/h2>\u003csection class=\"conversation-message user-prompt\">\n\u003cp>開始執行工單 1\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 20】AI助手\u003c/h2>\u003csection class=\"conversation-message ai-reply\">\n\u003ch2>1. 異動導覽\u003c/h2>\n\u003cp>本次工單完成「C++ 資料欄位、Opener 解析、起手過濾與驗證實作」，未修改任何 CSV 或 \u003ccode>.uasset\u003c/code> 資產：\u003c/p>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandData.h\">TndaCommandData.h\u003c/a>\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>修改位置\u003c/strong>：\u003ccode>FTndaCommandRow\u003c/code>（第 58 行）、\u003ccode>FTndaCommand\u003c/code>（第 114 行）、\u003ccode>TndaCommandData\u003c/code>（第 152 行）。\u003c/li>\n\u003cli>\u003cstrong>差異\u003c/strong>：\u003cul>\n\u003cli>\u003ccode>FTndaCommandRow\u003c/code> 新增 \u003ccode>UPROPERTY() FString Opener\u003c/code> 欄位（對應 CSV 第 12 欄）。\u003c/li>\n\u003cli>\u003ccode>FTndaCommand\u003c/code> 新增 \u003ccode>UPROPERTY() bool bOpener = true\u003c/code> 旗標。\u003c/li>\n\u003cli>\u003ccode>TndaCommandData\u003c/code> 宣告 \u003ccode>ParseOpener\u003c/code> 函式。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>原因\u003c/strong>：提供招式起手資格的資料結構與解析介面。\u003c/li>\n\u003cli>\u003cstrong>請檢查\u003c/strong>：USTRUCT 宣告與繁體中文 Doxygen 註解。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandData.cpp\">TndaCommandData.cpp\u003c/a>\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>修改位置\u003c/strong>：檔尾第 184 行。\u003c/li>\n\u003cli>\u003cstrong>差異\u003c/strong>：實作 \u003ccode>ParseOpener\u003c/code>。只裁切前後空白，空白或 \u003ccode>\"TRUE\"\u003c/code> 輸出 \u003ccode>true\u003c/code>，\u003ccode>\"FALSE\"\u003c/code> 輸出 \u003ccode>false\u003c/code>，嚴格區分大小寫，其他字串回傳 \u003ccode>false\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>原因\u003c/strong>：落實 SPEC 規定的 Opener 語法判定契約。\u003c/li>\n\u003cli>\u003cstrong>請檢查\u003c/strong>：大小寫敏感度（\u003ccode>ESearchCase::CaseSensitive\u003c/code>）與空白處理。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandReader.cpp\">TndaCommandReader.cpp\u003c/a>\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>修改位置\u003c/strong>：\u003ccode>Prepare\u003c/code>（第 54 行、第 60 行）與 \u003ccode>SelectCommand\u003c/code>（第 163 行）。\u003c/li>\n\u003cli>\u003cstrong>差異\u003c/strong>：\u003cul>\n\u003cli>\u003ccode>Prepare\u003c/code> 走訪時呼叫 \u003ccode>ParseOpener\u003c/code>，若非法則於 Editor 列入 \u003ccode>OutErrors\u003c/code>。\u003c/li>\n\u003cli>\u003ccode>SelectCommand\u003c/code> 在 \u003ccode>Link == nullptr\u003c/code>（空檔起手）時加入 \u003ccode>if (!Link &amp;&amp; !Candidate.bOpener) { continue; }\u003c/code>，直接略過不可起手的招式；連段（\u003ccode>Link != nullptr\u003c/code>）則僅看 Link 清單。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>原因\u003c/strong>：阻止不可起手招式在空檔被單鍵使出，並自動讓 CPU 起手候選（\u003ccode>GetCommandCandidates\u003c/code>）同步過濾。\u003c/li>\n\u003cli>\u003cstrong>請檢查\u003c/strong>：\u003ccode>Link == nullptr\u003c/code> 與 \u003ccode>Link != nullptr\u003c/code> 的分支行為。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandValidation.h\">TndaCommandValidation.h\u003c/a> / \u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/TndaCommandValidation.cpp\">TndaCommandValidation.cpp\u003c/a>\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>修改位置\u003c/strong>：\u003ccode>ValidateLinks\u003c/code>（第 48 行）與 \u003ccode>ValidateSource\u003c/code>（第 106 行、第 131 行）。\u003c/li>\n\u003cli>\u003cstrong>差異\u003c/strong>：\u003cul>\n\u003cli>\u003ccode>ValidateSource\u003c/code> 欄位契約擴增為 12 欄（第 12 欄 \u003ccode>Opener\u003c/code>），並透過 \u003ccode>ParseOpener\u003c/code> 驗證 CSV 原文。\u003c/li>\n\u003cli>\u003ccode>ValidateLinks\u003c/code> 增加孤兒招式檢查：若招式 \u003ccode>bOpener == false\u003c/code> 且無任何招式 Link 指向它，記錄 Warning Log（不加入 \u003ccode>OutErrors\u003c/code>，不阻止 PIE）。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>原因\u003c/strong>：滿足「Opener 填錯整表驗證失敗、無入口的 FALSE 招式只警告」規格。\u003c/li>\n\u003cli>\u003cstrong>請檢查\u003c/strong>：警告日誌使用 \u003ccode>UE_LOG(LogTndaFighter, Warning, ...)\u003c/code> 且未阻擋準備流程。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>測試檔案同步與擴充\u003c/strong>：\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/Tests/TndaCommandValidationTests.cpp\">TndaCommandValidationTests.cpp\u003c/a>：更新 12 欄 Header 與 ValidRow，加入 \u003ccode>true\u003c/code>、\u003ccode>false\u003c/code>、\u003ccode>True\u003c/code>、\u003ccode>False\u003c/code>、\u003ccode>1\u003c/code>、\u003ccode>0\u003c/code>、\u003ccode>bad\u003c/code> 均定位至 \u003ccode>Opener\u003c/code> 錯誤的測試。\u003c/li>\n\u003cli>\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/Tests/TndaCommandSelectionTests.cpp\">TndaCommandSelectionTests.cpp\u003c/a>：新增 \u003ccode>Opener=FALSE\u003c/code> 招式，驗證其在空檔不會被單鍵選出（\u003ccode>TrySelectCommand\u003c/code>），但可經由合法 Link 成功選出（\u003ccode>TrySelectLinkedCommand\u003c/code>）。\u003c/li>\n\u003cli>\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/Tests/TndaCommandLinkTests.cpp\">TndaCommandLinkTests.cpp\u003c/a>、\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/Tests/TndaDamageTests.cpp\">TndaDamageTests.cpp\u003c/a>、\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/DataTable/Tests/TndaReimportValidationTests.cpp\">TndaReimportValidationTests.cpp\u003c/a>、\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Source/TndaFighter/Fighting/Tests/FightingCommandHandoffTests.cpp\">FightingCommandHandoffTests.cpp\u003c/a>：同步隔離 fixture 的 12 欄 Header。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch2>2. 手動驗證\u003c/h2>\n\u003ch3>準備工作\u003c/h3>\n\u003cp>關閉目前 Editor（若開啟），以便編譯 C++ 原始碼。\u003c/p>\n\u003ch3>逐步操作\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>編譯 Editor Target\u003c/strong>：\n在 PowerShell 執行建置（或於 Visual Studio 以 \u003ccode>Development Editor\ u003c/code>、Hitbox=\u003ccode>foot_r\u003c/code>、Hurtboxes=\u003ccode>\"head,pelvis,calf_l,calf_r\"\u003c/code>、Link=\u003ccode>\"\"\u003c/code>、Opener=\u003ccode>FALSE\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>原因\u003c/strong>：落實 X→X→X 三段連段與 X→Y 分支配置，並指定二、三段為不可單獨起手（\u003ccode>Opener=FALSE\u003c/code>）。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>\u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Content/DataTable/DT_Damage.uasset\">/Game/DataTable/DT_Damage\u003c/a> 與 \u003ca href=\"file:///d:/Case/TNDA_Workspace/TndaFighterProject-worktrees/week-10/Content/DataTable/DT_Command.uasset\">/Game/DataTable/DT_Command\u003c/a>\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>操作方式\u003c/strong>：透過 \u003ccode>unreal-mcp\u003c/code> 執行 \u003ccode>fill_data_table_from_csv_file\u003c/code> 重新匯入，並以 \u003ccode>EditorAssetLibrary.save_loaded_asset\u003c/code> 儲存 package。\u003c/li>\n\u003cli>\u003cstrong>回讀確認\u003c/strong>：\u003cul>\n\u003cli>\u003ccode>DT_Damage\u003c/code> 回讀確認包含 5 列，ID 1 的 Hitstun 為 38。\u003c/li>\n\u003cli>\u003ccode>DT_Command\u003c/code> 回讀確認包含 5 列，第 12 欄為 Opener，ID 4、5 為 FALSE。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>請檢查\u003c/strong>：可在 Content Browser 打開 \u003ccode>DT_Command\u003c/code> 與 \u003ccode>DT_Damage\u003c/code> 查看 Row Name 與各欄位數值。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ol>\n\u003chr>\n\u003ch2>2. 手動驗證\u003c/h2>\n\u003ch3>準備工作\u003c/h3>\n\u003col>\n\u003cli>確保 Editor 處於開啟狀態（關卡為 \u003ccode>/Game/Fighting/stage1\u003c/code>）。\u003c/li>\n\u003cli>在關卡中按下 \u003cstrong>Play in Editor (PIE)\u003c/strong> 進入遊戲。\u003c/li>\n\u003c/ol>\n\u003ch3>逐步操作與驗收項目\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>單按 X（一段攻擊）\u003c/strong>：\u003c/p>\n\u003cul>\n\u003cli>操作：在空檔按一下 \u003ccode>U\u003c/code> 鍵（送出語意 X）。\u003c/li>\n\u003cli>預期：只打出一拳（\u003ccode>AM_Attack_01\u003c/code> 右拳），打完後自然收招，不會自動打出二段或三段。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>連按 X→X→X（三段完整連段）\u003c/strong>：\u003c/p>\n\u003cul>\n\u003cli>操作：靠近 CPU，連續節奏按 \u003ccode>U\u003c/code> 鍵（X → X → X）。\u003c/li>\n\u003cli>預期：\u003cul>\n\u003cli>第一段（右拳 \u003ccode>AM_Attack_01\u003c/code>）命中。\u003c/li>\n\u003cli>順利接出第二段（左拳 \u003ccode>AM_Attack_02\u003c/code>）並命中。\u003c/li>\n\u003cli>順利接出第三段（右腳 \u003ccode>AM_Attack_03\u003c/code>）擊中對手。\u003c/li>\n\u003cli>命中期間對手全程處於受擊硬直（\u003ccode>Hitstun\u003c/code> 播放挨打動畫），無法插招反擊。\u003c/li>\n\u003cli>第三段踢完後自然收招，解鎖移動與轉向。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>第一段改接 Y（X→Y 分支）\u003c/strong>：\u003c/p>\n\u003cul>\n\u003cli>操作：按 \u003ccode>U\u003c/code> 鍵出 X，於接招窗口內改按 \u003ccode>I\u003c/code> 鍵（送出語意 Y）。\u003c/li>\n\u003cli>預期：第一段（右拳）後順利接出第二攻擊（左拳 \u003ccode>AM_Attack_02\u003c/code>，觸發特寫鏡頭）。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>二段／三段不可空檔起手\u003c/strong>：\u003c/p>\n\u003cul>\n\u003cli>預期：在一般地面待機時，按 \u003ccode>U\u003c/code> 只會發動一段（ID 1 基本攻擊），絕不會直接出二段（ID 4）或三段（ID 5）。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>中斷後重新起手\u003c/strong>：\u003c/p>\n\u003cul>\n\u003cli>操作：打出 X 或 X→X 後停止按鍵，等動作完全收尾回到待機；或出招前受擊被打斷。\u003c/li>\n\u003cli>預期：收招或硬直結束後，再次按 \u003ccode>U\u003c/code> 依然能從第一段正常起手。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ol>\n\u003ch3>還原步驟\u003c/h3>\n\u003cp>若需還原測試前的資料表，可透過 \u003ccode>git checkout -- _DataTable/ Content/DataTable/\u003c/code> 還原 CSV 與資產。\u003c/p>\n\u003chr>\n\u003cp>請於執行上述 PIE 手動驗收後回報結果。\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 32】使用者（User）\u003c/h2>\u003csection class=\"conversation-message user-prompt\">\n\u003cp>以上確認無誤\u003c/p>\n\u003chr>\n\u003c/section>\u003ch2>【對話 33】AI助手\u003c/h2>\u003csection class=\"conversation-message ai-reply\">\n\u003ch3>驗證與結果記錄\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>單按 X（一段攻擊）\u003c/strong>：\u003cstrong>通過\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>連按 X→X→X（三段完整連段）\u003c/strong>：\u003cstrong>通過\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>第一段改接 Y（X→Y 分支）\u003c/strong>：\u003cstrong>通過\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>二段／三段不可空檔起手\u003c/strong>：\u003cstrong>通過\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>中斷後重新起手\u003c/strong>：\u003cstrong>通過\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch3>Commit 完成紀錄\u003c/h3>\n\u003cp>已將工單 2 之修改（包含資料表、資產 Reimport 與模組文件更新）提交至 Git：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>f0c22f2\u003c/code> (\u003ccode>feat: 工單 2 完成 Command 與 Damage 資料表更新與資產 Reimport\u003c/code>)\u003c/li>\n\u003c/ul>\n\u003cp>目前 working tree clean，本次需求「三段連段與起手限制」已完整實作並驗收完畢。\u003c/p>\n\u003chr>\n\u003c/section>\u003c/article>\u003c/body>\u003c/html>"},"prompt":"# 需求：三段連段\n我想讓玩家連按 X 打出三段，也能在第一段後改接 Y。\n請在招式表 _DataTable/CommandTable.csv（對應 DT_Command）新增 Opener，指定哪些招式可起手、哪些只能接在連段裡。\n# 規格\n- Opener 空白或 TRUE 可以起手，FALSE 只能由 Link 接出；區分大小寫，其他值視為錯誤。\n- 空檔選招看 Opener；連段中只看目前招式的 Link。\n- 按一下 X 只打一段，繼續按才接下一段；第二、三段不能單獨起手，第三段打完收招。\n- 可重用既有動畫，以不同 Command ID 區分連段步驟；保留原本其他招式。\n- 近距離第一下命中、後續順利接上時，對手來不及在中間還手。\n# 驗收目標\n- 單按 X、X→X→X、X→Y 都能正常使用；中斷後可重新起手。\n- FALSE 的招式無法從空檔使出，但能經 Link 接出；命中連段中間沒有還手空隙。\n- Opener 填錯、Link 接自己、接相同動畫或形成循環時，整表驗證失敗；無入口的 FALSE 招式只警告。\n- Reimport 後下次選招就使用新資料，原本其他招式仍正常。\n# 現在開始\n依共用提示詞先查專案，提出招式資料、接招時間與實作方案，讓我確認。\n只問未決問題並附建議；確認後整理 SPEC，再等我確認實作。"},{"page":15,"title":"情境需求：CPU 為什麼只會打兩下？","demo":2,"kind":"diagram","key":"week-10 的 CPU 一整組只有一次後續機會，打不出第三段；week-11 改成每一招各有一次，就能沿 Link 接到底。","location":"FightingCpuCharacter.cpp｜TryStartAIAttack()／TrySubmitAIFollowup()；FightingCpuStateTree.cpp｜攻擊 Task","lessonRefs":[{"href":"#reading-c810fa7d","label":"設計需求","hint":""},{"href":"#reading-7743ecd1","label":"程式流程圖","hint":""}],"api":[["起手遵守 Opener","只從 ID 1、2、3 等機率抽一招。"],["每一招一次","沒候選或被拒絕，同一招不重試。"],["節奏不變","整組收招後，才等 0.8 秒。"]],"note":"出招一樣交給玩家共用的 SubmitCommand()。","steps":[{"title":"本頁重點","detail":"week-10 的 CPU 一整組只有一次後續機會，打不出第三段；week-11 改成每一招各有一次，就能沿 Link 接到底。","focus":[]}],"topicLabel":"情境需求","svg":"\u003csvg id=\"slide-diagram-15\" width=\"604\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" height=\ detail":"ID 4 再接 ID 5，收招後等 0.8 秒。"}]},{"page":18,"title":"想一想：ID 5 接上第二攻擊，CPU 會打出什麼？","demo":2,"kind":"question","questionToggle":true,"key":"每一招各決定一次，候選只看目前這一招的 Link，而且等機率抽選。","location":"FightingCpuCharacter.cpp｜TrySubmitAIFollowup()，第 346～348 行","lessonRefs":[{"href":"#reading-6aefd691","label":"想一想","hint":""}],"steps":[{"title":"想一想｜ID 5 的 Link 改成 3","detail":"第三段之後可以接第二攻擊。開 CPUAI on 觀察 CPU，它可能打出哪些組合？每一種出現的機率是多少？","focus":[]},{"title":"參考答案｜四種可能的攻擊路線","detail":"起手：ID 1、2、3 各 1/3。若起手是 ID 1，再從 ID 3、4 各以 1/2 抽選。","table":{"columns":["攻擊路線","機率計算","結果"],"rows":[["ID 2（單發）","1/3","1/3"],["ID 3（單發）","1/3","1/3"],["ID 1 → 3","1/3 × 1/2","1/6"],["ID 1 → 4 → 5 → 3","1/3 × 1/2 × 1 × 1","1/6"]]},"note":"抽到 ID 4 後，4→5、5→3 都只有一個選擇。四種機率合計為 1；依規則推算，未實測抽招分布。","focus":[]}],"topicLabel":"想一想"},{"page":19,"title":"示範需求：CPU 會打連段","demo":2,"kind":"prompt","key":"貼上需求後，依共用流程討論、確認 SPEC、實作與驗收。","location":"無","lessonRefs":[],"steps":[{"title":"本頁重點","detail":"貼上需求後，依共用流程討論、確認 SPEC、實作與驗收。","focus":[]}],"topicLabel":"示範需求","prompt":"# 需求：CPU 會打連段\n我希望 CPU 依招式表 _DataTable/CommandTable.csv（DT_Command）的 Opener 與 Link 打連段，讓玩家練習防守。\n# 規格\n- 起手從 Opener 允許的招式等機率抽選；後續從目前 Link 的合法招式等機率抽選。\n- 每招第一次開啟接招預約窗口時有一次機會，接上下一招就有新機會；沿 Link 接到底，不限制三段。\n- 有候選就嘗試接，不額外隨機放棄；沒候選、提交失敗或預約過期，同一招都不重試。\n- 沿用玩家的出招與接招限制；最後一招完整收招後，才等 0.8 秒再進攻。\n- 受擊中斷或關閉 AI 後不補送舊招，下一次進攻重新開始；這次不加難度或看玩家動作選招。\n# 驗收目標\n- CPU 能打出單發、X→Y、X→X→X，且不會用連段專用招式起手。\n- 延長 Link 後能接出更多段；重用相同動畫的不同招式，也各有一次接招機會。\n- 接招失敗不重試，段與段之間不等待，整組收招後才等 0.8 秒。\n- 受擊中斷、AI 關閉再開啟後，不會補送上一組的招式。\n# 現在開始\n接續示範 1，依共用提示詞先查專案，提出實作與驗收方案，讓我確認。\n只問未決問題並附建議；確認後整理 SPEC，再等我確認實作。"},{"page":20,"title":"情境需求：被防住之後，誰該先出手？","demo":3,"kind":"cards","key":"Frame Bar 讓每一幀看得見，幀優勢告訴你誰先能動，命中分類告訴你打在對方的哪個階段。","location":"FightingPlayerCharacter.cpp｜DrawFrameBars()；FightingFrameBar.cpp｜FFightingFrameBarRecorder::Sample()；FightingCharacter.cpp｜UpdateFrameAdvantage()","lessonRefs":[{"href":"#reading-ecb043be","label":"設計需求","hint":""}],"cards":[["Frame Bar","畫面上方兩條，一格一幀。綠色判定前，紅色判定中，黃色收招；深紫是挨打硬直，淺紫是防禦硬直。"],["幀優勢","先恢復的一方能動時顯示。藍色加號是你先動，紅色減號是你晚動，白色 0 是同時。連段中不顯示。"],["命中分類","對方出招途中被打中才分類：破招、截擊、確反。只是標籤與 Log，不加傷害。"]],"note":"UE 提供動畫位置、計時器與繪圖；定案時機、正負號與分類規則由遊戲自己定。","steps":[{"title":"本頁重點","detail":"Frame Bar 讓每一幀看得見，幀優勢告訴你誰先能動，命中分類告訴你打在對方的哪個階段。","focus":[]}],"topicLabel":"情境需求"},{"page":21,"title":"算例：三招被防，為什麼是 ＋3、－2、－10？","demo":3,"kind":"question","key":"被防住的幀優勢等於「命中幀＋Blockstun－招式長度」，三招的資料讓結果剛好是 ＋3、－2、－10。","location":"_DataTable/DamageTable.csv｜Blockstun；FightingCharacter.cpp｜ResolveFrameAdvantage()","lessonRefs":[{"href":"#prestudy-commands","label":"本週的五列招式","source":"prestudy","sourceHeading":"本週的五列招式"},{"href":"#prestudy-montages","label":"三份 Montage 的時間軸","source":"prestudy","sourceHeading":"三份 Montage 的時間軸"},{"href":"#prestudy-stun","label":"三種硬直（DamageTable）","source":"prestudy","sourceHeading":"三種硬直"},{"href":"#reading-bfd2708d","label":"幀優勢計算規則","hint":""},{"href":"#reading-ecb043be","label":"設計需求","hint":""}],"steps":[{"title":"三招被防：誰先恢復？","detail":"以你這招開始播放為第 0 幀，雙方共用；假設判定開始就碰到 CPU。命中幀與動畫長度查 Montage 時間軸，Blockstun 查 DamageTable。","focus":[],"table":{"columns":["招式","命中幀","＋Blockstun","＝CPU 恢復","你恢復（動畫長度）","幀優勢（CPU－你）"],"rows":[["X","第 7 幀","26 幀","第 33 幀","第 30 幀","＋3：你早 3 幀"],["Y","第 10 幀","28 幀","第 38 幀","第 40 幀","－2：你晚 2 幀"],["6X","第 14 幀","46 幀","第 60 幀","第 70 幀","－10：你晚 10 幀"]]},"note":"狀況：1P 從空檔單按一次（不在連段中）；CPU 站著防禦、沒有出招（實測用 tnda.Debug.CPUAI off、tnda.Debug.CPUDefense on）；站距 85 cm，判定開始那一幀就碰到 CPU；60 FPS。站遠一點、晚 n 幀才碰到，幀優勢就多 n。"}],"topicLabel":"規則與算例"},{"page":22,"title":"規則：先恢復的一方，看對方還剩多少","demo":3,"kind":"ladder","rows":[["雙方都還不能動？","是","還沒定案，下一幀再看","否"],["攻擊方先能動？","是","＋防守方剩下的硬直幀數","否"]],"last":"防守方先能動：－攻擊方剩下的動畫幀數；同時恢復：0","discussion":{"question":"X→X→X 全被防住。第二段被擋住時，為什麼還不顯示這次攻防的幀優勢？要等到什麼時候才顯示？","answer":"第二段被擋住時，你還在出招，CPU 還在防禦硬直，雙方都沒恢復，所以先不定案。到第 65 幀你先恢復，CPU 還剩 3 幀硬直，才顯示 ＋3。","table":{"columns":["時間點","你","CPU","定案"],"rows":[["第 25 幀\n第二段被擋住","還在出招","防禦硬直中","還不能"],["第 42 幀\n第三段被擋住","還在出招","硬直重算\n到第 68 幀","還不能"],["第 65 幀\n你收招完","可以行動","還剩 3 幀硬直","顯示 ＋3"]]
