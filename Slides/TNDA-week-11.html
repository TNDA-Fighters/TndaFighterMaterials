u003ccode>AFightingPlayerCharacter::Attack()\u003c/code> 取樣方向後呼叫 \u003ccode>SubmitCommand()\u003c/code>；玩家版確認有 Controller，再交給 \u003ccode>FightingCharacter.cpp\u003c/code> 的 \u003ccode>AFightingCharacter::SubmitCommand()\u003c/code>。CPU 出招也走同一個入口。\u003c/li>\n\u003cli>\u003cstrong>不在出招中：起手。\u003c/strong> \u003ccode>SubmitCommand()\u003c/code> 確認角色在 \u003ccode>Neutral\u003c/code> 或 \u003ccode>Defending\u003c/code> 後，呼叫 \u003ccode>Source/TndaFighter/DataTable/TndaCommandReader.cpp\u003c/code> 的 \u003ccode>UTndaCommandReader::TrySelectCommand()\u003c/code>，它以 \u003ccode>Link＝nullptr\u003c/code> 呼叫 \u003ccode>SelectCommand()\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>起手只留有起手資格的列。\u003c/strong> \u003ccode>SelectCommand()\u003c/code> 走訪已排序的 \u003ccode>Reader-&gt;Commands\u003c/code>，\u003ccode>!Link &amp;&amp; !Candidate.bOpener\u003c/code> 的列直接跳過，再找第一個 \u003ccode>Attack\u003c/code> 相同、方向符合的列。ID 4、5 的 \u003ccode>bOpener\u003c/code> 是 false，所以空檔按 X 選到 ID 1。\u003c/li>\n\u003cli>\u003cstrong>出招中：先看能不能預約。\u003c/strong> 回到 \u003ccode>SubmitCommand()\u003c/code> 的 \u003ccode>IsAttacking()\u003c/code> 分支。\u003ccode>IsCommandPreorderOpen()\u003c/code> 要求目前招式的 \u003ccode>Link\u003c/code> 不是空的、動畫位置在 Preorder～Disable 之間；接著呼叫 \u003ccode>TrySelectLinkedCommand()\u003c/code>，把目前招式的 \u003ccode>CurrentAttack.Link\u003c/code> 傳進 \u003ccode>SelectCommand()\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>接招只留 Link 列出的 ID。\u003c/strong> 這次 \u003ccode>SelectCommand()\u003c/code> 先用 \u003ccode>Link-&gt;Contains(Candidate.Id)\u003c/code> 排除集合外的列，不再看 \u003ccode>bOpener\u003c/code>。選到的列和目前招式同一份 Montage 時，\u003ccode>SubmitCommand()\u003c/code> 回傳拒絕。\u003c/li>\n\u003cli>\u003cstrong>到 Enable 才真的接出。\u003c/strong> 通過的輸入存進 \u003ccode>CommandBuffer\u003c/code>，有效 0.5 秒；動畫到 \u003ccode>Enable\u003c/code> 時 \u003ccode>ConsumeCommandBuffer()\u003c/code> 再選一次並呼叫 \u003ccode>StartAttack()\u003c/code> 交接新招。\u003c/li>\n\u003c/ol>\u003cfigure class=\"flow-diagram\">\u003csvg style=\"width:1113px;max-width:100%;ma dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">交接下一段\u003c/text>\u003ctext x=\"652\" y=\"819\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">StartAttack()\u003c/text>\u003cline x1=\"372\" y1=\"856\" x2=\"931\" y2=\"856\" class=\"messageLine0\" data-et=\"message\" data-id=\"i10\" data-from=\"C\" data-to=\"M\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w11-3-diagram-1-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003c/svg>\u003c/figure>\u003cp>這張圖只回答「同一個按鍵為什麼選到不同 ID」。\u003cstrong>兩條路最後都進 \u003ccode>SelectCommand()\u003c/code>，差別只在有沒有傳入 Link。\u003c/strong>\u003c/p>\u003ch3 id=\"w11-3-5\">追蹤路徑二｜幀優勢在什麼時候、用哪兩個數字定案？\u003c/h3>\u003cp>\u003cstrong>X 被防住的 ＋3 是誰算出來的？\u003c/strong> 命中時先記下這次攻防，之後每一幀檢查誰先恢復，先恢復的一方一出現就用對方剩下的時間定案。\u003c/p>\u003col>\n\u003cli>\u003cstrong>命中時記下這次攻防。\u003c/strong> \u003ccode>FightingCharacter.cpp\u003c/code> 的 \u003ccode>TryApplyHit()\u003c/code> 確認合法命中、問完防禦意圖後，呼叫 \u003ccode>RecordExchangeHit(Target, bDefenseHit)\u003c/code>：把受擊方記成 \u003ccode>ExchangeDefender\u003c/code>，記下是不是被防，也順便依受擊方當下的攻擊階段算出破招、截擊或確反。\u003c/li>\n\u003cli>\u003cstrong>每一幀命中結算後檢查。\u003c/strong> \u003ccode>HandleWorldPostActorTick()\u003c/code> 在命中、硬直與收招都套用後，對雙方各呼叫一次 \u003ccode>UpdateFrameAdvantage()\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>雙方都還沒恢復就不定案。\u003c/strong> \u003ccode>UpdateFrameAdvantage()\u003c/code> 把雙方是否可行動、攻擊方剩下的動畫時間（\u003ccode>GetAttackRemainingSeconds()\u003c/code>）與防守方剩下的硬直（\u003ccode>GetStunRemainingSeconds()\u003c/code>）交給 \u003ccode>ResolveFrameAdvantage()\u003c/code>。兩人都不能動時回傳 false，連段打到一半就停在這裡。\u003c/li>\n\u003cli>\u003cstrong>先恢復的一方決定正負號。\u003c/strong> 攻擊方先恢復時，數字是防守方剩下的硬直，換成設計幀後是正數；防守方先恢復時，數字是攻擊方剩下的動畫時間，取負號。以 X 被防為例：第 30 幀攻擊方恢復，CPU 的 \u003ccode>Blockstun\u003c/code> 還剩 3 幀，結果是 ＋3。\u003c/li>\n\u003cli>\u003cstrong>雙方各存一份，寫進 Log。\u003c/strong> 攻擊方存 \u003ccode>Frames\u003c/code>、防守方存 \u003ccode>-Frames\u003c/code>，Frame Bar 右側讀的就是 1P 那一份；Log 寫一行 \u003ccode>FrameAdvantage: ... attacker_frames=+3 ...\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>Frame Bar 另外記格子。\u003c/strong> \u003ccode>FightingPlayerCharacter.cpp\u003c/code> 在每一幀 World Tick 結束時（\u003ccode>HandleWorldTickEndForFrameBar()\u003c/code> → \u003ccode>SampleFrameBar()\u003c/code>）把雙方的狀態交給 \u003ccode>FightingFrameBar.cpp\u003c/code> 的 \u003ccode>FFightingFrameBarRecorder::Sample()\u003c/code>，一格一個設計幀；雙方都恢復後停止記錄，結果保留到下一次攻防。\u003c/li>\n\u003c/ol>\u003cfigure class=\"flow-diagram\">\u003csvg style=\"width:920.5px;max-width:100%;margin-inline:auto\" id=\"w11-3-diagram-2\" width=\"920.5\" xmlns=\"http://www.w3.org/2000/svg\" height=\"716\" viewBox=\"-50 -10 920.5 746\" role=\"graphics-document document\" aria-roledescription=\"sequence\">\u003cg>\u003crect x=\"670.5\" y=\"618\" fill=\"#eaeaea\" stroke=\"#666\" width=\"150\" height=\"77\" name=\"L\" rx=\"6\" ry=\"6\" class=\"actor actor-bottom\" data-look=\"neo\" filter=\"url(#w11-3-diagram-2-drop-shadow)\">\u003c/rect>\u003ctext x=\"745.5\" y=\"656.5\" dominant-baseline=\"central\" alignment-baseline=\"central\" class=\"actor actor-box\" style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: &quot;Microsoft JhengHei&quot;;\">\u003ctspan x=\"745.5\" dy=\"0\">Log 與 Frame Bar\u003c/tspan>\u003c/text>\u003c/g>\u003cg>\u003crect x=\"470.5\" y=\"618\" fill=\"#eaeaea\" stroke=\"#666\" width=\"150\" height=\"77\" name=\"D\" rx=\"6\" ry=\"6\" class=\"actor actor-bottom\" data-look=\"neo\" filter=\"url(#w11-3-diagram-2-drop-shadow)\">\u003c/rect>\u003ctext x=\"545.5\" y=\"656.5\" dominant-baseline=\"central\" alignment-baseline=\"central\" class=\"actor actor-box\" style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: &quot;Microsoft JhengHei&quot;;\">\u003ctspan x=\"545.5\" dy=\"0\">防守方\u003c/tspan>\u003c/text>\u003c/g>\u003cg>\u003crect x=\"264\" y=\"618\" fi 03cp>三項示範都依「設計需求 → 程式碼增刪異動處 → 程式流程圖 → 想一想 → 把需求交給 AI 實作」講解；最後一段分成「設計提需求」與「工程給提示詞」兩段。程式碼節錄取自 \u003ccode>Projects/TndaFighter-worktrees/dev-week-11\u003c/code>，比較 \u003ccode>week-10\u003c/code>（\u003ccode>58159624\u003c/code>）到 \u003ccode>week-11\u003c/code>（\u003ccode>61e68432\u003c/code>）。\u003cstrong>\u003ccode>-\u003c/code> 開頭是前一週刪除的行，\u003ccode>+\u003c/code> 開頭是本週新增的行，沒有符號的是本週保留下來的行\u003c/strong>；符號依 \u003ccode>git diff\u003c/code> 判定，數字是該版本檔案的真實行號。\u003cstrong>程式碼上方的 \u003ccode>//\u003c/code> 註解都是原始碼註解\u003c/strong>，與程式一起節錄。每個區塊只節錄一個檔案，行號跳號表示省略，縮排已去掉共同的前導空白。\u003c/p>\u003ch3 id=\"w11-3-7\">課堂示範 1｜以 Command ID 表達三段連段\u003c/h3>\u003ch4 id=\"reading-70e65ecf\">設計需求\u003c/h4>\u003cul>\n\u003cli>\u003cstrong>連按 X 打出三段\u003c/strong>：空檔按 X 是第一段 ID 1，第一段出招中再按 X 是第二段 ID 4，第二段出招中再按 X 是第三段 ID 5。第三段之後再按 X 不會接第四段，要等收招後重新起手。\u003c/li>\n\u003cli>\u003cstrong>起手資格寫在資料\u003c/strong>：\u003ccode>CommandTable\u003c/code> 新增 \u003ccode>Opener\u003c/code> 欄。空白或 \u003ccode>TRUE\u003c/code> 可以在空檔起手，\u003ccode>FALSE\u003c/code> 只能經由其他招式的 Link 進入；其他文字讓整張表驗證失敗。ID 4、5 的 Keys 也是 X，靠 \u003ccode>FALSE\u003c/code> 才不會在空檔被選到。\u003c/li>\n\u003cli>\u003cstrong>步驟以 ID 區分\u003c/strong>：ID 1 與 ID 5 都播 \u003ccode>AM_Attack_01\u003c/code>。連段步驟看的是 ID，不是 Montage，所以重用同一份動畫也不會繞回第一段；Link 指向自己、指向同一份 Montage，或繞成一圈，匯入時都會擋下。\u003c/li>\n\u003cli>\u003cstrong>既有分支保留\u003c/strong>：ID 1 的 Link 是 \u003ccode>4,3\u003c/code>，第一段出招中按 Y 仍接第二攻擊。\u003c/li>\n\u003cli>\u003cstrong>打中時是真連段\u003c/strong>：第一段打中後，第二、三段都在 CPU 還在 \u003ccode>Hitstun\u003c/code> 時打到，CPU 從第一擊到第三擊結束都不能防禦或出招。\u003c/li>\n\u003cli>\u003cstrong>UE 提供與遊戲自訂的分界\u003c/strong>：UE 提供 DataTable 的 CSV 匯入與 Reimport；起手資格、Link 候選、排序與循環檢查都是教材專案自己定義的規則。\u003c/li>\n\u003c/ul>\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>本週資產值（本次 Editor 回讀）\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>DT_Command\u003c/code> ID 1／4／5\u003c/td>\n\u003ctd>Montage \u003ccode>AM_Attack_01\u003c/code>／\u003ccode>AM_Attack_02\u003c/code>／\u003ccode>AM_Attack_01\u003c/code>，Link \u003ccode>4,3\u003c/code>／\u003ccode>5\u003c/code>／空白，Opener 空白／\u003ccode>FALSE\u003c/code>／\u003ccode>FALSE\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AM_Attack_01\u003c/code>、\u003ccode>AM_Attack_02\u003c/code>\u003c/td>\n\u003ctd>長 0.5／0.667 秒（30／40 設計幀），Enable 在第 15／20 幀\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DT_Damage\u003c/code> 輕擊、第二攻擊\u003c/td>\n\u003ctd>Hitstun 29／32，Blockstun 26／28\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003ch4 id=\"reading-7cf66e4f\">程式碼增刪異動處\u003c/h4>\u003cp>\u003cstrong>異動歷程\u003c/strong>：\u003ccode>db41bd4a\u003c/code> 新增 Week 11 兩份規格與工單 → \u003ccode>585c99a9\u003c/code> Opener 起手資格與 X 三段連段資料 → \u003ccode>a8fcfa08\u003c/code>、\u003ccode>23b5f09a\u003c/code> 重調招式幀數與硬直。\u003c/p>\u003cp>\u003cstrong>本段要看懂的改動\u003c/strong>：① 資料表多一欄 \u003ccode>Opener\u003c/code>，整理成 \u003ccode>bOpener\u003c/code> → ② 空檔選招跳過沒有起手資格的列 → ③ 匯入時警告永遠用不到的列，資料改成三段。\u003c/p>\u003cp>例：1P 在空檔連按三次 \u003ccode>U\u003c/code>。第一次 \u003ccode>SelectCommand()\u003c/code> 沒有 Link，ID 4、5 被跳過，選到 ID 1；第二次帶著 ID 1 的 Link \u003ccode>4,3\u003c/code>，選到 ID 4；第三次帶著 ID 4 的 Link \u003ccode>5\u003c/code>，選到 ID 5。\u003c/p>\u003cp id=\"reading-3d97344\">\u003cstrong>① 資料表多一欄 Opener\u003c/strong>\u003c/p>\u003cp>\u003ccode>TndaCommandData.h｜FTndaCommandRow::Opener／FTndaCommand::bOpener｜week-11\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">   \u003cspan class=\"syn-number\">54\u003c/span>  \u003cspan class=\"syn-comment\">/** 合法後續招式 ID 的逗號清單；空白表示不能接招，Reader 拒絕空 token、重複及非法連接。 */\u003c/span>\n   \u003cspan class=\"syn-number\">55\u003c/span>  \u003cspan class=\"syn-macro\">UPROPERTY\u003c/span>(EditAnywhere, BlueprintReadOnly, Category=\u003cspan class=\"syn-string\">\"Command\"\u003c/span>)\n   \u003cspan class=\"syn-number\">56\u003c/span>  \u003cspan class=\"syn-type\">FString\u003c/span> \u003cspan class=\"syn-declaration\">Link\u003c/span>;\n+  \u003cspan class=\"syn-number\">57\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  58  \u003c/span>\u003cspan class=\"syn-comment\">/** 起手資格：空白或 TRUE 可從待機／防禦直接起手，FALSE 只能經其他招式的 Link 進入；其他文字整表拒絕。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  59  \u003c/span>\u003cspan class=\"syn-comment\"> * 以字串保存原文而非 bool，因原生匯入會把空白或非法文字靜默轉成預設值，無法區分「未填」與「填錯」。 */\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  60  \u003c/span>\u003cspan class=\"syn-macro\">UPROPERTY\u003c/span>(EditAnywhere, BlueprintReadOnly, Category=\u003cspan class=\"syn-string\">\"Command\"\u003c/span>)\n\u003cspan class=\"syn-prefix syn-added\">+  61  \u003c/span>\u003cspan class=\"syn-type\">FString\u003c/span> \u003cspan class=\"syn-declaration\">Opener\u003c/span>;\n  \u003cspan class=\"syn-number\">111\u003c/span>  \u003cspan class=\"syn-macro\">UPROPERTY\u003c/span>(VisibleAnywhere, BlueprintReadOnly, Category=\u003cspan class=\"syn-string\">\"Command\"\u003c/span>)\n  \u003cspan class=\"syn-number\">112\u003c/span>  \u003cspan class=\"syn-type\">TArray\u003c/span>&lt;\u003cspan class=\"syn-type\">int32\u003c/span>&gt; \u003cspan class=\"syn-declaration\">Link\u003c/span>;\n  \u003cspan class=\"syn-number\">113\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 114  \u003c/span>\u003cspan class=\"syn-comment\">/** 是否可從待機／防禦直接起手；false 的招式只是連段步驟，只在前一招的 Link 候選中出現。 */\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 115  \u003c/span>\u003cspan class=\"syn-macro\">UPROPERTY\u003c/span>(VisibleAnywhere, BlueprintReadOnly, Category=\u003cspan class=\"syn-string\">\"Command\"\u003c/span>)\n\u003cspan class=\"syn-prefix syn-added\">+ 116  \u003c/span>\u003cspan class=\"syn-type\">bool\u003c/span> \u003cspan class=\"syn-declaration\">bOpener\u003c/span> = \u003cspan class=\"syn-keyword\">true\u003c/span>;\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>TndaCommandData.cpp｜ParseOpener()｜week-11\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language- d)\" style=\"stroke-dasharray: 3, 3; fill: none;\">\u003c/line>\u003c/svg>\u003c/figure>\u003cp>\u003cstrong>對照重點\u003c/strong>：圖 1 回答「起手與接招各看哪個欄位」，圖 2 回答「三段連段在資料上怎麼接」，圖 3 回答「為什麼打中時是真連段」，圖 4 回答「改表後下一次出招為什麼就用新資料」。\u003c/p>\u003ch4 id=\"reading-49e563b\">想一想\u003c/h4>\u003cp>\u003cstrong>問題\u003c/strong>：設計師想新增一招「後退踢」：Keys 填 \u003ccode>4,X\u003c/code>，播 \u003ccode>AM_Attack_03\u003c/code>，只能在第一段之後使出。他把 ID 1 的 Link 改成 \u003ccode>4,3,6\u003c/code>，新增 ID 6，但忘了填 Opener。空檔按住後退再按 \u003ccode>U\u003c/code> 會出哪一招？補上 \u003ccode>FALSE\u003c/code> 之後呢？\u003c/p>\u003cul>\n\u003cli>\u003cstrong>參考答案\u003c/strong>：沒填 Opener 時，空檔按 4X 會\u003cstrong>直接出 ID 6\u003c/strong>。空白等於可起手，候選有 ID 1（X，沒寫方向）和 ID 6（4,X），排序規則讓有方向的 ID 6 排在前面。補上 \u003ccode>FALSE\u003c/code> 後，空檔按 4X 會\u003cstrong>出 ID 1\u003c/strong>：ID 6 被跳過，ID 1 沒寫方向，按任何方向都算符合。第一段出招中按 4X 兩種情況都接出 ID 6。以上兩種情況本次 PIE 實測都成立。\u003c/li>\n\u003cli>\u003cstrong>判讀重點\u003c/strong>：學生能說出空檔只看 Opener、連段只看 Link，並用排序規則解釋「有方向的列先被選到」。\u003c/li>\n\u003cli>\u003cstrong>可以追問\u003c/strong>：「如果後退踢的 Keys 改成 \u003ccode>Y\u003c/code>，忘了填 Opener 會怎樣？」答：空檔按 Y 仍是 ID 3。兩列都沒寫方向，ID 小的 ID 3 排在前面；本次實測 Opener 空白與 \u003ccode>FALSE\u003c/code> 結果相同，看不出差別。\u003c/li>\n\u003c/ul>\u003ch4 id=\"reading-487883a3\">把需求交給 AI 實作\u003c/h4>\u003cp>提示詞分兩段：\u003cstrong>設計先講玩家看到什麼，工程再把它轉成系統規格\u003c/strong>。工程提示詞沿用 week-08 實作題的方法：\u003cstrong>先定義資料與介面，再規劃 Init → Tick → End，最後接入遊戲流程\u003c/strong>，並要求 AI 先回覆規格、經確認後才改程式。\u003c/p>\u003ch5 id=\"reading-e0fd618d\">設計提需求\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># 三段連段\n## 玩家體驗\n連按同一顆攻擊鍵三下，打出三段不同的動作；打中時對手整套都動不了。\n\n## 規則\n- 空檔按攻擊只會出第一段；第二、三段只能接在前一段後面。\n- 第三段之後再按，不會接第四段，要等收招後重新起手。\n- 第一段之後按另一顆攻擊鍵，仍接原本的第二攻擊。\n- 第一段和第三段可以用同一個動作，但不能因此繞回第二段。\n- 哪一招能起手、能接哪一招，都寫在招式表裡。\n\n## 驗收畫面\n連按三下看到三段依序出現；空檔只按一下只出第一段；打中時對手在三段之間沒有恢復。\n\u003c/code>\u003c/pre>\u003ch5 id=\"reading-ea7a084d\">工程給提示詞\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># 目標\n依附上的「三段連段」設計需求，讓招式表能表達「只能接在連段中的招式」，玩家與 CPU 共用同一套選招規則。\n\n## 請依以下順序提出規格\n1. 定義資料與介面：招式表要新增哪個欄位、允許哪些值、空白怎麼解讀；整理後的招式資料多存什麼；起手與接招的選招介面差在哪裡。\n2. Init：資料表匯入或 Reimport 時要做哪些檢查；哪些錯誤讓整表失敗，哪些只警告。\n3. Tick：空檔按鍵與出招中按鍵各從哪些招式中選；多個候選時依什麼順序決定。\n4. End：連段正常收招、被打斷或預約過期時，連段步驟與預約怎麼清除。\n5. 接入與測試：CPU 起手與後續選招要接到哪裡；列出對應設計驗收的測試案例。\n\n## 回覆方式\n先閱讀專案中相關的既有程式與資產，再回覆以上五項規格與要修改的檔案。完成後回報每個驗收案例的 PIE 結果，未實測的標明未驗證。\n\n## 施工方式\n開工前先跟我確認規格。之後依規格順序一次做一項，每完成一項，經我確認無誤後 commit，再做下一項。\n\u003c/code>\u003c/pre>\u003ch3 id=\"w11-3-8\">課堂示範 2｜CPU 每一招各有一次後續機會\u003c/h3>\u003ch4 id=\"reading-c810fa7d\">設計需求\u003c/h4>\u003cul>\n\u003cli>\u003cstrong>CPU 也能打完三段\u003c/strong>：CPU 攻擊組沿著 Link 一路接到沒有後續為止。起手 ID 1 後，從 Link \u003ccode>4,3\u003c/code> 隨機選一個；選到 ID 4 就再從 Link \u003ccode>5\u003c/code> 選，選到 ID 3 就停在第二段。\u003c/li>\n\u003cli>\u003cstrong>每一招只決策一次\u003c/strong>：每一招在第一次看到 Preorder 開窗的那一幀做一次決定。沒有候選、提交被拒絕或預約過期，同一招都不重試；接上的下一招 ID 不同，自然有自己的一次機會。\u003c/li>\n\u003cli>\u003cstrong>起手也遵守 Opener\u003c/strong>：CPU 起手時從可起手的招式中等機率選一招，不會選到 ID 4、5。\u003c/li>\n\u003cli>\u003cstrong>節奏不變\u003c/strong>：整組打完、最後一招完整收招後，CPU 才進入 0.8 秒的等待，再重新決策。\u003c/li>\n\u003cli>\u003cstrong>本週取代的舊規則\u003c/strong>：week-09 規格的「每組最多起手加一次後續」由這條規則取代；\u003ccode>week-09-cpu-ai/spec.md\u003c/code> 的 Week 11 更新段落是本週的依據。\u003c/li>\n\u003cli>\u003cstrong>UE 提供與遊戲自訂的分界\u003c/strong>：UE 提供 StateTree 的 Task 每幀 Tick；「每一招一次機會」與「從 Link 選候選」是教材專案自己的規則，出招仍交給玩家與 CPU 共用的 \u003ccode>SubmitCommand()\u003c/code>。\u003c/li>\n\u003c/ul>\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>本週資產值（本次 Editor 回讀）\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>DT_Command\u003c/code> 可起手的列\u003c/td>\n\u003ctd>ID 1、2、3（Opener 空白）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CPU 可走的連段\u003c/td>\n\u003ctd>1→4→5、1→3；ID 2、3 單發\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003ch4 id=\"reading-e21f994d\">程式碼增刪異動處\u003c/h4>\u003cp>\u003cstrong>異動歷程\u003c/strong>：\u003ccode>7c2ae06d\u003c/code> CPU 攻擊組沿 Link 一路接到底。\u003c/p>\u003cp>\u003cstrong>本段要看懂的改動\u003c/strong>：① 起手時清掉「已決策」紀錄 → ② 每幀檢查「這一招決策過沒有」，改用招式 ID 判斷 → ③ 紀錄從 bool 換成招式 ID。\u003c/p>\u003cp>例：CPU 起手 ID 1，以 ID 1 開始播放的那一幀為第 0 幀。第 2 幀 ID 1 的 Preorder 開窗，CPU 記下「ID 1 已決策」，從 Link \u003ccode>4,3\u003c/code> 抽到 ID 4 並提交；第 15 幀接出 ID 4。ID 4 的 Preorder 開窗時，紀錄是 ID 1，不等於目前的 4，所以再決策一次，接出 ID 5。ID 5 的 Link 是空白，\u003ccode>IsCommandPreorderOpen()\u003c/code> 不開窗，整組在這裡結束。\u003c/p>\u003cp id=\"reading-86ba0a51\">\u003cstrong>① 起手時清掉紀錄\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCpuCharacter.cpp｜TryStartAIAttack()｜week-11\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">  \u003cspan class=\"syn-number\">300\u003c/span>  \u003cspan class=\"syn-type\">EFightingCommandResult\u003c/span> \u003cspan class=\"syn-type\">AFightingCpuCharacter\u003c/span>::\u003cspan class=\"syn-function\">TryStartAIAttack\u003c/span>()\n  \u003cspan class=\"syn-number\">301\u003c/span>  {\n\u003cspan class=\"syn-prefix syn-removed\">- 302  \u003c/span>    \u003cspan class=\"syn-comment\">// 1. Task 重選只接回尚未結束的同一組；不得重送起手，也不得重設該組的一次後續機會。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 302  \u003c/span>    \u003cspan class=\"syn-comment\">// 1. Task 重選只接回尚未結束的同一組；不得重送起手，也不得重設該組已用過的後續機會。\u003c/span>\n  \u003cspan class=\"syn-number\">303\u003c/span>      \u003cspan class=\"syn-keyword\">if\u003c/span> (\u003cspan class=\"syn-function\">IsAIAttackGroupActive\u003c/span>()) { \u003cspan class=\"syn-keyword\">return\u003c/span> \u003cspan class=\"syn-type\">EFightingCommandResult\u003c/span>::Started; }\n  \u003cspan class=\"syn-number\">324\u003c/span>      \u003cspan class=\"syn-comment\">// 5. 成功播放才認領共同攻擊序列；後續交接與最後淡出沿用此身分，不拿招式 ID 當播放身分。\u003c/span>\n  \u003cspan class=\"syn-number\">325\u003c/span>      \u003cspan class=\"syn-keyword\">if\u003c/span> (Result == \u003cspan class=\"syn-type\">EFightingCommandResult\u003c/span>::Started)\n  \u003cspan class=\"syn-number\">326\u003c/span>      {\n  \u003cspan class=\"syn-number\">327\u003c/span>          AIAttackSequence = \u003cspan class=\"syn-function\">GetAttackSequenceSerial\u003c/span>();\n\u003cspan class=\"syn-prefix syn-removed\">- 328  \u003c/span>        bAIFollowupAttempted = \u003cspan class=\"syn-keyword\">false\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 328  \u003c/span>        AIFollowupAttemptedCommandId.\u003cspan class=\"syn-function\">Reset\u003c/span>();\n  \u003cspan class=\"syn-number\">329\u003c/span>      }\n  \u003cspan class=\"syn-number\">330\u003c/span>      \u003cspan class=\"syn-keyword\">return\u003c/span> Result;\n  \u003cspan class=\"syn-number\">331\u003c/span>  }\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：起手成功才認領攻擊組，同時把「已決策的招式 ID」清空。week-10 用 \u003ccode>bAIFollowupAttempted = false\u003c/code>，一整組只有一次機會。\u003c/p>\u003cblockquote>\n\u003cp>資料：\u003ccode>SubmitCommand()\u003c/code> 回傳 \u003ccode>Started\u003c/code> → \u003ccode>AIAttackSequence\u003c/code> 記下序列 → \u003ccode>AIFollowupAttemptedCommandId.Reset()\u003c/code>。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-b19058a5\">\u003cstrong>② 每一招一次機會\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCpuCharacter.cpp｜TrySubmitAIFollowup()｜week-11\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">  \u003cspan class=\"syn-number\">333\u003c/span>  \u003cspan class=\"syn-type\">void\u003c/span> \u003cspan class=\"syn-type\">AFightingCpuCharacter\u003c/span>::\u003cspan class=\"syn-function\">TrySubmitAIFollowup\u003c/span>()\n  \u003cspan class=\"syn-number\">334\u003c/span>  {\n\u003cspan class=\"syn-prefix syn-removed\">- 335  \u003c/span>    \u003cspan class=\"syn-comment\">// 1. 每幀只觀察共同 Notify 公開的窗口；尚未開啟、已跨過整窗或已放棄本組時都不補送。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 335  \u003c/span>    \u003cspan class=\"syn-comment\">// 1. 每幀只觀察共同 Notify 公開的窗口；尚未開啟、已跨過整窗、本招已決策過或已放棄本組時都不補送。\u003c/span>\n  \u003cspan class=\"syn-number\">336\u003c/span>      \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">AFightingCpuController\u003c/span>* \u003cspan class=\"syn-declaration\">CpuController\u003c/span> = Cast&lt;\u003cspan class=\"syn-type\">AFightingCpuController\u003c/span>&gt;(\u003cspan class=\"syn-function\">GetController\u003c/span>());\n  \u003cspan class=\"syn-number\">337\u003c/span>      \u003cspan class=\"syn-keyword\">if\u003c/span> (!CpuController || !CpuController-&gt;\u003cspan class=\"syn-function\">IsAIEnabled\u003c/span>() || \u003cspan class=\"syn-function\">IsTestMovementEnabled\u003c/span>()\n\u003cspan class=\"syn-prefix syn-removed\">- 338  \u003c/span>        || !\u003cspan class=\"syn-function\">IsAIAttackGroupActive\u003c/span>() || bAIFollowupAttempted || !\u003cspan class=\"syn-function\">IsCommandPreorderOpen\u003c/span>())\n\u003cspan class=\"syn-prefix syn-added\">+ 338  \u003c/span>        || !\u003cspan class=\"syn-function\">IsAIAttackGroupActive\u003c/span>() || AIFollowupAttemptedCommandId == CurrentAttack.Id || !\u003cspan class=\"syn-function\">IsCommandPreorderOpen\u003c/span>())\n  \u003cspan class=\"syn-number\">339\u003c/span>      {\n  \u003cspan class=\"syn-number\">340\u003c/span>          \u003cspan class=\"syn-keyword\">return\u003c/span>;\n  \u003cspan class=\"syn-number\">341\u003c/span>      }\n\u003cspan class=\"syn-prefix syn-removed\">- 342  \u003c/span>    \u003cspan class=\"syn-comment\">// 2. 決策前先消耗唯一機會；沒有候選或提交 Rejected 也不重試。\u003c/span>\n\u003cspan class=\"syn-prefix syn-removed\">- 343  \u003c/span>    \u003cspan class=\"syn-comment\">// SubmitCommand 可能當下 Started，或稍後消耗預約，兩者都不能重設它。\u003c/span>\n\u003cspan class=\"syn-prefix syn-removed\">- 344  \u003c/span>    bAIFollowupAttempted = \u003cspan class=\"syn-keyword\">true\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 342  \u003c/span>    \u003cspan class=\"syn-comment\">// 2. 決策前先消耗本招的機會；沒有候選或提交 Rejected 也不重試。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 343  \u003c/span>    \u003cspan class=\"syn-comment\">// SubmitCommand 可能當下 Started，或稍後消耗預約；接上的下一招 ID 不同，自然得到下一次機會。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 344  \u003c/span>    AIFollowupAttemptedCommandId = CurrentAttack.Id;\n  \u003cspan class=\"syn-number\">345\u003c/span>      \u003cspan class=\"syn-comment\">// 3. 合法 ID 取自本招 Link 快照，候選內容則即時查最新表；集合外招式不能攔截選擇。\u003c/span>\n  \u003cspan class=\"syn-number\">346\u003c/span>      \u003cspan class=\"syn-type\">TArray\u003c/span>&lt;\u003cspan class=\"syn-type\">FTndaCommand\u003c/span>&gt; \u003cspan class=\"syn-declaration\">Candidates\u003c/span>;\n  \u003cspan class=\"syn-number\">347\u003c/span>      \u003cspan class=\"syn-keyword\">if\u003c/span> (!\u003cspan class=\"syn-type\">UTndaCommandReader\u003c/span>::\u003cspan class=\"syn-function\">GetCommandCandidates\u003c/span>(\u003cspan class=\"syn-function\">GetGameInstance\u003c/span>(), Candidates, &amp;CurrentAttack.Link) || Candidates.\u003cspan class=\"syn-function\">IsEmpty\u003c/span>()) { \u003cspan class=\"syn-keyword\">return\u003c/span>; }\n  \u003cspan class=\"syn-number\">348\u003c/span>      \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">FTndaCommand\u003c/span>&amp; \u003cspan class=\"syn-declaration\">Selected\u003c/span> = Candidates[AIRandom.\u003cspan class=\"syn-function\">RandRange\u003c/span>(\u003cspan class=\"syn-number\">0\u003c/span>, Candidates.\u003cspan class=\"syn-function\">Num\u003c/span>() - \u003cspan class=\"syn-number\">1\u003c/span>)];\n  \u003cspan class=\"syn-number\">349\u003c/span>      AISelectedCommandId = \u003cspan class=\"syn-type\">FName\u003c/span>(*\u003cspan class=\"syn-type\">FString\u003c/span>::\u003cspan class=\"syn-function\">FromInt\u003c/span>(Selected.Id));\n  \u003cspan class=\"syn-number\">350\u003c/span>      \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">TArray\u003c/span>&lt;\u003cspan class=\"syn-type\">int32\u003c/span>&gt; \u003cspan class=\"syn-declaration\">Directions\u003c/span> = Selected.Direction == \u003cspan class=\"syn-number\">0\u003c/span> ? \u003cspan class=\"syn-type\">TArray\u003c/span>&lt;\u003cspan class=\"syn-type\">int32\u003c/span>&gt;{} : \u003cspan class=\"syn-type\">TArray\u003c/span>&lt;\u003cspan class=\"syn-type\">int32\u003c/span>&gt;{Selected.Direction};\n  \u003cspan class=\"syn-number\">351\u003c/span>      \u003cspan class=\"syn-comment\">// 4. 預約、即時交接、拒絕與後續過期都交給共同戰鬥流程；CPU 只記錄結果，不自行推進 Montage。\u003c/span>\n  \u003cspan class=\"syn-number\">352\u003c/span>      \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">EFightingCommandResult\u003c/span> \u003cspan class=\"syn-declaration\">Result\u003c/span> = \u003cspan class=\"syn-function\">SubmitCommand\u003c/span>(Selected.Attack, Directions);\n  \u003cspan class=\"syn-number\">353\u003c/span>      \u003cspan class=\"syn-macro\">UE_LOG\u003c/span>(LogTndaFighter, Verbose, \u003cspan class=\"syn-macro\">TEXT\u003c/span>(\u003cspan class=\"syn-string\">\"CPU followup: actor=%s sequence=%llu selected=%s result=%d time=%.6f\"\u003c/span>),\n  \u003cspan class=\"syn-number\">354\u003c/span>          *\u003cspan class=\"syn-function\">GetName\u003c/span>(), AIAttackSequence, *AISelectedCommandId.\u003cspan class=\"syn-function\">ToString\u003c/span>(), static_cast&lt;\u003cspan class=\"syn-type\">int32\u003c/span>&gt;(Result), \u003cspan class=\"syn-function\">GetWorld\u003c/span>()-&gt;\u003cspan class=\"syn-function\">GetTimeSeconds\u003c/span>());\n  \u003cspan class=\"syn-number\">355\u003c/span>  }\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：關鍵在第 338 行。week-10 只要決策過一次就整組不再補送；week-11 比的是「上次決策的 ID 是不是目前這一招」，接上新招後 ID 變了，條件自然解除。候選由 \u003ccode>GetCommandCandidates()\u003c/code> 依目前招式的 Link 列出，再用 \u003ccode>AIRandom\u003c/code> 等機率抽一個，交給共用的 \u003ccode>SubmitCommand()\u003c/code>。\u003c/p>\u003cblockquote>\n\u003cp>資料：\u003ccode>CurrentAttack.Id\u003c/code> → \u003ccode>AIFollowupAttemptedCommandId\u003c/code>；\u003ccode>CurrentAttack.Link\u003c/code> → \u003ccode>GetCommandCandidates()\u003c/code> → \u003ccode>Selected\u003c/code> → \u003ccode>SubmitCommand()\u003c/code>。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-bd15039b\">\u003cstrong>③ 紀錄換成招式 ID\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCpuCharacter.h｜AIFollowupAttemptedCommandId｜week-11\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">  \u003cspan class=\"syn-number\">222\u003c/span>  \u003cspan class=\"syn-comment\">/** 唯一由成功起手建立的共同序列身分；不在 Task instance 保存，避免重選重設。 */\u003c/span>\n  \u003cspan class=\"syn-number\">223\u003c/span>  \u003cspan class=\"syn-type\">uint64\u003c/span> \u003cspan class=\"syn-declaration\">AIAttackSequence\u003c/span> = \u003cspan class=\"syn-number\">0\u003c/span>;\n\u003cspan class=\"syn-prefix syn-removed\">- 223  \u003c/span>\u003cspan class=\"syn-comment\">/** 本組曾觀察合法 Preorder 並做過決策；即使沒有候選或提交失敗也不重試。 */\u003c/span>\n\u003cspan class=\"syn-prefix syn-removed\">- 224  \u003c/span>\u003cspan class=\"syn-type\">bool\u003c/span> \u003cspan class=\"syn-declaration\">bAIFollowupAttempted\u003c/span> = \u003cspan class=\"syn-keyword\">false\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 224  \u003c/span>\u003cspan class=\"syn-comment\">/** 已做過後續決策的招式 ID；即使沒有候選或提交失敗，同一招也不重試。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 225  \u003c/span>\u003cspan class=\"syn-comment\"> * 以招式 ID 而非 Montage 區分步驟：Link 驗證禁止循環，同一攻擊組內 ID 不會重複出現，第三段重用第一段 Montage 仍有自己的機會。 */\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 226  \u003c/span>\u003cspan class=\"syn-type\">TOptional\u003c/span>&lt;\u003cspan class=\"syn-type\">int32\u003c/span>&gt; \u003cspan class=\"syn-declaration\">AIFollowupAttemptedCommandId\u003c/span>;\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：原始碼註解交代了為什麼用 ID 而不用 Montage：第三段 ID 5 和第一段 ID 1 都播 \u003ccode>AM_Attack_01\u003c/code>，用 Montage 會讓第三段被誤認為「決策過了」。Link 驗證禁止循環，同一組裡 ID 不會重複，所以用 ID 區分步驟是安全的。\u003c/p>\u003cblockquote>\n\u003cp>資料：\u003ccode>TOptional&lt;int32&gt;\u003c/code> 起手時清空，每一招決策時寫入目前 ID。\u003c/p>\n\u003c/blockquote>\u003cp>\u003ccode>FightingCpuCharacter.cpp\u003c/code>、\u003ccode>FightingCpuCharacter.h\u003c/code>｜week-10（\u003ccode>58159624\u003c/code>）→ week-11（\u003ccode>61e68432\u003c/code>）｜原始碼節錄；行號跳號表示省略，Tab 已換成四格空白。\u003c/p>\u003ch4 id=\"reading-7743ecd1\">程式流程圖\u003c/h4>\u003cp>\u003cstrong>圖 1｜CPU 一組攻擊從起手到結束怎麼跑？\u003c/strong>（呼叫順序）\u003c/p>\u003cfigure class=\"flow-diagram\">\u003csvg style=\"width:1012px;max-width:100%;margin-inline:auto\" id=\"w11-3-diagram-7\" width=\"1012\" xmlns=\"http://www.w3.org/2000/svg\" height=\"802\" viewBox=\"-50 -10 1012 832\" role=\"graphics-document document\" aria-roledescription=\"sequence\">\u003cg>\u003crect x=\"762\" y=\"704\" fill=\"#eaeaea\" stroke=\"#666\" width=\"150\" height=\"77\" name=\"C\" rx=\"6\" ry=\"6\" class=\"actor actor-bottom\" data-look=\"neo\" filter=\"url(#w11-3-diagram-7-drop-shadow)\">\u003c/rect>\u003ctext x=\"837\" y=\"742.5\" dominant-baseline=\"central\" alignment-baseline=\"central\" class=\"actor actor-box\" style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: &quot;Microsoft JhengHei&quot;;\">\u003ctspan x=\"837\" dy=\"0\">共用出招入口\u003c/tspan>\u003c/text>\u003c/g>\u003cg>\u003crect x=\"562\" y=\"704\" fill=\"#eaeaea\" stroke=\"#666\" width=\"150\" height=\"77\" name=\"R\" rx=\"6\" ry=\"6\" class=\"actor actor-bottom\" data-look=\"neo\" filter=\"url(#w11-3-diagram-7-drop-shadow)\">\u003c/rect>\u003ctext x=\"637\" y=\"742.5\" dominant-baseline=\"central\" alignment-baseline=\"central\" class=\"actor actor-box\" style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: &quot;Microsoft JhengHei&quot;;\">\u003ctspan x=\"637\" dy=\"0\">選招\u003c/tspan>\u003c/text>\u003c/g>\u003cg>\u003crect x=\"247\" y=\"704\" fill=\"#eaeaea\" stroke=\"#666\" width=\"150\" height=\"77\" name=\"A\" rx=\"6\" ry=\"6\" class=\"actor actor-bottom\" data-look=\"neo\" filter=\"url(#w11-3-diagram-7-drop-shadow)\">\u003 chart-b1-2\" data-look=\"neo\" transform=\"translate(112, 136)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\">\u003c/rect>\u003cg class=\"label\" style=\"\" transform=\"translate(-60, -12)\">\u003crect>\u003c/rect>\u003cforeignObject width=\"120\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center; width: 120px;\">\u003cspan class=\"nodeLabel \">\u003cp>ID 1\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default  \" id=\"w11-3-diagram-9-flowchart-b4-3\" data-look=\"neo\" transform=\"translate(324, 185)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\">\u003c/rect>\u003cg class=\"label\" style=\"\" transform=\"translate(-60, -12)\">\u003crect>\u003c/rect>\u003cforeignObject width=\"120\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center; width: 120px;\">\u003cspan class=\"nodeLabel \">\u003cp>ID 4\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default  \" id=\"w11-3-diagram-9-flowchart-b5-4\" data-look=\"neo\" transform=\"translate(500, 185)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\">\u003c/rect>\u003cg class=\"label\" style=\"\" transform=\"translate(-60, -12)\">\u003crect>\u003c/rect>\u003cforeignObject width=\"120\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center; width: 120px;\">\u003cspan class=\"nodeLabel \">\u003cp>ID 5\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default  \" id=\"w11-3-diagram-9-flowchart-b3-6\" data-look=\"neo\" transform=\"translate(324, 87)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\">\u003c/rect>\u003cg class=\"label\" style=\"\" transform=\"translate(-60, -12)\">\u003crect>\u003c/rect>\u003cforeignObject width=\"120\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center; width: 120px;\">\u003cspan class=\"nodeLabel \">\u003cp>ID 3\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003cdefs>\u003cfilter id=\"w11-3-diagram-9-drop-shadow\" height=\"130%\" width=\"130%\">\u003cfeDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\">\u003c/feDropShadow>\u003c/filter>\u003c/defs>\u003cdefs>\u003cfilter id=\"w11-3-diagram-9-drop-shadow-small\" height=\"150%\" width=\"150%\">\u003cfeDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\">\u003c/feDropShadow>\u003c/filter>\u003c/defs>\u003c/svg>\u003c/figure>\u003cp>\u003cstrong>對照重點\u003c/strong>：圖 1 回答「CPU 從起手到收招經過哪些函式」，圖 2 回答「哪一幀會送後續、為什麼不重試」，圖 3 回答「改成每招一次後，CPU 多了哪條路線」。\u003c/p>\u003ch4 id=\"reading-6aefd691\">想一想\u003c/h4>\u003cp>\u003cstrong>問題\u003c/strong>：學生把 ID 5 的 Link 改成 \u003ccode>3\u003c/code>（第三段之後可以接第二攻擊）。開 \u003ccode>tnda.Debug.CPUAI on\u003c/code> 觀察 CPU，它可能打出哪些組合？每一種出現的機率是多少？\u003c/p>\u003cul>\n\u003cli>\u003cstrong>參考答案\u003c/strong>：可能是 1→3、1→4→5→3，以及單發的 ID 2、ID 3。CPU 起手從 ID 1、2、3 等機率抽，ID 1 是 1/3。ID 1 之後從 \u003ccode>4,3\u003c/code> 抽，各 1/2；ID 4 之後只有 5；ID 5 之後只有 3。所以 1→4→5→3 是 1/3 × 1/2＝1/6，1→3 也是 1/6，單發 ID 2、ID 3 各 1/3。這是依原始碼推得的機率，本次沒有實測 CPU 的抽招分布。\u003c/li>\n\u003cli>\u003cstrong>判讀重點\u003c/strong>：學生能說出每一招各有一次決策，候選只看目前這一招的 Link，而且是等機率抽選。\u003c/li>\n\u003cli>\u003cstrong>可以追問\u003c/strong>：「CPU 的第三段被你打中而中斷，它會補送第四段嗎？」答：不會。被打中時攻擊被取消，攻擊組結束；同一招也不重試。\u003c/li>\n\u003c/ul>\u003ch4 id=\"reading-f4718061\">把需求交給 AI 實作\u003c/h4>\u003cp>提示詞分兩段：\u003cstrong>設計先講玩家看到什麼，工程再把它轉成系統規格\u003c/strong>。工程提示詞沿用 week-08 實作題的方法：\u003cstrong>先定義資料與介面，再規劃 Init → Tick → End，最後接入遊戲流程\u003c/strong>，並要求 AI 先回覆規格、經確認後才改程式。\u003c/p>\u003ch5 id=\"reading-e0c6ff0f\">設計提需求\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># CPU 會打連段\n## 玩家體驗\nCPU 有時只打一下，有時會把整套連段打完，讓玩家不能只等第一下。\n\n## 規則\n- CPU 用的招式表和連段規則跟玩家一樣。\n- 每一段打出來後，CPU 決定一次要不要接、接哪一招，從這一招能接的招式中隨機挑。\n- 同一段不重新決定；接不上就算了。\n- 整套打完才停頓，停頓時間跟現在一樣。\n\n## 驗收畫面\n讓 CPU 自己打一段時間，至少看到一次三段連段；也看得到只打兩段或單發的情況。\n\u003c/code>\u003c/pre>\u003ch5 id=\"reading-ad3578df\">工程給提示詞\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># 目標\n依附上的「CPU 會打連段」設計需求，讓 CPU 攻擊組依招式表的連接資料一路接到底。\n\n## 請依以下順序提出規格\n1. 定義資料與介面：CPU 要記住什麼來判斷「這一段決定過了」；候選從哪個介面取得。\n2. Init：CPU 起手成功時要重設哪些紀錄。\n3. Tick：每一幀在什麼條件下替 CPU 決定下一段；沒有候選或被拒絕時怎麼處理。\n4. End：攻擊組被打斷、AI 停用或整套收招時，紀錄怎麼清除。\n5. 接入與測試：決策結果交給哪個共用出招入口；列出對應設計驗收的測試案例。\n\n## 回覆方式\n先閱讀專案中相關的既有程式與資產，再回覆以上五項規格與要修改的檔案。完成後回報每個驗收案例的 PIE 結果，未實測的標明未驗證。\n\n## 施工方式\n開工前先跟我確認規格。之後依規格順序一次做一項，每完成一項，經我確認無誤後 commit，再做下一項。\n\u003c/code>\u003c/pre>\u003ch3 id=\"w11-3-9\">課堂示範 3｜Frame Bar、幀優勢與破招／截擊／確反\u003c/h3>\u003ch4 id=\"reading-ecb043be\">設計需求\u003c/h4>\u003cul>\n\u003cli>\u003cstrong>看得見的時間軸\u003c/strong>：Combat Debug 上方新增 Frame Bar，1P 與 CPU 各一條，每格一個設計幀。綠色是傷害判定前，紅色是判定中，黃色是收招，接招窗口在黃格上緣加白線；深紫是 \u003ccode>Hitstun\u003c/code>，淺紫是 \u003ccode>Blockstun\u003c/code>。結果保留到下一次攻防。規格早期寫在「雙方腳下」，最終實作移到畫面上方置中。\u003c/li>\n\u003cli>\u003cstrong>幀優勢\u003c/strong>：先恢復的一方恢復的那一幀，以對方實際剩下的鎖定時間定案。Frame Bar 右側顯示 1P 視角：藍色 \u003ccode>+N\u003c/code>、紅色 \u003ccode>-N\u003c/code>、白色 \u003ccode>0\u003c/code>。連段打到一半不顯示。\u003c/li>\n\u003cli>\u003cstrong>命中分類\u003c/strong>：受擊方正在出招時被打中才分類。打在對方判定前或判定中是\u003cstrong>破招\u003c/strong>；剛防住或挨完對方攻擊的一方反打成功是\u003cstrong>截擊\u003c/strong>；打在對方收招時是\u003cstrong>確反\u003c/strong>。只顯示標籤並寫 Log，不加成傷害或硬直。\u003c/li>\n\u003cli>\u003cstrong>重調招式\u003c/strong>：X 改成第 7 幀出判定的輕拳。被防住時 X 為 ＋3、Y 為 －2、6X 為 －10，靠的是重調 Montage 的 Notify 位置與 \u003ccode>DamageTable\u003c/code> 的 Blockstun。\u003c/li>\n\u003cli>\u003cstrong>一鍵重現\u003c/strong>：\u003ccode>tnda.Debug.FrameScenario A|B|C\u003c/code> 自動擺位、固定 60 Hz，讓雙方在可行動的第一幀出招，重現三種情境。\u003c/li>\n\u003cli>\u003cstrong>UE 提供與遊戲自訂的分界\u003c/strong>：UE 提供 Montage 播放位置、World 計時器剩餘時間與 Canvas 繪製；幀優勢的定案時機、命中分類與 Frame Bar 的格子規則都是教材專案自己定義的。\u003c/li>\n\u003c/ul>\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>本週資產值（本次 Editor 回讀）\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>AM_Attack_01\u003c/code>／\u003ccode>02\u003c/code>／\u003ccode>03\u003c/code> 長度\u003c/td>\n\u003ctd>30／40／70 設計幀\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>傷害判定開始\u003c/td>\n\u003ctd>第 7／10／14 幀\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DT_Damage\u003c/code> Blockstun\u003c/td>\n\u003ctd>輕擊 26、右腳踢頭 46、第二攻擊 28\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>FrameScenario（本次 PIE 實測）\u003c/th>\n\u003cth align=\"right\">起手被防\u003c/th>\n\u003cth>後續\u003c/th>\n\u003cth>命中分類\u003c/th>\n\u003cth align=\"right\">1P 最終幀優勢\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A：X\u003c/td>\n\u003ctd align=\"right\">＋3\u003c/td>\n\u003ctd>雙方各出 X，1P 先打到\u003c/td>\n\u003ctd>破招（CPU 在判定前）\u003c/td>\n\u003ctd align=\"right\">＋7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B：Y\u003c/td>\n\u003ctd align=\"right\">－2\u003c/td>\n\u003ctd>雙方各出 X，CPU 先打到\u003c/td>\n\u003ctd>截擊（1P 在判定前）\u003c/td>\n\u003ctd align=\"right\">－7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C：6X\u003c/td>\n\u003ctd align=\"right\">－10\u003c/td>\n\u003ctd>CPU 以 X→X→X 反擊\u003c/td>\n\u003ctd>確反（1P 在收招）\u003c/td>\n\u003ctd align=\"right\">－6\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003ch4 id=\"reading-a07a5596\">程式碼增刪異動處\u003c/h4>\u003cp>\u003cstrong>異動歷程\u003c/strong>：\u003ccode>a8fcfa08\u003c/code> 重調招式幀數 → \u003ccode>d4ad9169\u003c/code> 幀優勢定案與命中分類 → \u003ccode>093cd4dd\u003c/code> Combat Debug 加入 Frame Bar 與幀優勢顯示 → \u003ccode>5d69dc50\u003c/code> \u003ccode>tnda.Debug.FrameScenario\u003c/code> → \u003ccode>23b5f09a\u003c/code> Montage 放慢後重調 Notify 與硬直 → \u003ccode>bc5d31db\u003c/code>、\u003ccode>12d21a0e\u003c/code>、\u003ccode>840fe9a5\u003c/code>、\u003ccode>bcf4a1f2\u003c/code> Frame Bar 移到上方、拆出 Camera Debug、面板排版與標籤位置修正。\u003c/p>\u003cp>\u003cstrong>本段要看懂的改動\u003c/strong>：① 命中時記下這次攻防並分類 → ② 每幀命中結算後檢查誰先恢復 → ③ 用對方剩下的時間定出正負號，硬直資料同步重調。\u003c/p>\u003cp>例：1P 的 X 被 CPU 防住。第 7 幀命中時 \u003ccode>RecordExchangeHit()\u003c/code> 記下 CPU 是這次的防守方；第 30 幀 1P 收招，\u003ccode>ResolveFrameAdvantage()\u003c/code> 看到攻擊方先恢復，CPU 的 \u003ccode>Blockstun\u003c/code> 還剩 3 幀，定案為 ＋3。\u003c/p>\u003cp id=\"reading-cdb41498\">\u003cstrong>① 命中時記下這次攻防並分類\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCharacter.cpp｜ClassifyHit()｜week-11\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 699  \u003c/span>\u003cspan class=\"syn-type\">EFightingHitClassification\u003c/span> \u003cspan class=\"syn-type\">AFightingCharacter\u003c/span>::\u003cspan class=\"syn-function\">ClassifyHit\u003c/span>(\u003cspan class=\"syn-type\">bool\u003c/span> \u003cspan class=\"syn-declaration\">bTargetAttacking\u003c/span>, \u003cspan class=\"syn-type\">EFightingAttackPhase\u003c/span> \u003cspan class=\"syn-declaration\">TargetPhase\u003c/span>, \u003cspan class=\"syn-type\">bool\u003c/span> \u003cspan class=\"syn-declaration\">bHitterRecoveredFromTargetAttack\u003c/span>)\n\u003cspan class=\"syn-prefix syn-added\">+ 700  \u003c/span>{\n\u003cspan class=\"syn-prefix syn-added\">+ 701  \u003c/span>    \u003cspan class=\"syn-comment\">// 待機、防禦與硬直中都不是「出招途中被打」；連段第二擊起受擊方已在 Hitstun，因此只有第一擊帶分類。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 702  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (!bTargetAttacking)\n\u003cspan class=\"syn-prefix syn-added\">+ 703  \u003c/span>    {\n\u003cspan class=\"syn-prefix syn-added\">+ 704  \u003c/span>        \u003cspan c ass=\"syn-function\">Get\u003c/span>() == this);\n\u003cspan class=\"syn-prefix syn-added\">+ 764  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (Classification != \u003cspan class=\"syn-type\">EFightingHitClassification\u003c/span>::None)\n\u003cspan class=\"syn-prefix syn-added\">+ 765  \u003c/span>    {\n\u003cspan class=\"syn-prefix syn-added\">+ 766  \u003c/span>        Target-&gt;LastReceivedHitClassification = Classification;\n\u003cspan class=\"syn-prefix syn-added\">+ 767  \u003c/span>        Target-&gt;LastReceivedHitClassificationTime = \u003cspan class=\"syn-function\">IsValid\u003c/span>(\u003cspan class=\"syn-function\">GetWorld\u003c/span>()) ? \u003cspan class=\"syn-function\">GetWorld\u003c/span>()-&gt;\u003cspan class=\"syn-function\">GetTimeSeconds\u003c/span>() : -\u003cspan class=\"syn-number\">1.0\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 768  \u003c/span>        \u003cspan class=\"syn-macro\">UE_LOG\u003c/span>(LogTndaFighter, Log, \u003cspan class=\"syn-macro\">TEXT\u003c/span>(\u003cspan class=\"syn-string\">\"HitClassification: attacker=%s target=%s class=%s target_command=%d target_phase=%s\"\u003c/span>),\n\u003cspan class=\"syn-prefix syn-added\">+ 769  \u003c/span>            *\u003cspan class=\"syn-function\">GetName\u003c/span>(), *Target-&gt;\u003cspan class=\"syn-function\">GetName\u003c/span>(), *StaticEnum&lt;\u003cspan class=\"syn-type\">EFightingHitClassification\u003c/span>&gt;()-&gt;\u003cspan class=\"syn-function\">GetNameStringByValue\u003c/span>(static_cast&lt;\u003cspan class=\"syn-type\">int64\u003c/span>&gt;(Classification)),\n\u003cspan class=\"syn-prefix syn-added\">+ 770  \u003c/span>            Target-&gt;CurrentAttack.Id, *StaticEnum&lt;\u003cspan class=\"syn-type\">EFightingAttackPhase\u003c/span>&gt;()-&gt;\u003cspan class=\"syn-function\">GetNameStringByValue\u003c/span>(static_cast&lt;\u003cspan class=\"syn-type\">int64\u003c/span>&gt;(Target-&gt;AttackPhase)));\n\u003cspan class=\"syn-prefix syn-added\">+ 771  \u003c/span>    }\n\u003cspan class=\"syn-prefix syn-added\">+ 772  \u003c/span>    \u003cspan class=\"syn-comment\">// 受擊方自己進行中的交換被打斷，不產生幀優勢；它對本角色的反打紀錄也隨之失效。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 773  \u003c/span>    Target-&gt;ExchangeDefender.\u003cspan class=\"syn-function\">Reset\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+ 774  \u003c/span>    Target-&gt;RecentExchangeDefender.\u003cspan class=\"syn-function\">Reset\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+ 775  \u003c/span>    ExchangeDefender = Target;\n\u003cspan class=\"syn-prefix syn-added\">+ 776  \u003c/span>    bExchangeLastGuard = bGuard;\n\u003cspan class=\"syn-prefix syn-added\">+ 777  \u003c/span>    ExchangeLastCommandId = CurrentAttack.Id;\n\u003cspan class=\"syn-prefix syn-added\">+ 778  \u003c/span>    RecentExchangeDefender = Target;\n\u003cspan class=\"syn-prefix syn-added\">+ 779  \u003c/span>}\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：\u003ccode>RecordExchangeHit()\u003c/code> 在套用硬直之前執行，所以讀到的是受擊方命中當下的攻擊階段。受擊方在 Startup／Active 被打中，若打人的一方剛從受擊方的攻擊恢復，就是截擊，否則是破招；在 Link／Recovery 被打中是確反。受擊方自己的攻防被打斷，它那一份紀錄就清掉，不會再產生幀優勢。\u003c/p>\u003cblockquote>\n\u003cp>資料：\u003ccode>TryApplyHit()\u003c/code> → \u003ccode>RecordExchangeHit(Target, bGuard)\u003c/code> → \u003ccode>ExchangeDefender\u003c/code>、\u003ccode>bExchangeLastGuard\u003c/code>；\u003ccode>ClassifyHit()\u003c/code> → \u003ccode>Target-&gt;LastReceivedHitClassification\u003c/code>。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-c4ec4036\">\u003cstrong>② 每幀命中結算後檢查\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCharacter.cpp｜TryApplyHit()／HandleWorldPostActorTick()｜week-11\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">  \u003cspan class=\"syn-number\">1438\u003c/span>  \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">bool\u003c/span> \u003cspan class=\"syn-d 03c/span>) / Rate : \u003cspan class=\"syn-number\">0.0f\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 754  \u003c/span>}\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>DamageTable.csv｜資料｜week-11\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">  \u003cspan class=\"syn-number\">1\u003c/span>  \u003cspan class=\"syn-constant\">ID\u003c/span>,Title,Damage,Hitstun,Blockstun\n\u003cspan class=\"syn-prefix syn-removed\">- 2  \u003c/span>\u003cspan class=\"syn-number\">1\u003c/span>,輕擊,\u003cspan class=\"syn-number\">10\u003c/span>,\u003cspan class=\"syn-number\">12\u003c/span>,\u003cspan class=\"syn-number\">8\u003c/span>\n\u003cspan class=\"syn-prefix syn-removed\">- 3  \u003c/span>\u003cspan class=\"syn-number\">2\u003c/span>,右腳踢頭,\u003cspan class=\"syn-number\">15\u003c/span>,\u003cspan class=\"syn-number\">18\u003c/span>,\u003cspan class=\"syn-number\">12\u003c/span>\n\u003cspan class=\"syn-prefix syn-removed\">- 4  \u003c/span>\u003cspan class=\"syn-number\">3\u003c/span>,第二攻擊,\u003cspan class=\"syn-number\">20\u003c/span>,\u003cspan class=\"syn-number\">16\u003c/span>,\u003cspan class=\"syn-number\">10\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 2  \u003c/span>\u003cspan class=\"syn-number\">1\u003c/span>,輕擊,\u003cspan class=\"syn-number\">10\u003c/span>,\u003cspan class=\"syn-number\">29\u003c/span>,\u003cspan class=\"syn-number\">26\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 3  \u003c/span>\u003cspan class=\"syn-number\">2\u003c/span>,右腳踢頭,\u003cspan class=\"syn-number\">15\u003c/span>,\u003cspan class=\"syn-number\">49\u003c/span>,\u003cspan class=\"syn-number\">46\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 4  \u003c/span>\u003cspan class=\"syn-number\">3\u003c/span>,第二攻擊,\u003cspan class=\"syn-number\">20\u003c/span>,\u003cspan class=\"syn-number\">32\u003c/span>,\u003cspan class=\"syn-number\">28\u003c/span>\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：\u003ccode>ResolveFrameAdvantage()\u003c/code> 是純函式。雙方都不能動時回傳 false，連段中就不會定案；攻擊方先恢復時取防守方剩下的硬直，防守方先恢復時取攻擊方剩下的動畫時間並加負號。攻擊方剩下的時間包含淡出，\u003ccode>GetAttackRemainingSeconds()\u003c/code> 用「Montage 長度－目前位置」除以播放倍率。資料方面，三招硬直配合放慢後的 Montage 重調，Blockstun 26／46／28 讓三招被防住剛好是 ＋3／－10／－2。\u003c/p>\u003cblockquote>\n\u003cp>資料：\u003ccode>GetAttackRemainingSeconds()\u003c/code>、\u003ccode>GetStunRemainingSeconds()\u003c/code> → \u003ccode>SecondsToDesignFrames()\u003c/code> 四捨五入成設計幀 → \u003ccode>OutFrames\u003c/code>。\u003c/p>\n\u003c/blockquote>\u003cp>\u003ccode>FightingCharacter.cpp\u003c/code>、\u003ccode>_DataTable/DamageTable.csv\u003c/code>｜week-10（\u003ccode>58159624\u003c/code>）→ week-11（\u003ccode>61e68432\u003c/code>）｜原始碼節錄；行號跳號表示省略，Tab 已換成四格空白。\u003c/p>\u003ch4 id=\"reading-91e8d1aa\">程式流程圖\u003c/h4>\u003cp>\u003cstrong>圖 1｜幀優勢在哪一幀定案？\u003c/strong>（時間軸，X 被防，以 1P 起手的第 0 幀起算）\u003c/p>\u003cfigure class=\"flow-diagram\">\u003csvg style=\"width:900px;max-width:100%;margin-inline:auto\" id=\"w11-3-diagram-10\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 204\" role=\"graphics-document document\" aria-roledescription=\"gantt\">\u003cg>\u003c/g>\u003cg class=\"grid\" transform=\"translate(70, 154)\" fill=\"none\" font-size=\"10\" font-family=\"sans-serif\" text-anchor=\"middle\">\u003cpath class=\"domain\" stroke=\"currentColor\" d=\"M0.5,-114V0.5H800.5V-114\">\u003c/path>\u003cg class=\"tick\" opacity=\"1\" transform=\"translate(0.5,0)\">\u003cline stroke=\"currentColor\" y2=\"-114\">\u003c/line>\u003ctext fill=\"#000\" y=\"3\" dy=\"1em\" stroke=\"none\" font-size=\"10\" style=\"text-anchor: middle;\">00\u003c/text>\u003c/g>\u003cg class=\"tick\" opacity=\"1\" transform=\"translate(121.5,0)\">\u003cline stroke=\"currentColor\" y2=\"-114\">\u003c/line>\u003ctext fill=\"#000\" y=\"3\" dy=\"1em\" stroke=\"none\" font-size=\"10\" style=\"text-anchor: middle;\">05\u003c/text>\u003c/g>\u003cg class=\"tick\" opacity=\"1\" transform=\"translate(242.5,0)\">\ strong>：輸入 \u003ccode>tnda.Debug.FrameScenario C\u003c/code>，1P 的 6X 被防住是 －10，接著 CPU 用 X→X→X 反擊。\u003c/p>\u003col>\n\u003cli>CPU 的第一個 X 打中 1P 時，1P 頭頂會出現哪個標籤？\u003c/li>\n\u003cli>為什麼 －10 足夠讓 CPU 的 X 打中？\u003c/li>\n\u003c/ol>\u003cul>\n\u003cli>\u003cstrong>參考答案\u003c/strong>：1. \u003cstrong>確反\u003c/strong>。CPU 的 X 第 7 幀打到時，1P 的 6X 還在收招，\u003ccode>ClassifyHit()\u003c/code> 看到受擊方在 Link／Recovery。本次實測 Log 為 \u003ccode>class=Punish target_command=2 target_phase=Recovery\u003c/code>。2. CPU 比 1P 早 10 幀恢復，恢復後立刻出 X，從 X 的第 0 幀算起第 7 幀打到；7 比 10 小，1P 這時還沒收招完，打得到。1P 還在出招，不能防禦。\u003c/li>\n\u003cli>\u003cstrong>判讀重點\u003c/strong>：學生能把幀優勢的絕對值和對手最快一招的命中幀相比，並說出確反看的是受擊方的攻擊階段。\u003c/li>\n\u003cli>\u003cstrong>可以追問\u003c/strong>：「情境 B 的 Y 被防是 －2，CPU 出 X 為什麼標成截擊而不是確反？」答：CPU 早 2 幀恢復，雙方都出 X，1P 的 X 還在判定前就被打到；CPU 剛防住 1P 的攻擊，所以是截擊。本次實測 Log 為 \u003ccode>class=Interrupt target_phase=Startup\u003c/code>。\u003c/li>\n\u003c/ul>\u003ch4 id=\"reading-f61f924a\">把需求交給 AI 實作\u003c/h4>\u003cp>提示詞分兩段：\u003cstrong>設計先講玩家看到什麼，工程再把它轉成系統規格\u003c/strong>。工程提示詞沿用 week-08 實作題的方法：\u003cstrong>先定義資料與介面，再規劃 Init → Tick → End，最後接入遊戲流程\u003c/strong>，並要求 AI 先回覆規格、經確認後才改程式。\u003c/p>\u003ch5 id=\"reading-1e879cc0\">設計提需求\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># 幀數條與幀優勢\n## 玩家體驗\n練習時打開除錯畫面，能看到雙方每一幀在做什麼，以及一次攻防結束後誰先能動、早幾幀。\n\n## 規則\n- 畫面上方兩條時間軸，一格一幀；出招前、判定中、收招、挨打、防住各用不同顏色。\n- 一次攻防打完、先恢復的一方能動的那一刻，就顯示誰早幾幀：先動顯示藍色加號，晚動顯示紅色減號，同時顯示 0。\n- 連段打到一半不顯示，打完才顯示。\n- 對方出招途中被打中，頭頂顯示破招、截擊或確反，只是標籤，不改傷害。\n- 一個指令就能重現三種固定情境，數字每次都一樣。\n\n## 驗收畫面\n輕擊、第二攻擊、踢頭被防住，分別顯示 +3、-2、-10；三種情境各出現對應的標籤。\n\u003c/code>\u003c/pre>\u003ch5 id=\"reading-719f20bc\">工程給提示詞\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># 目標\n依附上的「幀數條與幀優勢」設計需求，在既有 Combat Debug 加入幀數條、幀優勢與命中分類，數字由正式戰鬥流程算出。\n\n## 請依以下順序提出規格\n1. 定義資料與介面：一次攻防要記住哪些資訊；幀優勢與命中分類存在哪裡、以什麼單位表示；Log 的固定格式。\n2. Init：命中當下要記錄什麼、在套用硬直之前還是之後記錄。\n3. Tick：每一幀在哪個時間點檢查誰先恢復；正負號取哪一方的剩餘時間；幀數條怎麼在任何更新率下以設計幀分格。\n4. End：對手失效、對戰結束或新的攻防開始時，舊紀錄怎麼清除；固定情境指令結束後如何還原設定。\n5. 接入與測試：顯示接到哪個除錯開關；列出對應設計驗收的測試案例。\n\n## 回覆方式\n先閱讀專案中相關的既有程式與資產，再回覆以上五項規格與要修改的檔案。完成後回報每個驗收案例的 PIE 結果，未實測的標明未驗證。\n\n## 施工方式\n開工前先跟我確認規格。之後依規格順序一次做一項，每完成一項，經我確認無誤後 commit，再做下一項。\n\u003c/code>\u003c/pre>\u003ch2 id=\"w11-3-10\">課堂實作\u003c/h2>\u003ch3 id=\"w11-3-11\">課堂實作｜做出只能在連段中使出的專屬招\u003c/h3>\u003ch4 id=\"reading-4ac0b1a5\">題目\u003c/h4>\u003cp>延伸課堂示範 1。只修改 \u003ccode>_DataTable/CommandTable.csv\u003c/code> 的 \u003ccode>Opener\u003c/code> 與 \u003ccode>Link\u003c/code>，可以新增列，但 Montage 與 Damage 只能用既有的，改完後 Reimport \u003ccode>DT_Command\u003c/code>。做出一招從空檔按不出來、只能接在連段裡使出的專屬招；用哪個輸入、接在第幾段由你決定。\u003c/p>\u003cp>開遊戲打開 Combat Debug，演示同一個輸入在空檔與連段中按下時，\u003ccode>Attack\u003c/code> 顯示的 ID 不同。請說明：\u003cstrong>\u003ccode>Opener\u003c/code> 怎麼讓這兩個時機選到不同的列？如果只加 Link、不設 \u003ccode>Opener\u003c/code>，會發生什麼？\u003c/strong>\u003c/p>\u003cp>演示後把 CSV 改回原值並再次 Reimport。\u003c/p>\u003ch4 id=\"reading-247ce2b5\">參考做法與判讀\u003c/h4>\u003cp>\u003cstrong>參考做法：把右腳踢頭變成第三段之後的專屬招。\u003c/strong> 不新增列，只改 \u003ccode>CommandTable.csv\u003c/code> 的兩格。連段中接出 ID 2 的結果，以 week-11 教材專案、60 FPS、CPU AI 關閉、站距 85 cm 的 PIE 實測確認（同課前實作參考做法 2 的 Link）；空檔按 6X 的結果依選招規則推得，尚未實測。\u003c/p>\u003col>\n\u003cli>\u003cp>\u003cstrong>停止 PIE，改 \u003ccode>CommandTable.csv\u003c/code>。\u003c/strong> 用文字編輯器開啟 \u003ccode>_DataTable/CommandTable.csv\u003c/code>，改兩格後以 UTF-8 存檔：\u003c/p>\n\u003cul>\n\u003cli>第 2 招（右腳踢頭）關閉 \u003ccode>Opener\u003c/code>，也就是填 \u003ccode>FALSE\u003c/code>。\u003c/li>\n\u003cli>第 5 招（連段三段）新增 \u003ccode>Link\u003c/code> 第 2 招，也就是填 \u003ccode>2\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003cp>改完的兩列：\u003c/p>\n\u003cpre>\u003ccode class=\"language-csv\">2,右腳踢頭,\"6,X\",AM_Attack_03,1.0,0,None,2,foot_r,\"head,pelvis\",,FALSE\n5,連段三段,X,AM_Attack_01,1.0,0,None,1,hand_r,\"head,pelvis,calf_l,calf_r\",2,FALSE\n\u003c/code>\u003c/pre>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Reimport。\u003c/strong> 在 Content Browser 對 \u003ccode>/Game/DataTable/DT_Command\u003c/code> 按右鍵選 \u003cstrong>Reimport\u003c/strong>，雙擊開啟，確認 Row \u003ccode>2\u003c/code> 的 Opener 是 \u003ccode>FALSE\u003c/code>、Row \u003ccode>5\u003c/code> 的 Link 是 2，Output Log 沒有 \u003ccode>DataTables TableId=Command\u003c/code> 的錯誤。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>開 PIE。\u003c/strong> 開 \u003ccode>/Game/Fighting/stage1\u003c/code> 按 Play，按右 \u003ccode>Ctrl\u003c/code>＋\u003ccode>F12\u003c/code> 打開 Combat Debug，Console 輸入 \u003ccode>tnda.Debug.CPUAI off\u003c/code>。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>演示空檔。\u003c/strong> 走到 CPU 面前，按住前進再按 \u003ccode>U\u003c/code>：1P 面板 \u003ccode>Attack\u003c/code> 顯示 ID 1，角色出拳，不是踢頭。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>演示連段。\u003c/strong> 依序按 \u003ccode>U\u003c/code>、\u003ccode>U\u003c/code>、\u003ccode>U\u003c/code>，第四下按住前進再按 \u003ccode>U\u003c/code>：\u003ccode>Attack\u003c/code> 依序顯示 ID 1、4、5、2，最後一下是右腳踢頭。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>對照不設 Opener。\u003c/strong> 第 2 招重新打開 \u003ccode>Opener\u003c/code>（清成空白），存檔並 Reimport，重做步驟 4：空檔按 6X 回到 ID 2，直接出踢頭。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>還原。\u003c/strong> 第 5 招拿掉 \u003ccode>Link\u003c/code>（清成空白），第 2 招的 \u003ccode>Opener\u003c/code> 確認是打開的（空白），存檔並 Reimport；Console 輸入 \u003ccode>tnda.Debug.CPUAI on\u003c/code>。\u003c/p>\n\u003c/li>\n\u003c/ol>\u003cp id=\"reading-cdd25700\">\u003cstrong>判讀重點\u003c/strong>\u003c/p>\u003cul>\n\u003cli>\u003cstrong>兩個時機看不同欄位\u003c/strong>：學生要說出空檔選招只看 \u003ccode>Opener\u003c/code>，連段中只看目前招式的 \u003ccode>Link\u003c/code>。ID 2 是 \u003ccode>FALSE\u003c/code>，空檔被跳過，6X 落到 Keys 沒寫方向的 ID 1；第三段 ID 5 出招中，候選只剩 Link 裡的 ID 2，6X 符合，所以出踢頭。\u003c/li>\n\u003cli>\u003cstrong>只加 Link、不設 Opener\u003c/strong>：ID 2 在空檔仍可起手，空檔與連段中按 6X 都出 ID 2。它只是「也能接在連段裡」，不是專屬招。設與不設的差別是出拳（ID 1）對踢頭（ID 2），不看 Combat Debug 也分得出來。\u003c/li>\n\u003cli>\u003cstrong>和課前實作的關係\u003c/strong>：課前選右腳踢頭收尾的學生已經改過 ID 5 的 Link，這題只多改 ID 2 的 Opener；課前改過的 \u003ccode>DamageTable\u003c/code> 已經還原，這題不需要。課前選第二攻擊收尾的學生，可以照同樣想法把 ID 3 設 \u003ccode>FALSE\u003c/code>、ID 5 的 Link 設 3：空檔按 Y 不會出任何招，因為能起手的 ID 1、ID 2 都要按 X；X→Y 仍可出 ID 3，因為 ID 1 的 Link 本來就有 3。這個另解依選招規則推得，尚未實測。\u003c/li>\n\u003cli>\u003cstrong>新增列的另解\u003c/strong>：學生也可以新增一列專屬招，但 Montage 只能用既有的三份，動作一定和某一招相同，只能靠 \u003ccode>Attack\u003c/code> 的 ID 區分。這時 \u003ccode>FALSE\u003c/code> 與空白的差別取決於輸入：用 \u003ccode>4,X\u003c/code> 時，空檔分別出 ID 1 與新列，看得出差別；用 \u003ccode>Y\u003c/code> 或 \u003ccode>6,X\u003c/code> 時，空檔一律由 ID 更小的既有列（ID 3、ID 2）搶先，兩者畫面相同。這組結果已實測；學生能用排序規則說明，也算理解。\u003c/li>\n\u003cli>\u003cstrong>常見錯誤\u003c/strong>：Link 指到和目前招式同一份 Montage 的列，例如把 ID 5 的 Link 設成 1（兩者都播 \u003ccode>AM_Attack_01\u003c/code>，也讓 1→4→5→1 繞成一圈），匯入時會整表驗證失敗，開 PIE 時跳出驗證失敗對話框並停止。\u003ccode>Opener\u003c/code> 寫成 \u003ccode>false\u003c/code> 小寫也會整表失敗。把 ID 1 的 Opener 改成 \u003ccode>FALSE\u003c/code>，空檔按 X 不會出任何招，Y 仍出 ID 3。\u003c/li>\n\u003c/ul>\u003cp id=\"reading-961409b7\">\u003cstrong>可以追問\u003c/strong>\u003c/p>\u003cul>\n\u003cli>「把 ID 4 的 Opener 改成空白，空檔按 X 會出 ID 4 嗎？」答：不會，仍是 ID 1。兩列都沒寫方向，ID 小的 ID 1 排在前面；本次實測連按三下仍是 1→4→5。\u003c/li>\n\u003cli>「只把 ID 2 設成 \u003ccode>FALSE\u003c/code>，忘了改 ID 5 的 Link，會發生什麼？」答：匯入不會失敗，但沒有任何 Link 指到 ID 2，Output Log 會警告這一列永遠無法使用，整場都使不出右腳踢頭。\u003c/li>\n\u003c/ul>\u003cp>教師備註：連段 ID 1→4→5→2 與空檔 4X 落到 ID 1，以腳本在記憶體改寫 \u003ccode>DT_Command\u003c/code> 後的 PIE 實測確認，腳本直接送出攻擊語意。空檔 6X 在 ID 2 設 \u003ccode>FALSE\u003c/code> 時落到 ID 1、刪掉 \u003ccode>FALSE\u003c/code> 後回到 ID 2，以及第二攻擊的另解，都依選招規則推得，尚未實測；人手按住前進時角色會往前走，選招結果應相同，但沒有實際操作驗證。整表驗證失敗的三種情況（同 Montage、循環、小寫 \u003ccode>false\u003c/code>）依原始碼推得，本次沒有在 PIE 實測對話框。\u003c/p>\u003c/article>\u003carticle class=\"paper reading-reference\">\u003ch2 id=\"prestudy-commands\">本週的五列招式\u003c/h2>\u003cp>資料來源：本週課前預習。\u003c/p>\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth align=\"right\">ID\u003c/th>\n\u003cth>招式\u003c/th>\n\u003cth>Keys\u003c/th>\n\u003cth>Montage\u003c/th>\n\u003cth align=\"right\">Damage\u003c/th>\n\u003cth>Link\u003c/th>\n\u003cth>Opener\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd align=\"right\">1\u003c/td>\n\u003ctd>基本攻擊\u003c/td>\n\u003ctd>X\u003c/td>\n\u003ctd>\u003ccode>AM_Attack_01\u003 ,"tone":"a"},{"a":7,"b":12,"text":"判定中","tone":"hot"},{"a":12,"b":30,"text":"收招","tone":"a"},{"a":30,"b":33,"text":"","tone":"free"}]},{"label":"CPU","bars":[{"a":0,"b":7,"text":"還沒被打到","tone":"muted"},{"a":7,"b":33,"text":"Blockstun 26 幀","tone":"hot"}]}],"markers":[{"f":0,"text":"第 0 幀：你的 X 開始播放"},{"f":30,"text":"第 30 幀：你恢復"},{"f":33,"text":"第 33 幀：CPU 恢復，你早 3 幀","row":1}],"cards":[["同樣按 X，為什麼出三種招？","空檔與出招中各看哪一欄。"],["CPU 怎麼也打出三段？","每一招各決定一次要不要接。"],["＋3 在哪一幀定案？","先恢復的一方，看對方還剩多少。"]],"steps":[{"title":"本頁重點","detail":"課前算出 X 被防後你早 3 幀能動，今天看選招、CPU 連段與幀優勢怎麼寫在程式裡。","focus":[]}],"topicLabel":"本週主題"},{"page":2,"title":"AI 共用開場：先讀專案與操作入口","demo":0,"kind":"prompt","key":"完成專案導讀，回覆只保留結果與阻礙。","location":"無","lessonRefs":[],"steps":[{"title":"本頁重點","detail":"完成專案導讀，回覆只保留結果與阻礙。","focus":[]}],"topicLabel":"AI 共用開場","prompt":"# 專案與工作範圍\n以目前資料夾的 TndaFighter.uproject 為根目錄；主要模組是 TndaFighter。\n這是 Unreal Engine C++ 格鬥遊戲；引擎版本讀 EngineAssociation。\n# 先讀文件，再對照程式\n先讀 Source/AGENTS.md 與 Source/TndaFighter/Fighting/AGENTS.md。\n接著讀 Source/TndaFighter/ 下 Fighting/README.md、DataTable/README.md，\n再依功能讀 Fighting/Docs 與相關原始碼。\n文件缺失或與程式不一致時，先查原始碼與設定；資產查詢等下一頁確認 unreal-mcp 後進行。\n# 操作與資料入口\n關卡：/Game/Fighting/stage1。U 是 X，I 是 Y；6 朝向對手、4 遠離對手。\nCSV：_DataTable/CommandTable.csv、_DataTable/DamageTable.csv。\n對應 /Game/DataTable/DT_Command、/Game/DataTable/DT_Damage；改 CSV 後 Reimport。\n動畫：/Game/Fighting/Anims/AM_Attack_01～03；右 Ctrl＋F12 切換 Combat Debug。\n# 本輪回覆格式\n成功只回一句：「專案導讀完成，可以提供需求。」\n受阻只回兩行：「阻礙：…」「下一步：…」。先完成查證，不改檔，不附摘要或重述規則。"},{"page":3,"title":"AI 共用開場：確認工具，再逐輪合作","demo":0,"kind":"prompt","key":"先驗證 unreal-mcp 與專案完整路徑；所有 .uasset 操作統一走 unreal-mcp。","location":"無","lessonRefs":[],"steps":[{"title":"本頁重點","detail":"先驗證 unreal-mcp 與專案完整路徑；所有 .uasset 操作統一走 unreal-mcp。","focus":[]}],"topicLabel":"AI 共用開場","prompt":"# 開工前確認 unreal-mcp\n使用 unreal-mcp：http://127.0.0.1:8000/mcp。\n1. 完成 MCP 連線、取得工具並執行 Editor 唯讀查詢；只有 HTTP 回應不算通過。\n2. 透過 unreal-mcp 取得 Editor 開啟的 .uproject 完整路徑，\n   與工作資料夾的 TndaFighter.uproject 比對；只核對檔名不夠。\n3. 連線失敗、專案不符或無法確認時停止實作，排除後重新驗證。\n# 資產操作規則\n.uasset 的查詢、建立、修改、Reimport 與儲存，一律透過 unreal-mcp。\n修改前查現況，修改後回讀確認。C++、CSV 與設定文字檔使用檔案工具；\nCSV 改完後，DataTable 的 Reimport 與儲存仍透過 unreal-mcp。\n缺少所需能力時先回報並討論，不改用其他方式操作資產。\n本輪不修改功能；連線與專案確認後，接著貼四段共用提示詞。\n# 本輪回覆格式：固定三行\nunreal-mcp：可用／不可用／未確認\nEditor 專案：完整 .uproject 路徑；與工作資料夾一致／不一致／無法確認\n開工條件：已就緒／受阻；受阻時附原因與下一步\n受阻原因與下一步寫在第三行；不附前言、結語、清單或過程。未查證就寫「未確認」。"},{"page":4,"title":"共用提示詞 1／4：收到需求後怎麼合作","demo":0,"kind":"prompt","key":"依序貼上四段共用規則，再貼示範需求。","location":"無","lessonRefs":[],"steps":[{"title":"本頁重點","detail":"先完成共用流程，再開始功能討論。","focus":[]}],"topicLabel":"共用提示詞","prompt":"# 共用提示詞（1／4）\n接下來四段是同一套規則，適用於後續每個功能；收到完整規則與功能需求才開始。\n本段先記住規則，等待下一段，不修改檔案。\n# 收到功能需求後\n先讀指定文件與程式，用 unreal-mcp 查相關資產，再提出尚未決定的問題。\n能自行查證的事實先查；每題附建議，一輪只問現在能回答的題目。\n我回答後再問衍生問題，全部確認後才依接下來的格式整理 SPEC。\nSPEC 給我看，我確認後才存檔；每張工單由你實作，我檢查異動並手動確認功能。\n# 開始功能前先確認基準\n保留既有改動；確認引擎、編譯工具與 TndaFighterEditor Win64 Development 建置方式。\n先讀啟動腳本，給我建置與進入 stage1 的操作步驟；等我回報基準結果，不自行執行。\n基準失敗先說明原因與下一步，不把既有問題當成本次修改造成。\n# 回覆與接續\n正常進度簡短回報；討論只列待決定問題，SPEC、異動導覽與手動驗證步驟依格式提供。\n換新對話時重貼共用開場、這四段規則與已確認 SPEC，交代目前工單進度。\n# 本輪回覆格式\n成功只回一句：「收到共用提示詞 1／4。」\n受阻只回兩行：「阻礙：…」「下一步：…」。不附摘要、解釋、重述規則或額外提問。"},{"page":5,"title":"共用提示詞 2／4：SPEC 目標與實作設計","demo":0,"kind":"prompt","key":"依序貼上四段共用規則，再貼示範需求。","location":"無","lessonRefs":[],"steps":[{"title":"本頁重點","detail":"先完成共用流程，再開始功能討論。","focus":[]}],"topicLabel":"共用提示詞","prompt":"# 共用提示詞（2／4）：SPEC 固定格式前半\n討論完成後，SPEC 使用 Markdown，標題為「# SPEC｜功能名稱」。\n## 1. 目標與範圍\n寫目前問題、完成後的遊戲行為、本次包含與不包含的工作。\n## 2. 現況與已確認規則\n列程式與資產查證依據；規則用「條件 → 行為」表格。\n數值寫單位、方向基準與起算點，區分既有值與本次決定；未決事項不能當成已確認。\n## 3. 實作設計\n每套功能各開小節，完整展開以下五步，不能只列標題：\n1. 資料與介面：型別、初始值、單位、擁有者、公開／私有方法與輸入輸出。\n   涉及表格時列 CSV、Row、執行期副本、Reader、驗證與舊資料相容方式。\n2. Init：觸發條件、資料準備、清除舊狀態、無效輸入與重複啟動的處理。\n3. Tick：更新時機、時間來源、狀態推進與停止條件；公式附符號、單位與小算例。\n4. End：正常結束、中斷、停用與生命週期清理；哪些歸零、哪些保留、如何重啟。\n5. 接入與手動確認：呼叫者、插入位置、先後順序、保留的既有行為與建置／資產更新順序。\n# 本輪回覆格式\n成功只回一句：「收到共用提示詞 2／4。」\n受阻只回兩行：「阻礙：…」「下一步：…」。不加摘要、解釋或提問；等待下一段，不動工。"},{"page":6,"title":"共用提示詞 3／4：SPEC 手動驗證與工單","demo":0,"kind":"prompt","key":"依序貼上四段共用規則，再貼示範需求。","location":"無","lessonRefs":[],"steps":[{"title":"本頁重點","detail":"先完成共用流程，再開始功能討論。","focus":[]}],"topicLabel":"共用提示詞","prompt":"# 共用提示詞（3／4）：SPEC 固定格式後半\n# 實作設計的詳細程度\n每一步列檔案／資產、修改位置、內容、原因，以及學生應檢查的重點。\n新名稱標示「預計新增」；不適用寫原因，事件驅動寫實際入口；必要時附偽碼。\n## 4. 手動驗證清單\n每項依序寫：編號、確認目標、準備條件、操作步驟、預期畫面或 Log、結束後如何還原。\n步驟要寫清楚開哪個檔案或畫面、改動要看哪裡、遊戲內按什麼、觀察什麼。\n包含異動內容檢查、正常功能、中斷與受影響的舊功能；先提供最小可操作案例。\n建置與啟動也提供給我操作；資產修改仍由你透過 unreal-mcp 處理，我負責檢視與遊戲操作。\n不自行跑測試、操作遊戲驗證或產生自動驗收腳本；結果等我回報，未回報就是未確認。\n## 5. 分階段工單\n表格欄位：編號、範圍、相依工單、修改檔案／資產、可展示成果、手動驗證項目編號。\n每張完成後先讓我檢查異動、操作確認，我同意後才進下一張。\n## 6. 未決事項\n列問題與建議；沒有寫「無」。提出 SPEC 保存位置，等我確認再存檔。\n# 本輪回覆格式\n成功只回一句：「收到共用提示詞 3／4。」\n受阻只回兩行：「阻礙：…」「下一步：…」。不加摘要、解釋或提問；等待下一段，不動工。"},{"page":7,"title":"共用提示詞 4／4：實作後交給學生確認","demo":0,"kind":"prompt","key":"依序貼上四段共用規則，再貼示範需求。","location":"無","lessonRefs":[],"steps":[{"title":"本頁重點","detail":"先完成共用流程，再開始功能討論。","focus":[]}],"topicLabel":"共用提示詞","prompt":"# 共用提示詞（4／4）：每張工單的執行方式\n# 規格確認後\n讀 SPEC 與目前工單，簡述本批範圍，等我確認後只實作這張工單。\n保留既有改動，依專案規則處理註解、行尾與文件；完成後閱讀 diff，整理異動導覽。\n資產查詢、修改、儲存、回讀與 CSV Reimport 都走 unreal-mcp；重連後核對 .uproject 完整路徑。\n需要停止 PIE、建置或重啟 Editor 時，先給我操作步驟，等我回報後繼續。\n# 完成實作後，固定交付兩段\n1. 異動導覽：檔案／資產、修改位置、改前與改後的差異、原因；指出我應檢查的內容。\n2. 手動驗證：依 SPEC 列出本批項目，包含準備、逐步操作、預期畫面或 Log、還原步驟。\n步驟要能照做，交付後等我回報；不自行跑測試、遊戲驗證或自動驗收腳本。\n# 收到我的結果後\n依回報記錄通過／失敗／未確認；沒有回報的項目不能自行判定通過。\n失敗時先問實際現象與錯誤，查原因並提出修正；修正後再給我重測步驟。\n我還原 Debug，你透過 MCP 還原測試資產；我確認後才 commit、做下一張，無 Git 則先備份。\nunreal-mcp 受阻先停止並排除，不改用其他方式操作資產。\n# 本輪回覆格式\n成功只回一句：「共用提示詞已就緒，請提供功能需求。」\n受阻只回兩行：「阻礙：…」「下一步：…」。不加摘要、解釋或提問；等待功能需求，不動工。"},{"page":8,"title":"情境需求：連按三次 X，怎麼打出三種不同的招？","demo":1,"kind":"diagram","key":"連段的每一步是招式表裡的一列 ID；ID 4、5 不能起手，只能靠前一招的 Link 接出來。","location":"TndaCommandData.h｜FTndaCommandRow::Opener；_DataTable/CommandTable.csv","lessonRefs":[{"href":"#reading-70e65ecf","label":"設計需求","hint":""},{"href":"#reading-2c3bac2b","label":"程式流程圖","hint":""}],"api":[["三段的資料","ID 1 接 4,3，ID 4 接 5；ID 5 的 Link 空白，連段到此結束。"],["Opener 欄","空白或 TRUE 可以起手；FALSE 只能被接出來。"],["UE／遊戲自己定","UE 提供 CSV 匯入；起手、接招與排序由遊戲自己定。"]],"note":"ID 1 和 ID 5 都播 AM_Attack_01。步驟看 ID，不看動畫，所以不會繞回第一段。","steps":[{"title":"本頁重點","detail":"連段的每一步是招式表裡的一列 ID；ID 4、5 不能起手，只能靠前一招的 Link 接出來。","focus":[]}],"topicLabel":"情境需求","svg":"\u003csvg id=\"slide-diagram-8\" width=\"1218.180419921875\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" height=\"469.75\" viewBox=\"4 4 1218.180419921875 469.75\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\">\u003cstyle>#slide-diagram-8{font-family:Microsoft JhengHei;font-size:30px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#slide-diagram-8 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#slide-diagram-8 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#slide-diagram-8 .error-icon{fill:#552222;}#slide-diagram-8 .error-text{fill:#552222;stroke:#552222;}#slide-diagram-8 .edge-thickness-normal{stroke-width:1px;}#slide-diagram-8 .edge-thickness-thick{stroke-width:3.5px;}#slide-diagram-8 .edge-pattern-solid{stroke-dasharray:0;}#slide-diagram-8 .edge-thickness-invisible{stroke-width:0;fill:none;}#slide-diagram-8 .edge-pattern-dashed{stroke-dasharray:3;}#slide-diagram-8 .edge-pattern-dotted{stroke-dasharray:2;}#slide-diagram-8 .marker{fill:#333333;stroke:#333333;}#slide-diagram-8 .marker.cross{stroke:#333333;}#slide-diagram-8 svg{font-family:Microsoft JhengHei;font-size:30px;}#slide-diagram-8 p{margin:0;}#slide-diagram-8 .label{font-family:Microsoft JhengHei;color:#333;}#slide-diagram-8 .cluster-label text{fill:#333;}#slide-diagram-8 .cluster-label span{color:#333;}#slide-diagram-8 .cluster-label span p{background-color:transparent;}#slide-diagram-8 .label text,#slide-diagram-8 span{fill:#333;color:#333;}#slide-diagram-8 .node rect,#slide-diagram-8 .node circle,#slide-diagram-8 .node ellip
