function sequence(){
 const names=['角色','輸入預約','招式資料','動畫播放'];
 const messages=[ [0,1,'確認窗口與期限',0],[0,1,'取出輸入並清除預約',1],[0,2,'TrySelectLinkedCommand',2],[2,0,'選招結果',2],[0,3,'選招成功 → StartAttack',3],[3,0,'播放結果',3],[0,0,'播放成功 → 清理舊招並交接',4] ];

}
function speedComparison(){
 const s=slideData[page],t=s.timing,x=v=>280+1050*v;
 return '<div class="speed-source"><strong>'+escapeHtml(s.calculationSource.title)+'</strong><p>'+escapeHtml(s.calculationSource.markers)+'</p><p>'+escapeHtml(s.calculationSource.difference)+'</p></div><svg class="speed-diagram" viewBox="0 0 1500 430" role="img" aria-label="正常速度約 0.33 秒可接招，輸入仍有效；半速輸入在 0.5 秒過期，約 0.66 秒才可接招。">'+
 '<text x="280" y="27" font-size="23">按 I 後經過的遊戲時間（秒）</text><text x="'+x(t.lifetime)+'" y="27" font-size="25" text-anchor="start" fill="#b63e35">0.5 秒：輸入期限上限</text>'+
 [0,.25,.5,.75,1].map(v=>'<text x="'+x(v)+'" y="65" font-size="22" text-anchor="middle">'+v+'</text><path d="M'+x(v)+' 78V198M'+x(v)+' 245V365" stroke="'+(v===.5?'#b63e35':'#dce6eb')+'" stroke-width="'+(v===.5?3:1)+'" stroke-dasharray="6 5"/>').join('')+

}

function render(){
 const s=slideData[page],active=s.steps[stepIndex];
 document.querySelector('.stage').classList.toggle('cancel-overview',s.kind==='cancelOverview');
 document.querySelector('.stage').classList.toggle('speed-comparison',s.kind==='speedComparison');
 document.querySelector('.stage').classList.toggle('frame-overview',s.kind==='frameOverview');
 document.querySelector('.stage').classList.toggle('buffer-write',s.kind==='bufferWrite');
 document.querySelector('.stage').classList.toggle('consume-overview',s.kind==='consumeOverview');
 document.querySelector('.stage').classList.toggle('code-route',s.kind==='codeRoute');
 const keepIntro=s.kind==='comboIntro'&&!!$('visual').querySelector('.intro-diagram');
 document.querySelector('.stage').classList.toggle('combo-intro',s.kind==='comboIntro');
 document.querySelector('.stage').classList.toggle('source-walk',s.kind==='frameSequence');
 document.querySelector('.stage').classList.toggle('notify-page',s.kind==='notifyLifecycle');
 document.querySelector('.stage').classList.toggle('video-page',s.kind==='video');
 document.querySelector('.stage').classList.toggle('combo-overview',!!s.staticOverview);
 document.querySelector('.stage').classList.toggle('assignment-page',s.kind==='assignments');
 document.querySelector('.stage').classList.toggle('buffer-entries',s.kind==='bufferEntries');
 $('title').textContent=s.title;$('source').textContent=s.source;$('count').textContent=`${page+1} / ${slideData.length}`;$('pages').value=page;
 $('steps').innerHTML=s.steps.map((x,i)=>`<option value="${i}">${i+1}. ${escapeHtml(x.title)}</option>`).join('');$('steps').value=stepIndex;
 let graph='';
 if(s.kind==='codeRoute')graph=codeRoute();
 else if(s.kind==='consumeOverview')graph=consumeOverview();
 else if(s.kind==='bufferWrite')graph=bufferWrite();
 else if(s.kind==='frameOverview')graph=frameOverview();
 else if(s.kind==='cancelOverview')graph=cancelOverview();
 else if(s.kind==='comboIntro')graph=comboIntro();
 else if(s.kind==='bufferEntries')graph=s.entries.map(e=>'<section class="buffer-entry"><div><h2>'+escapeHtml(e.title)+'</h2><p>'+escapeHtml(e.detail)+'</p></div><div class="entry-functions"><p>'+escapeHtml(e.entry)+'</p><p class="entry-source">'+escapeHtml(e.source)+'</p><p>'+escapeHtml(e.helper)+'</p><p class="entry-source">'+escapeHtml(e.helperSource)+'</p></div></section>').join('');
 else if(s.kind==='assignments')graph='<div class="practice-grid">'+s.assignments.map(item=>'<section class="practice-card"><h2>'+escapeHtml(item.title)+'</h2>'+item.sections.map(([label,text])=>'<div class="'+(label==='完成展示'?'practice-result':'practice-section')+'"><h3>'+escapeHtml(label)+'</h3><p>'+escapeHtml(text)+'</p></div>').join('')+'</section>').join('')+'</div>';
 else if(s.kind==='notifyLifecycle')graph=notifyLifecycle();
 else if(s.kind==='speedComparison')graph=speedComparison();
 else if(s.kind==='frameSequence')graph=frameSequence();
 else if(s.kind==='sequence')graph=sequence();
 else if(s.kind==='combo')graph=`<img class="combo-img" src="${s.image}" alt="${escapeHtml(s.title)}的 CommandTable.csv 設定">`;
 else if(s.kind==='video')graph=`<div>${s.links.map(([t,u])=>`<a href="${escapeHtml(u)}" target="_blank" rel="noopener">${escapeHtml(t)}</a>`).join('<br>')}</div>`;
 else graph=`<div class="cards">${s.steps.map((x,i)=>`<article class="card ${i===stepIndex?'active':''}"><h2>${escapeHtml(x.title)}</h2><p>${escapeHtml(x.detail)}</p></article>`).join('')}</div>`;
 $('visual').classList.toggle('phase-images',(s.kind==='timeline'&&!!active.image)||!!s.windowImage);
 if(s.kind==='timeline'&&active.image)graph=`<img class="phase-shot" src="${active.image}" alt="${escapeHtml(active.imageAlt)}">`+graph;
 if(s.windowImage)graph=`<img class="phase-shot" src="${s.windowImage}" alt="${escapeHtml(s.windowImageAlt)}">`+graph;
 if(s.staticOverview)graph+='<div class="combo-flow">'+s.overview.map(([title,detail,montage])=>'<article><h2>'+escapeHtml(title)+'</h2>'+(montage?'<p class="combo-montage">&lt;'+escapeHtml(montage)+'&gt;</p>':'')+'<p>'+escapeHtml(detail)+'</p></article>').join('')+'</div>';
 if(!keepIntro)$('visual').innerHTML=graph+(s.kind==='codeRoute'||s.kind==='notifyLifecycle'||s.kind==='consumeOverview'||s.kind==='bufferWrite'||s.kind==='frameOverview'||s.kind==='speedComparison'||s.kind==='cancelOverview'||s.kind==='comboIntro'||s.kind==='assignments'||s.kind==='bufferEntries'?'':`<div class="caption"><h2>${s.kind==='video'||s.staticOverview?'':`${stepIndex+1} / ${s.steps.length} · `}${escapeHtml(active.title)}</h2><p>${escapeHtml(active.detail)}</p></div>`);
 if(s.kind==='comboIntro')updateComboIntro();
 $('note').textContent=s.note||'';$('location').textContent='程式定位：'+s.location+'｜下列為教學偽碼／摘要';$('code').textContent=active.code;
 if(s.kind==='consumeOverview')$('location').textContent='原始碼節錄：省略日誌及其 SourceId 變數，僅調整換行｜'+s.location;
 if(s.kind==='codeRoute')$('location').textContent=s.location;
 if(s.kind==='notifyLifecycle')$('location').textContent='程式定位：'+s.location;
 if(s.kind==='cancelOverview')$('location').textContent='程式定位：'+s.location;
 if(s.kind==='frameSequence'){$('location').textContent='原始碼節錄｜查證版本 week-08 / 5ec37df｜行號跳號表示省略；底色標示本步關鍵行';let last='';$('code').innerHTML=active.codeLines.map(row=>{let header=row.file!==last?'<span class="code-file">'+escapeHtml(row.file)+'</span>':'';last=row.file;return header+'<span class="code-line '+(row.active?'active':'')+'"><span class="code-num">'+row.line+'</span>'+escapeHtml(row.text)+'</span>';}).join('');}
 $('prev').disabled=page===0;$('next').disabled=page===slideData.length-1;$('back').disabled=stepIndex===0;$('forward').disabled=stepIndex===s.steps.length-1;
}
function gotoPage(n){stop();page=Math.max(0,Math.min(slideData.length-1,n));stepIndex=0;render();history.replaceState(null,'','#slide-'+(page+1))}
function pageFromHash(){const match=location.hash.match(/^#slide-(\d+)$/);const number=match?Number(match[1]):1;return Number.isSafeInteger(number)?number-1:0}
window.addEventListener('hashchange',()=>gotoPage(pageFromHash()));
function tick(){if(stepIndex>=slideData[page].steps.length-1){stop();return}stepIndex++;render();if(stepIndex===slideData[page].steps.length-1)stop()}
function play(){if(slideData[page].steps.length<=1)return;if(['speedComparison','frameOverview','bufferWrite','consumeOverview','notifyLifecycle','codeRoute'].includes(slideData[page].kind))return;if(timer){stop();return}if(stepIndex===slideData[page].steps.length-1)stepIndex=0;render();$('play').textContent='暫停';timer=setInterval(tick,2400)}
function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1600,(innerHeight-56)/900))}
 $('pages').innerHTML=slideData.map((s,i)=>`<option value="${i}">${i+1}｜${escapeHtml(s.source)}</option>`).join('');
 $('pages').onchange=e=>gotoPage(+e.target.value);$('prev').onclick=()=>gotoPage(page-1);$('next').onclick=()=>gotoPage(page+1);
 $('back').onclick=()=>{stop();stepIndex=Math.max(0,stepIndex-1);render()};$('forward').onclick=()=>{stop();tick()};$('steps').onchange=e=>{stop();stepIndex=+e.target.value;render()};$('reset').onclick=()=>{stop();stepIndex=0;render();play()};$('play').onclick=play;
 $('smooth').onchange=e=>document.body.classList.toggle('instant',!e.target.checked);
 onresize=resize;document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});document.addEventListener('keydown',e=>{if(['SELECT','INPUT'].includes(e.target.tagName))return;if(e.key==='ArrowRight')gotoPage(page+1);if(e.key==='ArrowLeft')gotoPage(page-1);if(e.code==='Space'){e.preventDefault();play()}});resize();gotoPage(pageFromHash());
</script></body></html>
