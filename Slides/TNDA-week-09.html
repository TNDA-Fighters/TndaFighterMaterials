olor=\"#FFFFFF\">\u003c/feDropShadow>\u003c/filter>\u003c/defs>\u003ctext x=\"219\" y=\"92\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">進入狀態，嘗試起手\u003c/text>\u003cline x1=\"76\" y1=\"129\" x2=\"362\" y2=\"129\" class=\"messageLine0\" data-et=\"message\" data-id=\"i0\" data-from=\"A\" data-to=\"C\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w09-3-diagram-6-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"489\" y=\"144\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">取合法候選，等權抽一招\u003c/text>\u003cline x1=\"370\" y1=\"181\" x2=\"608\" y2=\"181\" class=\"messageLine0\" data-et=\"message\" data-id=\"i1\" data-from=\"C\" data-to=\"R\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w09-3-diagram-6-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"589\" y=\"196\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">SubmitCommand，Started 記下序列號\u003c/text>\u003cline x1=\"370\" y1=\"233\" x2=\"808\" y2=\"233\" class=\"messageLine0\" data-et=\"message\" data-id=\"i2\" data-from=\"C\" data-to=\"B\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w09-3-diagram-6-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"219\" y=\"248\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">每幀：窗口開啟時最多一次後續\u003c/text>\u003cline x1=\"76\" y1=\"285\" x2=\"362\" y2=\"285\" class=\"messageLine0\" data-et=\"message\" data-id=\"i3\" data-from=\"A\" data-to=\"C\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w09-3-diagram-6-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"589\" y=\"300\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">從 Link 候選抽招再送出\u003c/text>\u003cline x1=\"370\" y1=\"337\" x2=\"808\" y2=\"337\" class=\"messageLine0\" data-et=\"message\" data-id=\"i4\" data-from=\"C\" data-to=\"B\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w09-3-diagram-6-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"448\" y=\"352\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">整組淡出，序列歸零，Task 完成並轉入 Wait\u003c/text>\u003cline x1=\"814\" y1=\"389\" x2=\"82\" y2=\"389\" class=\"messageLine1\" data-et=\"message\" data-id=\"i5\" data-from=\"B\" data-to=\"A\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w09-3-diagram-6-arrowhead)\" style=\"stroke-dasharray: 3, 3; fill: none;\">\u003c/line>\u003c/svg>\u003c/figure>\u003cp>\u003cstrong>對照重點\u003c/strong>：圖 1 回答「為什麼 Controller 不寫 AI 決策」，圖 2 回答「何時接近、何時攻擊」，圖 3 回答「一組攻擊何時才算結束」。\u003c/p>\u003ch4 id=\"reading-44d51e16\">想一想\u003c/h4>\u003cp>\u003cstrong>問題\u003c/strong>：CPU 正在你面前出招，你趁它還沒打完就退到遠處。\u003cstrong>CPU 會立刻停下攻擊、跑過來追你嗎？還是會先把這組攻擊做完？\u003c/strong>\u003c/p>\u003cul>\n\u003cli>\u003cstrong>參考答案\u003c/strong>：會先把已經開始的這組攻擊做完，完整收招後再等 0.8 秒，才重新決定要做什麼。如果那時你仍在遠處，CPU 才會接近。\u003cstrong>你退遠，不會讓 CPU 立刻取消正在進行的攻擊或跳過等待。\u003c/strong> 本題假設 CPU 沒有被打斷，也沒有新的防禦事件。\u003c/li>\n\u003cli>\u003cstrong>判讀重點\u003c/strong>：學生能說出「打完 → 等待 → 再決定」的順序，知道 CPU 不會看到距離改變就立刻換動作。\u003c/li>\n\u003cli>\u003cstrong>可以追問\u003c/strong>：「CPU 等待時，你又跑遠了一點，它會提早結束等待來追你嗎？」答：不會，單純拉開距離不會縮短這次等待。\u003c/li>\n\u003c/ul>\u003ch4 id=\"reading-b9a267ee\">把需求交給 AI 實作\u003c/h4>\u003cp>同示範 1：\u003cstrong>設計先講玩家看到什麼，工程再依「資料與介面 → Init → Tick → End → 接入與測試」提出規格\u003c/strong>，確認後才實作。\u003c/p>\u003ch5 id=\"reading-27ef2dfc\">設計提需求\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># CPU 自主接近與選招\n## 玩家體驗\n開場後 CPU 會主動走向玩家，靠近後出招，有時接成兩段連招；打完一組會停一下，讓玩家有反擊或拉開的空檔。\n\n## 規則\n- 開場準備完成才開始行動。\n- 距離 100 cm 以內算近身，拉開超過 120 cm 才算離開；中間保持原判斷，避免在邊界抖動。\n- 遠處直線走向玩家，最快 400 cm/s，不繞路。\n- 近身時從目前規則允許的招式中隨機挑一招，每招機會相同；新增招式資料後也要能被選到。\n- 一組攻擊最多起手加一次合法接招，不打第三段。\n- 最後一招完整收招後才休息 0.8 秒，玩家走遠也不提早結束。\n- 可用指令暫停或恢復 CPU，正在出的招自然打完。\n\n## 驗收畫面\n接近後出招、停在 100～120 cm 不抖動、出現合法的 X→Y、收招後才休息、暫停與恢復。\n\u003c/code>\u003c/pre>\u003ch5 id=\"reading-22b4aa78\">工程給提示詞\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># 目標\n依附上的「CPU 自主接近與選招」設計需求，用 StateTree 讓 CPU 自主行動；攻擊仍走玩家共用的 SubmitCommand。\n\n## 請依以下順序提出規格\n1. 定義資料與介面：StateTree 根參數、Evaluator 輸出、Task 種類；CPU 要保存哪些攻擊組資料；Controller、StateTree、CPU 角色各自負責什麼。\n2. Init：何時才把控制權交給 StateTree；進入接近、攻擊、等待狀態時各自準備什麼。\n3. Tick：每幀如何更新距離與近身判斷、送出接近輸入、觀察接招窗口並最多送一次後續、推進等待時間。\n4. End：離開狀態或失去控制時，如何撤回移動、還原速度、判定一組攻擊已完整收尾。\n5. 接入與測試：StateTree 資產的狀態與轉移、Controller 與 GameMode 的呼叫時機、候選招式如何沿用共用選招規則；列出對應設計驗收的測試案例。\n\n## 回覆方式\n先閱讀專案中相關的既有程式與資產，再回覆以上五項規格、狀態轉移圖與要修改的檔案，經我確認後再實作。完成後回報每個驗收案例的 PIE 結果，未實測的標明未驗證。\n\u003c/code>\u003c/pre>\u003ch3 id=\"w09-3-7\">課堂示範 3｜CPU 與玩家防禦\u003c/h3>\u003ch4 id=\"reading-73da5290\">設計需求\u003c/h4>\u003cul>\n\u003cli>\u003cstrong>CPU 何時抽\u003c/strong>：CPU 對玩家的\u003cstrong>每個新攻擊序列只觀察一次\u003c/strong>。第一次看見時，若具備正常行動資格、在 \u003cstrong>120 cm\u003c/strong> 內，就以 \u003cstrong>0.5 機率\u003c/strong>抽選（\u003ccode>Roll &lt; Chance\u003c/code>）。不合格或沒抽中也算看過，\u003cstrong>X→Y 屬同一序列，不因第二擊或每幀更新重抽\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>CPU 準備時間\u003c/strong>：抽中後先進入 \u003cstrong>0.2 秒的防禦準備\u003c/strong>，停止接近與起手；\u003cstrong>準備中被打仍正常扣血\u003c/strong>，並取消這次防禦。準備完成才正式防禦，維持到該序列結束；序列與防禦反應都收尾後，才進入原本的 0.8 秒等待。等待中出現新的合格序列可以中斷等待。\u003c/li>\n\u003cli>\u003cstrong>玩家何時算防禦\u003c/strong>：\u003cstrong>每次命中當下\u003c/strong>讀取 MoveAction 的即時值，依雙方位置換算成相對方向，必須是\u003cstrong>後退 4\u003c/strong>。玩家還要有控制、在地面、沒在攻擊、不在受擊反應中。\u003c/li>\n\u003cli>\u003cstrong>方向基準\u003c/strong>：A／D 是畫面左右鍵，4 是遠離對手。1P 在左側時按 A、在右側時按 D；\u003cstrong>換邊後要換鍵\u003c/strong>。按住後退不會立刻播放 \u003ccode>AM_Def\u003c/code>，成立的命中結算才會播放。\u003c/li>\n\u003cli>\u003cstrong>共用結算\u003c/strong>：兩種防禦最後都進同一個命中結算 \u003ccode>TryApplyHit()\u003c/code>：\u003cstrong>不扣 HP、播放 \u003ccode>/Game/Fighting/Anims/AM_Def\u003c/code>\u003c/strong>；不成立就照常扣血與受擊。\u003c/li>\n\u003cli>\u003cstrong>範圍外\u003c/strong>：上下段、不可防禦技、摔技、削血、Guard Meter 都不做。除錯用 \u003ccode>tnda.Debug.CpuAlwaysDef\u003c/code> 保留為強制來源，\u003cstrong>不是正式 AI 決策\u003c/strong>。\u003ccode>DefenseChance=1\u003c/code> 只排除抽選不確定性，不保證資格與準備時間都成立。\u003c/li>\n\u003c/ul>\u003ch4 id=\"reading-285e268\">程式碼增刪異動處\u003c/h4>\u003cp>\u003cstrong>本段要看懂的改動\u003c/strong>：讓玩家與 CPU 用各自的規則決定能否防禦，再交給同一套命中流程結算。依序閱讀：① 命中時詢問被打方能否防禦 → ② CPU 對新攻擊序列抽選一次 → ③ 推進準備、防禦與收尾階段 → ④ 由 StateTree Task 銜接狀態 → ⑤ 玩家在命中當下檢查後退方向與行動資格。對照檔案為 \u003ccode>FightingCharacter.cpp\u003c/code>、\u003ccode>FightingCpuCharacter.h/.cpp\u003c/code>、\u003ccode>FightingCpuStateTree.cpp\u003c/code> 與 \u003ccode>FightingPlayerCharacter.cpp\u003c/code>。\u003c/p>\u003cp>例：1P 在 100 cm 處出右直拳 X，序列號 7。CPU 抽中、準備 0.2 秒後正式防禦，1P 接出 Y 仍是序列 7，兩擊都被擋。\u003c/p>\u003cp id=\"reading-47e16b9a\">\u003cstrong>① 共同結算改成詢問「被打的一方用哪種防禦」\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCharacter.cpp｜TryApplyHit()｜week-08 刪除側\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-removed\">-1226  \u003c/span>\u003cspan class=\"syn-type\">bool\u003c/span> \u003cspan class=\"syn-declaration\">bDefenseHit\u003c/span> = \u003cspan class=\"syn-keyword\">false\u003c/span>;\n\u003cspan class=\"syn-prefix syn-removed\">-1230  \u003c/span>bDefenseHit = PlayerAttacker != \u003cspan class=\"syn-keyword\">nullptr\u003c/span> &amp;&amp; CpuTarget != \u003cspan class=\"syn-keyword\">nullptr\u003c/span>\n\u003cspan class=\"syn-prefix syn-removed\">-1231  \u003c/span>    &amp;&amp; \u003cspan class=\"syn-type\">FCpuAlwaysDefConsoleCommand\u003c/span>::\u003cspan class=\"syn-function\">IsEnabledFor\u003c/span>(\u003cspan class=\"syn-function\">GetWorld\u003c/span>(), *PlayerAttacker, *CpuTarget);\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCharacter.cpp｜GetDefenseSourceForHit()／TryApplyHit()｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 630  \u003c/span>\u003cspan class=\"syn-type\">EFightingDefenseSource\u003c/span> \u003cspan class=\"syn-type\">AFightingCharacter\u003c/span>::\u003cspan class=\"syn-function\">GetDefenseSourceForHit\u003c/span>(\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">AFightingCharacter\u003c/span>&amp; \u003cspan class=\"syn-declaration\">Attacker\u003c/span>) \u003cspan class=\"syn-keyword\">const\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 632  \u003c/span>    \u003cspan class=\"syn-keyword\">return\u003c/span> \u003cspan class=\"syn-type\">EFightingDefenseSource\u003c/span>::None;\n\u003cspan class=\"syn-prefix syn-added\">+1251  \u003c/span>    \u003cspan class=\"syn-type\">EFightingDefenseSource\u003c/span> \u003cspan class=\"syn-declaration\">DefenseSource\u003c/span> = Target-&gt;\u003cspan class=\"syn-function\">GetDefenseSourceForHit\u003c/span>(*this);\n\u003cspan class=\"syn-prefix syn-added\">+1258  \u003c/span>        DefenseSource = \u003cspan class=\"syn-type\">EFightingDefenseSource\u003c/span>::CpuForced;\n\u003cspan class=\"syn-prefix syn-added\">+1261  \u003c/span>    \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">bool\u003c/span> \u003cspan class=\"syn-declaration\">bDefenseHit\u003c/span> = DefenseSource != \u003cspan class=\"syn-type\">EFightingDefenseSource\u003c/span>::None;\n \u003cspan class=\"syn-number\">1262\u003c/span>      \u003cspan class=\"syn-keyword\">if\u003c/span> (\u003cspan class=\"syn-function\">EvaluateHitReactionResult\u003c/span>(bDefenseHit, \u003cspan class=\"syn-number\">0\u003c/span>) == \u003cspan class=\"syn-type\">EHitReactionResult\u003c/span>::Guard)\n\u003cspan class=\"syn-prefix syn-added\">+1264  \u003c/span>        Target-&gt;\u003cspan class=\"syn-function\">OnHitResolved\u003c/span>(DefenseSource, \u003cspan class=\"syn-number\">0\u003c/span>);\n \u003cspan class=\"syn-number\">1265\u003c/span>          Target-&gt;\u003cspan class=\"syn-function\">QueueDefenseReaction\u003c/span>();\n \u003cspan class=\"syn-number\">1273\u003c/span>      \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">int32\u003c/span> \u003cspan class=\"syn-declaration\">Deducted\u003c/span> = \u003cspan class=\"syn-function\">IsValid\u003c/span>(TargetHealth) ? TargetHealth-&gt;\u003cspan class=\"syn-function\">ApplyDamage\u003c/span>(Damage.Damage) : \u003cspan class=\"syn-number\">0\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+1274  \u003c/span>    Target-&gt;\u003cspan class=\"syn-function\">OnHitResolved\u003c/span>(\u003cspan class=\"syn-type\">EFightingDefenseSource\u003c/span>::None, Deducted);\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：week-08 只有除錯指令能讓 CPU 防禦。week-09 在共同父類新增 \u003cstrong>virtual \u003ccode>GetDefenseSourceForHit()\u003c/code>\u003c/strong>，預設不防禦；玩家與 CPU 各自覆寫，回答「這一擊我用哪種防禦」。除錯指令改成覆蓋為 \u003ccode>CpuForced\u003c/code>，仍保留。結算只有一條路：防禦成立就排入防禦反應，不扣血；否則扣血、受擊。兩條路都呼叫 \u003ccode>OnHitResolved()\u003c/code>，\u003cstrong>通知被打方結果\u003c/strong>，CPU 靠它得知準備中挨打。\u003c/p>\u003cblockquote>\n\u003cp>資料：命中候選 → \u003ccode>DefenseSource\u003c/code>（None／PlayerBackward／CpuAI／CpuForced）→ Guard 或扣血 → \u003ccode>OnHitResolved\u003c/code>。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-8c5793ca\">\u003cstrong>② CPU：新序列只抽一次，抽中先準備\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCpuStateTree.cpp｜FFightingCpuEvaluator::Tick()｜week-09 新檔\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+  73  \u003c/span>Data.Cpu-&gt;\u003cspan class=\"syn-function\">UpdateAIDefenseDecision\u003c/span>(\n\u003cspan class=\"syn-prefix syn-added\">+  74  \u003c/span>    Data.bCanAct &amp;&amp; Distance &lt;= Data.DefenseDistance,\n\u003cspan class=\"syn-prefix syn-added\">+  75  \u003c/span>    Data.DefenseReactionTime,\n\u003cspan class=\"syn-prefix syn-added\">+  76  \u003c/span>    Data.DefenseChance);\n\u003cspan class=\"syn-prefix syn-added\">+  77  \u003c/span>Data.bShouldDefensePrepare = Data.Cpu-&gt;\u003cspan class=\"syn-function\">IsAIDefensePreparing\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+  78  \u003c/span>Data.bShouldDefend = Data.Cpu-&gt;\u003cspan class=\"syn-function\">IsAIDefending\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+  79  \u003c/span>Data.bShouldWaitAfterDefense = Data.Cpu-&gt;\u003cspan class=\"syn-function\">IsAIDefenseWaitPending\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+  80  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">bool\u003c/span> \u003cspan class=\"syn-declaration\">bDefenseBlocksNormalAction\u003c/span> = Data.Cpu-&gt;\u003cspan class=\"syn-function\">IsAIDefenseCycleActive\u003c/span>();\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCpuCharacter.h｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 103  \u003c/span>\u003cspan class=\"syn-keyword\">static\u003c/span> \u003cspan class=\"syn-type\">bool\u003c/span> \u003cspan class=\"syn-function\">ConsumeNewDefenseSequence\u003c/span>(\u003cspan class=\"syn-type\">uint64\u003c/span>&amp; \u003cspan class=\"syn-declaration\">LastObservedSequence\u003c/span>, \u003cspan class=\"syn-type\">uint64\u003c/span> \u003cspan class=\"syn-declaration\">CurrentSequence\u003c/span>)\n\u003cspan class=\"syn-prefix syn-added\">+ 110  \u003c/span>\u003cspan class=\"syn-keyword\">static\u003c/span> \u003cspan class=\"syn-type\">bool\u003c/span> \u003cspan class=\"syn-function\">EvaluateDefenseRoll\u003c/span>(\u003cspan class=\"syn-type\">float\u003c/span> \u003cspan class=\"syn-declaration\">Roll\u003c/span>, \u003cspan class=\"syn-type\">float\u003c/span> \u003cspan class=\"syn-declaration\">Chance\u003c/span>) { \u003cspan class=\"syn-keyword\">return\u003c/span> Roll &lt; Chance; }\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCpuCharacter.cpp｜UpdateAIDefenseDecision()｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 111  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">uint64\u003c/span> \u003cspan class=\"syn-declaration\">CurrentSequence\u003c/span> = \u003cspan class=\"syn-function\">IsValid\u003c/span>(Other) ? Other-&gt;\u003cspan class=\"syn-function\">GetAttackSequenceSerial\u003c/span>() : \u003cspan class=\"syn-number\">0\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 113  \u003c/span>\u003cspan class=\"syn-comment\">// 首次觀察是不可回溯的事實；即使舊防禦仍在 Finishing 或 CPU 當下無資格，也要立即消耗新序列。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 114  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">bool\u003c/span> \u003cspan class=\"syn-declaration\">bObservedNewSequence\u003c/span> = \u003cspan class=\"syn-function\">ConsumeNewDefenseSequence\u003c/span>(LastObservedDefenseSequence, CurrentSequence);\n\u003cspan class=\"syn-prefix syn-added\">+ 153  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (!bObservedNewSequence)\n\u003cspan class=\"syn-prefix syn-added\">+ 158  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (!bEligible)\n\u003cspan class=\"syn-prefix syn-added\">+ 162  \u003c/span>AIDefenseRoll = AIRandom.\u003cspan class=\"syn-function\">FRand\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+ 163  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (!\u003cspan class=\"syn-function\">EvaluateDefenseRoll\u003c/span>(AIDefenseRoll, Chance))\n\u003cspan class=\"syn-prefix syn-added\">+ 168  \u003c/span>TrackedDefenseSequence = CurrentSequence;\n\u003cspan class=\"syn-prefix syn-added\">+ 170  \u003c/span>DefenseReadyAt = Now + ReactionTime;\n\u003cspan class=\"syn-prefix syn-added\">+ 172  \u003c/span>AIDefensePhase = ReactionTime &lt;= \u003cspan class=\"syn-number\">0.0f\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 173  \u003c/span>    ? \u003cspan class=\"syn-type\">EFightingCpuDefensePhase\u003c/span>::Defending : \u003cspan class=\"syn-type\">EFightingCpuDefensePhase\u003c/span>::Preparing;\n\u003cspan class=\"syn-prefix syn-added\">+ 174  \u003c/span>\u003cspan class=\"syn-function\">StopAIApproach\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+ 175  \u003c/span>\u003cspan class=\"syn-function\">ReleaseAIAttackGroup\u003c/span>();\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：「一次」的單位是示範 2 建立的\u003cstrong>玩家攻擊序列號\u003c/strong>；X→Y 交接不換號，所以第二擊不會再抽。第 114 行\u003cstrong>不論資格或目前階段，先把新序列標成看過\u003c/strong>，之後才檢查資格（第 158 行）與機率（第 163 行）；不合格的序列錯過就不補抽。抽中時記下要防的序列號與準備期限 \u003ccode>現在 + 0.2\u003c/code>，同時停止接近並放棄 CPU 自己的攻擊組。Evaluator 再把階段轉成 \u003ccode>bShouldDefensePrepare\u003c/code>、\u003ccode>bShouldDefend\u003c/code> 給資產選狀態，第 80 行讓接近與攻擊在防禦期間讓位。\u003c/p>\u003cblockquote>\n\u003cp>資料：玩家 \u003ccode>AttackSequenceSerial\u003c/code> 7 → 首次觀察 → \u003ccode>Roll\u003c/code>（示意值 0.31）&lt; 0.5 → \u003ccode>TrackedDefenseSequence\u003c/code> 7、\u003ccode>DefenseReadyAt\u003c/code>。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-fc009d4f\">\u003cstrong>③ CPU：準備、防禦、收尾三段推進\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCpuCharacter.cpp｜UpdateAIDefenseDecision()／GetDefenseSourceForHit()／OnHitResolved()｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 116  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (AIDefensePhase == \u003cspan class=\"syn-type\">EFightingCpuDefensePhase\u003c/span>::Preparing)\n\u003cspan class=\"syn-prefix syn-added\">+ 118  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (CurrentSequence != TrackedDefenseSequence)\n\u003cspan class=\"syn-prefix syn-added\">+ 120  \u003c/span>        AIDefensePhase = \u003cspan class=\"syn-type\">EFightingCpuDefensePhase\u003c/span>::Finishing;\n\u003cspan class=\"syn-prefix syn-added\">+ 125  \u003c/span>        AIDefenseRemaining = \u003cspan class=\"syn-type\">FMath\u003c/span>::\u003cspan class=\"syn-function\">Max\u003c/span>(\u003cspan class=\"syn-number\">0.0\u003c/span>, DefenseReadyAt - Now);\n\u003cspan class=\"syn-prefix syn-added\">+ 128  \u003c/span>            AIDefensePhase = \u003cspan class=\"syn-type\">EFightingCpuDefensePhase\u003c/span>::Defending;\n\u003cspan class=\"syn-prefix syn-added\">+ 132  \u003c/span>\u003cspan class=\"syn-keyword\">else\u003c/span> \u003cspan class=\"syn-keyword\">if\u003c/span> (AIDefensePhase == \u003cspan class=\"syn-type\">EFightingCpuDefensePhase\u003c/span>::Defending &amp;&amp; CurrentSequence != TrackedDefenseSequence)\n\u003cspan class=\"syn-prefix syn-added\">+ 134  \u003c/span>    AIDefensePhase = \u003cspan class=\"syn-type\">EFightingCpuDefensePhase\u003c/span>::Finishing;\n\u003cspan class=\"syn-prefix syn-added\">+ 139  \u003c/span>    \u003cspan class=\"syn-comment\">// 準備受擊時還要等原序列與受擊反應都收尾；正式防禦則等最後一次 AM_Def 淡出。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 140  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (CurrentSequence != TrackedDefenseSequence &amp;&amp; !\u003cspan class=\"syn-function\">IsInReaction\u003c/span>())\n\u003cspan class=\"syn-prefix syn-added\">+ 142  \u003c/span>        AIDefensePhase = \u003cspan class=\"syn-type\">EFightingCpuDefensePhase\u003c/span>::WaitPending;\n\u003cspan class=\"syn-prefix syn-added\">+ 191  \u003c/span>\u003cspan class=\"syn-keyword\">return\u003c/span> \u003cspan class=\"syn-function\">IsAIDefending\u003c/span>() &amp;&amp; TrackedDefenseSequence != \u003cspan class=\"syn-number\">0\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 192  \u003c/span>    &amp;&amp; Attacker.\u003cspan class=\"syn-function\">GetAttackSequenceSerial\u003c/span>() == TrackedDefenseSequence\n\u003cspan class=\"syn-prefix syn-added\">+ 193  \u003c/span>    ? \u003cspan class=\"syn-type\">EFightingDefenseSource\u003c/span>::CpuAI : \u003cspan class=\"syn-type\">EFightingDefenseSource\u003c/span>::None;\n\u003cspan class=\"syn-prefix syn-added\">+ 199  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (AIDefensePhase == \u003cspan class=\"syn-type\">EFightingCpuDefensePhase\u003c/span>::Preparing &amp;&amp; DefenseSource == \u003cspan class=\"syn-type\">EFightingDefenseSource\u003c/span>::None)\n\u003cspan class=\"syn-prefix syn-added\">+ 201  \u003c/span>    AIDefensePhase = \u003cspan class=\"syn-type\">EFightingCpuDefensePhase\u003c/span>::Finishing;\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：準備期限以 World 遊戲時間比較，暫停不扣時間。期限到且仍是同一序列，才進 \u003ccode>Defending\u003c/code>；\u003cstrong>序列提早結束\u003c/strong>就進 \u003ccode>Finishing\u003c/code>，不會擺出空防。\u003ccode>GetDefenseSourceForHit()\u003c/code> 要求\u003cstrong>正在防禦，而且打過來的就是被追蹤的那個序列\u003c/strong>，準備中一律回傳 None。所以準備中挨打會照常扣血，第 199–201 行再把這次防禦改成收尾。\u003ccode>Finishing\u003c/code> 等序列結束且受擊／防禦反應播完，才變成 \u003ccode>WaitPending\u003c/code>，交給等待狀態。\u003c/p>\u003cblockquote>\n\u003cp>資料：\u003ccode>AIDefensePhase\u003c/code>：None → Preparing → Defending → Finishing → WaitPending → None。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-62f46fd3\">\u003cstrong>④ StateTree：防禦兩態與中斷等待\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCpuStateTree.cpp｜FFightingCpuDefenseTask::Tick()／FFightingCpuWaitTask::Tick()｜week-09 新檔\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 103  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (bPrepare)\n\u003cspan class=\"syn-prefix syn-added\">+ 107  \u003c/span>    \u003cspan class=\"syn-keyword\">case\u003c/span> \u003cspan class=\"syn-type\">EFightingCpuDefensePhase\u003c/span>::Preparing:\n\u003cspan class=\"syn-prefix syn-added\">+ 110  \u003c/span>        \u003cspan class=\"syn-keyword\">return\u003c/span> \u003cspan class=\"syn-type\">EStateTreeRunStatus\u003c/span>::Running;\n\u003cspan class=\"syn-prefix syn-added\">+ 111  \u003c/span>    \u003cspan class=\"syn-keyword\">case\u003c/span> \u003cspan class=\"syn-type\">EFightingCpuDefensePhase\u003c/span>::Defending:\n\u003cspan class=\"syn-prefix syn-added\">+ 112  \u003c/span>        \u003cspan class=\"syn-keyword\">return\u003c/span> \u003cspan class=\"syn-type\">EStateTreeRunStatus\u003c/span>::Succeeded;\n\u003cspan class=\"syn-prefix syn-added\">+ 117  \u003c/span>    default:\n\u003cspan class=\"syn-prefix syn-added\">+ 118  \u003c/span>        \u003cspan class=\"syn-keyword\">return\u003c/span> \u003cspan class=\"syn-type\">EStateTreeRunStatus\u003c/span>::Failed;\n\u003cspan class=\"syn-prefix syn-added\">+ 124  \u003c/span>\u003cspan class=\"syn-keyword\">case\u003c/span> \u003cspan class=\"syn-type\">EFightingCpuDefensePhase\u003c/span>::Defending:\n\u003cspan class=\"syn-prefix syn-added\">+ 125  \u003c/span>\u003cspan class=\"syn-keyword\">case\u003c/span> \u003cspan class=\"syn-type\">EFightingCpuDefensePhase\u003c/span>::Finishing:\n\u003cspan class=\"syn-prefix syn-added\">+ 128  \u003c/span>    \u003cspan class=\"syn-keyword\">return\u003c/span> \u003cspan class=\"syn-type\">EStateTreeRunStatus\u003c/span>::Running;\n\u003cspan class=\"syn-prefix syn-added\">+ 129  \u003c/span>\u003cspan class=\"syn-keyword\">case\u003c/span> \u003cspan class=\"syn-type\">EFightingCpuDefensePhase\u003c/span>::WaitPending:\n\u003cspan class=\"syn-prefix syn-added\">+ 130  \u003c/span>    \u003cspan class=\"syn-keyword\">return\u003c/span> \u003cspan class=\"syn-type\">EStateTreeRunStatus\u003c/span>::Succeeded;\n\u003cspan class=\"syn-prefix syn-added\">+ 229  \u003c/span>\u003cspan class=\"syn-comment\">// Wait 期間觀察到新的合格威脅並抽中後，立即回 Root，讓 DefensePrepare 優先接手。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 230  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (Data.Cpu-&gt;\u003cspan class=\"syn-function\">IsAIDefensePreparing\u003c/span>() || Data.Cpu-&gt;\u003cspan class=\"syn-function\">IsAIDefending\u003c/span>())\n\u003cspan class=\"syn-prefix syn-added\">+ 232  \u003c/span>    \u003cspan class=\"syn-keyword\">return\u003c/span> \u003cspan class=\"syn-type\">EStateTreeRunStatus\u003c/span>::Succeeded;\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：Task 只把角色的防禦階段翻成 StateTree 的執行結果，\u003cstrong>計時與抽選都留在 CPU 角色\u003c/strong>。資產回讀結果：DefensePrepare 有 \u003cstrong>On State Succeeded → Defense\u003c/strong>、\u003cstrong>On State Failed → Wait\u003c/strong> 兩條轉移；Defense 完成到 Wait。準備中挨打時，階段經 \u003ccode>Finishing\u003c/code> 到 \u003ccode>WaitPending\u003c/code>，準備 Task 碰到 default 回傳 Failed，於是走 Failed 那條去 Wait。第 230–232 行讓 Wait 遇到新的防禦決策時提早完成，回 Root 由 DefensePrepare 接手。\u003c/p>\u003cblockquote>\n\u003cp>資料：\u003ccode>AIDefensePhase\u003c/code> → Task 執行結果 → 資產轉移 → 下一個狀態。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-f358f4f7\">\u003cstrong>⑤ 玩家：命中當下才讀方向\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingPlayerCharacter.cpp｜SampleAttackDirections()｜week-08 刪除側（整段搬出成共用取樣）\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-removed\">- 235  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">FVector2D\u003c/span> \u003cspan class=\"syn-declaration\">MoveValue\u003c/span> = Value.Get&lt;\u003cspan class=\"syn-type\"  width=\"120\" height=\"45\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center;\">\u003cspan class=\"nodeLabel \">\u003cp>有控制？\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default  \" id=\"w09-3-diagram-10-flowchart-B-1\" data-look=\"neo\" transform=\"translate(350, 46.5)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-34.5\" width=\"152\" height=\"69\">\u003c/rect>\u003cg class=\"label\" style=\"\" transform=\"translate(-60, -22.5)\">\u003crect>\u003c/rect>\u003cforeignObject width=\"120\" height=\"45\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center;\">\u003cspan class=\"nodeLabel \">\u003cp>在地面？\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default  \" id=\"w09-3-diagram-10-flowchart-C-3\" data-look=\"neo\" transform=\"translate(627, 46.5)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-91\" y=\"-34.5\" width=\"182\" height=\"69\">\u003c/rect>\u003cg class=\"label\" style=\"\" transform=\"translate(-75, -22.5)\">\u003crect>\u003c/rect>\u003cforeignObject width=\"150\" height=\"45\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center;\">\u003cspan class=\"nodeLabel \">\u003cp>沒在攻擊？\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default  \" id=\"w09-3-diagram-10-flowchart-D-5\" data-look=\"neo\" transform=\"translate(919, 46.5)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-91\" y=\"-34.5\" width=\"182\" height=\"69\">\u003c/rect>\u003cg class=\"label\" style=\"\" transform=\"translate(-75, -22.5)\">\u003crect>\u003c/rect>\u003cforeignObject width=\"150\" height=\"45\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center;\">\u003cspan class=\"nodeLabel \">\u003cp>不在受擊？\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default  \" id=\"w09-3-diagram-10-flowchart-E-7\" data-look=\"neo\" transform=\"translate(1238.4453125, 46.5)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-118.4453125\" y=\"-34.5\" width=\"236.890625\" height=\"69\">\u003c/rect>\u003cg class=\"label\" style=\"\" transform=\"translate(-102.4453125, -22.5)\">\u003crect>\u003c/rect>\u003cforeignObject width=\"204.890625\" height=\"45\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center;\">\u003cspan class=\"nodeLabel \">\u003cp>此刻是後退 4？\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default  \" id=\"w09-3-diagram-10-flowchart-F-9\" data-look=\"neo\" transform=\"translate(1542.890625, 46.5)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-34.5\" width=\"152\" height=\"69\">\u003c/rect>\u003cg class=\"label\" style=\"\" transform=\"translate(-60, -22.5)\">\u003crect>\u003c/rect>\u003cforeignObject width=\"120\" height=\"45\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center;\">\u003cspan class=\"nodeLabel \">\u003cp>防禦成立\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003cdefs>\u003cfilter id=\"w09-3-diagram-10-drop-shadow\" height=\"130%\" width=\"130%\">\u003cfeDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\">\u003c/feDropShadow>\u003c/filter>\u003c/defs>\u003cdefs>\u003cfilter id=\"w09-3-diagram-10-drop-shadow-small\" height=\"150%\" width=\"150%\">\u003cfeDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\">\u003c/feDropShadow>\u003c/filter>\u003c/defs>\u003c/svg>\u003c/figure>\u003cp>任一格回答「否」就照常受傷，Combat Debug 顯示對應原因：NoControl、Airborne、Attacking、HitReaction、Direction。\u003c/p>\u003cp>\u003cstrong>對照重點\u003c/strong>：圖 1 回答「兩種防禦在哪裡會合」，圖 2 回答「CPU 為什麼不會每幀重抽」，圖 3 回答「準備時間的意義」，圖 4 回答「玩家防禦失敗時先查什麼」。\u003c/p>\u003ch4 id=\"reading-25c7d9a4\">想一想\u003c/h4>\u003cp>\u003cstrong>問題\u003c/strong>：CPU 已經決定要防禦，但需要 0.2 秒才準備好。你的拳頭在 0.1 秒時就打中了它。\u003cstrong>這一拳擋得住嗎？如果想讓玩家有機會搶先打中，為什麼要保留這段準備時間？\u003c/strong>\u003c/p>\u003cul>\n\u003cli>\u003cstrong>參考答案\u003c/strong>：擋不住，這一拳仍會扣血，CPU 也會取消這次防禦。\u003cstrong>決定要擋，不代表已經來得及擋。\u003c/strong> 準備時間讓玩家有機會在 CPU 防禦生效前打中它；若決定防禦後立刻就能擋，玩家就少了這個機會。\u003c/li>\n\u003cli>\u003cstrong>判讀重點\u003c/strong>：學生能區分「想要防禦」與「已經能擋」，並說明準備時間對玩家有什麼影響。\u003c/li>\n\u003cli>\u003cstrong>可以追問\u003c/strong>：「如果改成準備完成後才打中，而且仍是它正在防的同一組攻擊呢？」答：在正式防禦仍有效時，這一拳會被擋下，不扣血並播放防禦動作。\u003c/li>\n\u003c/ul>\u003ch4 id=\"reading-a476cef4\">把需求交給 AI 實作\u003c/h4>\u003cp>同示範 1：\u003cstrong>設計先講玩家看到什麼，工程再依「資料與介面 → Init → Tick → End → 接入與測試」提出規格\u003c/strong>，確認後才實作。玩家防禦沒有持續狀態，只在命中當下判斷，所以放在「接入」說明。\u003c/p>\u003ch5 id=\"reading-804b67ae\">設計提需求\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># CPU 與玩家防禦\n## 玩家體驗\n玩家按住遠離對手的方向就能擋住攻擊；CPU 偶爾會擋，但需要一點反應時間，玩家出手夠快仍能打中。\n\n## 規則\n- 玩家：被打中的那一刻正按住後退（遠離對手）才算防禦。換邊後要按另一邊；跳起、出招中、受擊中不能防。\n- CPU：玩家每一組攻擊只決定一次要不要防，120 cm 內有一半機會。決定防禦後要 0.2 秒才擋得住，這段時間被打照樣受傷並放棄這次防禦。\n- 同一組 X→Y 不重新決定；防禦維持到這組攻擊結束，之後才休息 0.8 秒。\n- 防禦成功不扣血，播放防禦動作；失敗照常受傷。\n- 不做上下段、摔技、削血、防禦條。\n\n## 驗收畫面\n玩家左右兩側各擋一次、按錯方向受傷、CPU 準備中被打、CPU 擋下整組 X→Y、防禦後才休息。\n\u003c/code>\u003c/pre>\u003ch5 id=\"reading-404379d2\">工程給提示詞\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># 目標\n依附上的「CPU 與玩家防禦」設計需求，加入玩家後退防禦與 CPU 機率防禦；兩者共用既有命中結算。\n\n## 請依以下順序提出規格\n1. 定義資料與介面：防禦來源有哪些；被打方如何回答「這一擊用哪種防禦」與接收結算結果；CPU 要保存哪些序列、期限與階段。\n2. Init：CPU 第一次看到新攻擊序列時如何記錄、抽選，抽中後如何開始準備並停止自己的接近與攻擊。\n3. Tick：CPU 每幀如何推進準備、防禦、收尾各階段；StateTree 如何對應這些階段。\n4. End：準備中挨打、序列結束、防禦反應播完時，如何收尾並交回等待。\n5. 接入與測試：命中結算在哪裡詢問被打方、玩家在命中當下如何取樣方向與檢查資格；新增哪些 StateTree 參數、狀態與轉移；列出對應設計驗收的測試案例。\n\n## 回覆方式\n先閱讀專案中相關的既有程式與資產，再回覆以上五項規格、CPU 防禦階段圖與要修改的檔案，經我確認後再實作。完成後回報每個驗收案例的 PIE 結果，未實測的標明未驗證。\n\u003c/code>\u003c/pre>\u003ch2 id=\"w09-3-8\">課堂實作\u003c/h2>\u003ch3 id=\"w09-3-9\">課堂實作 1｜還沒打完！讓 CPU 追加第二波攻勢\u003c/h3>\u003ch4 id=\"reading-858da991\">題目\u003c/h4>\u003cp>修改 \u003ccode>ST_FightingCpu\u003c/code>，新增 \u003ccode>SecondWave\u003c/code> 狀態。第一波 Attack 結束時，若仍符合攻擊條件，就立刻追加第二波；否則進原本的 Wait。第二波結束後必須等待，不得無限追打。玩家可以靠拉開距離阻止追打。\u003c/p>\u003cp>一波是完整 CPU 攻擊組，可能包含原有的 X→Y；不要更改 Command 的 Link 或把題目改成三段連招。分享畫面展示新增狀態、近處追加及退開不追加，並說明：為什麼只改完成轉移，就能保留共用的選招與攻擊規則？\u003c/p>\u003ch4 id=\"reading-e2af369\">參考答案\u003c/h4>\u003col>\n\u003cli>停止 PIE，先確認 Controller 引用已還原 \u003ccode>ST_FightingCpu\u003c/code>。記下本題開始時樹的結構與設定。可先另存副本備份，課堂操作仍在指定正式樹；不要用還原整個檔案覆蓋其他人的修改。\u003c/li>\n\u003cli>在 Root 下新增同層 \u003ccode>SecondWave\u003c/code>，放在原本 Wait 後面。只新增狀態及「CPU 攻擊組」Task，Cpu 綁 Context → Actor；不要複製原 Attack 的條件與轉移後忘記改去向。SecondWave 不再加新的選招邏輯。\u003c/li>\n\u003cli>選原 Attack。把原本 On State Completed → Wait 改成 \u003cstrong>On State Completed → SecondWave\u003c/strong>；在這條 Transition 加 \u003cstrong>Bool Compare\u003c/strong>：Left 綁 Evaluator「CPU 對手距離與資格」的 \u003ccode>bShouldAttack\u003c/code>（介面顯示 Should Attack），Right = true，Invert = false。\u003c/li>\n\u003cli>在同一個 Attack 的 Transitions 下方新增第二條 \u003cstrong>On State Completed → Wait\u003c/strong>，不加條件。兩條同優先序，追打放前、保底 Wait 放後；不要用 On Tick，否則可能在第一波還沒收尾時就換狀態。\u003c/li>\n\u003cli>SecondWave 只有一條 \u003cstrong>On State Completed → Wait\u003c/strong>。不要指回 Attack 或 SecondWave。原 Wait → Root、正式樹其他六個狀態、Evaluator、參數與 Binding 均保留。\u003c/li>\n\u003cli>Compile、Save，重新 Play。近距離不攻擊 CPU，展示第一組完整結束後接第二組，第二組後出現 Wait；再於第一波時退開，展示直接回 Wait。以 StateTree Debugger 的作用中狀態辨識波次，不能只數拳數或只看 Debug 的 AI 文字，因兩個狀態共用 Task 都可能顯示 Attack。\u003c/li>\n\u003cli>攻擊條件沿用 \u003ccode>bShouldAttack\u003c/code>，不是只檢查「距離 &lt;100」。它含近戰遲滯、行動資格與正式防禦週期等判斷；條件在第一波完成時才用來決定下一個狀態。已有攻擊進行中時的 true 不表示能提前開始下一波。\u003c/li>\n\u003cli>第二題延續本題，\u003cstrong>先保留\u003c/strong>這次變更。若不繼續第二題，展示後把原 Attack 恢復為唯一一條 On State Completed → Wait，刪除自己新增的 SecondWave，Compile、Save。保留本題前已有的工作。\u003c/li>\n\u003c/ol>\u003ch3 id=\"w09-3-10\">課堂實作 2｜它到底打完了沒？加入隨機追打\u003c/h3>\u003ch4 id=\"reading-97782369\">題目\u003c/h4>\u003cp>延續上題，讓 CPU 不再固定追加第二波，新增 \u003ccode>ThirdWave\u003c/code>，最多連續發起三波攻勢。第一波與第二波結束時，都要同時符合攻擊條件且 Random 通過，才進下一波；任一條件不成立就 Wait。第三波結束後一定 Wait。\u003c/p>\u003cp>玩家即使留在近處，也不能事先確定這次打一波、兩波或三波。分享畫面展示新增 State、兩處隨機條件與不同長度的攻勢，並說明：最大三波由什麼結構保證？如果第三波也接回前面的攻擊狀態，會出現什麼問題？\u003c/p>\u003ch4 id=\"reading-72d3e161\">參考答案\u003c/h4>\u003col>\n\u003cli>從上題完成結果開始，停止 PIE。在 Root 下、SecondWave 後新增 ThirdWave；放「CPU 攻擊組」Task，Cpu 綁 Context → Actor。ThirdWave 的唯一完成轉移為 \u003cstrong>On State Completed → Wait\u003c/strong>。\u003c/li>\n\u003cli>原 Attack 的第一條完成轉移仍去 SecondWave。在已有 Bool Compare 後加 \u003cstrong>Random\u003c/strong>（\u003ccode>StateTreeRandomCondition\u003c/code>），Threshold = \u003ccode>0.5\u003c/code>，兩個條件以 \u003cstrong>AND\u003c/strong> 結合。保留第二條無條件完成轉移去 Wait。Random 只放 Transition，不再放目的狀態 Enter Condition 重抽一次。\u003c/li>\n\u003cli>SecondWave 也改為兩條依序檢查的完成轉移：第一條去 ThirdWave，條件是同一 Evaluator 的 \u003ccode>bShouldAttack == true\u003c/code> \u003cstrong>AND\u003c/strong> Random Threshold = \u003ccode>0.5\u003c/code>；第二條無條件去 Wait。相同優先序，條件式在前、保底在後。\u003c/li>\n\u003cli>檢查根選擇順序：保留原 Approach、Attack、DefensePrepare、Defense、Hold、Wait，再放 SecondWave、ThirdWave。原 Hold 是保底，讓追打狀態由指定的完成轉移到達，避免回 Root 時把它們當成一般起手選中。\u003c/li>\n\u003cli>Compile、Save，重新 Play，多觀察幾輪近距離攻勢。0.5 不保證少量展示就剛好出現所有長度，也不是三種長度等機率。假設每一輪都符合攻擊條件、沒有外部打斷，理論上是一波 50%、兩波 25%、三波 25%；這是機率算例，不是實測分布。\u003c/li>\n\u003cli>若現場沒看到三波，可暫把兩處 Threshold 都設 \u003ccode>1\u003c/code>，Compile、Save、重開 PIE，驗證最多三波後回 Wait；再都設 \u003ccode>0\u003c/code> 驗證只打一波。最後改回 \u003ccode>0.5\u003c/code>，Compile、Save。不能把門檻為 1 的展示說成隨機性已驗證。\u003c/li>\n\u003cli>口頭答案核心：只有 Attack → SecondWave → ThirdWave 的單向鏈；第三波無條件去 Wait，沒有回頭邊，所以有三波上限。各波內的合法選招與一次後續仍由共用 Attack Task 管理；原防禦與等待行為保留。\u003c/li>\n\u003cli>展示完成後停止 PIE，原 Attack 恢復為唯一的 On State Completed → Wait，刪除自己新增的 SecondWave、ThirdWave 與對應新增條件；Controller 引用保持 ST_FightingCpu，七個正式參數不變。Compile、Save，再 Play 確認回到一組攻擊後等待的基準。不要刪除既有 DefensePrepare／Defense 或其他人的變更。\u003c/li>\n\u003c/ol>\u003c/article>\u003c/body>\u003c/html>","anchors":["w09-3-4","w09-3-5","reading-6c1ec2c2","reading-b961ad6a","reading-24942daa","reading-43d3612","reading-7d702605","reading-637e1eab","reading-e651053e","w09-3-diagram-1","actor18","root-18","actor17","root-17","actor16","root-16","actor15","root-15","w09-3-diagram-1-computer","w09-3-diagram-1-database","w09-3-diagram-1-clock","w09-3-diagram-1-arrowhead","w09-3-diagram-1-crosshead","w09-3-diagram-1-filled-head","w09-3-diagram-1-sequencenumber","w09-3-diagram-1-solidTopArrowHead","w09-3-diagram-1-solidBottomArrowHead","w09-3-diagram-1-stickTopArrowHead","w09-3-diagram-1-stickBottomArrowHead","w09-3-diagram-1-drop-shadow","w09-3-diagram-2","w09-3-diagram-2_flowchart-v2-pointEnd","w09-3-diagram-2_flowchart-v2-pointStart","w09-3-diagram-2_flowchart-v2-pointEnd-margin","w09-3-diagram-2_flowchart-v2-pointStart-margin","w09-3-diagram-2_flowchart-v2-circleEnd","w09-3-diagram-2_flowchart-v2-circleStart","w09-3-diagram-2_flowchart-v2-circleEnd-margin","w09-3-diagram-2_flowchart-v2-circleStart-margin","w09-3-diagram-2_flowchart-v2-crossEnd","w09-3-diagram-2_flowchart-v2-crossStart","w09-3-diagram-2_flowchart-v2-crossEnd-margin","w09-3-diagram-2_flowchart-v2-crossStart-margin","w09-3-diagram-2-L_A_X_0","w09-3-diagram-2-L_A_B_0","w09-3-diagram-2-L_B_D_0","w09-3-diagram-2-L_B_X_0","w09-3-diagram-2-L_B_E_0","w09-3-diagram-2-L_E_F_0","w09-3-diagram-2-flowchart-A-0","w09-3-diagram-2-flowchart-X-1","w09-3-diagram-2-flowchart-B-3","w09-3-diagram-2-flowchart-D-5","w09-3-diagram-2-flowchart-E-9","w09-3-diagram-2-flowchart-F-11","w09-3-diagram-2-drop-shadow","w09-3-diagram-2-drop-shadow-small","w09-3-diagram-3","w09-3-diagram-3_stateDiagram-barbEnd","w09-3-diagram-3_stateDiagram-barbEnd-margin","w09-3-diagram-3-edge0","w09-3-diagram-3-ed let page=0,stepIndex=0,timer=null,returnPoint=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const names=['開場','攻擊位移與地面推擠','CPU 自主接近與選招','CPU 與玩家防禦','課堂實作','UE5 StateTree 導覽'];
function sectionLabel(s){return (s.demo>0&&s.demo<4?'示範 '+s.demo+'｜':'')+(s.defenseSection??names[s.demo])}
function stop(){clearInterval(timer);timer=null;$('play').textContent='播放'}
function scale(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1600,(innerHeight-56)/900))}
function wrap(s,max=34){let a=[],l='',w=0;for(const c of s){const n=c.charCodeAt(0)>255?2:1;if(w+n>max){a.push(l);l='';w=0}l+=c;w+=n}if(l)a.push(l);return a}
function sequence(s){const xs=s.lanes.map((_,i)=>85+i*(880/(s.lanes.length-1)));return `<svg viewBox="0 0 1050 520" role="img" aria-label="${esc(s.title)}"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#087f8c"/></marker></defs>${s.lanes.map((n,i)=>`<rect x="${xs[i]-80}" y="4" width="160" height="42" rx="6" fill="#e3f1ed"/><text x="${xs[i]}" y="33" text-anchor="middle" font-size="24">${esc(n)}</text><path class="lifeline" d="M${xs[i]} 48V515"/>`).join('')}${s.messages.map((m,i)=>{const a=xs[m.a],b=xs[m.b],y=105+i*(s.messages.length>6?60:70),self=a===b,tx=self?Math.min(a+22,600):(a+b)/2,lines=wrap(m.text,self?36:34);return `<g class="message ${i===stepIndex?'active':''}" data-message="${i}"><rect x="${self?Math.min(a+8,585):Math.max(5,tx-245)}" y="${y-52}" width="${self?440:490}" height="${lines.length>1?52:28}" rx="4" fill="transparent"/><text x="${tx}" y="${y-29}" text-anchor="${self?'start':'middle'}">${lines.map((l,j)=>`<tspan x="${tx}" dy="${j?25:0}">${esc(l)}</tspan>`).join('')}</text><path d="${self?`M${a} ${y}h45v18h-45`:`M${a} ${y}H${b}`}" marker-end="url(#arrow)" ${m.returned?'stroke-dasharray="7 5"':''}/></g>`}).join('')}</svg>`}
function svg(content,label){return `<svg class="sim-svg" viewBox="0 0 1000 380" role="img" aria-label="${esc(label)}">${content}</svg>`}
function label(x,y,text,size=28,anchor='middle',fill='#19364e'){return `<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}" fill="${fill}">${esc(text)}</text>`}
function box(x,y,w,h,fill='#e3f1ed'){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${fill}"/>`}
function fighter(id,x,name,color){return `<g class="actor" id="${id}">${box(x,120,100,150,color)}${label(x+50,100,name,29)}</g>`}
function rootMotion(s,st){const person=(id,x,color)=>`<g class="actor" id="${id}"><rect x="${x}" y="208" width="70" height="112" rx="32" fill="${color}" fill-opacity=".28" stroke="${color}" stroke-width="3"/><circle cx="${x+35}" cy="232" r="12" fill="${color}"/><path d="M${x+35} 244V284 M${x+35} 259L${x+15} 277 M${x+35} 259L${st.pose?x+77:x+55} ${st.pose?253:275} M${x+35} 284L${x+20} 300L${x+10} 318 M${x+35} 284L${x+50} 300L${x+60} 318" stroke="${color}" stroke-width="6" fill="none"/><circle cx="${x+35}" cy="320" r="6" fill="#b84a3d"/></g>`;return svg(`${box(15,10,290,108)}${label(160,47,'動作製作',28)}${label(160,80,'姿勢＋Root Motion',26)}${box(355,10,290,108)}${label(500,47,'Sequence／Montage',26)}${label(500,80,'播放、抽取 Root Motion',26)}${box(695,10,290,108)}${label(840,47,'CharacterMovement',25)}${label(840,80,'套用到角色移動',26)}<path d="M310 64h35m-12-10 12 10-12 10M650 64h35m-12-10 12 10-12 10" stroke="#087f8c" stroke-width="4" fill="none"/>${label(235,180,'week-08｜停用此次 Root Motion',24)}${label(735,180,'week-09｜採用水平 Root Motion',24)}<path d="M50 328H435M535 328H955" stroke="#9fb5bf" stroke-width="4"/>${person('rootOld',150,'#68869b')}${person('rootNew',750,'#087f8c')}<path d="M645 320h140" stroke="#b84a3d" stroke-width="3" stroke-dasharray="5 5"/>${label(235,367,'姿勢播放；Capsule 留在原處',25)}${label(745,367,'Capsule 與角色一起前進',25)}`,s.title)}
function pushExample(s){return `<div class="push-example content"><p class="push-premise">${esc(s.premise)}</p><div class="push-ledger">${s.amounts.map((a,i)=>`<article class="push-amount"><h2>${esc(a.label)}</h2><strong>${esc(a.value)}</strong><p class="push-meaning">${esc(a.meaning)}</p><code>${esc(a.code)}</code><p>${esc(a.detail)}</p></article>${i<2?`<span class="push-operator" aria-hidden="true">${i===0?"−":"="}</span>`:""}`).join("")}</div><aside class="push-limited"><h2>${esc(s.limited.title)}</h2><p>${esc(s.limited.detail)}</p><p>${esc(s.limited.result)}</p></aside><p class="push-note">${esc(s.note)}</p></div>`}
function hysteresis(s,st){const x=v=>100+(v-80)*15;return svg(`${box(x(100),110,x(120)-x(100),110,'#fff0cd')}${label(550,60,'同一位置，結果取決於來路',33)}<path d="M100 220H900" stroke="#799eac" stroke-width="4"/>${[80,100,110,120,130].map(v=>`<path d="M${x(v)} 215v14" stroke="#799eac" stroke-width="3"/>${label(x(v),263,''+v,27)}`).join('')}${label(270,305,'≤100：進入',26)}${label(610,305,'100～120：保留',26)}${label(850,350,'>120：退出',26)}<g id="distanceMarker" class="moving"><circle cx="0" cy="190" r="17" fill="${st.near?'#087f8c':'#b97500'}"/>${label(0,155,'110 cm',28)}</g>${label(490,105,'來路：'+st.history,30)}`,s.title)}
function defenseTime(s,st){const x=t=>110+t*2400;return svg(`${label(500,45,'獨立案例 '+st.branch+'｜'+st.phase,32)}${box(110,115,480,75,'#fff0cd')}${box(590,115,290,75,st.phase==='Finishing'?'#e7ecef':'#d9eee7')}${label(350,160,'準備期：還擋不住',29)}${label(740,160,st.phase==='Finishing'?'已取消，不再生效':'正式防禦',29)}<path d="M110 230H900" stroke="#799eac" stroke-width="4"/>${[0,.1,.2,.3].map(t=>`<path d="M${x(t)} 220v20" stroke="#799eac"/>${label(x(t),277,t+' 秒',27)}`).join('')}<g id="timeMarker" class="moving"><path d="M0 95V245" stroke="#b97500" stroke-width="4"/></g>${label(500,340,st.branch==='A'&&st.time===.1?'0.1 秒挨打：轉 Finishing，不會補防':st.phase==='Guard'?'0.3 秒命中：同序列且已生效 → Guard':'序列 7｜示意 Roll 0.31 < 0.5',28)}`,s.title)}
function defenseCycle(s,st){const phases=['首次觀察','Preparing','Defending','收尾／Wait'];return svg(`${label(500,60,'X → Y 仍是同一個序列 7',34)}${label(500,104,'僅合格且抽中，才進入準備與防禦路徑',26)}${phases.map((p,i)=>box(30+i*245,130,215,85,i===st.phase?'#bce0d8':'#eef2f4')+label(137+i*245,180,p,28)).join('')}${[0,1,2].map(i=>`<path d="M${250+i*245} 172h20m-7-6 7 6-7 6" stroke="#087f8c" stroke-width="3" fill="none"/>`).join('')}${label(500,285,'目前序列：'+st.sequence+'｜每個新序列最多判定一次',30)}${label(500,340,'序列結束，也要等受擊／防禦反應播完',26)}`,s.title)}
function playerGuard(s,st){return svg(`${label(500,45,'命中當下：按 '+st.key,34)}<path d="M50 290H950" stroke="#9fb5bf" stroke-width="4"/>${fighter('guard1',st.swapped?650:250,'1P','#83b6d5')}${fighter('guard2',st.swapped?250:650,'CPU','#eeb995')}${label(500,330,(st.guard?'後退 4 → 可防禦':'前進 6 → 不防禦')+'（假設其他資格成立）',30,'middle',st.guard?'#087f8c':'#aa5342')}<path d="${st.key==='A'?'M550 200H440m12-9-12 9 12 9':'M450 200H560m-12-9 12 9-12 9'}" stroke="#b97500" stroke-width="5" fill="none"/>`,s.title)}
function lessonLink(r){return `<a href="${esc(r.href)}" data-lesson="${esc(r.href.slice(1))}">${esc(r.label)} →</a>`}
function promptConversation(s){return `<div class="conversation-columns content">${s.columns.map(c=>`<article class="conversation-column"><h2>${esc(c.title)}</h2>${c.blocks.map(b=>`<section class="dialogue-block role-${esc(b.tone)}"><div class="dialogue-role">${esc(b.role)}</div><pre class="dialogue-text">${esc(b.text)}</pre></section>`).join('')}</article>`).join('')}</div>`}
function side(s,st){const r=st.lessonRef??s.lessonRefs?.[0];return `<aside class="side">${r&&(s.kind==='sequence'||!s.api)?`<div class="lesson-card"><h2>看完整實作</h2>${lessonLink(r)}${r.hint?`<p>${esc(r.hint)}</p>`:''}</div>`:''}${s.api?s.api.map(a=>`<div class="api-item"><h2>${esc(a[0])}</h2><p>${esc(a[1])}</p></div>`).join(''):''}<p class="note">${esc(s.note??'')}</p></aside>`}
function termGrid(s){return '<div class="term-grid content">'+s.terms.map(t=>'<article class="term-card"><h2>'+esc(t[0])+'</h2><p class="term-purpose">'+esc(t[1])+'</p><p>'+esc(t[2])+'</p></article>').join('')+'</div>'}
function stateOverview(s){return '<div class="state-overview content"><svg viewBox="0 0 1030 520" role="img" aria-label="'+esc(s.title)+'"><defs><marker id="tourArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#087f8c"/></marker></defs>'+s.edges.map(e=>'<path d="M'+e[0]+' '+e[1]+'L'+e[2]+' '+e[3]+'" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#tourArrow)"/>').join('')+s.nodes.map(n=>'<g>'+box(n.x,n.y,n.w,n.h)+label(n.x+n.w/2,n.y+34,n.title,28)+n.lines.map((l,i)=>label(n.x+n.w/2,n.y+70+i*30,l,23)).join('')+'</g>').join('')+'</svg><p>'+esc(s.note)+'</p></div>'}
function lifecycleOverview(s){return `<div class="lifecycle-flow content"><svg viewBox="0 0 1500 520" role="img" aria-label="Init、Tick 迴圈、狀態切換與 End 完整流程圖"><defs><marker id="lifeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#087f8c"/></marker></defs>${label(20,30,"Init｜啟動",27,"start")}${label(430,235,"Tick｜重複更新",25,"start")}${label(1230,220,"End｜停止與清理",25,"start")}${s.flowPaths.map(e=>`<path d="${e.d}" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#lifeArrow)"/>${e.label?label(e.x,e.y,e.label,23):""}`).join("")}${s.flowNodes.map(n=>`<g>${box(n.x,n.y,n.w,n.h)}${n.lines.map((l,i)=>label(n.x+n.w/2,n.y+(n.h-(n.lines.length-1)*32)/2+8+i*32,l,23)).join("")}</g>`).join("")}<path d="M1000 240L1110 310L1000 380L890 310Z" fill="#fff0cd" stroke="#bb8a30" stroke-width="2"/>${label(1000,300,"轉移判定",25)}${label(1000,334,"與狀態選擇",23)}</svg><p>${esc(s.note)}${s.reference?` <a href="${esc(s.reference.href)}" target="_blank" rel="noopener noreferrer">${esc(s.reference.label)} ↗</a>`:""}</p></div>`}
function defenseDecisionTable(s){return `<div class="defense-decision content"><p>${esc(s.premise)}</p><table><thead><tr>${s.headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr><th scope="row">${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table><p class="decision-note">${esc(s.note)}</p></div>`}
function questionTrace(st){return `<div class="trace-layout content"><section class="trace-explanation"><h2>${esc(st.title)}</h2><p>${esc(st.detail)}</p><ul>${st.tracePoints.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></section><section class="trace-code source">${st.traceBlocks.map(b=>`<div class="trace-block"><h3>${esc(b.file)}｜${esc(b.fn)}</h3><pre>${b.lines.map((r,i)=>`${i&&r.n>b.lines[i-1].n+1?'<span class="trace-gap">⋯ 省略其他分支</span>':''}<span class="trace-row ${b.active.includes(r.n)?'active':''}"><span class="trace-num">${r.n}</span><span class="trace-text">${esc(r.text.replace(/^\t{1,2}/,''))}</span></span>`).join('')}</pre></div>`).join('')}</section></div>`}
function practiceTasks(s){return `<div class="practice-tasks content"><div class="task-columns">${s.tasks.map(t=>`<article class="task-card"><h2>課堂實作 ${esc(t.number)}</h2><h3>${esc(t.title)}</h3><p class="task-goal">${esc(t.task)}</p><p class="task-show"><strong>展示：</strong>${esc(t.show)}</p><aside class="task-hint"><strong>簡短提示</strong><p>${esc(t.hint)}</p></aside></article>`).join('')}</div><p class="task-note">${esc(s.note)}</p></div>`}
function view(s){const st=s.steps[stepIndex];if(s.kind==='practiceTasks')return practiceTasks(s);if(st.traceBlocks)return questionTrace(st);if(s.kind==='defenseDecisionTable')return defenseDecisionTable(s);if(s.kind==='lifecycleOverview')return lifecycleOverview(s);if(s.kind==='termGrid')return termGrid(s);if(s.kind==='stateOverview')return stateOverview(s);if(s.kind==='promptConversation')return promptConversation(s);if(s.kind==='pushExample')return pushExample(s);if(s.kind==='sequence')return `<div class="seq-layout content">${sequence(s)}${side(s,st).replace('<p class="note">','<p class="step-detail">'+esc(st.detail)+'</p><p class="note">')}</div>`;if(s.kind==='prompt')return '<pre class="prompt">'+esc(s.prompt)+'</pre>';if(s.kind==='question')return '<div class="question content '+(st.lineBreaks?'question-answer':'')+'"><h2>'+esc(st.title)+'</h2><p>'+esc(st.detail)+'</p></div>';if(s.kind==='cards'){const cards='<div class="cards content">'+s.cards.map(c=>'<article class="card"><h2>'+esc(c[0])+'</h2><p>'+esc(c[1])+'</p></article>').join('')+'</div>';return s.note?'<div class="card-wrap">'+cards+'<p class="note">'+esc(s.note)+'</p></div>':cards}
 const picture=({rootMotion,hysteresis,defenseTime,defenseCycle,playerGuard})[s.kind](s,st);return `<div class="sim-layout content"><div class="sim">${picture}<div class="sim-description"><strong>${esc(st.title)}</strong><p>${esc(st.detail)}</p></div></div>${side(s,st)}</div>`}
function updateShapes(){const s=slideData[page],st=s.steps[stepIndex];if(s.kind==='hysteresis'){$('distanceMarker').style.transform=`translateX(${100+(st.distance-80)*15}px)`;$('distanceMarker').querySelector('text').textContent=st.distance+' cm'}if(s.kind==='defenseTime')$('timeMarker').style.transform=`translateX(${110+st.time*2400}px)`}
function render(){const s=slideData[page];$('stage').className='stage '+(s.kind==='prompt'?'prompt-page ':'')+(s.steps.length===1?'static-page ':'')+($('instant').checked?' instant':'');$('title').textContent=s.title;$('eyebrow').textContent=sectionLabel(s);$('key').textContent=s.key;$('location').innerHTML=`<div class="lesson-index">教案索引：${(s.lessonRefs??[]).map(lessonLink).join('　／　')}</div><div>程式定位：${esc(s.location)}</div>`;$('pageCount').textContent=`${page+1} / ${slideData.length}`;$('pages').value=page;$('prevPage').disabled=page===0;$('nextPage').disabled=page===slideData.length-1;$('steps').innerHTML=s.steps.map((st,i)=>`<option value="${i}">${i+1} / ${s.steps.length}｜${esc(st.title)}</option>`).join('');$('steps').value=stepIndex;$('previous').disabled=stepIndex===0;$('next').disabled=stepIndex===s.steps.length-1;for(const id of ['play','replay','steps'])$(id).disabled=s.steps.length===1;$('compare').hidden=!s.steps[stepIndex].compare;$('back').hidden=!returnPoint;$('controls').hidden=s.steps.length===1&&!s.steps[0].compare&&!returnPoint;
 const prev={};for(const e of $('visual').querySelectorAll('.actor,.moving'))prev[e.id]=e.style.transform;
 $('visual').innerHTML=view(s);for(const e of $('visual').querySelectorAll('.actor,.moving'))if(prev[e.id])e.style.transform=prev[e.id];
 void $('visual').offsetWidth;updateShapes();scale();}
function setStep(n,manual=true){if(manual)stop();stepIndex=Math.max(0,Math.min(n,slideData[page].steps.length-1));render()}
function pageFromHash(){const match=/^#slide-(\d+)$/.exec(location.hash),number=match?Number(match[1]):0;return Number.isSafeInteger(number)&&number>=1&&number<=slideData.length?number-1:0}
function syncSlideHash(replace=false){const hash='#slide-'+(page+1);if(location.hash!==hash)history[replace?'replaceState':'pushState'](null,'',hash)}
function applySlideHash(){stop();page=pageFromHash();stepIndex=0;returnPoint=null;syncSlideHash(true);render()}
function setPage(n){stop();page=Math.max(0,Math.min(n,slideData.length-1));stepIndex=0;returnPoint=null;render();syncSlideHash()}
function navigationTopic(s){
 if(s.demo===0)return '本週主題';
 if(s.demo===4)return '課堂實作';
 if(s.kind==='prompt'||s.kind==='promptConversation')return s.title.startsWith('工程')?'工程提示詞':'設計提需求';
 if(s.kind==='question')return '想一想';
 if(s.kind==='sequence')return '流程與教案索引';
 return ['cards','rootMotion','defenseTime'].includes(s.kind)?'情境需求':'規則與算例';
}
$('pages').innerHTML=[0,1,5,2,3,4].flatMap(demo=>{
 const pages=slideData.map((s,index)=>({s,index})).filter(({s})=>s.demo===demo);
 if(!pages.length)return [];
 const sections=demo===3?[...new Set(pages.map(({s})=>s.defenseSection))]:[null];
 return sections.map(section=>{const items=section?pages.filter(({s})=>s.defenseSection===section):pages;
 return `<optgroup label="${esc(sectionLabel(items[0].s))}">${items.map(({s,index})=>`<option value="${index}">${index+1}｜${navigationTopic(s)}｜${esc(['prompt','promptConversation'].includes(s.kind)?s.title.replace(/^(設計提需求|工程提示詞)：/,'').trim():s.title)}</option>`).join('')}</optgroup>`;});
}).join('');
$('pages').onchange=e=>setPage(+e.target.value);$('prevPage').onclick=()=>setPage(page-1);$('nextPage').onclick=()=>setPage(page+1);$('steps').onchange=e=>setStep(+e.target.value);$('previous').onclick=()=>setStep(stepIndex-1);$('next').onclick=()=>setStep(stepIndex+1);$('replay').onclick=()=>setStep(0);
$('play').onclick=()=>{if(timer){stop();return}if(stepIndex===slideData[page].steps.length-1)setStep(0);$('play').textContent='暫停';timer=setInterval(()=>{if(stepIndex===slideData[page].steps.length-1){stop();return}setStep(stepIndex+1,false)},2400)};
$('instant').onchange=()=>{$('stage').classList.toggle('instant',$('instant').checked)};
let readerReady=null,readerFocus=null,readerAnchor=null;
async function openLesson(anchor,link){
 stop();readerAnchor=anchor;readerFocus=link;
 $('lessonTitle').textContent='完整實作｜'+link.textContent.replace(/\s*→$/,'');
 if(!$('lessonPanel').open)$('lessonPanel').showModal();
 if(!readerReady){readerReady=new Promise(resolve=>{$('lessonFrame').onload=()=>{const doc=$('lessonFrame').contentDocument;doc.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();$('lessonPanel').close()}});resolve()}});$('lessonFrame').srcdoc=embeddedLesson.html}
 await readerReady;if(!$('lessonPanel').open)return;
 const target=$('lessonFrame').contentDocument.getElementById(readerAnchor);
 if(!target)throw Error('找不到內嵌教案段落：'+readerAnchor);
 for(let p=target.parentElement;p;p=p.parentElement)if(p.tagName==='DETAILS')p.open=true;
 target.scrollIntoView({block:'start',behavior:'instant'});
}
$('stage').addEventListener('click',e=>{const link=e.target.closest('a[data-lesson]');if(link){e.preventDefault();openLesson(link.dataset.lesson,link)}});
$('closeLesson').onclick=()=>$('lessonPanel').close();
$('lessonPanel').addEventListener('close',()=>{stop();readerFocus?.focus({preventScroll:true})});
$('compare').onclick=()=>{const t=slideData[page].steps[stepIndex].compare;stop();returnPoint={page,stepIndex};page=t.page-1;stepIndex=t.step;render();syncSlideHash()};$('back').onclick=()=>{stop();({page,stepIndex}=returnPoint);returnPoint=null;render();syncSlideHash()};
addEventListener('hashchange',applySlideHash);
addEventListener('resize',scale);addEventListener('keydown',e=>{if($('lessonPanel').open||/SELECT|BUTTON|INPUT/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();stepIndex<slideData[page].steps.length-1?setStep(stepIndex+1):setPage(page+1)}if(e.key==='ArrowLeft'){e.preventDefault();stepIndex?setStep(stepIndex-1):setPage(page-1)}});addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});applySlideHash();
</script></body></html>
