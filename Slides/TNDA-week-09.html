-start{fill:#000000;}#w09-3-diagram-10 [data-look=\"neo\"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#w09-3-diagram-10 [data-look=\"neo\"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#w09-3-diagram-10 :root{--mermaid-font-family:Microsoft JhengHei;}\n\n\n.paper pre.syntax-pre{background:#f5f7fa;border-color:#cedae5;color:#243746;font-family:Consolas,'Microsoft JhengHei',monospace;font-size:16px;line-height:1.7}\n.paper pre.syntax-pre code.syntax-code{background:none;color:#243746;padding:0;font:inherit}\n.syn-comment{color:#54705b}.syn-type{color:#006b73;font-weight:650}.syn-declaration{color:#174c99;font-weight:750;text-decoration:underline;text-underline-offset:3px}.syn-keyword{color:#8035a3;font-weight:650}.syn-string{color:#a23a26}.syn-number,.syn-constant{color:#865800}.syn-function{color:#795200}.syn-macro{color:#8035a3}.syn-prefix{color:#64717e}.syn-added{color:#1c7051;font-weight:650}.syn-removed{color:#ab3535;font-weight:650}\nhtml{scroll-behavior:auto}body{padding:18px;background:#fff;font-size:18px}article.paper{width:100%;max-width:1160px;margin:0 auto;padding:24px;box-shadow:none;border:0}article.paper [id]{scroll-margin-top:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{overflow-wrap:anywhere}svg{max-width:100%;height:auto}h2{margin-top:1.5em}h2:first-child{margin-top:0}@media(max-width:800px){body{padding:4px}article.paper{padding:12px}}\u003c/style>\u003c/head>\u003cbody>\u003carticle class=\"paper\">\u003ch2 id=\"w09-3-4\">課堂示範\u003c/h2>\u003cp>三項示範都依「設計需求 → 程式碼增刪異動處 → 程式流程圖 → 想一想 → 把需求交給 AI 實作」講解；最後一段分成「設計提需求」與「工程給提示詞」兩段。閱讀時，先看每段要解決的問題，再依編號對照檔案與函式。\u003c/p>\u003cp>程式碼以 week-08 的舊寫法與學生手上的 week-09 專案做增刪對照。\u003cstrong>\u003ccode>-\u003c/code> 是已移除的舊寫法，只需閱讀本教案的節錄，不必在專案中尋找；\u003ccode>+\u003c/code> 是新增內容，沒有符號的是保留內容，可在 week-09 專案中對照。\u003c/strong> 不需要 Git 紀錄或研發歷程。數字是對應版本的檔案行號；定位時以檔名與函式名稱為主，行號為輔。\u003cstrong>程式碼上方的 \u003ccode>//\u003c/code> 註解都是原始碼註解\u003c/strong>，與程式一起節錄。每個區塊只節錄一個檔案，行號跳號表示省略，縮排已去掉共同的前導空白。\u003c/p>\u003ch3 id=\"w09-3-5\">課堂示範 1｜攻擊位移與地面推擠\u003c/h3>\u003ch4 id=\"reading-6c1ec2c2\">設計需求\u003c/h4>\u003cul>\n\u003cli>\u003cstrong>位移來源\u003c/strong>：玩家與 CPU 出招時，都依攻擊 Montage 的 \u003cstrong>Root Motion 水平平移\u003c/strong>前進、後退或側移；沒有根位移的素材就原地出招。week-08 為了避免滑動，起招時對每個 Montage 播放呼叫 \u003ccode>PushDisableRootMotion()\u003c/code>，所以 \u003ccode>AM_Attack_02\u003c/code> 左鉤拳約 90 cm 的前踏不會移動角色。\u003c/li>\n\u003cli>\u003cstrong>只取水平\u003c/strong>：保留出招朝向、重力與地面高度。\u003cstrong>根骨旋轉與 Z 位移一律丟棄\u003c/strong>，面向仍由共同面向規則決定。\u003c/li>\n\u003cli>\u003cstrong>推擠只看身體\u003c/strong>：只有雙方 \u003cstrong>Capsule 實際接觸\u003c/strong>（容差 2 cm）且都在地面時才推擠。推擠與 Hitbox 命中、Damage Active 區間及扣血完全分開，\u003cstrong>沒打中也能推，打中也不額外擊退\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>三種接觸情境\u003c/strong>：\u003cul>\n\u003cli>\u003cstrong>相向主動移動\u003c/strong>：雙方對頂，交給 UE 原生 Pawn Block。\u003c/li>\n\u003cli>\u003cstrong>只有一方往前\u003c/strong>：該方是推動者，被推者讓出多少距離，推動者就跟進多少。\u003c/li>\n\u003cli>\u003cstrong>被推者貼牆\u003c/strong>：被擋住的位移直接捨棄，\u003cstrong>不累積到下一幀補走\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>收尾與交接\u003c/strong>：舊招開始淡出、被外部停止或接成下一招時，\u003cstrong>舊招立即停止貢獻位移\u003c/strong>，並在下一幀清掉殘留速度，避免滑行；新招從自己的播放進度重新計算位移。\u003c/li>\n\u003cli>\u003cstrong>受擊時仍可被推\u003c/strong>：受擊反應中的角色也參與推擠協調。受擊仍鎖住操作，但已成立的被動推擠不會因命中結果中止。\u003c/li>\n\u003cli>\u003cstrong>保留不變\u003c/strong>：出招期間鎖定主動移動與面向、合法選招與預約、命中結算順序。一般行走的雙方互推仍由 1P 既有的 PrePhysics 規則處理，\u003cstrong>只有攻擊參與時才走本次的新協調\u003c/strong>。\u003c/li>\n\u003c/ul>\u003ch4 id=\"reading-b961ad6a\">程式碼增刪異動處\u003c/h4>\u003cp>\u003cstrong>本段要看懂的改動\u003c/strong>：讓攻擊動畫帶動角色，碰到對手時再協調雙方位置，最後處理收招時的殘留位移。依序閱讀：① 允許攻擊位移，但只留水平平移 → ② 在移動後檢查身體接觸 → ③ 只推動尚未走完的距離 → ④ 收招時停止舊招位移。主要檔案為 \u003ccode>FightingCharacter.cpp/.h\u003c/code> 與 \u003ccode>FightingCameraActor.cpp\u003c/code>。\u003c/p>\u003cp>例：1P 在 CPU 面前使出左鉤拳 \u003ccode>AM_Attack_02\u003c/code>，Montage 這一幀要往前踏 3 cm（示意值），CPU 站著不動。\u003c/p>\u003cp id=\"reading-24942daa\">\u003cstrong>① 移除起招禁用，改成移動前只留水平平移\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCharacter.cpp｜StartAttack()｜week-08 刪除側\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-removed\">-1747  \u003c/span>\u003cspan class=\"syn-comment\">// 保留 Sequence 根骨抽取與 AnimBP 模式；僅禁止這次播放把根骨位移累積給 CharacterMovement。\u003c/span>\n\u003cspan class=\"syn-prefix syn-removed\">-1748  \u003c/span>Instance-&gt;\u003cspan class=\"syn-function\">PushDisableRootMotion\u003c/span>();\n\u003cspan class=\"syn-prefix syn-removed\">-1749  \u003c/span>bAttackRootMotionDisabled = \u003cspan class=\"syn-keyword\">true\u003c/span>;\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCharacter.cpp｜BeginPlay()／ConstrainAttackRootMotion()｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 494  \u003c/span>\u003cspan class=\"syn-comment\">// 引擎在 CharacterMovement 的 PerformMovement 中先抽取並轉換 Montage Root Motion，再用它求速度與旋轉；\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 495  \u003c/span>\u003cspan class=\"syn-comment\">// 在此接入原生 post-convert hook，確保該次攻擊位移只進入移動流程一次，且不帶根骨旋轉與高度。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 496  \u003c/span>\u003cspan class=\"syn-function\">GetCharacterMovement\u003c/span>()-&gt;ProcessRootMotionPostConvertToWorld.\u003cspan class=\"syn-function\">BindUObject\u003c/span>(this, &amp;\u003cspan class=\"syn-type\">AFightingCharacter\u003c/span>::ConstrainAttackRootMotion);\n\u003cspan class=\"syn-prefix syn-added\">+2178  \u003c/span>\u003cspan class=\"syn-comment\">// 重要：此函式不負責「啟用」或「抽取」Root Motion。StartAttack 不再於起招時呼叫 PushDisableRootMotion，\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2179  \u003c/span>\u003cspan class=\"syn-comment\">// UE 才會先從 Montage 抽取根位移、轉成 WorldRootMotion，接著由 CharacterMovement 呼叫這個 post-convert hook。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2180  \u003c/span>\u003cspan class=\"syn-comment\">// 1. 這個委派可能收到非攻擊期間或其他 MovementComponent 的轉換結果；只有目前角色的攻擊根位移需要限制。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2181  \u003c/span>\u003cspan class=\"syn-comment\">// 其餘情況原樣回傳，避免改到一般 Root Motion 或外部移動流程。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2182  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (!bIsAttacking || MovementComponent != \u003cspan class=\"syn-function\">GetCharacterMovement\u003c/span>())\n\u003cspan class=\"syn-prefix syn-added\">+2183  \u003c/span>{\n\u003cspan class=\"syn-prefix syn-added\">+2184  \u003c/span>    \u003cspan class=\"syn-keyword\">return\u003c/span> WorldRootMotion;\n\u003cspan class=\"syn-prefix syn-added\">+2185  \u003c/span>}\n\u003cspan class=\"syn-prefix syn-added\">+2186  \u003c/span>\u003cspan class=\"syn-comment\">// 2. 輸入已是 CharacterMovement 轉成世界座標後的位移。保留 XY 平移，移除 Z 與根骨旋轉，\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2187  \u003c/span>\u003cspan class=\"syn-comment\">// 讓場地碰撞、重力及角色面向仍由 CharacterMovement／共同面向規則控制。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2188  \u003c/span>\u003cspan class=\"syn-type\">FTransform\u003c/span> \u003cspan class=\"syn-declaration\">HorizontalMotion\u003c/span> = WorldRootMotion;\n\u003cspan class=\"syn-prefix syn-added\">+2189  \u003c/span>\u003cspan class=\"syn-type\">FVector\u003c/span> \u003cspan class=\"syn-declaration\">Translation\u003c/span> = HorizontalMotion.\u003cspan class=\"syn-function\">GetTranslation\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+2190  \u003c/span>Translation.Z = \u003cspan class=\"syn-number\">0.0\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+2191  \u003c/span>HorizontalMotion.\u003cspan class=\"syn-function\">SetTranslation\u003c/span>(Translation);\n\u003cspan class=\"syn-prefix syn-added\">+2192  \u003c/span>HorizontalMotion.\u003cspan class=\"syn-function\">SetRotation\u003c/span>(\u003cspan class=\"syn-type\">FQuat\u003c/span>::Identity);\n\u003cspan class=\"syn-prefix syn-added\">+2193  \u003c/span>\u003cspan class=\"syn-comment\">// 3. 同一 World 幀可能多次轉換 Root Motion；第一次進入時保存原生移動前的位置並清空需求量，\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2194  \u003c/span>\u003cspan class=\"syn-comment\">// 後續呼叫只累加，供接觸協調計算「本幀原本想走多少」而不重複套用位移。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2195  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">float\u003c/span> \u003cspan class=\"syn-declaration\">WorldTime\u003c/span> = \u003cspan class=\"syn-function\">GetWorld\u003c/span>()-&gt;\u003cspan class=\"syn-function\">GetTimeSeconds\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+2196  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (AttackRootMotionWorldTime != WorldTime)\n\u003cspan class=\"syn-prefix syn-added\">+2197  \u003c/span>{\n\u003cspan class=\"syn-prefix syn-added\">+2198  \u003c/span>    AttackRootMotionWorldTime = WorldTime;\n\u003cspan class=\"syn-prefix syn-added\">+2199  \u003c/span>    AttackRootMotionStart = \u003cspan class=\"syn-function\">GetActorLocation\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+2200  \u003c/span>    AttackRootMotionRequested = \u003cspan class=\"syn-type\">FVector\u003c/span>::ZeroVector;\n\u003cspan class=\"syn-prefix syn-added\">+2201  \u003c/span>}\n\u003cspan class=\"syn-prefix syn-added\">+2202  \u003c/span>AttackRootMotionRequested += Translation;\n\u003cspan class=\"syn-prefix syn-added\">+2203  \u003c/span>\u003cspan class=\"syn-comment\">// 4. 將受限 Transform 交回引擎，仍由原生 CharacterMovement 以 Sweep 處理本角色的實際移動與阻擋。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2204  \u003c/span>\u003cspan class=\"syn-keyword\">return\u003c/span> HorizontalMotion;\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：week-08 在起招當下就讓這次 Montage 播放不輸出根位移。week-09 刪掉這兩行，讓 CharacterMovement 正常取用 Montage 的根位移，再透過 UE 原生的 \u003cstrong>\u003ccode>ProcessRootMotionPostConvertToWorld\u003c/code> 掛鉤\u003c/strong>，在位移轉成世界座標後、真正移動前攔截：\u003cstrong>非攻擊期間原樣放行\u003c/strong>；攻擊期間把 Z 歸零、旋轉改成單位四元數。同一幀第一次進入時記下起點，之後每次累加「這一幀原本想走多少」，給下一步推擠使用。\u003c/p>\u003cblockquote>\n\u003cp>資料：Montage 根位移 → \u003ccode>WorldRootMotion\u003c/code> → \u003ccode>HorizontalMotion\u003c/code>（交回引擎）＋ \u003ccode>AttackRootMotionRequested\u003c/code>（留給推擠）。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-43d3612\">\u003cstrong>② 原生移動之後，協調雙方接觸\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCameraActor.cpp｜Tick()｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+  93  \u003c/span>\u003cspan class=\"syn-comment\">// Root Motion 由 CharacterMovement 本幀產生；先完成接觸協調，構圖與後段命中才讀取相同的世界位置。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  94  \u003c/span>PlayerCharacter-&gt;\u003cspan class=\"syn-function\">ResolveAttackRootMotionPush\u003c/span>();\n   \u003cspan class=\"syn-number\">95\u003c/span>  \u003cspan class=\"syn-function\">ConstrainPlayerToMaxDistance\u003c/span>(PlayerCharacter, CpuCharacter);\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCharacter.cpp｜HandleWorldPostActorTick()｜week-08 刪除側 → week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-removed\">-1262  \u003c/span>\u003cspan class=\"syn-comment\">// 即使較大 UniqueID 的回呼先到，也要先替雙方更新快照，較小 ID 結算時才能讀到同一幀資料。\u003c/span>\n\u003cspan class=\"syn-prefix syn-removed\">-1263  \u003c/span>\u003cspan class=\"syn-function\">EnsureCombatFrame\u003c/span>();\n\u003cspan class=\"syn-prefix syn-removed\">-1267  \u003c/span>    Target-&gt;\u003cspan class=\"syn-function\">EnsureCombatFrame\u003c/span>();\n \u003cspan class=\"syn-number\">1293\u003c/span>  \u003cspan class=\"syn-comment\">// Actor 與 Mesh 更新完才保存雙方本幀端點，避免拿一方的新姿勢對另一方的上一幀姿勢掃掠。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+1297  \u003c/span>    \u003cspan class=\"syn-comment\">// 雙方都訂閱此委派；較大 ID 不能先擷取尚未完成推擠的位置。\u003c/span>\n \u003cspan class=\"syn-number\">1298\u003c/span>      \u003cspan class=\"syn-keyword\">if\u003c/span> (\u003cspan class=\"syn-function\">GetUniqueID\u003c/span>() &gt; Target-&gt;\u003cspan class=\"syn-function\">GetUniqueID\u003c/span>())\n \u003cspan class=\"syn-number\">1299\u003c/span>      {\n \u003cspan class=\"syn-number\">1300\u003c/span>          \u003cspan class=\"syn-keyword\">return\u003c/span>;\n \u003cspan class=\"syn-number\">1301\u003c/span>      }\n\u003cspan class=\"syn-prefix syn-added\">+1302  \u003c/span>    \u003cspan class=\"syn-function\">ResolveAttackRootMotionPush\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+1303  \u003c/span>    Target-&gt;\u003cspan class=\"syn-function\">EnsureCombatFrame\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+1305  \u003c/span>\u003cspan class=\"syn-function\">EnsureCombatFrame\u003c/span>();\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCharacter.cpp｜ResolveAttackRootMotionPush()｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+2209  \u003c/span>\u003cspan class=\"syn-comment\">// 1. 推擠只在同一 World 的既有配對內結算；雙方都可能從攝影機或 World 後段進入，\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2210  \u003c/span>\u003cspan class=\"syn-comment\">// 因此先用共同時間戳把每一對角色限制為每幀一次。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2214  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (LastPairPushWorldTime == WorldTime || Other-&gt;LastPairPushWorldTime == WorldTime) { \u003cspan class=\"syn-keyword\">return\u003c/span>; }\n\u003cspan class=\"syn-prefix syn-added\">+2217  \u003c/span>\u003cspan class=\"syn-comment\">// 2. 一般行走雙方仍由 1P 的 PrePhysics 既有規則處理；有攻擊參與時才在原生移動後協調。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2218  \u003c/span>\u003cspan class=\"syn-comment\">// 雙方必須仍在地面、可參與接觸協調並維持 Pawn Block，否則不代替離地或碰撞規則搬動角色。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2219  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (!bIsAttacking &amp;&amp; !Other-&gt;bIsAttacking) { \u003cspan class=\"syn-keyword\">return\u003c/span>; }\n\u003cspan class=\"syn-prefix syn-added\">+2220  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (!\u003cspan class=\"syn-function\">GetCharacterMovement\u003c/span>()-&gt;\u003cspan class=\"syn-function\">IsMovingOnGround\u003c/span>() || !Other-&gt;\u003cspan class=\"syn-function\">GetCharacterMovement\u003c/span>()-&gt;\u003cspan class=\"syn-function\">IsMovingOnGround\u003c/span>()\n\u003cspan class=\"syn-prefix syn-added\">+2221  \u003c/span>    \u003cspan class=\"syn-comment\">// 受擊反應仍保留操作鎖定，但不能讓命中結果提前中止已成立的被動推擠。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2222  \u003c/span>    || !(\u003cspan class=\"syn-function\">IsInNormalGroundState\u003c/span>() || bIsAttacking || bIsReacting)\n\u003cspan class=\"syn-prefix syn-added\">+2223  \u003c/span>    || !(Other-&gt;\u003cspan class=\"syn-function\">IsInNormalGroundState\u003c/span>() || Other-&gt;bIsAttacking || Other-&gt;bIsReacting)\n\u003cspan class=\"syn-prefix syn-added\">+2224  \u003c/span>    || \u003cspan class=\"syn-function\">GetCapsuleComponent\u003c/span>()-&gt;\u003cspan class=\"syn-function\">GetCollisionResponseToChannel\u003c/span>(\u003cspan class=\"syn-constant\">ECC_Pawn\u003c/span>) != \u003cspan class=\"syn-constant\">ECR_Block\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2225  \u003c/span>    || Other-&gt;\u003cspan class=\"syn-function\">GetCapsuleComponent\u003c/span>()-&gt;\u003cspan class=\"syn-function\">GetCollisionResponseToChannel\u003c/span>(\u003cspan class=\"syn-constant\">ECC_Pawn\u003c/span>) != \u003cspan class=\"syn-constant\">ECR_Block\u003c/span>)\n\u003cspan class=\"syn-prefix syn-added\">+2229  \u003c/span>\u003cspan class=\"syn-comment\">// 3. 只在 Capsule 已接觸或落入 2 cm 數值容差時處理；Direction 是 this 指向對手的水平單位向量。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2230  \u003c/span>\u003cspan class=\"syn-type\">FVector\u003c/span> \u003cspan class=\"syn-declaration\">Direction\u003c/span> = Other-&gt;\u003cspan class=\"syn-function\">GetActorLocation\u003c/span>() - \u003cspan class=\"syn-function\">GetActorLocation\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+2231  \u003c/span>Direction.Z = \u003cspan class=\"syn-number\">0.0f\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+2232  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">float\u003c/span> \u003cspan class=\"syn-declaration\">Distance\u003c/span> = Direction.\u003cspan class=\"syn-function\">Size\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+2233  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">float\u003c/span> \u003cspan class=\"syn-declaration\">ContactDistance\u003c/span> = \u003cspan class=\"syn-function\">GetCapsuleComponent\u003c/span>()-&gt;\u003cspan class=\"syn-function\">GetScaledCapsuleRadius\u003c/span>()\n\u003cspan class=\"syn-prefix syn-added\">+2234  \u003c/span>    + Other-&gt;\u003cspan class=\"syn-function\">GetCapsuleComponent\u003c/span>()-&gt;\u003cspan class=\"syn-function\">GetScaledCapsuleRadius\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+2235  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (Distance &lt;= \u003cspan class=\"syn-constant\">KINDA_SMALL_NUMBER\u003c/span> || Distance &gt; ContactDistance + \u003cspan class=\"syn-number\">2.0f\u003c/span>) { \u003cspan class=\"syn-keyword\">return\u003c/span>; }\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：推擠必須在\u003cstrong>雙方 CharacterMovement 都完成本幀移動之後\u003c/strong>，攝影機構圖與命中快照\u003cstrong>之前\u003c/strong>處理。所以攝影機 Tick 第 94 行和 World 後段第 1302 行都會呼叫它，再由第 2214 行的時間戳\u003cstrong>保證每對角色每幀只算一次\u003c/strong>。week-08 在 World 後段一開始就擷取命中快照；week-09 把快照移到推擠之後，命中判定才會讀到推完的位置。第 2219–2235 行是資格門檻：至少一方在攻擊、雙方都在地面、Pawn 碰撞仍為 Block，而且 Capsule 半徑和加 2 cm 內才算接觸。第 2222–2223 行納入 \u003ccode>bIsReacting\u003c/code>，讓受擊中的角色仍可被推動。\u003c/p>\u003cblockquote>\n\u003cp>資料：雙方 Actor 位置 → \u003ccode>Direction\u003c/code>（水平單位向量）、\u003ccode>Distance\u003c/code> → 是否接觸。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-7d702605\">\u003cstrong>③ 算出推動者，只傳遞尚未走完的差額\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCharacter.cpp｜ResolveAttackRootMotionPush()｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+2237  \u003c/span>\u003cspan class=\"syn-comment\">// 4. 還原雙方本幀的水平移動需求。攻擊者優先使用 ConstrainAttackRootMotion 累加的世界位移；\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2238  \u003c/span>\u003cspan class=\"syn-comment\">// 一般行走者則由最後輸入、最大速度與 DeltaSeconds 推算，沒有本幀有效移動起點就視為零。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2242  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (Character.AttackRootMotionWorldTime == WorldTime) { \u003cspan class=\"syn-keyword\">return\u003c/span> Character.AttackRootMotionRequested; }\n\u003cspan class=\"syn-prefix syn-added\">+2249  \u003c/span>    \u003cspan class=\"syn-keyword\">return\u003c/span> Input.\u003cspan class=\"syn-function\">GetClampedToMaxSize\u003c/span>(\u003cspan class=\"syn-number\">1.0f\u003c/span>) * Character.\u003cspan class=\"syn-function\">GetCharacterMovement\u003c/span>()-&gt;\u003cspan class=\"syn-function\">GetMaxSpeed\u003c/span>() * DeltaSeconds;\n\u003cspan class=\"syn-prefix syn-added\">+2253  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">float\u003c/span> \u003cspan class=\"syn-declaration\">OwnToward\u003c/span> = \u003cspan class=\"syn-type\">FVector\u003c/span>::\u003cspan class=\"syn-function\">DotProduct\u003c/span>(OwnDemand, Direction);\n\u003cspan class=\"syn-prefix syn-added\">+2254  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">float\u003c/span> \u003cspan class=\"syn-declaration\">OtherToward\u003c/span> = \u003cspan class=\"syn-type\">FVector\u003c/span>::\u003cspan class=\"syn-function\">DotProduct\u003c/span>(OtherDemand, -Direction);\n\u003cspan class=\"syn-prefix syn-added\">+2255  \u003c/span>\u003cspan class=\"syn-comment\">// 5. 把需求投影到雙方連線。雙方都朝彼此前進時交給原生 Pawn Block 對頂；雙方都未前進時無位移可傳遞。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2256  \u003c/span>\u003cspan class=\"syn-comment\">// 僅一方主動朝接觸面前進時，該方就是 Pusher，不以角色類型、招式或速度硬編優先權。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2257  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> ((OwnToward &gt; \u003cspan class=\"syn-constant\">KINDA_SMALL_NUMBER\u003c/span> &amp;&amp; OtherToward &gt; \u003cspan class=\"syn-constant\">KINDA_SMALL_NUMBER\u003c/span>)\n\u003cspan class=\"syn-prefix syn-added\">+2258  \u003c/span>    || (OwnToward &lt;= \u003cspan class=\"syn-constant\">KINDA_SMALL_NUMBER\u003c/span> &amp;&amp; OtherToward &lt;= \u003cspan class=\"syn-constant\">KINDA_SMALL_NUMBER\u003c/span>)) { \u003cspan class=\"syn-keyword\">return\u003c/span>; }\n\u003cspan class=\"syn-prefix syn-added\">+2259  \u003c/span>\u003cspan class=\"syn-type\">AFightingCharacter\u003c/span>* \u003cspan class=\"syn-declaration\">Pusher\u003c/span> = OwnToward &gt; \u003cspan class=\"syn-number\">0.0f\u003c/span> ? this : Other;\n\u003cspan class=\"syn-prefix syn-added\">+2265  \u003c/span>\u003cspan class=\"syn-comment\">// 6. 原生移動可能已完成部分需求；只把沿推擠方向尚未完成的差額傳給對手，避免把本幀 Root Motion 套用兩次。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2266  \u003c/span>\u003cspan class=\"syn-type\">FVector\u003c/span> \u003cspan class=\"syn-declaration\">AlreadyMoved\u003c/span> = Pusher-&gt;\u003cspan class=\"syn-function\">GetActorLocation\u003c/span>() - PusherStart;\n\u003cspan class=\"syn-prefix syn-added\">+2268  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">float\u003c/span> \u003cspan class=\"syn-declaration\">PushDistance\u003c/span> = \u003cspan class=\"syn-type\">FVector\u003c/span>::\u003cspan class=\"syn-function\">DotProduct\u003c/span>(PusherDemand - AlreadyMoved, PushDirection);\n\u003cspan class=\"syn-prefix syn-added\">+2270  \u003c/span>\u003cspan class=\"syn-comment\">// 7. 先以 Sweep 移動被推者，牆面或其他阻擋會把實際 Available 截短；完全動不了時，推動者也不再前進。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2273  \u003c/span>Pushed-&gt;\u003cspan class=\"syn-function\">AddActorWorldOffset\u003c/span>(PushDirection * PushDistance, \u003cspan class=\"syn-keyword\">true\u003c/span>, &amp;PushedHit, \u003cspan class=\"syn-type\">ETeleportType\u003c/span>::None);\n\u003cspan class=\"syn-prefix syn-added\">+2274  \u003c/span>\u003cspan class=\"syn-type\">FVector\u003c/span> \u003cspan class=\"syn-declaration\">Available\u003c/span> = Pushed-&gt;\u003cspan class=\"syn-function\">GetActorLocation\u003c/span>() - PushedStart;\n\u003cspan class=\"syn-prefix syn-added\">+2276  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (Available.\u003cspan class=\"syn-function\">IsNearlyZero\u003c/span>()) { \u003cspan class=\"syn-keyword\">return\u003c/span>; }\n\u003cspan class=\"syn-prefix syn-added\">+2277  \u003c/span>\u003cspan class=\"syn-comment\">// 8. 推動者只跟進被推者實際騰出的距離，同樣使用 Sweep。若推動者自身另被阻擋，\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2278  \u003c/span>\u003cspan class=\"syn-comment\">// 將無法跟進的差額從被推者退回，保持 Capsule 接觸且不憑空拉開間距。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2281  \u003c/span>Pusher-&gt;\u003cspan class=\"syn-function\">AddActorWorldOffset\u003c/span>(Available, \u003cspan class=\"syn-keyword\">true\u003c/span>, &amp;PusherHit, \u003cspan class=\"syn-type\">ETeleportType\u003c/span>::None);\n\u003cspan class=\"syn-prefix syn-added\">+2282  \u003c/span>\u003cspan class=\"syn-type\">FVector\u003c/span> \u003cspan class=\"syn-declaration\">Unmatched\u003c/span> = Available - (Pusher-&gt;\u003cspan class=\"syn-function\">GetActorLocation\u003c/span>() - PusherFollowStart);\n\u003cspan class=\"syn-prefix syn-added\">+2287  \u003c/span>    Pushed-&gt;\u003cspan class=\"syn-function\">AddActorWorldOffset\u003c/span>(-Unmatched, \u003cspan class=\"syn-keyword\">true\u003c/span>, &amp;RollbackHit, \u003cspan class=\"syn-type\">ETeleportType\u003c/span>::None);\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：先還原雙方本幀\u003cstrong>想走多少\u003c/strong>：攻擊者用第 ① 步累加的根位移，行走者用輸入 × 最大速度 × DeltaSeconds。投影到雙方連線後，\u003cstrong>兩人都往前就對頂，兩人都沒往前就不處理\u003c/strong>，只有一方往前時那一方才是推動者，不依角色類型或招式強弱決定。原生移動被 CPU 的 Capsule 擋下，1P 實際只走了 0 cm，所以差額是 3 cm。程式先用 \u003cstrong>Sweep\u003c/strong> 把 CPU 推 3 cm；若 CPU 貼牆，\u003ccode>Available\u003c/code> 會被截短甚至為 0，被擋掉的部分\u003cstrong>直接捨棄\u003c/strong>。1P 只跟進 \u003ccode>Available\u003c/code>，自己再被擋時，把 CPU 退回 \u003ccode>Unmatched\u003c/code>，保持兩人貼著。\u003c/p>\u003cblockquote>\n\u003cp>資料：\u003ccode>PusherDemand − AlreadyMoved\u003c/code> → \u003ccode>PushDistance\u003c/code> → 實際騰出 \u003ccode>Available\u003c/code> → 推動者跟進。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-637e1eab\">\u003cstrong>④ 收尾與交接時關閉舊招位移\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCharacter.cpp｜StartAttack() 交接段｜week-08 刪除側 → week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-removed\">-1727  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (bAttackRootMotionDisabled) { Previous-&gt;\u003cspan class=\"syn-function\">PopDisableRootMotion\u003c/span>(); }\n\u003cspan class=\"syn-prefix syn-added\">+1764  \u003c/span>    \u003cspan class=\"syn-comment\">// 舊姿勢可以淡出，舊根位移不能在新招建立後繼續貢獻；禁用計數只屬於這個舊 instance。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+1765  \u003c/span>    \u003cspan class=\"syn-function\">StopCurrentAttackRootMotion\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+1767  \u003c/span>\u003cspan class=\"syn-comment\">// 停止舊 instance 的根位移後，才讓舊通知失效；交接全程不呼叫 FinishAttack。\u003c/span>\n \u003cspan class=\"syn-number\">1768\u003c/span>  AttackInstanceId = \u003cspan class=\"syn-constant\">INDEX_NONE\u003c/span>;\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCharacter.cpp｜HandleAttackBlendingOut()／StopCurrentAttackRootMotion()／UpdateAttack()｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+1844  \u003c/span>\u003cspan class=\"syn-function\">StopCurrentAttackRootMotion\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+2293  \u003c/span>\u003cspan class=\"syn-comment\">// 重要：PushDisableRootMotion 現在是「收尾閥門」，只在淡出、外部 Stop 或接招交接時關閉舊 instance；\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2294  \u003c/span>\u003cspan class=\"syn-comment\">// StartAttack 起招時不呼叫它，所以播放中的新招可以持續把 Root Motion 交給 CharacterMovement。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2295  \u003c/span>\u003cspan class=\"syn-comment\">// 1. 這些收尾路徑可能在相鄰回呼重複進入；旗標讓每個攻擊 instance 只停用一次。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2296  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (!bAttackRootMotionStopped)\n\u003cspan class=\"syn-prefix syn-added\">+2298  \u003c/span>    \u003cspan class=\"syn-comment\">// 2. 只操作目前由角色記錄的 Montage instance。PushDisableRootMotion 的計數屬於該 instance，\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2299  \u003c/span>    \u003cspan class=\"syn-comment\">// 不修改 AnimBP 的 RootMotionMode，也不會停掉新招或其他 Montage 的根位移。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2300  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (\u003cspan class=\"syn-type\">FAnimMontageInstance\u003c/span>* \u003cspan class=\"syn-declaration\">Instance\u003c/span> = \u003cspan class=\"syn-function\">GetAttackInstance\u003c/span>())\n\u003cspan class=\"syn-prefix syn-added\">+2302  \u003c/span>        Instance-&gt;\u003cspan class=\"syn-function\">PushDisableRootMotion\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+2303  \u003c/span>        bAttackRootMotionStopped = \u003cspan class=\"syn-keyword\">true\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+2304  \u003c/span>        \u003cspan class=\"syn-comment\">// 3. 淡出通知可能發生在 CharacterMovement 已抽取本幀根位移之後；標記到下一次 UpdateAttack\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2305  \u003c/span>        \u003cspan class=\"syn-comment\">// 呼叫 StopMovementImmediately，清掉由舊 instance 留下的水平速度，避免收尾或交接後滑行。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2306  \u003c/span>        bClearRootVelocityNextTick = \u003cspan class=\"syn-keyword\">true\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+2313  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (bClearRootVelocityNextTick)\n\u003cspan class=\"syn-prefix syn-added\">+2315  \u003c/span>    \u003cspan class=\"syn-comment\">// Montage 可能在本幀 CharacterMovement 已抽取根位移後才開始淡出；下幀先清 Velocity，避免殘速滑行。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2316  \u003c/span>    \u003cspan class=\"syn-function\">GetCharacterMovement\u003c/span>()-&gt;\u003cspan class=\"syn-function\">StopMovementImmediately\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+2340  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (\u003cspan class=\"syn-type\">FAnimMontageInstance\u003c/span>* \u003cspan class=\"syn-declaration\">Instance\u003c/span> = \u003cspan class=\"syn-function\">GetAttackInstance\u003c/span>(); Instance &amp;&amp; Instance-&gt;\u003cspan class=\"syn-function\">IsStopped\u003c/span>())\n\u003cspan class=\"syn-prefix syn-added\">+2342  \u003c/span>    \u003cspan class=\"syn-comment\">// 外部 Stop 的委派可能尚未派送；先阻止下一次動畫更新從淡出 instance 再抽根位移。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2343  \u003c/span>    \u003cspan class=\"syn-function\">StopCurrentAttackRootMotion\u003c/span>();\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：\u003ccode>PushDisableRootMotion()\u003c/code> 沒有消失，\u003cstrong>角色從「起招就關」改成「收尾才關」\u003c/strong>。三個入口共用同一個閥門：連招交接第 1765 行、自然淡出第 1844 行、外部 Stop 第 2343 行。它只關閉\u003cstrong>舊的那個 Montage instance\u003c/strong>，不改 AnimBP 的 Root Motion 模式，也不影響已開始的新招。淡出可能發生在本幀移動元件已把根位移換成速度之後，所以第 2313–2316 行在下一次 \u003ccode>UpdateAttack()\u003c/code> 清掉殘速。\u003c/p>\u003cblockquote>\n\u003cp>資料：舊 instance 停止貢獻 → 下一幀 \u003ccode>Velocity\u003c/code> 歸零；新 instance 的根位移照常進入第 ① 步。\u003c/p>\n\u003c/blockquote>\u003cp>\u003ccode>FightingCharacter.cpp\u003c/code>、\u003ccode>FightingCameraActor.cpp\u003c/code>｜week-08 舊寫法 → week-09 教材寫法｜原始碼節錄；行號跳號表示省略，長行僅調整換行。\u003c/p>\u003ch4 id=\"reading-e651053e\">程式流程圖\u003c/h4>\u003cp>\u003cstrong>圖 1｜一幀內誰先動？\u003c/strong>（呼叫順序）\u003c/p>\u003cfigure class=\"flow-diagram\">\u003csvg style=\"width:1116.5px;max-width:100%;margin-inline:auto\" id=\"w09-3-diagram-1\" width=\"1116.5\" xmlns=\"http://www.w3.org/2000/svg\" height=\"567\" viewBox=\"-98.5 -10 1116.5 597\" role=\"graphics-document document\" aria-roledescription=\"sequence\">\u003cg>\u003crect x=\"818\" y=\"469\" fill=\"#eaeaea\" stroke=\"#666\" width=\"150\" height=\"77\" name=\"H\" rx=\"6\" ry=\"6\" class=\"actor actor-bottom\" data-look=\"neo\" filter=\"url(#w09-3-diagram-1-drop-shadow)\">\u003c/rect>\u003ctext x=\"893\" y=\"507.5\" dominant-baseline=\"central\" alignment-baseline=\"central\" class=\"actor actor-box\" style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: &quot;Microsoft JhengHei&quot;;\">\u003ctspan x=\"893\" dy=\"0\">命中判定\u003c/tspan>\u003c/text>\u003c/g>\u003cg>\u003crect x=\"578\" y=\"469\" fill=\"#eaeaea\" stroke=\"#666\" width=\"170\" height=\"77\" name=\"K\" rx=\"6\" ry=\"6\" class=\"actor actor-bottom\" data-look=\"neo\" filter=\"url(#w09-3-diagram-1-drop-shadow)\">\u003c/rect>\u003ctext x=\"663\" y=\"507.5\" dominant-baseline=\"central\" alignment-baseline=\"central\" class=\"actor actor-box\" style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: &quot;Microsoft JhengHei&quot;;\">\u003ctspan x=\"66 496117172916782, 2.09271010209987 -1.3753197776503712, 2.1650635094610915 -1.2500000000000089 C2.237416916822313 -1.1246802223496466, 2.299738906453196 -0.9910302842862939, 2.3492315519647673 -0.855050358314182 C2.3987241974763385 -0.71907043234207, 2.4368913078579792 -0.5766288372196986, 2.462019382530518 -0.4341204441673369 C2.487147457203057 -0.29161205111497523, 2.4936698970884197 -0.07235340736123454, 2.5 -1.1714553645825241e-14 C2.5063301029115803 0.07235340736121111, 2.50633010291158 -0.07235340736122292, 2.5 0\" stroke=\"#9370DB\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"0 0\" style=\"\">\u003c/path>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003cdefs>\u003cfilter id=\"w09-3-diagram-3-drop-shadow\" height=\"130%\" width=\"130%\">\u003cfeDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\">\u003c/feDropShadow>\u003c/filter>\u003c/defs>\u003cdefs>\u003cfilter id=\"w09-3-diagram-3-drop-shadow-small\" height=\"150%\" width=\"150%\">\u003cfeDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\">\u003c/feDropShadow>\u003c/filter>\u003c/defs>\u003c/svg>\u003c/figure>\u003cp>\u003cstrong>對照重點\u003c/strong>：圖 1 回答「為什麼推擠不寫在角色 Tick」，圖 2 回答「推擠規則」，圖 3 回答「為什麼連招不會疊加舊招位移」。\u003c/p>\u003ch4 id=\"reading-d11884c6\">想一想\u003c/h4>\u003cp>\u003cstrong>問題\u003c/strong>：你出拳時，角色會往前踏一步。拳頭沒打中 CPU，但身體已經貼到站著不動的 CPU。\u003cstrong>CPU 會被推走嗎？為什麼沒打中，也可能把人推走？\u003c/strong>\u003c/p>\u003cul>\n\u003cli>\u003cstrong>參考答案\u003c/strong>：會，只要 CPU 後方有空間，就可能被往後推。\u003cstrong>拳頭打中人\u003c/strong>與\u003cstrong>身體擠到人\u003c/strong>是分開處理的；這裡是角色往前踏時，用身體把 CPU 擠開，不需要先打中或扣血。\u003c/li>\n\u003cli>\u003cstrong>判讀重點\u003c/strong>：學生能用自己的話說出「打中才扣血，身體碰到也能推人」。\u003c/li>\n\u003cli>\u003cstrong>可以追問\u003c/strong>：「如果 CPU 背後就是牆，完全退不了，你還能把它往前擠嗎？」答：不能；CPU 退不了，你也不能靠這次推擠繼續往前，更不能穿過它。\u003c/li>\n\u003c/ul>\u003ch4 id=\"reading-780d9a1e\">把需求交給 AI 實作\u003c/h4>\u003cp>提示詞分兩段：\u003cstrong>設計先講玩家看到什麼，工程再把它轉成系統規格\u003c/strong>。工程提示詞沿用 week-08 實作題的方法：\u003cstrong>先定義資料與介面，再規劃 Init → Tick → End，最後接入遊戲流程\u003c/strong>，並要求 AI 先回覆規格、經確認後才改程式。\u003c/p>\u003ch5 id=\"reading-c1b844cc\">設計提需求\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># 攻擊位移與地面推擠\n## 玩家體驗\n出招時角色依動畫自然前踏、後退或側移，沒有位移的招式原地出招。出招撞到對手時，會把對手往前推，有身體接觸的重量感。\n\n## 規則\n- 只取水平位移，不改出招朝向，不離開地面。\n- 推擠只看身體接觸，與命中、扣血無關：沒打中也能推，打中也不額外擊退。\n- 只有一方往前：推動對方，對方讓多少就跟多少。\n- 兩人都往前：互相頂住，誰也推不動誰。\n- 對方貼牆：推不動就停，離牆後不補走。\n- 接成下一招或收招時，舊招的位移立即停止，不滑行。\n- 對方正在出招或受擊，也照樣被推，原動作不中斷。\n\n## 驗收畫面\n自由出招、推人、對頂、推到牆邊、X→Y 連招、推擠但沒命中；交換玩家與 CPU 再看一次。\n\u003c/code>\u003c/pre>\u003ch5 id=\"reading-7c040e88\">工程給提示詞\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># 目標\n依附上的「攻擊位移與地面推擠」設計需求，在玩家與 CPU 共用的 AFightingCharacter 加入攻擊 Root Motion 與地面推擠。\n\n## 請依以下順序提出規格\n1. 定義資料與介面：角色要保存哪些本幀位移資料、誰擁有；對外與私有方法各有哪些。\n2. Init：起招時如何讓 Montage 位移進入角色移動，並只保留水平平移。\n3. Tick：每幀在雙方移動完成後，如何判斷接觸、決定推動者、傳遞推擠、處理牆面阻擋。\n4. End：舊招淡出、被停止或接成下一招時，如何停止它的位移與殘留速度。\n5. 接入與測試：在什麼時機、由誰呼叫上述方法，才能讓攝影機與命中讀到推完的位置；列出對應設計驗收的測試案例。\n\n## 回覆方式\n先閱讀專案中相關的既有程式與資產，再回覆以上五項規格與要修改的檔案，經我確認後再實作。完成後回報每個驗收案例的 PIE 結果，未實測的標明未驗證。\n\u003c/code>\u003c/pre>\u003ch3 id=\"w09-3-6\">課堂示範 2｜CPU 自主接近與選招\u003c/h3>\u003ch4 id=\"reading-e6a90ed2\">設計需求\u003c/h4>\u003cul>\n\u003cli>\u003cstrong>啟動時機\u003c/strong>：GameMode 完成 CPU 生成、雙向配對、朝向、相機與 View Target 後，\u003cstrong>才通知 CPU 開場就緒\u003c/strong>；Possess 本身不啟動 AI。手動關閉 AI（\u003ccode>tnda.Debug.CPUAI off\u003c/code>）、CPU 測試移動模式、失去配對或控制都會撤回 AI 控制權。\u003c/li>\n\u003cli>\u003cstrong>距離判斷\u003c/strong>：使用雙方角色中心的\u003cstrong>水平距離\u003c/strong>。\u003cstrong>≤100 cm 進入近戰，&gt;120 cm 才離開\u003c/strong>，100～120 cm 之間保留前一次判斷（遲滯），避免在門檻邊緣來回切換。這不是必中距離，CPU 也沒有額外命中保證。\u003c/li>\n\u003cli>\u003cstrong>接近\u003c/strong>：遠距離時沿目前對手方向 \u003ccode>AddMovementInput()\u003c/code> 直線前進，速度上限 \u003cstrong>400 cm/s\u003c/strong>；加速、重力與碰撞照常。\u003cstrong>不使用 NavMesh、Move To 或感知事件\u003c/strong>，牆邊受阻也不繞路。\u003c/li>\n\u003cli>\u003cstrong>選招\u003c/strong>：近戰時從共用 Command 表\u003cstrong>真正選得到的唯一招式 ID\u003c/strong> 等權抽一招，送進玩家同樣使用的 \u003ccode>SubmitCommand()\u003c/code>。\u003cstrong>不硬編碼 X、Y 招式清單\u003c/strong>，資料表新增合法招式後也會參與抽選。\u003c/li>\n\u003cli>\u003cstrong>一組攻擊\u003c/strong>：起手成功算一組。在接招預約窗口開啟時，\u003cstrong>從本招 Link 允許的招式中最多再抽一次後續\u003c/strong>；被拒絕、過期或受擊都不重試，第二招有 Link 也不送第三招。\u003c/li>\n\u003cli>\u003cstrong>等待\u003c/strong>：最後一招\u003cstrong>完整淡出收尾後\u003c/strong>，才開始 \u003cstrong>0.8 秒遊戲時間\u003c/strong>的等待；等待中對手退開也不提早結束，暫停時不扣時間。到期後重新評估距離與資格。\u003c/li>\n\u003cli>\u003cstrong>責任分工\u003c/strong>：Controller 只管「誰有控制權」；StateTree 資產決定「現在處於哪個狀態」；C++ Task 呼叫角色既有介面；\u003cstrong>播放、命中、傷害仍由共同戰鬥流程負責\u003c/strong>。\u003c/li>\n\u003c/ul>\u003ch4 id=\"reading-3afff57a\">程式碼增刪異動處\u003c/h4>\u003cp>\u003cstrong>本段要看懂的改動\u003c/strong>：讓 CPU 能在開場就緒後，自行接近、選招與等待。依序閱讀：① 確認就緒與控制權後啟動樹 → ② 把距離與行動資格整理成判斷結果 → ③ 需要接近時送出移動輸入 → ④ 從共用招式資料選出合法攻擊 → ⑤ 最多接一次後續，完整收招後才等待。\u003ccode>FightingCpuStateTree.h/.cpp\u003c/code> 是本週新增的檔案，集中放 Evaluator 與各種 Task；本段先看接近與攻擊，防禦留到示範 3。\u003c/p>\u003cp>例：CPU 從 300 cm 外走近 1P，抽到右直拳 X，接招窗口開啟後抽到左鉤拳 Y，打完等待 0.8 秒。\u003c/p>\u003cp id=\"reading-13826f1e\">\u003cstrong>① 開場就緒才交出控制權\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCpuController.cpp｜week-08 刪除側\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-removed\">-   8  \u003c/span>\u003cspan class=\"syn-comment\">// AI 尚未實作完成，Possess 時不可自動啟動 BrainComponent／StateTree 邏輯。\u003c/span>\n\u003cspan class=\"syn-prefix syn-removed\">-  17  \u003c/span>\u003cspan class=\"syn-comment\">// 目前只執行 AAIController 的標準接管流程；AI 行為資產仍刻意留空。\u003c/span>\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingGameMode.cpp｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 169  \u003c/span>\u003cspan class=\"syn-comment\">// Spawn 的 Possess 早於配對／定位；全部開場步驟成功後才允許正式 AI 執行。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 170  \u003c/span>CpuCharacter-&gt;\u003cspan class=\"syn-function\">NotifyMatchReady\u003c/span>();\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCpuCharacter.cpp｜Tick()｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+  46  \u003c/span>\u003cspan class=\"syn-comment\">// 仲裁必須早於測試輸入：Editor 可直接修改 runtime 模式，這裡先停止 AI 並還原速度，\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  47  \u003c/span>\u003cspan class=\"syn-comment\">// 後續 StateTree 與 Movement Tick 才不會混用正式接近和測試模式的輸入。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  48  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (\u003cspan class=\"syn-type\">AFightingCpuController\u003c/span>* \u003cspan class=\"syn-declaration\">CpuController\u003c/span> = Cast&lt;\u003cspan class=\"syn-type\">AFightingCpuController\u003c/span>&gt;(\u003cspan class=\"syn-function\">GetController\u003c/span>()))\n\u003cspan class=\"syn-prefix syn-added\">+  50  \u003c/span>    CpuController-&gt;\u003cspan class=\"syn-function\">RefreshAIControl\u003c/span>();\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCpuController.cpp｜建構子／OnPossess()／RefreshAIControl()｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+  51  \u003c/span>\u003cspan class=\"syn-comment\">// Spawn 的 OnPossess 早於配對與定位；只能由正式就緒仲裁啟動。\u003c/span>\n   \u003cspan class=\"syn-number\">52\u003c/span>  bStartAILogicOnPossess = \u003cspan class=\"syn-keyword\">false\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+  53  \u003c/span>StateTree = CreateDefaultSubobject&lt;\u003cspan class=\"syn-type\">UStateTreeAIComponent\u003c/span>&gt;(\u003cspan class=\"syn-macro\">TEXT\u003c/span>(\u003cspan class=\"syn-string\">\"StateTree\"\u003c/span>));\n\u003cspan class=\"syn-prefix syn-added\">+  54  \u003c/span>StateTree-&gt;\u003cspan class=\"syn-function\">SetStartLogicAutomatically\u003c/span>(\u003cspan class=\"syn-keyword\">false\u003c/span>);\n\u003cspan class=\"syn-prefix syn-added\">+  55  \u003c/span>\u003cspan class=\"syn-comment\">// 將同一元件交給 AAIController 的 Brain 生命週期管理，Blueprint 只配置它的 StateTreeRef。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  56  \u003c/span>BrainComponent = StateTree;\n\u003cspan class=\"syn-prefix syn-added\">+  67  \u003c/span>    \u003cspan class=\"syn-comment\">// 角色先仲裁測試模式，StateTree 才能送輸入，Movement 最後消耗單一來源。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  68  \u003c/span>    StateTree-&gt;\u003cspan class=\"syn-function\">AddTickPrerequisiteActor\u003c/span>(Cpu);\n\u003cspan class=\"syn-prefix syn-added\">+  69  \u003c/span>    Cpu-&gt;\u003cspan class=\"syn-function\">GetCharacterMovement\u003c/span>()-&gt;\u003cspan class=\"syn-function\">AddTickPrerequisiteComponent\u003c/span>(StateTree);\n\u003cspan class=\"syn-prefix syn-added\">+  98  \u003c/span>\u003cspan class=\"syn-comment\">// 1. 只仲裁誰有控制權；攻擊鎖、距離及下一個行動留給執行中的 StateTree 判斷。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 100  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">FName\u003c/span> \u003cspan class=\"syn-declaration\">BlockReason\u003c/span> = \u003cspan class=\"syn-function\">GetAIControlBlockReason\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+ 104  \u003c/span>    \u003cspan class=\"syn-comment\">// 2. 手動 off／測試覆蓋讓已開始的本招正常播完；失去合法控制則走共同取消。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 105  \u003c/span>    \u003cspan class=\"syn-comment\">// NotReady 即使未曾取得 AI 控制也要清理，因為角色可能經共同入口已有攻擊或預約。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 106  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (bOwnsAIControl || (\u003cspan class=\"syn-function\">IsValid\u003c/span>(Cpu) &amp;&amp; bNotReady))\n\u003cspan class=\"syn-prefix syn-added\">+ 108  \u003c/span>        \u003cspan class=\"syn-function\">ReleaseAIControl\u003c/span>(Cpu, bNotReady);\n\u003cspan class=\"syn-prefix syn-added\">+ 116  \u003c/span>\u003cspan class=\"syn-comment\">// 3. 只有「未持有 → 可持有」且 Controller 已 BeginPlay 才啟動一次。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 117  \u003c/span>\u003cspan class=\"syn-comment\">// 持續持有時不重新 StartLogic，避免每幀清掉 Evaluator 遲滯或重設等待期限。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 118  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (!bOwnsAIControl &amp;&amp; \u003cspan class=\"syn-function\">HasActorBegunPlay\u003c/span>())\n\u003cspan class=\"syn-prefix syn-added\">+ 120  \u003c/span>    bOwnsAIControl = \u003cspan class=\"syn-keyword\">true\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 121  \u003c/span>    StateTree-&gt;\u003cspan class=\"syn-function\">StartLogic\u003c/span>();\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：week-08 的 Controller 只是空殼。week-09 由 C++ 建立唯一的 StateTree 元件，並\u003cstrong>關閉自動啟動\u003c/strong>。CPU 每幀 Tick 呼叫 \u003ccode>RefreshAIControl()\u003c/code>：有阻擋原因（\u003ccode>NotReady\u003c/code>、\u003ccode>ManualOff\u003c/code>、\u003ccode>TestMovement\u003c/code>）就釋放控制；\u003cstrong>只有從「未持有」變成「可持有」那一刻才 \u003ccode>StartLogic()\u003c/code> 一次\u003c/strong>，持續持有時不重啟，遲滯記憶與等待期限才不會每幀被清掉。第 68–69 行把執行順序固定為角色仲裁 → StateTree → 移動元件。\u003c/p>\u003cblockquote>\n\u003cp>資料：GameMode 就緒通知 → \u003ccode>bMatchReady\u003c/code> → \u003ccode>BlockReason\u003c/code> → \u003ccode>bOwnsAIControl\u003c/code> → StateTree 開始執行。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-3605756b\">\u003cstrong>② Evaluator 把距離與資格整理成布林輸出\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCpuStateTree.cpp｜FFightingCpuEvaluator::Tick()｜week-09 新檔\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+  54  \u003c/span>\u003cspan class=\"syn-comment\">// 2. 先撤回本幀的行動輸出再檢查對手，避免提早返回時沿用上一幀的接近／攻擊要求。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  55  \u003c/span>Data.bCanAct = \u003cspan class=\"syn-function\">IsValid\u003c/span>(Data.Cpu) &amp;&amp; Data.Cpu-&gt;\u003cspan class=\"syn-function\">IsInNormalGroundState\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+  67  \u003c/span>\u003cspan class=\"syn-comment\">// 3. 高度差不納入距離；空中能否行動已由共同資格處理。中間區間不寫入，才能保留遲滯記憶。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  68  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">float\u003c/span> \u003cspan class=\"syn-declaration\">Distance\u003c/span> = \u003cspan class=\"syn-type\">FVector\u003c/span>::\u003cspan class=\"syn-function\">Dist2D\u003c/span>(Data.Cpu-&gt;\u003cspan class=\"syn-function\">GetActorLocation\u003c/span>(), Opponent-&gt;\u003cspan class=\"syn-function\">GetActorLocation\u003c/span>());\n\u003cspan class=\"syn-prefix syn-added\">+  69  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (Distance &lt;= Data.EnterDistance) { Data.bInMeleeRange = \u003cspan class=\"syn-keyword\">true\u003c/span>; }\n\u003cspan class=\"syn-prefix syn-added\">+  70  \u003c/span>\u003cspan class=\"syn-keyword\">else\u003c/span> \u003cspan class=\"syn-keyword\">if\u003c/span> (Distance &gt; Data.ExitDistance) { Data.bInMeleeRange = \u003cspan class=\"syn-keyword\">false\u003c/span>; }\n\u003cspan class=\"syn-prefix syn-added\">+  81  \u003c/span>Data.bShouldApproach = !bDefenseBlocksNormalAction &amp;&amp; Data.bCanAct &amp;&amp; !Data.bInMeleeRange;\n\u003cspan class=\"syn-prefix syn-added\">+  82  \u003c/span>\u003cspan class=\"syn-comment\">// 4. 已開始的 AI 攻擊組仍須被追蹤到完整收尾，不因攻擊鎖或對手退開而改成接近。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  83  \u003c/span>\u003cspan class=\"syn-comment\">// 這些輸出只供資產選狀態；Evaluator 本身不移動、不送招，也不強制中斷等待 Task。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  84  \u003c/span>Data.bShouldAttack = Data.Cpu-&gt;\u003cspan class=\"syn-function\">IsAIAttackGroupActive\u003c/span>()\n\u003cspan class=\"syn-prefix syn-added\">+  85  \u003c/span>    || (!bDefenseBlocksNormalAction &amp;&amp; Data.bCanAct &amp;&amp; Data.bInMeleeRange);\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：\u003ccode>Dist2D\u003c/code> 只比水平距離。第 69–70 行\u003cstrong>只在跨過門檻時才寫入\u003c/strong>，100～120 cm 不改，所以 CPU 一旦進入近戰，對手退到 110 cm 仍算近戰。Evaluator \u003cstrong>不移動、不送招\u003c/strong>，只產生 \u003ccode>bShouldApproach\u003c/code>、\u003ccode>bShouldAttack\u003c/code> 等輸出，交給資產的 Enter Condition 選狀態。第 84 行讓\u003cstrong>已開始的攻擊組持續被視為「應攻擊」\u003c/strong>，直到完整收尾，不會因對手退開就改成追趕。七個門檻值是 \u003ccode>ST_FightingCpu\u003c/code> 的根參數：EnterDistance 100、ExitDistance 120、ApproachSpeed 400、WaitDuration 0.8，另三個屬於示範 3。\u003c/p>\u003cblockquote>\n\u003cp>資料：雙方位置 → \u003ccode>Distance\u003c/code> → \u003ccode>bInMeleeRange\u003c/code>（含前次記憶）→ \u003ccode>bShouldApproach\u003c/code>／\u003ccode>bShouldAttack\u003c/code>。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-3f31a219\">\u003cstrong>③ 接近 Task：只送移動意圖\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCpuStateTree.cpp｜FFightingCpuMoveTask::Tick()｜week-09 新檔\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 153  \u003c/span>\u003cspan class=\"syn-comment\">// 1. 接近意圖與節點用途不符時返回選擇入口；Hold 恢復正常資格時也必須放行，\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 154  \u003c/span>\u003cspan class=\"syn-comment\">// 即使已在近戰、不需要接近，仍要讓 Root 有機會選到 Attack。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 155  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (Data.bShouldApproach != bApproach || (!bApproach &amp;&amp; Data.bCanAct &amp;&amp; Data.bParametersValid))\n\u003cspan class=\"syn-prefix syn-added\">+ 157  \u003c/span>    Data.Cpu-&gt;\u003cspan class=\"syn-function\">StopAIApproach\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+ 158  \u003c/span>    \u003cspan class=\"syn-keyword\">return\u003c/span> \u003cspan class=\"syn-type\">EStateTreeRunStatus\u003c/span>::Succeeded;\n\u003cspan class=\"syn-prefix syn-added\">+ 160  \u003c/span>\u003cspan class=\"syn-comment\">// 2. 仍留在本節點時才維持單幀動作與觀察值；Succeeded 之後的去向由資產轉移決定。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 163  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (bApproach) { Data.Cpu-&gt;\u003cspan class=\"syn-function\">ApplyAIApproach\u003c/span>(Data.ApproachSpeed); }\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCpuCharacter.cpp｜ApplyAIApproach()｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 208  \u003c/span>\u003cspan class=\"syn-comment\">// 1. Task 選中接近後仍重新檢查控制與行動資格，避免選擇到實際送輸入之間的變化漏過檢查。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 211  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (!CpuController || !CpuController-&gt;\u003cspan class=\"syn-function\">IsAIEnabled\u003c/span>() || !bMatchReady || \u003cspan class=\"syn-function\">IsTestMovementEnabled\u003c/span>()\n\u003cspan class=\"syn-prefix syn-added\">+ 212  \u003c/span>    || !\u003cspan class=\"syn-function\">IsInNormalGroundState\u003c/span>() || !\u003cspan class=\"syn-type\">FMath\u003c/span>::\u003cspan class=\"syn-function\">IsFinite\u003c/span>(Speed) || Speed &lt;= \u003cspan class=\"syn-number\">0.0f\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 213  \u003c/span>    || !\u003cspan class=\"syn-function\">TryGetOpponentDirection\u003c/span>(Direction))\n\u003cspan class=\"syn-prefix syn-added\">+ 218  \u003c/span>\u003cspan class=\"syn-comment\">// 2. 只在首次接管速度時保存原值；每幀覆寫都重新保存會把 AI 速度誤當成還原基準。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 219  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (!PreviousMaxWalkSpeed.\u003cspan class=\"syn-function\">IsSet\u003c/span>()) { PreviousMaxWalkSpeed = \u003cspan class=\"syn-function\">GetCharacterMovement\u003c/span>()-&gt;MaxWalkSpeed; }\n\u003cspan class=\"syn-prefix syn-added\">+ 220  \u003c/span>\u003cspan class=\"syn-function\">GetCharacterMovement\u003c/span>()-&gt;MaxWalkSpeed = Speed;\n\u003cspan class=\"syn-prefix syn-added\">+ 221  \u003c/span>\u003cspan class=\"syn-comment\">// 3. 輸入留給本幀稍後的 Movement 消耗，加速、碰撞及重力仍由共同移動流程處理。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 222  \u003c/span>\u003cspan class=\"syn-function\">AddMovementInput\u003c/span>(Direction);\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：同一個 Task 被 Approach（\u003ccode>bApproach=true\u003c/code>）與 Hold（\u003ccode>bApproach=false\u003c/code>）兩個狀態共用，本次已由 MCP 回讀兩者的設定值。意圖與用途不符時回傳 Succeeded，讓資產回 Root 重選。真正送輸入前，角色第 211 行\u003cstrong>再檢查一次\u003c/strong>控制與資格，避免 StateTree 選擇後條件已改變。速度只在第一次接管時保存原值，\u003ccode>StopAIApproach()\u003c/code> 還原速度並撤回輸入，\u003cstrong>但不把 Velocity 歸零\u003c/strong>，推擠、煞車與重力照常。\u003c/p>\u003cblockquote>\n\u003cp>資料：\u003ccode>ApproachSpeed\u003c/code> 400 → \u003ccode>MaxWalkSpeed\u003c/code>；對手方向 → \u003ccode>AddMovementInput\u003c/code> → 本幀移動元件消耗。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-51b1635\">\u003cstrong>④ 攻擊 Task：從共用規則抽起手\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCpuStateTree.cpp｜FFightingCpuAttackTask::EnterState()｜week-09 新檔\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 182  \u003c/span>\u003cspan class=\"syn-comment\">// 2. 先撤回追趕，再嘗試新起手或接回既有攻擊組；此處只呼叫一次，不輪流試其他候選。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 183  \u003c/span>Data.Cpu-&gt;\u003cspan class=\"syn-function\">StopAIApproach\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+ 184  \u003c/span>Data.bStarted = Data.Cpu-&gt;\u003cspan class=\"syn-function\">TryStartAIAttack\u003c/span>() == \u003cspan class=\"syn-type\">EFightingCommandResult\u003c/span>::Started;\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCpuCharacter.cpp｜TryStartAIAttack()｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 266  \u003c/span>\u003cspan class=\"syn-comment\">// 1. Task 重選只接回尚未結束的同一組；不得重送起手，也不得重設該組的一次後續機會。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 267  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (\u003cspan class=\"syn-function\">IsAIAttackGroupActive\u003c/span>()) { \u003cspan class=\"syn-keyword\">return\u003c/span> \u003cspan class=\"syn-type\">EFightingCommandResult\u003c/span>::Started; }\n\u003cspan class=\"syn-prefix syn-added\">+ 277  \u003c/span>\u003cspan class=\"syn-comment\">// 3. 決策當下才查最新資料。Reader 已完成 selector 仲裁與 ID 去重，對索引抽選即可維持等權。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 279  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (!\u003cspan class=\"syn-type\">UTndaCommandReader\u003c/span>::\u003cspan class=\"syn-function\">GetCommandCandidates\u003c/span>(\u003cspan class=\"syn-function\">GetGameInstance\u003c/span>(), Candidates) || Candidates.\u003cspan class=\"syn-function\">IsEmpty\u003c/span>())\n\u003cspan class=\"syn-prefix syn-added\">+ 283  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">FTndaCommand\u003c/span>&amp; \u003cspan class=\"syn-declaration\">Selected\u003c/span> = Candidates[AIRandom.\u003cspan class=\"syn-function\">RandRange\u003c/span>(\u003cspan class=\"syn-number\">0\u003c/span>, Candidates.\u003cspan class=\"syn-function\">Num\u003c/span>() - \u003cspan class=\"syn-number\">1\u003c/span>)];\n\u003cspan class=\"syn-prefix syn-added\">+ 285  \u003c/span>\u003cspan class=\"syn-comment\">// 4. 只交出招式語意與最小方向集合，由玩家／CPU 共用入口再次驗證並開始正式播放。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 287  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">EFightingCommandResult\u003c/span> \u003cspan class=\"syn-declaration\">Result\u003c/span> = \u003cspan class=\"syn-function\">SubmitCommand\u003c/span>(Selected.Attack, Directions);\n\u003cspan class=\"syn-prefix syn-added\">+ 288  \u003c/span>\u003cspan class=\"syn-comment\">// 5. 成功播放才認領共同攻擊序列；後續交接與最後淡出沿用此身分，不拿招式 ID 當播放身分。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 289  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (Result == \u003cspan class=\"syn-type\">EFightingCommandResult\u003c/span>::Started)\n\u003cspan class=\"syn-prefix syn-added\">+ 291  \u003c/span>    AIAttackSequence = \u003cspan class=\"syn-function\">GetAttackSequenceSerial\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+ 292  \u003c/span>    bAIFollowupAttempted = \u003cspan class=\"syn-keyword\">false\u003c/span>;\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>TndaCommandReader.cpp｜GetCommandCandidates()｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 130  \u003c/span>\u003cspan class=\"syn-comment\">// 查詢過程只使用值副本；不讓 AI 持有失效／重新準備後的 Reader 元素指標。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 131  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">TArray\u003c/span>&lt;\u003cspan class=\"syn-type\">FTndaCommand\u003c/span>&gt; \u003cspan class=\"syn-declaration\">PreparedCommands\u003c/span> = Reader-&gt;Commands;\n\u003cspan class=\"syn-prefix syn-added\">+ 134  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (Link &amp;&amp; !Link-&gt;\u003cspan class=\"syn-function\">Contains\u003c/span>(Candidate.Id)) { \u003cspan class=\"syn-keyword\">continue\u003c/span>; }\n\u003cspan class=\"syn-prefix syn-added\">+ 137  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (\u003cspan class=\"syn-function\">SelectCommand\u003c/span>(GameInstance, Candidate.Attack, Directions, Link, Selected) &amp;&amp; Selected.Id == Candidate.Id)\n\u003cspan class=\"syn-prefix syn-added\">+ 139  \u003c/span>        \u003cspan class=\"syn-comment\">// 原表 ID 唯一，逐列最多加入一次，不因可對應的其他方向組合而增加權重。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 140  \u003c/span>        OutCandidates.\u003cspan class=\"syn-function\">Add\u003c/span>(\u003cspan class=\"syn-function\">MoveTemp\u003c/span>(Selected));\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：\u003ccode>GetCommandCandidates()\u003c/code> 逐列拿表中的 Attack 與 Direction，\u003cstrong>反問玩家用的同一套 \u003ccode>SelectCommand()\u003c/code> 會不會選中這一列\u003c/strong>，只有選回同一 ID 才算候選。因此候選清單跟著資料表與勝出規則變動，每個 ID 只出現一次，抽選才會等權。CPU 抽完後\u003cstrong>仍走 \u003ccode>SubmitCommand()\u003c/code>\u003c/strong>，資格、播放與 Notify 都和玩家相同。只有 \u003ccode>Started\u003c/code> 才記下共同攻擊序列編號；StateTree 重選時，第 267 行讓同一組直接接回，\u003cstrong>不重送起手，也不重置後續機會\u003c/strong>。\u003c/p>\u003cblockquote>\n\u003cp>資料：Command 表 → \u003ccode>Candidates\u003c/code>（唯一 ID）→ \u003ccode>Selected\u003c/code> → \u003ccode>SubmitCommand\u003c/code> → \u003ccode>AIAttackSequence\u003c/code>。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-639f050b\">\u003cstrong>⑤ 每組最多一次後續，完整收尾後才等待\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCharacter.cpp｜StartAttack()｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+1790  \u003c/span>\u003cspan class=\"syn-comment\">// 6. 攻擊序列代表整組連招：普通起手才換號，交接沿用，讓 CPU 能追蹤同一組是否收尾。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+1791  \u003c/span>\u003cspan class=\"syn-comment\">// 零保留給「沒有有效攻擊」，溢位後也必須跳過。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+1792  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (!bHandoff)\n\u003cspan class=\"syn-prefix syn-added\">+1794  \u003c/span>    ++AttackSequenceSerial;\n\u003cspan class=\"syn-prefix syn-added\">+1795  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (AttackSequenceSerial == \u003cspan class=\"syn-number\">0\u003c/span>) { ++AttackSequenceSerial; }\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCpuStateTree.cpp｜FFightingCpuAttackTask::Tick()／FFightingCpuWaitTask::EnterState()、Tick()｜week-09 新檔\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 194  \u003c/span>\u003cspan class=\"syn-comment\">// 共同序列在 Buffered 交接、第二招與最後淡出期間都存活；不能用 Link Disable 或招式 ID 改變判定完成。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 195  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (\u003cspan class=\"syn-function\">IsValid\u003c/span>(Data.Cpu) &amp;&amp; Data.bStarted &amp;&amp; Data.Cpu-&gt;\u003cspan class=\"syn-function\">IsAIAttackGroupActive\u003c/span>())\n\u003cspan class=\"syn-prefix syn-added\">+ 197  \u003c/span>    \u003cspan class=\"syn-comment\">// 每幀觀察窗口，但 CPU 端的一次嘗試旗標保證最多提交一次，Task 不自行重建預約。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 198  \u003c/span>    Data.Cpu-&gt;\u003cspan class=\"syn-function\">TrySubmitAIFollowup\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+ 201  \u003c/span>\u003cspan class=\"syn-comment\">// 無候選／起手被拒絕，或共同攻擊已完整結束，都由資產的完成轉移進入同一段決策等待。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 202  \u003c/span>\u003cspan class=\"syn-keyword\">return\u003c/span> \u003cspan class=\"syn-type\">EStateTreeRunStatus\u003c/span>::Succeeded;\n\u003cspan class=\"syn-prefix syn-added\">+ 212  \u003c/span>    \u003cspan class=\"syn-comment\">// 進入 Wait 才以當下遊戲秒數建立期限；攻擊播放與取消淡出的時間不抵扣等待。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 213  \u003c/span>    \u003cspan class=\"syn-comment\">// World 時間受暫停影響，無須自行累加真實時間或在恢復時補扣。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 214  \u003c/span>    Data.Deadline = Data.Cpu-&gt;\u003cspan class=\"syn-function\">GetWorld\u003c/span>()-&gt;\u003cspan class=\"syn-function\">GetTimeSeconds\u003c/span>() + Data.WaitDuration;\n\u003cspan class=\"syn-prefix syn-added\">+ 234  \u003c/span>\u003cspan class=\"syn-comment\">// 等待只比較遊戲時間，不因對手走遠而提前結束；到期後才交還 Root 重新評估距離與資格。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 236  \u003c/span>\u003cspan class=\"syn-keyword\">return\u003c/span> Data.Cpu-&gt;AIWaitRemaining &gt; \u003cspan class=\"syn-number\">0.0f\u003c/span> ? \u003cspan class=\"syn-type\">EStateTreeRunStatus\u003c/span>::Running : \u003cspan class=\"syn-type\">EStateTreeRunStatus\u003c/span>::Succeeded;\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCpuCharacter.cpp｜TrySubmitAIFollowup()｜week-09\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 299  \u003c/span>\u003cspan class=\"syn-comment\">// 1. 每幀只觀察共同 Notify 公開的窗口；尚未開啟、已跨過整窗或已放棄本組時都不補送。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 301  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (!CpuController || !CpuController-&gt;\u003cspan class=\"syn-function\">IsAIEnabled\u003c/span>() || \u003cspan class=\"syn-function\">IsTestMovementEnabled\u003c/span>()\n\u003cspan class=\"syn-prefix syn-added\">+ 302  \u003c/span>    || !\u003cspan class=\"syn-function\">IsAIAttackGroupActive\u003c/span>() || bAIFollowupAttempted || !\u003cspan class=\"syn-function\">IsCommandPreorderOpen\u003c/span>())\n\u003cspan class=\"syn-prefix syn-added\">+ 306  \u003c/span>\u003cspan class=\"syn-comment\">// 2. 決策前先消耗唯一機會；沒有候選或提交 Rejected 也不重試。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 307  \u003c/span>\u003cspan class=\"syn-comment\">// SubmitCommand 可能當下 Started，或稍後消耗預約，兩者都不能重設它。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 308  \u003c/span>bAIFollowupAttempted = \u003cspan class=\"syn-keyword\">true\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 309  \u003c/span>\u003cspan class=\"syn-comment\">// 3. 合法 ID 取自本招 Link 快照，候選內容則即時查最新表；集合外招式不能攔截選擇。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 311  \u003c/span>\u003cspan class=\"syn-keyword\">if\u003c/span> (!\u003cspan class=\"syn-type\">UTndaCommandReader\u003c/span>::\u003cspan class=\"syn-function\">GetCommandCandidates\u003c/span>(\u003cspan class=\"syn-function\">GetGameInstance\u003c/span>(), Candidates, &amp;CurrentAttack.Link) || Candidates.\u003cspan class=\"syn-function\">IsEmpty\u003c/span>()) { \u003cspan class=\"syn-keyword\">return\u003c/span>; }\n\u003cspan class=\"syn-prefix syn-added\">+ 315  \u003c/span>\u003cspan class=\"syn-comment\">// 4. 預約、即時交接、拒絕與後續過期都交給共同戰鬥流程；CPU 只記錄結果，不自行推進 Montage。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 316  \u003c/span>\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">EFightingCommandResult\u003c/span> \u003cspan class=\"syn-declaration\">Result\u003c/span> = \u003cspan class=\"syn-function\">SubmitCommand\u003c/span>(Selected.Attack, Directions);\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：一般起手才遞增序列編號，\u003cstrong>接招交接沿用同一號\u003c/strong>，整組淡出後 \u003ccode>GetAttackSequenceSerial()\u003c/code> 回傳 0。\u003ccode>IsAIAttackGroupActive()\u003c/code> 比對這個編號，所以 X→Y 整組都算同一次攻擊。攻擊 Task 每幀觀察預約窗口，但第 308 行\u003cstrong>在抽選前先把唯一機會用掉\u003c/strong>，被拒絕也不重試；候選限定在本招 \u003ccode>CurrentAttack.Link\u003c/code>。整組收尾後 Task 才回傳 Succeeded，資產轉入 Wait，\u003cstrong>Wait 進入當下\u003c/strong>才以遊戲時間建立 0.8 秒期限。\u003c/p>\u003cblockquote>\n\u003cp>資料：\u003ccode>AttackSequenceSerial\u003c/code>（交接不變）→ \u003ccode>IsAIAttackGroupActive()\u003c/code> → Attack 完成 → \u003ccode>Deadline = 現在 + 0.8\u003c/code>。\u003c/p>\n\u003c/blockquote>\u003cp>\u003ccode>FightingCpuController.cpp\u003c/code>、\u003ccode>FightingCpuStateTree.cpp\u003c/code>、\u003ccode>FightingCpuCharacter.cpp\u003c/code>、\u003ccode>TndaCommandReader.cpp\u003c/code>、\u003ccode>FightingCharacter.cpp\u003c/code>、\u003ccode>FightingGameMode.cpp\u003c/code>｜week-08 舊寫法 → week-09 教材寫法｜原始碼節錄；行號跳號表示省略，長行僅調整換行。\u003c/p>\u003ch4 id=\"reading-7c81744e\">程式流程圖\u003c/h4>\u003cp>\u003cstrong>圖 1｜誰負責什麼？\u003c/strong>（責任分工）\u003c/p>\u003cfigure class=\"flow-diagram\">\u003csvg style=\"width:1415.390625px;max-width:100%;margin-inline:auto\" id=\"w09-3-diagram-4\" width=\"1415.390625\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flo
