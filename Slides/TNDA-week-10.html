e class=\"paper\">\u003ch2 id=\"w10-3-4\">程式追蹤\u003c/h2>\u003cp>課前預習的七條打法與兩項實作，都建立在下面兩條執行流程上。原始碼取自 \u003ccode>Projects/TndaFighter-worktrees/dev-week-10\u003c/code>。\u003c/p>\u003ch3 id=\"w10-3-5\">追蹤路徑一｜按下 U，怎麼變成起手或接招？\u003c/h3>\u003cp>\u003cstrong>你在出招中又按了 I，為什麼有時會接出來，有時不會？\u003c/strong> 共用的出招入口會先看你是不是正在出招，再看現在是不是預約或接招時間。\u003c/p>\u003cp>以下 C++ 檔案都在 \u003ccode>Source/TndaFighter/Fighting/\u003c/code>。\u003c/p>\u003col>\n\u003cli>\u003cstrong>玩家按鍵進入共用入口。\u003c/strong> \u003ccode>FightingPlayerCharacter.cpp\u003c/code> 的 \u003ccode>AFightingPlayerCharacter::Attack()\u003c/code> 取樣方向後呼叫 \u003ccode>SubmitCommand()\u003c/code>；玩家版 \u003ccode>SubmitCommand()\u003c/code> 確認有 Controller，再交給 \u003ccode>FightingCharacter.cpp\u003c/code> 的 \u003ccode>AFightingCharacter::SubmitCommand()\u003c/code>。CPU 出招也走同一個入口。\u003c/li>\n\u003cli>\u003cstrong>不在出招中：檢查能不能起手。\u003c/strong> \u003ccode>SubmitCommand()\u003c/code> 先擋掉已分勝負的對局，接著用 \u003ccode>IsInNormalGroundState()\u003c/code> 確認戰鬥狀態是 \u003ccode>Neutral\u003c/code> 或 \u003ccode>Defending\u003c/code>、人在地面、沒有其他動畫占用，然後選招並呼叫 \u003ccode>StartAttack()\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>起手：播放動畫，換新的攻擊序列。\u003c/strong> \u003ccode>StartAttack()\u003c/code> 讀這一招的 Notify 時間、播放 Montage；不是接招時把 \u003ccode>AttackSequenceSerial\u003c/code> 加 1，再用 \u003ccode>SetCombatState(ECombatState::Attacking, ...)\u003c/code> 進入出招狀態。\u003c/li>\n\u003cli>\u003cstrong>出招中再按：先看能不能預約。\u003c/strong> 回到 \u003ccode>SubmitCommand()\u003c/code> 的 \u003ccode>IsAttacking()\u003c/code> 分支。\u003ccode>IsCommandPreorderOpen()\u003c/code> 要求這一招的 \u003ccode>Link\u003c/code> 欄不是空的、還沒進入收招（Recovery），而且動畫位置在 Preorder～Disable 之間。接著 \u003ccode>UTndaCommandReader::TrySelectLinkedCommand()\u003c/code> 只在 \u003ccode>Link\u003c/code> 欄列出的招式裡選，選到同一個 Montage 也拒絕。通過後把按鍵存進 \u003ccode>CommandBuffer\u003c/code>，有效 0.5 秒。\u003c/li>\n\u003cli>\u003cstrong>到了 Enable 才真的接出。\u003c/strong> 如果按下時已經在 Enable～Disable 之間（\u003ccode>IsCommandLinkOpen()\u003c/code>），立刻 \u003ccode>ConsumeCommandBuffer()\u003c/code>；還沒到就回傳 \u003ccode>Buffered\u003c/code>，等動畫跑到 Enable Notify，\u003ccode>HandleCommandLinkNotify()\u003c/code> 再消耗預約。兩條路最後都呼叫 \u003ccode>StartAttack()\u003c/code> 的接招版本：舊招淡出、新招播放，\u003cstrong>攻擊序列編號不變\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>收招才回到待機。\u003c/strong> Montage 播完時 \u003ccode>HandleAttackEnded()\u003c/code> 記下要收尾，之後角色回到 \u003ccode>Neutral\u003c/code>，或在玩家按住後退時回到 \u003ccode>Defending\u003c/code>。\u003c/li>\n\u003c/ol>\u003cfigure class=\"flow-diagram\">\u003csvg style=\"width:890px;max-width:100%;margin-inline:auto\" id=\"w10-3-diagram-1\" width=\"890\" xmlns=\"http://www.w3.org/2000/svg\" height=\"633\" viewBox=\"-50 -10 890 663\" role=\"graphics-document document\" aria-roledescription=\"sequence\">\u003cg>\u003crect x=\"640\" y=\"535\" fill=\"#eaeaea\" stroke=\"#666\" width=\"150\" height=\"77\" name=\"A\" rx=\"6\" ry=\"6\" class=\"actor actor-bottom\" data-look=\"neo\" filter=\"url(#w10-3-diagram-1-drop-shadow)\">\u003c/rect>\u003ctext x=\"715\" y=\"573.5\" dominant-baseline=\"central\" alignment-baseline=\"central\" class=\"actor actor-box\" style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: &quot;Microsoft JhengHei&quot;;\">\u003ctspan x=\"715\" dy=\"0\">攻擊動畫\u003c/tspan>\u003c/text>\u003c/g>\u003cg>\u003crect x=\"309\" y=\"535\" fill=\"#eaeaea\" stroke=\"#666\" width=\"150\" height=\"77\" name=\"S\" rx=\"6\" ry=\"6\" class=\"actor actor-bottom\" data-look=\"neo\" filter=\"url(#w10-3-diagram-1-drop-shadow)\">\u003c/rect>\u003ctext x=\"384\" y=\"573.5\" dominant-baseline=\"central\" alignment-baseline=\"central\" class=\"actor actor-box\" style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: &quot;Microsoft JhengHei&quot;;\">\u003ctspan x=\"384\" dy=\"0\">共用出招入口\u003c/tspan>\u003c/text>\u003c/g>\u003cg>\u003crect x=\"0\" y=\"535\" fill=\"#eaeaea\" stroke=\"#666\" width=\"150\" height=\"77\" name=\"P\" rx=\"6\" ry=\"6\" class=\"actor actor-bottom\" data-look=\"neo\" filter=\"url 0\" data-from=\"P\" data-to=\"S\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-1-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"547\" y=\"165\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">Neutral 可起手，播放輕擊，序列 +1\u003c/text>\u003ctext x=\"547\" y=\"186\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">StartAttack()\u003c/text>\u003cline x1=\"385\" y1=\"223\" x2=\"708\" y2=\"223\" class=\"messageLine0\" data-et=\"message\" data-id=\"i1\" data-from=\"S\" data-to=\"A\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-1-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"227\" y=\"238\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">第 20 幀按 I（已過 Preorder 16）\u003c/text>\u003ctext x=\"227\" y=\"259\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">IsCommandPreorderOpen()\u003c/text>\u003cline x1=\"76\" y1=\"296\" x2=\"377\" y2=\"296\" class=\"messageLine0\" data-et=\"message\" data-id=\"i2\" data-from=\"P\" data-to=\"S\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-1-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"233\" y=\"311\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">存進預約，回傳 Buffered\u003c/text>\u003ctext x=\"233\" y=\"332\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">CommandBuffer.Submit()\u003c/text>\u003cline x1=\"383\" y1=\"369\" x2=\"82\" y2=\"369\" class=\"messageLine1\" data-et=\"message\" data-id=\"i3\" data-from=\"S\" data-to=\"P\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-1-arrowhead)\" style=\"stroke-dasharray: 3, 3; fill: none;\">\u003c/line>\u003ctext x=\"553\" y=\"384\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">第 36 幀 Enable Notify\u003c/text>\u003ctext x=\"553\" y=\"405\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">HandleCommandLinkNotify()\u003c/text>\u003cline x1=\"714\" y1=\"442\" x2=\"391\" y2=\"442\" class=\"messageLine0\" data-et=\"message\" data-id=\"i4\" data-from=\"A\" data-to=\"S\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-1-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"547\" y=\"457\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">接出第二攻擊，序列不變\u003c/text>\u003ctext x=\"547\" y=\"478\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">StartAttack(交接)\u003c/text>\u003cline x1=\"385\" y1=\"515\" x2=\"708\" y2=\"515\" class=\"messageLine0\" data-et=\"message\" data-id=\"i5\" data-from=\"S\" data-to=\"A\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-1-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003c/svg>\u003c/figure>\u003cp>這張圖只回答「U 怎麼接出 I」。\u003cstrong>Preorder 決定什麼時候可以先按，Enable 決定什麼時候真的換招\u003c/strong>；按太早（第 16 幀前）或太晚（第 44 幀後）都會被拒絕。如果在 U 出招中按 U，\u003ccode>Link\u003c/code> 欄沒有 1，也會被拒絕，所以 U 不能接自己。\u003c/p>\u003cp>\u003cstrong>可以提問：\u003c/strong> 為什麼 U→I 對 CPU 來說算「同一波攻擊」，而 U 收招後再按 U 是「新的一波」？\u003c/p>\u003cp>\u003cstrong>參考答案：\u003c/strong> I 走 \u003ccode>StartAttack()\u003c/code> 的接招版本，攻擊序列編號不變；U 收招後再按 U 是新的起手，\u003ccode>AttackSequenceSerial\u003c/code> 加 1。CPU 只在看到新編號時抽防禦。\u003c/p>\u003ch3 id=\"w10-3-6\">追蹤路徑二｜CPU 什麼時候抽防禦？命中又怎麼變成硬直？\u003c/h3>\u003cp>\u003cstrong>同樣是 U 打過去，為什麼 CPU 有時防住、有時被打中，有時連防都不防？\u003c/strong> CPU 每幀看你的攻擊序列編號，只在看到新編號的那一刻抽一次；命中時再用同一個判定問它「現在是不是在防禦」。\u003c/p>\u003col>\n\u003cli>\u003cstrong>每幀先算資格。\u003c/strong> \u003ccode>FightingCpuStateTree.cpp\u003c/code> 的 \u003ccode>FFightingCpuEvaluator::Tick()\u003c/code> 算雙方水平距離，把「CPU 能行動（\u003ccode>IsInNormalGroundState()\u003c/code>）且距離 ≤ DefenseDistance」當作防禦資格，連同反應時間與機率交給 \u003ccode>FightingCpuCharacter.cpp\u003c/code> 的 \u003ccode>AFightingCpuCharacter::UpdateAIDefenseDecision()\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>看到新序列就先記下來。\u003c/strong> \u003ccode>UpdateAIDefenseDecision()\u003c/code> 用 \u003ccode>ConsumeNewDefenseSequence()\u003c/code> 比對你的 \u003ccode>AttackSequenceSerial\u003c/code>。新編號\u003cstrong>不論 CPU 當下有沒有資格都會被記成看過\u003c/strong>；沒資格（例如正在硬直或出招）就不抽，這一波攻擊之後也不會補抽。\u003c/li>\n\u003cli>\u003cstrong>有資格才抽一次。\u003c/strong> \u003ccode>AIRandom.FRand()\u003c/code> 抽出 0～1 的亂數，\u003ccode>EvaluateDefenseRoll()\u003c/code> 判斷是否小於 \u003ccode>DefenseChance\u003c/code>。抽中後進入準備，0.2 秒後變成正式防禦；這段期間 CPU 停止接近與出招。\u003c/li>\n\u003cli>\u003cstrong>防到這一波結束。\u003c/strong> 防禦會一直維持到你這個序列結束（你換了新序列，或整串收招），CPU 的反應動作也播完後，才交給 StateTree 進入 Wait，再等 0.8 秒才重新決策。\u003c/li>\n\u003c/ol>\u003cfigure class=\"flow-diagram\">\u003csvg style=\"width:914px;max-width:100%;margin-in "middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">ConsumeNewDefenseSequence()\u003c/text>\u003cpath d=\"M 370,223 C 430,213 430,253 370,243\" class=\"messageLine0\" data-et=\"message\" data-id=\"i1\" data-from=\"D\" data-to=\"D\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-2-arrowhead)\" style=\"fill: none;\">\u003c/path>\u003ctext x=\"370\" y=\"268\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">有資格才抽一次，小於 0.5 就防\u003c/text>\u003ctext x=\"370\" y=\"289\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">EvaluateDefenseRoll()\u003c/text>\u003cpath d=\"M 370,326 C 430,316 430,356 370,346\" class=\"messageLine0\" data-et=\"message\" data-id=\"i2\" data-from=\"D\" data-to=\"D\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-2-arrowhead)\" style=\"fill: none;\">\u003c/path>\u003ctext x=\"551\" y=\"371\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">準備 12 幀後正式防禦\u003c/text>\u003ctext x=\"551\" y=\"392\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">IsAIDefending()\u003c/text>\u003cline x1=\"370\" y1=\"429\" x2=\"732\" y2=\"429\" class=\"messageLine1\" data-et=\"message\" data-id=\"i3\" data-from=\"D\" data-to=\"T\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-2-arrowhead)\" style=\"stroke-dasharray: 3, 3; fill: none;\">\u003c/line>\u003ctext x=\"551\" y=\"444\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">序列結束、反應播完\u003c/text>\u003ctext x=\"551\" y=\"465\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">IsAIDefenseWaitPending() → Wait 0.8 秒\u003c/text>\u003cline x1=\"370\" y1=\"502\" x2=\"732\" y2=\"502\" class=\"messageLine1\" data-et=\"message\" data-id=\"i4\" data-from=\"D\" data-to=\"T\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-2-arrowhead)\" style=\"stroke-dasharray: 3, 3; fill: none;\">\u003c/line>\u003c/svg>\u003c/figure>\u003cp>這張圖只回答「CPU 什麼時候決定防」。\u003cstrong>抽籤只發生在新序列出現的那一刻，而且要當下有資格。\u003c/strong>\u003c/p>\u003col start=\"5\">\n\u003cli>\u003cstrong>命中時先問防禦意圖。\u003c/strong> \u003ccode>FightingCharacter.cpp\u003c/code> 的 \u003ccode>AFightingCharacter::TryApplyHit()\u003c/code> 確認合法命中後，用 \u003ccode>UTndaDamageReader::TryGetDamage()\u003c/code> 讀這一招的 Damage 列，再呼叫受擊方的 \u003ccode>EvaluateDefenseIntent()\u003c/code>。CPU 版的 \u003ccode>AFightingCpuCharacter::EvaluateDefenseIntentAs()\u003c/code> 只在正式防禦中、而且追蹤的正是你這個序列時，才回答「有防」。\u003c/li>\n\u003cli>\u003cstrong>分成三種結果。\u003c/strong> \u003ccode>EvaluateHitOutcome()\u003c/code> 依序判斷：有防禦意圖就是防住，不扣血，排入 Blockstun；沒防就扣血，HP 歸零排入擊倒，否則排入 Hitstun。硬直幀數用的是\u003cstrong>攻擊方這一招\u003c/strong>的 \u003ccode>Hitstun\u003c/code>／\u003ccode>Blockstun\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>硬直由計時器倒數。\u003c/strong> \u003ccode>BeginStun()\u003c/code> 取消受擊方原本的攻擊，把幀數換成秒（\u003ccode>ConvertDesignFramesToSeconds()\u003c/code>，例如 12÷60＝0.2 秒），設定 World 計時器 \u003ccode>StunTimer\u003c/code>，再播放挨打或防禦動畫。計時器到期時 \u003ccode>HandleStunExpired()\u003c/code> 讓角色回到 \u003ccode>Neutral\u003c/code> 或 \u003ccode>Defending\u003c/code>。\u003cstrong>動畫只負責畫面，什麼時候能動由計時器決定。\u003c/strong>\u003c/li>\n\u003c/ol>\u003cfigure class=\"flow-diagram\">\u003csvg style=\"width:930px;max-width:100%;margin-inline:auto\" id=\"w10-3-diagram-3\" width=\"930\" xmlns=\"http://www.w3.org/2000/svg\" height=\"590\" viewBox=\"-58 -10 930 620\" role=\"graphics-document document\" aria-roledescription=\"sequence\">\u003cg>\u003crect x=\"672\" y=\"492\" fill=\"#eaeaea\" stroke=\"#666\" width=\"150\" height=\"77\" name=\"W\" rx=\"6\" ry=\"6\" class=\"actor actor-bottom\" data-look=\"neo\" filter=\"url(#w10-3-diagram-3-drop-shadow)\">\u003c/rect>\u003ctext x=\"747\" y=\"530.5\" dominant-baseline=\"central\" alignment-baseline=\"central\" class=\"actor actor-box\" style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: &quot;Microsoft JhengHei&quot;;\">\u003ctspan x=\"747\" dy=\"0\">World 計時器\u003c/tspan>\u003c/text>\u003c/g>\u003cg>\u003crect x=\"414\" y=\"492\" fill=\"#eaeaea\" stroke=\"#666\" width=\"150\" height=\"77\" name=\"T\" rx=\"6\" ry=\"6\" class=\"actor actor-bottom\" data-look=\"neo\" filter=\"url(#w10-3-diagram-3-drop-shadow)\">\u003c/rect>\u003ctext x=\"489\" y=\"530.5\" dominant-baseline=\"central\" alignment-baseline=\"central\" class=\"actor actor-box\" style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: &quot;Microsoft JhengHei&quot;;\">\u003ctspan x=\"489\" dy=\"0\">受擊方\u003c/tspan>\u003c/text>\u003c/g>\u003cg>\u003crect x=\"0\" y=\"492\" fill=\"#eaeaea\" stroke=\"#666\" width=\"150\" height=\"77\" name=\"A\" rx=\"6\" ry=\"6\" class=\"actor actor-bottom\" data-look=\"neo\" filter=\"url(#w10-3-diagram-3-drop-shadow)\">\u003c/rect>\u003ctext x=\"75\" y=\"530.5\" dominant-baseline=\"central\" alignment-baseline=\"central\" class=\"actor actor-box\" style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: &quot;Microsoft JhengHei&quot;;\">\u003ctspan x=\"75\" dy=\"0\">攻擊方命中\u003c/tspan>\u003c/text>\u003c/g>\u003cg>\u003cline id=\"actor ht: 400;\">現在有防禦意圖嗎？\u003c/text>\u003ctext x=\"279\" y=\"216\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">EvaluateDefenseIntent()\u003c/text>\u003cline x1=\"76\" y1=\"253\" x2=\"482\" y2=\"253\" class=\"messageLine0\" data-et=\"message\" data-id=\"i1\" data-from=\"A\" data-to=\"T\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-3-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"279\" y=\"268\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">防住：Blockstun；沒防：扣血後 Hitstun 或擊倒\u003c/text>\u003ctext x=\"279\" y=\"289\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">EvaluateHitOutcome() → QueueStun()\u003c/text>\u003cline x1=\"76\" y1=\"326\" x2=\"482\" y2=\"326\" class=\"messageLine0\" data-et=\"message\" data-id=\"i2\" data-from=\"A\" data-to=\"T\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-3-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"615\" y=\"341\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">幀數 ÷ 60 秒後到期\u003c/text>\u003ctext x=\"615\" y=\"362\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">BeginStun() → SetTimer()\u003c/text>\u003cline x1=\"490\" y1=\"399\" x2=\"740\" y2=\"399\" class=\"messageLine0\" data-et=\"message\" data-id=\"i3\" data-from=\"T\" data-to=\"W\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-3-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"621\" y=\"414\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">到期，回到待機\u003c/text>\u003ctext x=\"621\" y=\"435\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">HandleStunExpired()\u003c/text>\u003cline x1=\"746\" y1=\"472\" x2=\"496\" y2=\"472\" class=\"messageLine0\" data-et=\"message\" data-id=\"i4\" data-from=\"W\" data-to=\"T\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-3-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003c/svg>\u003c/figure>\u003cp>這張圖只回答「命中結果怎麼變成硬直」。硬直中再被打中，計時器會用新那一擊的數值\u003cstrong>重新起算\u003c/strong>，不累加。\u003c/p>\u003ch2 id=\"w10-3-7\">課堂示範\u003c/h2>\u003cp>兩項示範都依「設計需求 → 程式碼增刪異動處 → 程式流程圖 → 想一想 → 把需求交給 AI 實作」講解；最後一段分成「設計提需求」與「工程給提示詞」兩段。程式碼節錄取自 \u003ccode>Projects/TndaFighter-worktrees/dev-week-10\u003c/code>，比較 \u003ccode>week-09\u003c/code>（\u003ccode>f14ebe42\u003c/code>）到 \u003ccode>week-10\u003c/code>（\u003ccode>58159624\u003c/code>）。\u003cstrong>\u003ccode>-\u003c/code> 開頭是前一週刪除的行，\u003ccode>+\u003c/code> 開頭是本週新增的行，沒有符號的是本週保留下來的行\u003c/strong>；符號依 \u003ccode>git diff\u003c/code> 判定，數字是該版本檔案的真實行號。\u003cstrong>程式碼上方的 \u003ccode>//\u003c/code> 註解都是原始碼註解\u003c/strong>，與程式一起節錄。每個區塊只節錄一個檔案，行號跳號表示省略，縮排已去掉共同的前導空白。\u003c/p>\u003ch3 id=\"w10-3-8\">課堂示範 1｜集中式戰鬥狀態、防禦硬直與擊倒\u003c/h3>\u003ch4 id=\"reading-3462ab66\">設計需求\u003c/h4>\u003cul>\n\u003cli>\u003cstrong>一名角色只有一個戰鬥狀態\u003c/strong>：Neutral（待機）、Attacking（攻擊中）、Defending（帶防禦意圖的待機）、Hitstun（受擊硬直）、Blockstun（防禦硬直）、KnockedOut（擊倒）、Victory（勝利）。能不能移動、出招、防禦與接受指令，一律看這個值。week-09 由「攻擊中」「反應中」等多個旗標各自把關；week-10 把它們收成一個狀態，攻擊的 Startup／Active／Link／Recovery 改當成 Attacking 的子階段。\u003c/li>\n\u003cli>\u003cstrong>命中先問防禦意圖\u003c/strong>：命中規則與 Damage 查表的順序不變，查表成功後才問受擊方「現在想不想防」。意圖成立就是\u003cstrong>防禦命中\u003c/strong>：不扣血、播 \u003ccode>AM_Def\u003c/code>、進 Blockstun。不成立就扣血；HP 還有剩且 Hitstun 大於 0 進 Hitstun 並播 \u003ccode>AM_Hitted\u003c/code>；Hitstun 為 0 只扣血；HP 歸零直接進 KnockedOut。\u003c/li>\n\u003cli>\u003cstrong>硬直長度是資料，不是動畫\u003c/strong>：Damage 表新增 \u003ccode>Hitstun\u003c/code>、\u003ccode>Blockstun\u003c/code> 兩欄，單位是設計幀（每秒 60）。命中當下查表換成秒數，交給 World 計時器倒數；\u003cstrong>計時器到期才解除鎖定\u003c/strong>。反應動畫比硬直長就在到期時淡出，比硬直短就停在待機姿勢等到期。World 計時器用遊戲時間，暫停時不會流逝。\u003c/li>\n\u003cli>\u003cstrong>硬直中再被打\u003c/strong>：以新命中那一擊的數值重新起算，不累加、不取較長者；反應動作從頭重播。\u003c/li>\n\u003cli>\u003cstrong>擊倒與勝利是終態\u003c/strong>：HP 歸零那一擊不播挨打，直接播 \u003ccode>AM_EndLost\u003c/code>；之後的命中全部忽略。對手倒下時，勝方若還在出招，等本招完整收尾才進 Victory 並播 \u003ccode>AM_EndWin\u003c/code>。兩個結束 Montage 在資產上關閉 Auto Blend Out，停在最後一幀。同幀互擊雙方都歸零時，兩人都倒下、沒有勝方。本週沒有回合 Reset，重開 PIE 再戰。\u003c/li>\n\u003cli>\u003cstrong>除錯指令走正式介面\u003c/strong>：\u003ccode>tnda.Debug.CPUDefense on|off|auto\u003c/code> 取代 week-09 的 \u003ccode>CpuAlwaysDef\u003c/code>，把覆寫交給 CPU 角色保存，命中結算只呼叫同一個防禦意圖函式。\u003ccode>tnda.Debug.PrintFighters\u003c/code> 一次輸出雙方的狀態、HP、目前招式、攻擊階段、硬直剩餘秒與防禦意圖來源，同時寫進 Log 與畫面。\u003c/li>\n\u003cli>\u003cstrong>UE 提供與遊戲自訂的分界\u003c/strong>：UE 提供 Montage 播放與 Blend、World 計時器（\u003ccode>FTimerManager\u003c/code>）與 Console 指令註冊；狀態列舉、轉移規則、命中結果判斷與「計時器決定鎖定」這條規則都是遊戲自己定義的。\u003c/li>\n\u003c/ul>\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>本週資產值（本次 Editor 回讀）\u003c/th>\n\u003cth>值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>DT_Damage\u003c/code> 輕擊／右腳踢頭／第二攻擊\u003c/td>\n\u003ctd>Damage 10／15／20，Hitstun 12／18／16，Blockstun 8／12／10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AM_Hitted\u003c/code>、\u003ccode>AM_Def\u003c/code>\u003c/td>\n\u003ctd>長 0.333 秒，Auto Blend Out 開啟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>AM_EndLost\u003c/code>、\u003ccode>AM_EndWin\u003c/code>\u003c/td>\n\u003ctd>長 1.67／1.133 秒，Auto Blend Out 關閉\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1P 與 CPU 的 Blueprint\u003c/td>\n\u003ctd>都指定 \u003ccode>AM_Hitted\u003c/code>、\u003ccode>AM_Def\u003c/code>、\u003ccode>AM_EndLost\u003c/code>、\u003ccode>AM_EndWin\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003ch4 id=\"reading-fe4d44de\">程式碼增刪異動處\u003c/h4>\u003cp>\u003cstrong>異動歷程\u003c/strong>：\u003ccode>92dcf7b4\u003c/code> 集中式戰鬥狀態（工單 01）→ \u003ccode>4ee10c53\u003c/code> Damage 表硬直與計時驅動的 Hitstun／Blockstun（工單 02）→ \u003ccode>abc8823e\u003c/code> 防禦意圖、雙方 Defending 與 \u003ccode>tnda.Debug.CPUDefense\u003c/code>（工單 03）→ \u003ccode>494467e6\u003c/code> 擊倒、勝利與 \u003ccode>PrintFighters\u003c/code>（工單 04）。\u003c/p>\u003cp>\u003cstrong>本段要看懂的改動\u003c/strong>：① 先把分散旗標收成一個戰鬥狀態 → ② 命中時先問防禦意圖，再分出 Blockstun／Hitstun／KnockedOut → ③ 硬直幀換成秒，交給計時器解除 → ④ 終態與觀察工具。主要檔案為 \u003ccode>FightingCharacter.cpp/.h\u003c/code>、\u003ccode>FightingCpuCharacter.cpp\u003c/code>、\u003ccode>TndaDamageData.h\u003c/code> 與 \u003ccode>FightingPlayerCharacter.cpp\u003c/code>。\u003c/p>\u003cp>例：1P 用 U 輕擊打中 CPU。這一列 Damage 10、Hitstun 12、Blockstun 8。CPU 沒防禦時扣 10 HP，進 Hitstun 12 幀，也就是 12 ÷ 60 = 0.2 秒；CPU 防住時不扣血，進 Blockstun 8 幀，約 0.133 秒。CPU 只剩 10 HP 時，這一擊直接把它打成 KnockedOut。\u003c/p>\u003cp id=\"reading-a84a5f4c\">\u003cstrong>① 一個戰鬥狀態，一個轉移入口\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCharacter.h｜ECombatState｜week-10\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+  50  \u003c/span>\u003cspan class=\"syn-comment\">/**\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  51  \u003c/span>\u003cspan class=\"syn-comment\"> * 每名角色同一時間恰好處於其中一種的集中式戰鬥狀態（ADR-0005）。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  52  \u003c/span>\u003cspan class=\"syn-comment\"> * 移動、自動面向、出招、Root Motion 消耗、推擠資格與 CPU 行動資格一律由它決定；攻擊的四個階段是 Attacking 的子階段。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  53  \u003c/span>\u003cspan class=\"syn-comment\"> * Defending 由每幀評估的防禦意圖在待機時進入／離開；HP 歸零那一擊進入 KnockedOut，對手擊倒且本招收尾後進入 Victory，\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  54  \u003c/span>\u003cspan class=\"syn-comment\"> * 兩者為終態，本週沒有回合 Reset。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  55  \u003c/span>\u003cspan class=\"syn-comment\"> */\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  56  \u003c/span>\u003cspan class=\"syn-macro\">UENUM\u003c/span>(BlueprintType)\n\u003cspan class=\"syn-prefix syn-added\">+  57  \u003c/span>\u003cspan class=\"syn-keyword\">enum\u003c/span> \u003cspan class=\"syn-keyword\">class\u003c/span> \u003cspan class=\"syn-type\">ECombatState\u003c/span> : \u003cspan class=\"syn-type\">uint8\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  58  \u003c/span>{\n\u003cspan class=\"syn-prefix syn-added\">+  59  \u003c/span>    \u003cspan class=\"syn-comment\">/** 待機：可移動、可起手、可自動面向。 */\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  60  \u003c/span>    Neutral,\n\u003cspan class=\"syn-prefix syn-added\">+  61  \u003c/span>    \u003cspan class=\"syn-comment\">/** 攻擊中：從起手到完整收尾（含淡出）；`AttackPhase` 只在此狀態非 Idle。 */\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  62  \u003c/span>    Attacking,\n\u003cspan class=\"syn-prefix syn-added\">+  63  \u003c/span>    \u003cspan class=\"syn-comment\">/** 防禦狀態：具備非空防禦意圖的待機，權限與 Neutral 相同、不播動畫。 */\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  64  \u003c/span>    Defending,\n\u003cspan class=\"syn-prefix syn-added\">+  65  \u003c/span>    \u003cspan class=\"syn-comment\">/** 受擊硬直：一般命中後的反應鎖定，不可移動、出招或防禦。 */\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  66  \u003c/span>    Hitstun,\n\u003cspan class=\"syn-prefix syn-added\">+  67  \u003c/span>    \u003cspan class=\"syn-comment\">/** 防禦硬直：防禦命中後的反應鎖定；持續防禦意圖仍可防禦後續命中。 */\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  68  \u003c/span>    Blockstun,\n\u003cspan class=\"syn-prefix syn-added\">+  69  \u003c/span>    \u003cspan class=\"syn-comment\">/** 擊倒：生命值歸零的那一擊之後的終態；不再接受命中與輸入。 */\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  70  \u003c/span>    KnockedOut,\n\u003cspan class=\"syn-prefix syn-added\">+  71  \u003c/span>    \u003cspan class=\"syn-comment\">/** 勝利：對手擊倒後的終態；不再接受輸入。 */\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  72  \u003c/span>    Victory\n\u003cspan class=\"syn-prefix syn-added\">+  73  \u003c/span>};\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCharacter.cpp｜CanTransitionCombatState()／SetCombatState()｜week-10\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 433  \u003c/span>\u003cspan class=\"syn-type\">bool\u003c/span> \u003cspan class=\"syn-type\">AFightingCharacter\u003c/span>::\u003cspan class=\"syn-function\">CanTransitionCombatState\u003c/span>(\u003cspan class=\"syn-type\">ECombatState\u003c/span> \u003cspan class=\"syn-declaration\">From\u003c/span>, \u003cspan class=\"syn-type\">ECombatState\u003c/span> \u003cspan class=\"syn-declaration\">To\u003c/span>)\n\u003cspan class=\"syn-prefix syn-added\">+ 434  \u003c/span>{\n\u003cspan class=\"syn-prefix syn-added\">+ 435  \u003c/span>    \u003cspan class=\"syn-comment\">// 終態只允許停留在自身；回合 Reset 留給 Week 13，本週沒有任何流程能離開 KnockedOut／Victory。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 436  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (From == \u003cspan class=\"syn-type\">ECombatState\u003c/span>::KnockedOut || From == \u003cspan class=\"syn-type\">ECombatState\u003c/span>::Victory)\n\u003cspan class=\"syn-prefix syn-added\">+ 437  \u003c/span>    {\n\u003cspan class=\"syn-prefix syn-added\">+ 438  \u003c/span>        \u003cspan class=\"syn-keyword\">return\u003c/span> From == To;\n\u003cspan class=\"syn-prefix syn-added\">+ 439  \u003c/span>    }\n\u003cspan class=\"syn-prefix syn-a ate), *\u003cspan class=\"syn-type\">UEnum\u003c/span>::\u003cspan class=\"syn-function\">GetValueAsString\u003c/span>(NewState), Reason);\n\u003cspan class=\"syn-prefix syn-added\">+ 453  \u003c/span>        \u003cspan class=\"syn-keyword\">return\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 454  \u003c/span>    }\n\u003cspan class=\"syn-prefix syn-added\">+ 455  \u003c/span>    \u003cspan class=\"syn-comment\">// 以 Log 等級記錄，讓教學不必開 Verbose 就能在 Output Log 看到每次狀態轉移。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 456  \u003c/span>    \u003cspan class=\"syn-macro\">UE_LOG\u003c/span>(LogTndaFighter, Log, \u003cspan class=\"syn-macro\">TEXT\u003c/span>(\u003cspan class=\"syn-string\">\"Combat state: actor=%s from=%s to=%s reason=%s\"\u003c/span>),\n\u003cspan class=\"syn-prefix syn-added\">+ 457  \u003c/span>        *\u003cspan class=\"syn-function\">GetName\u003c/span>(), *\u003cspan class=\"syn-type\">UEnum\u003c/span>::\u003cspan class=\"syn-function\">GetValueAsString\u003c/span>(CombatState), *\u003cspan class=\"syn-type\">UEnum\u003c/span>::\u003cspan class=\"syn-function\">GetValueAsString\u003c/span>(NewState), Reason);\n\u003cspan class=\"syn-prefix syn-added\">+ 458  \u003c/span>    CombatState = NewState;\n  \u003cspan class=\"syn-number\">459\u003c/span>  }\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCharacter.cpp｜IsInNormalGroundState()｜week-09 刪除側 → week-10\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-removed\">-1587  \u003c/span>\u003cspan class=\"syn-comment\">// 面向、推擠與出招共用這個資格判斷。攻擊鎖定涵蓋淡出期間，任何其他 Montage／Root Motion\u003c/span>\n\u003cspan class=\"syn-prefix syn-removed\">-1588  \u003c/span>\u003cspan class=\"syn-comment\">// 也會暫停一般地面規則；沒有 AnimInstance 本身不阻止地面規則，出招時才另外要求有效播放者。\u003c/span>\n\u003cspan class=\"syn-prefix syn-removed\">-1591  \u003c/span>\u003cspan class=\"syn-keyword\">return\u003c/span> !bIsAttacking &amp;&amp; !bIsReacting &amp;&amp; \u003cspan class=\"syn-function\">IsValid\u003c/span>(MovementComponent)\n\u003cspan class=\"syn-prefix syn-added\">+1655  \u003c/span>\u003cspan class=\"syn-comment\">// 面向、推擠與出招共用這個資格判斷。戰鬥狀態是第一道門：只有 Neutral／Defending 可行動；\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+1656  \u003c/span>\u003cspan class=\"syn-comment\">// 攻擊鎖定涵蓋淡出期間（Attacking 直到 OnMontageEnded 才回 Neutral）。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+1657  \u003c/span>\u003cspan class=\"syn-comment\">// 其他 Montage 只在仍為 active 時暫停地面規則；正在 Blend Out 的不算，\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+1658  \u003c/span>\u003cspan class=\"syn-comment\">// 因為 IsAnyMontagePlaying 會把淡出中的 instance 也計入，硬直到期後反應淡出那 0.15 秒會多鎖一段，\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+1659  \u003c/span>\u003cspan class=\"syn-comment\">// 違反「計時器是解除鎖定的唯一依據、動畫只負責視覺」（ADR-0005）。Root Motion 仍會暫停規則；\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+1660  \u003c/span>\u003cspan class=\"syn-comment\">// 沒有 AnimInstance 本身不阻止地面規則，出招時才另外要求有效播放者。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+1663  \u003c/span>\u003cspan class=\"syn-keyword\">return\u003c/span> \u003cspan class=\"syn-function\">IsCombatStateActionable\u003c/span>(CombatState) &amp;&amp; \u003cspan class=\"syn-function\">IsValid\u003c/span>(MovementComponent)\n \u003cspan class=\"syn-number\">1664\u003c/span>      &amp;&amp; MovementComponent-&gt;\u003cspan class=\"syn-function\">IsMovingOnGround\u003c/span>()\n \u003cspan class=\"syn-number\">1665\u003c/span>      &amp;&amp; !\u003cspan class=\"syn-function\">IsPlayingRootMotion\u003c/span>()\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：week-10 新增 \u003ccode>ECombatState\u003c/code> 七個值，角色只保存一個 \u003ccode>CombatState\u003c/code>。所有轉移都經過 \u003ccode>SetCombatState()\u003c/code>：值相同直接返回；\u003ccode>CanTransitionCombatState()\u003c/code> 不允許離開 KnockedOut／Victory；成功時以 Log 等級記下「從哪裡、到哪裡、為什麼」，Output Log 不開 Verbose 也看得到。資格判斷也跟著改：week-09 第 1591 行用 \u003ccode>bIsAttacking\u003c/code>、\u003ccode>bIsReacting\u003c/code> 兩個旗標把關，week-10 第 1663 行改成「狀態是不是 Neutral 或 Defending」。另一個細節是第 1657～1659 行：淡出中的反應 Montage 不再算佔用，否則硬直到期後還會多鎖一段淡出時間。\u003c/p>\u003cblockquote>\n\u003cp>資料：攻擊、命中、計時器到期等事件 → \u003ccode>SetCombatState(新狀態, 原因)\u003c/code> → \u003ccode>CombatState\u003c/code>（唯一值）→ 移動、出招、面向與 CPU 行動資格都讀它。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-ba2a7da0\">\u003cstrong>② 命中先問防禦意圖，再決定結果\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCharacter.cpp｜TryApplyHit()｜week-09 刪除側\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-removed\">-1251  \u003c/span>    \u003cspan class=\"syn-type\">EFightingDefenseSource\u003c/span> \u003cspan class=\"syn-declaration\">DefenseSource\u003c/span> = Target-&gt;\u003cspan class=\"syn-function\">GetDefenseSourceForHit\u003c/span>(*this);\n\u003cspan class=\"syn-prefix syn-removed\">-1252  \u003c/span>#\u003cspan class=\"syn-keyword\">if\u003c/span> !\u003cspan class=\"syn-constant\">UE_BUILD_SHIPPING\u003c/span>\n\u003cspan class=\"syn-prefix syn-removed\">-1253  \u003c/span>    \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">AFightingPlayerCharacter\u003c/span>* \u003cspan class=\"syn-declaration\">PlayerAttacker\u003c/span> = Cast&lt;\u003cspan class=\"syn-type\">AFightingPlayerCharacter\u003c/span>&gt;(this);\n\u003cspan class=\"syn-prefix syn-removed\">-1254  \u003c/span>    \u003cspan class=\"syn-type\">AFightingCpuCharacter\u003c/span>* \u003cspan class=\"syn-declaration\">CpuTarget\u003c/span> = Cast&lt;\u003cspan class=\"syn-type\">AFightingCpuCharacter\u003c/span>&gt;(Target);\n\u003cspan class=\"syn-prefix syn-removed\">-1255  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (PlayerAttacker != \u003cspan class=\"syn-keyword\">nullptr\u003c/span> &amp;&amp; CpuTarget != \u003cspan class=\"syn-keyword\">nullptr\u003c/span>\n\u003cspan class=\"syn- class=\"syn-type\">EFightingCpuDefenseOverride\u003c/span> \u003cspan class=\"syn-declaration\">Override\u003c/span>)\n\u003cspan class=\"syn-prefix syn-added\">+ 225  \u003c/span>{\n\u003cspan class=\"syn-prefix syn-added\">+ 226  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (DefenseOverride == Override)\n\u003cspan class=\"syn-prefix syn-added\">+ 227  \u003c/span>    {\n\u003cspan class=\"syn-prefix syn-added\">+ 228  \u003c/span>        \u003cspan class=\"syn-keyword\">return\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 229  \u003c/span>    }\n\u003cspan class=\"syn-prefix syn-added\">+ 230  \u003c/span>    DefenseOverride = Override;\n\u003cspan class=\"syn-prefix syn-added\">+ 231  \u003c/span>    \u003cspan class=\"syn-comment\">// 只更新待機的 Neutral／Defending；硬直、反應 Montage 與已開始的 AI 週期都不動。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 232  \u003c/span>    \u003cspan class=\"syn-function\">UpdateDefendingState\u003c/span>();\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：week-09 的命中結算先問一次防禦來源，再用 \u003ccode>#if !UE_BUILD_SHIPPING\u003c/code> 直接讀 \u003ccode>CpuAlwaysDef\u003c/code> 指令的靜態狀態覆蓋它；反應是否播放則看「實際扣了多少血」。week-10 刪掉這段，第 1312 行改呼叫 \u003ccode>EvaluateDefenseIntent()\u003c/code>，和每幀更新 Defending 用的是同一個函式，所以 Debug 顯示和結算結果不會不一致。CPU 的覆寫存在角色身上：\u003ccode>CPUDefense on\u003c/code> 讓 \u003ccode>ResolveDefenseIntent()\u003c/code> 回 \u003ccode>CpuForced\u003c/code>，\u003ccode>off\u003c/code> 回 \u003ccode>None\u003c/code>，\u003ccode>auto\u003c/code> 才看正式 AI 是否在 Defending；\u003ccode>SetDefenseOverride()\u003c/code> 只更新待機的 Neutral／Defending，不截斷已開始的硬直。結果由 \u003ccode>EvaluateHitOutcome()\u003c/code> 判斷，順序是\u003cstrong>防禦 → 歸零 → 有無 Hitstun\u003c/strong>。判斷完只先 \u003ccode>QueueStun()\u003c/code> 排入，等第 1397～1400 行雙方候選都結算完才套用，第 1403 行再判勝負；同幀互擊才不會因為誰先算而取消另一方的命中。\u003c/p>\u003cblockquote>\n\u003cp>資料：\u003ccode>Target-&gt;EvaluateDefenseIntent()\u003c/code> → \u003ccode>bDefenseHit\u003c/code>；\u003ccode>Damage.Hitstun\u003c/code>、扣血後 \u003ccode>HealthAfter\u003c/code> → \u003ccode>EHitOutcome\u003c/code> → \u003ccode>QueueStun(狀態, 幀數)\u003c/code> → \u003ccode>ApplyPendingStun()\u003c/code>。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-2846ed4a\">\u003cstrong>③ 硬直幀換成秒，計時器到期才解除\u003c/strong>\u003c/p>\u003cp>\u003ccode>TndaDamageData.h｜FTndaDamageRow｜week-10\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+  23  \u003c/span>\u003cspan class=\"syn-comment\">/** 一般命中後受擊方的受擊硬直，單位設計幀（每秒 60）；0 代表只扣血不硬直（ADR-0005）。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  24  \u003c/span>\u003cspan class=\"syn-comment\"> * 不加 ClampMin：負值必須由 Reader 驗證明確擋下並提示，Editor 靜默夾成 0 會違反「錯誤資料不靜默變 0」。 */\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  25  \u003c/span>\u003cspan class=\"syn-macro\">UPROPERTY\u003c/span>(EditAnywhere, BlueprintReadOnly, Category=\u003cspan class=\"syn-string\">\"Damage\"\u003c/span>)\n\u003cspan class=\"syn-prefix syn-added\">+  26  \u003c/span>\u003cspan class=\"syn-type\">int32\u003c/span> \u003cspan class=\"syn-declaration\">Hitstun\u003c/span> = \u003cspan class=\"syn-number\">0\u003c/span>;\n+  \u003cspan class=\"syn-number\">27\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  28  \u003c/span>\u003cspan class=\"syn-comment\">/** 防禦命中後受擊方的防禦硬直，單位設計幀（每秒 60）；0 代表防住但不硬直。負值同樣由 Reader 驗證擋下。 */\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  29  \u003c/span>\u003cspan class=\"syn-macro\">UPROPERTY\u003c/span>(EditAnywhere, BlueprintReadOnly, Category=\u003cspan class=\"syn-string\">\"Damage\"\u003c/span>)\n\u003cspan class=\"syn-prefix syn-added\">+  30  \u003c/span>\u003cspan class=\"syn-type\">int32\u003c/span> \u003cspan class=\"syn-declaration\">Blockstun\u003c/span> = \u003cspan class=\"syn-number\">0\u003c/span>;\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCharacter.cpp｜DesignFramesPerSecond／ConvertDesignFramesToSeconds()｜week-10\u003c/code>\u003 ent\">// 資產缺失或播放失敗不回滾命中，也不留下永久鎖定：計時器仍會在到期時解除。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2154  \u003c/span>\u003cspan class=\"syn-function\">StartReactionMontage\u003c/span>(Montage, ReactionName);\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCharacter.cpp｜HandleReactionEnded()｜week-09 刪除側 → week-10\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-removed\">-2011  \u003c/span>\u003cspan class=\"syn-function\">FinishReaction\u003c/span>(\u003cspan class=\"syn-keyword\">false\u003c/span>);\n\u003cspan class=\"syn-prefix syn-added\">+2083  \u003c/span>\u003cspan class=\"syn-comment\">// 結束回呼只釋放播放身分；硬直長度由 Damage 表計時，動畫先播完只代表角色已停在待機姿勢。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2090  \u003c/span>\u003cspan class=\"syn-function\">ReleaseReactionPlayback\u003c/span>(\u003cspan class=\"syn-keyword\">false\u003c/span>);\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingCharacter.cpp｜HandleStunExpired()｜week-10\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+2227  \u003c/span>\u003cspan class=\"syn-type\">void\u003c/span> \u003cspan class=\"syn-type\">AFightingCharacter\u003c/span>::\u003cspan class=\"syn-function\">HandleStunExpired\u003c/span>()\n \u003cspan class=\"syn-number\">2228\u003c/span>  {\n\u003cspan class=\"syn-prefix syn-added\">+2229  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (\u003cspan class=\"syn-type\">UWorld\u003c/span>* \u003cspan class=\"syn-declaration\">World\u003c/span> = \u003cspan class=\"syn-function\">GetWorld\u003c/span>())\n \u003cspan class=\"syn-number\">2230\u003c/span>      {\n\u003cspan class=\"syn-prefix syn-added\">+2231  \u003c/span>        World-&gt;\u003cspan class=\"syn-function\">GetTimerManager\u003c/span>().\u003cspan class=\"syn-function\">ClearTimer\u003c/span>(StunTimer);\n \u003cspan class=\"syn-number\">2232\u003c/span>      }\n\u003cspan class=\"syn-prefix syn-added\">+2233  \u003c/span>    \u003cspan class=\"syn-comment\">// 動畫比硬直長：先解除回呼再以資產 Blend Out 收掉；已播完則 instance 早已消失，角色停在待機。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2234  \u003c/span>    \u003cspan class=\"syn-type\">UAnimInstance\u003c/span>* \u003cspan class=\"syn-declaration\">AnimInstance\u003c/span> = ReactionAnimInstance.\u003cspan class=\"syn-function\">Get\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+2235  \u003c/span>    \u003cspan class=\"syn-type\">FAnimMontageInstance\u003c/span>* \u003cspan class=\"syn-declaration\">Instance\u003c/span> = AnimInstance ? AnimInstance-&gt;\u003cspan class=\"syn-function\">GetMontageInstanceForID\u003c/span>(ReactionInstanceId) : \u003cspan class=\"syn-keyword\">nullptr\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+2236  \u003c/span>    \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">UAnimMontage\u003c/span>* \u003cspan class=\"syn-declaration\">Montage\u003c/span> = ActiveReactionMontage.\u003cspan class=\"syn-function\">Get\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+2237  \u003c/span>    \u003cspan class=\"syn-function\">ReleaseReactionPlayback\u003c/span>(\u003cspan class=\"syn-keyword\">false\u003c/span>);\n\u003cspan class=\"syn-prefix syn-added\">+2238  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (Instance != \u003cspan class=\"syn-keyword\">nullptr\u003c/span> &amp;&amp; !Instance-&gt;\u003cspan class=\"syn-function\">IsStopped\u003c/span>())\n \u003cspan class=\"syn-number\">2239\u003c/span>      {\n\u003cspan class=\"syn-prefix syn-added\">+2240  \u003c/span>        Instance-&gt;\u003cspan class=\"syn-function\">Stop\u003c/span>(\u003cspan class=\"syn-function\">IsValid\u003c/span>(Montage) ? Montage-&gt;BlendOut : \u003cspan class=\"syn-type\">FAlphaBlend\u003c/span>(\u003cspan class=\"syn-number\">0.15f\u003c/span>));\n \u003cspan class=\"syn-number\">2241\u003c/span>      }\n\u003cspan class=\"syn-prefix syn-added\">+2242  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (\u003cspan class=\"syn-function\">IsInReaction\u003c/span>())\n \u003cspan class=\"syn-number\">2243\u003c/span>      {\n\u003cspan class=\"syn-prefix syn-added\">+2244  \u003c/span>        \u003cspan class=\"syn-comment\">// 以 Neutral 假定狀態評估意圖，直接從硬直一次轉移到 Neutral 或 Defending（持續後退的玩家、覆寫 on 的 CPU）。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2245  \u003c/span>        \u003cspan class=\"syn-function\">ReturnToIdle\u003c/span>(\u003cspan class=\"syn-macro\">TEXT\u003c/span>(\u003cspan class=\"syn-string\">\"StunExpired\"\u003c/span>));\n \u003cspan class=\"syn-number\">2246\u003c/span>      }\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：Damage Row 新增 \u003ccode>Hitstun\u003c/code>、\u003ccode>Blockstun\u003c/code> 兩個整數欄。進入硬直時，\u003ccode>BeginStun()\u003c/code> 用 \u003ccode>ConvertDesignFramesToSeconds()\u003c/code> 把 12 幀換成 0.2 秒，先轉到 Hitstun，再用同一個 \u003ccode>StunTimer\u003c/code> handle 設定 World 計時器；硬直中再被打時重新 \u003ccode>SetTimer\u003c/code>，就是以新值重新起算。反應動畫的角色也改了：week-09 的 \u003ccode>HandleReactionEnded()\u003c/code> 在動畫播完時呼叫 \u003ccode>FinishReaction()\u003c/code> 解除鎖定；week-10 第 2090 行只釋放播放身分，\u003cstrong>解除鎖定改由 \u003ccode>HandleStunExpired()\u003c/code> 負責\u003c/strong>。以輕擊為例，\u003ccode>AM_Hitted\u003c/code> 長 0.333 秒、硬直只有 0.2 秒，到期時第 2240 行以資產的 Blend Out 把動畫收掉，第 2245 行依當下防禦意圖回到 Neutral 或 Defending。動畫缺失時第 2153 行的註解說明：命中不回滾，計時器照樣解除。\u003c/p>\u003cblockquote>\n\u003cp>資料：\u003ccode>Damage.Hitstun = 12\u003c/code> → \u003ccode>Seconds = 0.2\u003c/code> → \u003ccode>SetTimer(StunTimer, 0.2)\u003c/code> → 到期 \u003ccode>HandleStunExpired()\u003c/code> → \u003ccode>ReturnToIdle()\u003c/code>。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-27338530\">\u003cstrong>④ 擊倒、勝利與觀察工具\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingCharacter.cpp｜BeginKnockedOut()｜week-10\u003c/code>\u003c/p>\u003cpre class=\"syn \u003cspan class=\"syn-string\">\"AttackFinishedAfterKnockout\"\u003c/span>));\n\u003cspan class=\"syn-prefix syn-added\">+2284  \u003c/span>    }\n\u003cspan class=\"syn-prefix syn-added\">+2285  \u003c/span>    \u003cspan class=\"syn-keyword\">else\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+2286  \u003c/span>    {\n\u003cspan class=\"syn-prefix syn-added\">+2287  \u003c/span>        \u003cspan class=\"syn-function\">ReturnToIdle\u003c/span>(\u003cspan class=\"syn-macro\">TEXT\u003c/span>(\u003cspan class=\"syn-string\">\"AttackFinished\"\u003c/span>));\n\u003cspan class=\"syn-prefix syn-added\">+2288  \u003c/span>    }\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingPlayerCharacter.cpp｜PrintFighters()｜week-10\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 113  \u003c/span>\u003cspan class=\"syn-comment\">/** 一次性輸出雙方各一行摘要到 Log（Display）與畫面訊息（5 秒）；只讀狀態，不開 Debug 繪製也能查。 */\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 114  \u003c/span>\u003cspan class=\"syn-type\">void\u003c/span> \u003cspan class=\"syn-function\">PrintFighters\u003c/span>(\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">TArray\u003c/span>&lt;\u003cspan class=\"syn-type\">FString\u003c/span>&gt;&amp; \u003cspan class=\"syn-declaration\">Args\u003c/span>, \u003cspan class=\"syn-type\">UWorld\u003c/span>* \u003cspan class=\"syn-declaration\">World\u003c/span>)\n\u003cspan class=\"syn-prefix syn-added\">+ 115  \u003c/span>{\n\u003cspan class=\"syn-prefix syn-added\">+ 116  \u003c/span>    \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">AFightingPlayerCharacter\u003c/span>* \u003cspan class=\"syn-declaration\">Player\u003c/span> = \u003cspan class=\"syn-function\">IsValid\u003c/span>(World) &amp;&amp; World-&gt;\u003cspan class=\"syn-function\">IsGameWorld\u003c/span>()\n\u003cspan class=\"syn-prefix syn-added\">+ 117  \u003c/span>        ? Cast&lt;\u003cspan class=\"syn-type\">AFightingPlayerCharacter\u003c/span>&gt;(\u003cspan class=\"syn-type\">UGameplayStatics\u003c/span>::\u003cspan class=\"syn-function\">GetPlayerCharacter\u003c/span>(World, \u003cspan class=\"syn-number\">0\u003c/span>)) : \u003cspan class=\"syn-keyword\">nullptr\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 118  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (!\u003cspan class=\"syn-function\">IsValid\u003c/span>(Player))\n\u003cspan class=\"syn-prefix syn-added\">+ 119  \u003c/span>    {\n\u003cspan class=\"syn-prefix syn-added\">+ 120  \u003c/span>        \u003cspan class=\"syn-macro\">UE_LOG\u003c/span>(LogTndaFighter, Warning, \u003cspan class=\"syn-macro\">TEXT\u003c/span>(\u003cspan class=\"syn-string\">\"tnda.Debug.PrintFighters failed: the command requires an active PIE or game World with player 0.\"\u003c/span>));\n\u003cspan class=\"syn-prefix syn-added\">+ 121  \u003c/span>        \u003cspan class=\"syn-keyword\">return\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 122  \u003c/span>    }\n\u003cspan class=\"syn-prefix syn-added\">+ 123  \u003c/span>    \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">AFightingCharacter\u003c/span>* \u003cspan class=\"syn-declaration\">Fighters\u003c/span>[] = { Player, Player-&gt;\u003cspan class=\"syn-function\">GetOpponent\u003c/span>() };\n\u003cspan class=\"syn-prefix syn-added\">+ 124  \u003c/span>    \u003cspan class=\"syn-keyword\">for\u003c/span> (\u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">AFightingCharacter\u003c/span>* \u003cspan class=\"syn-declaration\">Fighter\u003c/span> : Fighters)\n\u003cspan class=\"syn-prefix syn-added\">+ 125  \u003c/span>    {\n\u003cspan class=\"syn-prefix syn-added\">+ 126  \u003c/span>        \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">FString\u003c/span> \u003cspan class=\"syn-declaration\">Line\u003c/span> = \u003cspan class=\"syn-function\">IsValid\u003c/span>(Fighter) ? Fighter-&gt;\u003cspan class=\"syn-function\">GetFighterSummaryText\u003c/span>() : \u003cspan class=\"syn-type\">FString\u003c/span>(\u003cspan class=\"syn-macro\">TEXT\u003c/span>(\u003cspan class=\"syn-string\">\"(no opponent)\"\u003c/span>));\n\u003cspan class=\"syn-prefix syn-added\">+ 127  \u003c/span>        \u003cspan class=\"syn-macro\">UE_LOG\u003c/span>(LogTndaFighter, Display, \u003cspan class=\"syn-macro\">TEXT\u003c/span>(\u003cspan class=\"syn-string\">\"PrintFighters: %s\"\u003c/span>), *Line);\n\u003cspan class=\"syn-prefix syn-added\">+ 128  \u003c/span>        \u003cspan class=\"syn-keyword\">if\u003c/span> (GEngine)\n\u003cspan class=\"syn-prefix syn-added\">+ 129  \u003c/span>        {\n\u003cspan class=\"syn-prefix syn-added\">+ 130  \u003c/span>            GEngine-&gt;\u003cspan class=\"syn-function\">AddOnScreenDebugMessage\u003c/span>(\u003cspan class=\"syn-constant\">INDEX_NONE\u003c/span>, \u003cspan class=\"syn-number\">5.0f\u003c/span>, \u003cspan class=\"syn-type\">FColor\u003c/span>::Yellow, Line);\n\u003cspan class=\"syn-prefix syn-added\">+ 131  \u003c/span>        }\n\u003cspan class=\"syn-prefix syn-added\">+ 132  \u003c/span>    }\n\u003cspan class=\"syn-prefix syn-added\">+ 133  \u003c/span>}\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：歸零那一擊排入的是 KnockedOut，\u003ccode>BeginKnockedOut()\u003c/code> 清掉硬直計時器、停掉原攻擊與舊反應、清空指令預約後，轉到 KnockedOut 並播 \u003ccode>AM_EndLost\u003c/code>。之後 \u003ccode>TryApplyHit()\u003c/code> 的 \u003ccode>bTargetEnded\u003c/code> 讓所有命中都不成立。勝方要等自己的攻擊收尾：\u003ccode>FinishAttack()\u003c/code> 第 2281 行發現對手已倒，就呼叫 \u003ccode>EnterVictory()\u003c/code>；勝方本來就在待機時，則由 \u003ccode>ResolveMatchOutcome()\u003c/code> 立即進 Victory。\u003ccode>PrintFighters\u003c/code> 不改任何狀態，只把 \u003ccode>GetFighterSummaryText()\u003c/code> 的一行摘要寫到 Log，並在畫面顯示 5 秒。\u003c/p>\u003cblockquote>\n\u003cp>資料：\u003ccode>QueueStun(KnockedOut, 0)\u003c/code> → \u003ccode>BeginKnockedOut()\u003c/code> → \u003ccode>CombatState = KnockedOut\u003c/code>；勝方 \u003ccode>FinishAttack()\u003c/code> → \u003ccode>EnterVictory()\u003c/code>；\u003ccode>PrintFighters\u003c/code> → \u003ccode>GetFighterSummaryText()\u003c/code> → Log／畫面。\u003c/p>\n\u003c/blockquote>\u003cp>\u003ccode>FightingCharacter.cpp\u003c/code>、\u003ccode>FightingCharacter.h\u003c/code>、\u003ccode>FightingCpuCharacter.cpp\u003c/code>、\u003ccode>TndaDamageData.h\u003c/code>、\u003ccode>FightingPlayerCharacter.cpp\u003c/code>｜week-09（\u003ccode>f14ebe42\u003c/code>）→ week-10（\u003ccode>58159624\u003c/code>）｜原始碼節錄；行號跳號表示省略，Tab 已換成四格空白。\u003c/p>\u003ch4 id=\"reading-fd519232\">程式流程圖\u003c/h4>\u003cp>\u003cstrong>圖 1｜一次命中，結果怎麼分？\u003c/strong>（判斷規則）\u003c/p>\u003cfigure class=\"flow-diagram\">\u003csvg style=\"width:989.96875px;max-width:100%;margin-inline:auto\" id=\"w10-3-diagram-4\" width=\"989.96875\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" height=\"1744.078125\" viewBox=\"4 4 989.96875 1744.078125\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\">\u003cg>\u003cmarker id=\"w10-3-diagram-4_flowchart-v2-pointEnd\" class=\"marker flowchart-v2\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\">\u003cpath d=\"M 0 0 L 10 5 L 0 10 z\" class=\"arrowMarkerPath\" style=\"stroke-width: 1; stroke-dasharray: 1, 0;\">\u003c/path>\u003c/marker>\u003cmarker id=\"w10-3-diagram-4_flowchart-v2-pointStart\" class=\"marker flowchart-v2\" viewBox=\"0 0 10 10\" refX=\"4.5\" refY=\"5\" markerUnits=\"userSpaceOnUse\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\">\u003cpath d=\"M 0 5 L 10 10 L 10 0 z\" class=\"arrowMarkerPath\" style=\"stroke-width: 1; stroke-dasharray: 1, 0;\">\u003c/path>\u003c/marker>\u003cmarker id=\"w10-3-diagram-4_flowchart-v2-pointEnd-margin\" class=\"marker flowchart-v2\" viewBox=\"0 0 11.5 14\" refX=\"11.5\" refY=\"7\" mark e=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">結算 B 的命中候選\u003c/text>\u003ctext x=\"375\" y=\"186\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">TryApplyHit() → QueueStun()\u003c/text>\u003cline x1=\"76\" y1=\"223\" x2=\"673\" y2=\"223\" class=\"messageLine0\" data-et=\"message\" data-id=\"i1\" data-from=\"W\" data-to=\"B\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-7-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"275\" y=\"238\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">套用排入的硬直或擊倒\u003c/text>\u003ctext x=\"275\" y=\"259\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">ApplyPendingStun()\u003c/text>\u003cline x1=\"76\" y1=\"296\" x2=\"473\" y2=\"296\" class=\"messageLine0\" data-et=\"message\" data-id=\"i2\" data-from=\"W\" data-to=\"A\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-7-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"375\" y=\"311\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">ApplyPendingStun()\u003c/text>\u003cline x1=\"76\" y1=\"348\" x2=\"673\" y2=\"348\" class=\"messageLine0\" data-et=\"message\" data-id=\"i3\" data-from=\"W\" data-to=\"B\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-7-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"275\" y=\"363\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">判勝負\u003c/text>\u003ctext x=\"275\" y=\"384\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">ResolveMatchOutcome()\u003c/text>\u003cline x1=\"76\" y1=\"421\" x2=\"473\" y2=\"421\" class=\"messageLine0\" data-et=\"message\" data-id=\"i4\" data-from=\"W\" data-to=\"A\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-7-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003ctext x=\"375\" y=\"436\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-family: &quot;Microsoft JhengHei&quot;; font-size: 16px; font-weight: 400;\">ResolveMatchOutcome()\u003c/text>\u003cline x1=\"76\" y1=\"473\" x2=\"673\" y2=\"473\" class=\"messageLine0\" data-et=\"message\" data-id=\"i5\" data-from=\"W\" data-to=\"B\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#w10-3-diagram-7-arrowhead)\" style=\"fill: none;\">\u003c/line>\u003c/svg>\u003c/figure>\u003cp>\u003cstrong>對照重點\u003c/strong>：圖 1 回答「一次命中會得到哪種結果」，圖 2 回答「狀態之間能怎麼轉」，圖 3 回答「為什麼解除鎖定看計時器、不看動畫」，圖 4 回答「為什麼同幀雙倒時沒有勝方」。\u003c/p>\u003ch4 id=\"reading-3016378a\">想一想\u003c/h4>\u003cp>\u003cstrong>問題\u003c/strong>：\u003ccode>AM_Hitted\u003c/code> 只有 0.333 秒（20 幀）。受擊時，比較 Hitstun 為 12 與 30 兩種情況：\u003c/p>\u003col>\n\u003cli>Hitstun＝12：挨打動作還沒播完，能動了嗎？\u003c/li>\n\u003cli>Hitstun＝30：挨打動作已經播完，能動了嗎？\u003c/li>\n\u003cli>為什麼？\u003c/li>\n\u003c/ol>\u003cul>\n\u003cli>\u003cstrong>參考答案\u003c/strong>：Hitstun＝12 時\u003cstrong>能動\u003c/strong>。第 12 幀計時器到期，\u003ccode>HandleStunExpired()\u003c/code> 用資產的 Blend Out 收掉動作，CPU 回到 Neutral，動作還沒播完也一樣。Hitstun＝30 時\u003cstrong>還不能動\u003c/strong>。動作第 20 幀播完時，\u003ccode>HandleReactionEnded()\u003c/code> 只釋放播放身分，CPU 停在待機姿勢，但狀態仍是 Hitstun，要到第 30 幀（0.5 秒）計時器到期才解除。原因是\u003cstrong>鎖定只看計時器，動畫只負責畫面\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>判讀重點\u003c/strong>：學生能分清「動畫播完」與「鎖定解除」是兩件事，並指出解除鎖定的是 World 計時器。\u003c/li>\n\u003cli>\u003cstrong>可以追問\u003c/strong>：「把輕擊的 Hitstun 從 12 改成 30 並 Reimport，要重開 PIE 嗎？」答：不用，硬直是在命中當下查表，下一次命中就用 30。「CPU 硬直還剩 0.3 秒時又被打中一次 Hitstun 12，最後總共鎖多久？」答：重新起算為 0.2 秒，不是 0.3＋0.2，也不是取較長的 0.3。\u003c/li>\n\u003c/ul>\u003ch4 id=\"reading-fa6610d2\">把需求交給 AI 實作\u003c/h4>\u003cp>提示詞分兩段：\u003cstrong>設計先講玩家看到什麼，工程再把它轉成系統規格\u003c/strong>。工程提示詞沿用 week-08 實作題的方法：\u003cstrong>先定義資料與介面，再規劃 Init → Tick → End，最後接入遊戲流程\u003c/strong>，並要求 AI 先回覆規格、經確認後才改程式。\u003c/p>\u003ch5 id=\"reading-579f828\">設計提需求\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># Hitstun 與 Blockstun\n## 玩家體驗\n打中對手時，對手要僵住一下；被擋下時也會僵住，但時間比較短。\n\n## 規則\n- 兩種硬直的長度都寫在傷害表，單位是幀（Frame），1 幀是 1/60 秒，每招可以不同。\n- 僵多久只看傷害表，跟動畫長短無關。\n- 硬直中再被打，用新的一擊重新算。\n- 這次不做擊退和削血。\n\n## 驗收畫面\n打中和防住各看一次；改傷害表後再打，僵住的時間要跟著變。\n\u003c/code>\u003c/pre>\u003ch5 id=\"reading-5bf508a4\">工程給提示詞\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># 目標\n依附上的「Hitstun 與 Blockstun」設計需求，讓玩家與 CPU 共用的 AFightingCharacter 由傷害表驅動兩種硬直。\n\n## 請依以下順序提出規格\n1. 定義資料與介面：傷害表要新增哪些欄位與驗證；角色如何表示 Hitstun、Blockstun；命中時要問受擊方什麼。\n2. Init：角色開始時的初始狀態；既有的反應中判斷要如何改讀新狀態，讓重構後行為不變。\n3. Tick：命中時如何分出防住與打中；硬直如何計時，到期後回到哪個狀態；硬直中再被打如何重新起算。\n4. End：EndPlay 與反覆 PIE 時如何清掉計時器與狀態。\n5. 接入與測試：移動、出招與 CPU StateTree 的行動資格接到哪裡；列出對應設計驗收的測試案例。\n\n## 回覆方式\n先閱讀專案中相關的既有程式與資產，再回覆以上五項規格與要修改的檔案。完成後回報每個驗收案例的 PIE 結果，未實測的標明未驗證。\n\n## 施工方式\n開工前先跟我確認規格。之後依規格順序一次做一項，每完成一項，經我確認無誤後 commit，再做下一項。\n\u003c/code>\u003c/pre>\u003ch3 id=\"w10-3-9\">課堂示範 2｜暫停、變速與逐格除錯\u003c/h3>\u003ch4 id=\"reading-3e06a578\">設計需求\u003c/h4>\u003cul>\n\u003cli>\u003cstrong>要解決的問題\u003c/strong>：檢查硬直、Link 窗口與 Hitbox 有效期時，原本只能開 Console 輸入 \u003ccode>pause\u003c/code>、\u003ccode>slomo 0.5\u003c/code>、\u003ccode>tnda.Debug.ShowCombatDebug on\u003c/code>。動作一快就錯過要看的那一幀，也沒辦法在暫停中\u003cstrong>剛好前進一幀\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>Space\u003c/code>｜暫停／恢復\u003c/strong>：與 Console \u003ccode>pause\u003c/code> 共用引擎的暫停狀態，兩種方式混用不會互相打架。\u003c/li>\n\u003cli>\u003cstrong>小鍵盤 \u003ccode>+\u003c/code>／\u003ccode>-\u003c/code>｜變速\u003c/strong>：時間倍率固定六檔 \u003cstrong>×0.125、×0.25、×0.5、×1、×2、×4\u003c/strong>，到兩端停住。暫停中也能調，恢復後沿用。倍率不在檔位上時（例如先下過 \u003ccode>slomo 0.3\u003c/code>），先對齊最近的檔位再移一格。\u003c/li>\n\u003cli>\u003cstrong>小鍵盤 \u003ccode>.\u003c/code>｜逐格\u003c/strong>：暫停中前進\u003cstrong>一個設計幀（1/60 遊戲秒）\u003c/strong>，不受目前倍率與實際 FPS 影響。未暫停時按下只會暫停、不前進；按住不連發；上一格還沒走完時再按會被忽略。\u003c/li>\n\u003cli>\u003cstrong>右 \u003ccode>Ctrl\u003c/code>＋\u003ccode>F12\u003c/code>｜切換 Combat Debug\u003c/strong>：效果等同 \u003ccode>tnda.Debug.ShowCombatDebug on|off\u003c/code>。左 \u003ccode>Ctrl\u003c/code>＋\u003ccode>F12\u003c/code> 與單獨 \u003ccode>F12\u003c/code> 不動作；暫停中也能切換。\u003c/li>\n\u003cli>\u003cstrong>回饋\u003c/strong>：每次按熱鍵都寫一行 Log，並顯示約 2 秒的畫面訊息。Combat Debug 1P 面板的最後一行是時間狀態：執行中為 \u003ccode>Time x0.5\u003c/code>，暫停中為 \u003ccode>Time x0.5 | PAUSED | Step 3\u003c/code>。Step 是這次暫停以來前進的格數，恢復執行就歸零。\u003c/li>\n\u003cli>\u003cstrong>暫停不改變戰鬥結果\u003c/strong>：硬直計時器、CommandBuffer 期限與 CPU 等待都用 World 遊戲時間計算，所以\u003cstrong>暫停時不流逝，變速時等比縮放\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>UE 已提供、遊戲要自己定義的部分\u003c/strong>：引擎已有暫停（\u003ccode>SetPause\u003c/code>）、時間倍率（\u003ccode>SetGlobalTimeDilation\u003c/code>）、World Settings 的幀時間上下限，以及「暫停中仍執行」的按鍵綁定。檔位、逐格的兩個階段、左右 \u003ccode>Ctrl\u003c/code> 的判定與時間行格式，是本專案自己定義的規則。\u003c/li>\n\u003cli>\u003cstrong>範圍\u003c/strong>：只存在於非 Shipping 組態；不新增 Input Action，也不改 \u003ccode>IMC_Combat\u003c/code>。Windows 在附加除錯器時會攔截 \u003ccode>F12\u003c/code>，這是已知限制。\u003c/li>\n\u003c/ul>\u003ch4 id=\"reading-4a2bf150\">程式碼增刪異動處\u003c/h4>\u003cp>\u003cstrong>異動歷程\u003c/strong>：\u003ccode>176fc72a\u003c/code> 熱鍵規格與工單 → \u003ccode>7f645243\u003c/code> Space 暫停 → \u003ccode>2db58fd7\u003c/code> 倍率檔位 → \u003ccode>28407232\u003c/code> 逐格 → \u003ccode>0cb2cdfd\u003c/code> 右 Ctrl＋F12 → \u003ccode>03c8018a\u003c/code> 逐格第二階段改在 Tick → \u003ccode>9a82c654\u003c/code> 補類別說明 → \u003ccode>1a068296\u003c/code> 逐格改用 World 幀時間上下限 → \u003ccode>d9b23cc2\u003c/code> CHANGELOG。以下只節錄 week-10 的最終寫法；week-09 的 \u003ccode>AFightingPlayerController\u003c/code> 只負責掛 Mapping Context 與提供相機旋轉，除錯熱鍵全部是本週新增。\u003c/p>\u003cp>\u003cstrong>本段要看懂的改動\u003c/strong>：依序閱讀：① 暫停中也收得到按鍵 → ② 倍率在六個檔位間移動 → ③ 逐格：解除暫停一幀，再停回來 → ④ Combat Debug 切換與面板時間行。主要檔案為 \u003ccode>FightingPlayerController.cpp\u003c/code>，面板時間行在 \u003ccode>FightingPlayerCharacter.cpp\u003c/code>。\u003c/p>\u003cp>例：1P 的 U 打中 CPU，CPU 進入 12 幀 Hitstun（0.2 秒）。教師在命中那一幀按 \u003ccode>Space\u003c/code> 停住，再按 3 下小鍵盤 \u003ccode>.\u003c/code>。面板顯示 \u003ccode>Time x1.0 | PAUSED | Step 3\u003c/code>，CPU 的硬直剩 9 幀。\u003c/p>\u003cp id=\"reading-fe028964\">\u003cstrong>① 暫停中也收得到按鍵\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingPlayerController.cpp｜SetupInputComponent()｜week-10\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">   \u003cspan class=\"syn-number\">35\u003c/span>  \u003cspan class=\"syn-type\">void\u003c/span> \u003cspan class=\"syn-type\">AFightingPlayerController\u003c/span>::\u003cspan class=\"syn-function\">SetupInputComponent\u003c/span>()\n   \u003cspan class=\"syn-number\">36\u003c/span>  {\n   \u003cspan class=\"syn-number\">37\u003c/span>      Super::\u003cspan class=\"syn-function\">SetupInputComponent\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+  52  \u003c/span>#\u003cspan class=\"syn-keyword\">if\u003c/span> !\u003cspan class=\"syn-constant\">UE_BUILD_SHIPPING\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  53  \u003c/span>    \u003cspan class=\"syn-comment\">// 除錯熱鍵以 C++ 直接綁鍵而非 Input Action，Shipping 才能靠編譯條件整段排除、不留資產。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  54  \u003c/span>    \u003cspan class=\"syn-comment\">// 綁在 Controller：暫停與時間倍率屬於 World，不隨角色 KnockedOut／Victory 停止輸入。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  55  \u003c/span>    \u003cspan class=\"syn-comment\">// bExecuteWhenPaused 必須開啟，否則暫停後收不到按鍵，永遠無法恢復。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  56  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (\u003cspan class=\"syn-function\">IsLocalPlayerController\u003c/span>() &amp;&amp; InputComponent)\n\u003cspan class=\"syn-prefix syn-added\">+  57  \u003c/span>    {\n\u003cspan class=\"syn-prefix syn-added\">+  58  \u003c/span>        InputComponent-&gt;\u003cspan class=\"syn-function\">BindKey\u003c/span>(\u003cspan class=\"syn-type\">EKeys\u003c/span>::SpaceBar, IE_Pressed, this, &amp;\u003cspan class=\"syn-type\">AFightingPlayerController\u003c/span>::ToggleDebugPause).bExecuteWhenPaused = \u003cspan class=\"syn-keyword\">true\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+  59  \u003c/span>        InputComponent-&gt;\u003cspan class=\"syn-function\">BindKey\u003c/span>(\u003cspan class=\"syn-type\">EKeys\u003c/span>::Add, IE_Pressed, this, &amp;\u003cspan class=\"syn-type\">AFightingPlayerController\u003c/span>::IncreaseDebugTimeScale).bExecuteWhenPaused = \u003cspan class=\"syn-keyword\">true\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+  60  \u003c/span>        InputComponent-&gt;\u003cspan class=\"syn-function\">BindKey\u003c/span>(\u003cspan class=\"syn-type\">EKeys\u003c/span>::Subtract, IE_Pressed, this, &amp;\u003cspan class=\"syn-type\">AFightingPlayerController\u003c/span>::DecreaseDebugTimeScale).bExecuteWhenPaused = \u003cspan class=\"syn-keyword\">true\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+  61  \u003c/span>        \u003cspan class=\"syn-comment\">// 只綁 Pressed：按住時的鍵盤重複送的是 Repeat，不會連續逐格。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  62  \u003c/span>        InputComponent-&gt;\u003cspan class=\"syn-function\">BindKey\u003c/span>(\u003cspan class=\"syn-type\">EKeys\u003c/span>::Decimal, IE_Pressed, this, &amp;\u003cspan class=\"syn-type\">AFightingPlayerController\u003c/span>::StepDebugFrame).bExecuteWhenPaused = \u003cspan class=\"syn-keyword\">true\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+  63  \u003c/span>        InputComponent-&gt;\u003cspan class=\"syn-function\">BindKey\u003c/span>(\u003cspan class=\"syn-type\">EKeys\u003c/span>::\u003cspan class=\"syn-constant\">F12\u003c/span>, IE_Pressed, this, &amp;\u003cspan class=\"syn-type\">AFightingPlayerController\u003c/span>::ToggleCombatDebugHotkey).bExecuteWhenPaused = \u003cspan class=\"syn-keyword\">true\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+  64  \u003c/span>    }\n\u003cspan class=\"syn-prefix syn-added\">+  65  \u003c/span>#endif\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingPlayerController.cpp｜ToggleDebugPause()｜week-10\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 194  \u003c/span>\u003cspan class=\"syn-type\">void\u003c/span> \u003cspan class=\"syn-type\">AFightingPlayerController\u003c/span>::\u003cspan class=\"syn-function\">ToggleDebugPause\u003c/span>()\n\u003cspan class=\"syn-prefix syn-added\">+ 195  \u003c/span>{\n\u003cspan class=\"syn-prefix syn-added\">+ 196  \u003c/span>    \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">UWorld\u003c/span>* \u003cspan class=\"syn-declaration\">World\u003c/span> = \u003cspan class=\"syn-function\">GetWorld\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+ 197  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (!\u003cspan class=\"syn-function\">IsValid\u003c/span>(World))\n\u003cspan class=\"syn-prefix syn-added\">+ 198  \u003c/span>    {\n\u003cspan class=\"syn-prefix syn-added\">+ 199  \u003c/span>        \u003cspan class=\"syn-keyword\">return\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 200  \u003c/span>    }\n\u003cspan class=\"syn-prefix syn-added\">+ 201  \u003c/span>    \u003cspan class=\"syn-function\">SetPause\u003c/span>(! \">1.0f\u003c/span>, \u003cspan class=\"syn-number\">2.0f\u003c/span>, \u003cspan class=\"syn-number\">4.0f\u003c/span> };\n\u003c/code>\u003c/pre>\u003cp>\u003ccode>FightingPlayerController.cpp｜StepDebugTimeScale()｜week-10\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 215  \u003c/span>\u003cspan class=\"syn-type\">void\u003c/span> \u003cspan class=\"syn-type\">AFightingPlayerController\u003c/span>::\u003cspan class=\"syn-function\">StepDebugTimeScale\u003c/span>(\u003cspan class=\"syn-type\">int32\u003c/span> \u003cspan class=\"syn-declaration\">Direction\u003c/span>)\n\u003cspan class=\"syn-prefix syn-added\">+ 216  \u003c/span>{\n\u003cspan class=\"syn-prefix syn-added\">+ 217  \u003c/span>    \u003cspan class=\"syn-comment\">// 檔位成倍數排列，以 log2 距離找最近檔位，讓 0.3 對齊 ×0.25 而非只看線性差。\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+ 218  \u003c/span>    \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">float\u003c/span> \u003cspan class=\"syn-declaration\">Current\u003c/span> = \u003cspan class=\"syn-type\">FMath\u003c/span>::\u003cspan class=\"syn-function\">Max\u003c/span>(\u003cspan class=\"syn-type\">UGameplayStatics\u003c/span>::\u003cspan class=\"syn-function\">GetGlobalTimeDilation\u003c/span>(this), \u003cspan class=\"syn-constant\">KINDA_SMALL_NUMBER\u003c/span>);\n\u003cspan class=\"syn-prefix syn-added\">+ 219  \u003c/span>    \u003cspan class=\"syn-type\">int32\u003c/span> \u003cspan class=\"syn-declaration\">Nearest\u003c/span> = \u003cspan class=\"syn-number\">0\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 220  \u003c/span>    \u003cspan class=\"syn-keyword\">for\u003c/span> (\u003cspan class=\"syn-type\">int32\u003c/span> \u003cspan class=\"syn-declaration\">Index\u003c/span> = \u003cspan class=\"syn-number\">1\u003c/span>; Index &lt; \u003cspan class=\"syn-macro\">UE_ARRAY_COUNT\u003c/span>(DebugTimeScales); ++I ro\">TEXT\u003c/span>(\u003cspan class=\"syn-string\">\"Faster\"\u003c/span>) : \u003cspan class=\"syn-macro\">TEXT\u003c/span>(\u003cspan class=\"syn-string\">\"Slower\"\u003c/span>));\n\u003cspan class=\"syn-prefix syn-added\">+ 230  \u003c/span>}\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：檔位每格加倍或減半，所以第 222 行用 \u003cstrong>log2 距離\u003c/strong>找最近檔位，而不是看線性差值。例如先下過 \u003ccode>slomo 0.3\u003c/code>：0.3 到 0.25 的 log2 距離約 0.26，到 0.5 約 0.74，最近的是 ×0.25；按 \u003ccode>-\u003c/code> 就移到 ×0.125。第 227 行把目標夾在 0～5 號檔位，到兩端時倍率不變、只重送回饋。\u003ccode>SetGlobalTimeDilation()\u003c/code> 寫回 World Settings；World 每幀把實際經過的時間乘上倍率，硬直、CommandBuffer 與動畫因此一起等比變慢或變快。\u003c/p>\u003cblockquote>\n\u003cp>資料：目前倍率 → 最近檔位 \u003ccode>Nearest\u003c/code> → 移動後的 \u003ccode>Target\u003c/code> → \u003ccode>SetGlobalTimeDilation()\u003c/code> → 下一幀遊戲時間 = 實際幀時間 × 倍率。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-df1d8cff\">\u003cstrong>③ 逐格：解除暫停一幀，再停回來\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingPlayerController.cpp｜StepDebugFrame()｜week-10\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+  24  \u003c/span>    \u003cspan class=\"syn-comment\">/** 逐格長度：一個設計幀。 */\u003c/span>\n\u003cspan class=\"syn-prefix syn-added\">+  25  \u003c/span>    \u003cspan class=\"syn-keyword\">constexpr\u003c/span> \u003cspan class=\"syn-type\">double\u003c/span> \u003cspan class=\"syn-declaration\">DebugStepGameSeconds\u003c/span> = \u003cspan class=\"syn-number\">1.0\u003c/span> / \u003cspan class=\"syn-number\">60.0\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 117  \u003c/span>\u003cspan class=\"syn-type\">void\u003c/span> \u003cspan class=\"syn-type\">AFightingPlayerController\u003c/span>::\u003cspan class=\"syn-function\">StepDebugFrame\u003c/span>()\n\u003cspan class=\"syn-prefix syn-added\">+ 118  \u003c/span>{\n\u003cspan class=\"syn-prefix syn-added\">+ 119  \u003c/span>    \u003cspan class=\" f\u003c/span> (!bDebugStepInProgress)\n\u003cspan class=\"syn-prefix syn-added\">+ 182  \u003c/span>    {\n\u003cspan class=\"syn-prefix syn-added\">+ 183  \u003c/span>        \u003cspan class=\"syn-keyword\">return\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 184  \u003c/span>    }\n\u003cspan class=\"syn-prefix syn-added\">+ 185  \u003c/span>    bDebugStepInProgress = \u003cspan class=\"syn-keyword\">false\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 186  \u003c/span>    \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-type\">UWorld\u003c/span>* \u003cspan class=\"syn-declaration\">World\u003c/span> = \u003cspan class=\"syn-function\">GetWorld\u003c/span>();\n\u003cspan class=\"syn-prefix syn-added\">+ 187  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (\u003cspan class=\"syn-type\">AWorldSettings\u003c/span>* \u003cspan class=\"syn-declaration\">Settings\u003c/span> = \u003cspan class=\"syn-function\">IsValid\u003c/span>(World) ? World-&gt;\u003cspan class=\"syn-function\">GetWorldSettings\u003c/span>() : \u003cspan class=\"syn-keyword\">nullptr\u003c/span>)\n\u003cspan class=\"syn-prefix syn-added\">+ 188  \u003c/span>    {\n\u003cspan class=\"syn-prefix syn-added\">+ 189  \u003c/span>        Settings-&gt;MinUndilatedFrameTime = SavedMinUndilatedFrameTime;\n\u003cspan class=\"syn-prefix syn-added\">+ 190  \u003c/span>        Settings-&gt;MaxUndilatedFrameTime = SavedMaxUndilatedFrameTime;\n\u003cspan class=\"syn-prefix syn-added\">+ 191  \u003c/span>    }\n\u003cspan class=\"syn-prefix syn-added\">+ 192  \u003c/span>}\n\u003c/code>\u003c/pre>\u003cp>\u003cstrong>說明\u003c/strong>：逐格分兩個階段。\u003cstrong>第一階段在按鍵當下\u003c/strong>：沒暫停就只暫停並回報（第 124–128 行）。已暫停時，先保存 World Settings 原本的 \u003ccode>MinUndilatedFrameTime\u003c/code>／\u003ccode>MaxUndilatedFrameTime\u003c/code>，把兩者都設成「1/60 ÷ 目前倍率」，再解除暫停。World 會把「實際幀時間 × 倍率」夾在「上下限 × 倍率」之間；上下限相同時，夾出來一定是 1/60 秒，與 FPS、倍率無關。\u003cstrong>第二階段在下一幀的 \u003ccode>Tick()\u003c/code>\u003c/strong>：\u003ccode>GFrameCounter\u003c/code> 比起點大，表示逐格那一幀已經開始。先還原上下限，再重新暫停並把 Step 加 1。World 在每幀開頭就決定這一幀是否暫停，所以在 Tick 中途呼叫 \u003ccode>SetPause(true)\u003c/code>，不會截斷其他 Actor 本幀的更新。若按下逐格後、下一幀開始前又被 \u003ccode>Space\u003c/code> 或 Console \u003ccode>pause\u003c/code> 停住，那一幀其實沒前進，只回報 \u003ccode>Step cancelled\u003c/code>、不計格數。PIE 在逐格途中結束時，\u003ccode>EndPlay()\u003c/code> 也會呼叫 \u003ccode>RestoreDebugStepTimeStep()\u003c/code> 還原設定。\u003c/p>\u003cblockquote>\n\u003cp>資料：按 \u003ccode>.\u003c/code> → 保存並改寫上下限、\u003ccode>bDebugStepInProgress = true\u003c/code> → 解除暫停 → 下一幀遊戲時間 = 1/60 秒 → \u003ccode>Tick()\u003c/code> 還原上下限、重新暫停、\u003ccode>DebugStepCount + 1\u003c/code>。\u003c/p>\n\u003c/blockquote>\u003cp id=\"reading-c845a3cb\">\u003cstrong>④ Combat Debug 切換與面板時間行\u003c/strong>\u003c/p>\u003cp>\u003ccode>FightingPlayerController.cpp｜ToggleCombatDebugHotkey()｜week-10\u003c/code>\u003c/p>\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-diff syntax-code\">\u003cspan class=\"syn-prefix syn-added\">+ 154  \u003c/span>\u003cspan class=\"syn-type\">void\u003c/span> \u003cspan class=\"syn-type\">AFightingPlayerController\u003c/span>::\u003cspan class=\"syn-function\">ToggleCombatDebugHotkey\u003c/span>()\n\u003cspan class=\"syn-prefix syn-added\">+ 155  \u003c/span>{\n\u003cspan class=\"syn-prefix syn-added\">+ 156  \u003c/span>    \u003cspan class=\"syn-keyword\">if\u003c/span> (!\u003cspan class=\"syn-function\">IsInputKeyDown\u003c/span>(\u003cspan class=\"syn-type\">EKeys\u003c/span>::RightControl) || \u003cspan class=\"syn-function\">IsInputKeyDown\u003c/span>(\u003cspan class=\"syn-type\">EKeys\u003c/span>::LeftControl))\n\u003cspan class=\"syn-prefix syn-added\">+ 157  \u003c/span>    {\n\u003cspan class=\"syn-prefix syn-added\">+ 158  \u003c/span>        \u003cspan class=\"syn-keyword\">return\u003c/span>;\n\u003cspan class=\"syn-prefix syn-added\">+ 159  \u003c/span>    }\n\u003cspan class=\"syn-prefix syn-added\">+ 160  \u003c/span>    \u003cspan
