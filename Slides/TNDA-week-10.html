agram-11-flowchart-W-0\" data-look=\"neo\" transform=\"translate(798.5703125, 69)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-166\" y=\"-57\" width=\"332\" height=\"114\">\u003c/rect>\u003cg class=\"label\" style=\"\" transform=\"translate(-150, -45)\">\u003crect>\u003c/rect>\u003cforeignObject width=\"300\" height=\"90\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center;\">\u003cspan class=\"nodeLabel \">\u003cp>World 遊戲時間\u003cbr>暫停不累加，變速等比\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default  \" id=\"w10-3-diagram-11-flowchart-H-1\" data-look=\"neo\" transform=\"translate(196.609375, 243)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-184.609375\" y=\"-57\" width=\"369.21875\" height=\"114\">\u003c/rect>\u003cg class=\"label\" style=\"\" transform=\"translate(-168.609375, -45)\">\u003crect>\u003c/rect>\u003cforeignObject width=\"337.21875\" height=\"90\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center;\">\u003cspan class=\"nodeLabel \">\u003cp>硬直計時器\u003cbr>Hitstun／Blockstun 剩餘\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default  \" id=\"w10-3-diagram-11-flowchart-B-3\" data-look=\"neo\" transform=\"translate(587.453125, 220.5)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-166.234375\" y=\"-34.5\" width=\"332.46875\" height=\"69\">\u003c/rect>\u003cg class=\"label\" style=\"\" transform=\"translate(-150.234375, -22.5)\">\u003crect>\u003c/rect>\u003cforeignObject width=\"300.46875\" height=\"45\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center;\">\u003cspan class=\"nodeLabel \">\u003cp>CommandBuffer 期限\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default  \" id=\"w10-3-diagram-11-flowchart-C-5\" data-look=\"neo\" transform=\"translate(1009.6875, 265.5)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-216\" y=\"-79.5\" width=\"432\" height=\"159\">\u003c/rect>\u003cg class=\"label\" style=\"\" transform=\"translate(-200, -67.5)\">\u003crect>\u003c/rect>\u003cforeignObject width=\"400\" height=\"135\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 400px; text-align: center; width: 400px;\">\u003cspan class=\"nodeLabel \">\u003cp>CPU Wait 期限\u003cbr>GetTimeSeconds() + WaitDuration\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default  \" id=\"w10-3-diagram-11-flowchart-A-7\" data-look=\"neo\" transform=\"translate(1458.875, 220.5)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-193.1875\" y=\"-34.5\" width=\"386.375\" height=\"69\">\u003c/rect>\u003cg class=\"label\" style=\"\" transform=\"translate(-177.1875, -22.5)\">\u003crect>\u003c/rect>\u003cforeignObject width=\"354.375\" height=\"45\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 400px; text-align: center;\">\u003cspan class=\"nodeLabel \">\u003cp>攻擊與反應 Montage 播放\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003cdefs>\u003cfilter id=\"w10-3-diagram-11-drop-shadow\" height=\"130%\" width=\"130%\">\u003cfeDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\">\u003c/feDropShadow>\u003c/filter>\u003c/defs>\u003cdefs>\u003cfilter id=\"w10-3-diagram-11-drop-shadow-small\" height=\"150%\" width=\"150%\">\u003cfeDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\">\u003c/feDropShadow>\u003c/filter>\u003c/defs>\u003c/svg>\u003c/figure>\u003cp>\u003cstrong>對照重點\u003c/strong>：圖 1 回答「逐格的兩個階段各在什麼時候執行」，圖 2 回答「為什麼逐格長度不受 FPS 與倍率影響」，圖 3 回答「檔位如何移動、到兩端會怎樣」，圖 4 回答「為什麼暫停與變速不改變戰鬥結果」。\u003c/p>\u003ch4 id=\"reading-6b559f4c\">想一想\u003c/h4>\u003cp>\u003cstrong>問題\u003c/strong>：1P 的 U 打中 CPU，CPU 進入 12 幀 Hitstun。教師在命中那一幀按 \u003ccode>Space\u003c/code> 停住，先按兩下小鍵盤 \u003ccode>-\u003c/code> 降到 ×0.25，再按 4 下小鍵盤 \u003ccode>.\u003c/code>。\u003cstrong>這時 CPU 的硬直還剩幾幀？按 \u003ccode>Space\u003c/code> 恢復後，剩下的硬直要經過多少真實秒才結束？\u003c/strong>\u003c/p>\u003cul>\n\u003cli>\u003cstrong>參考答案\u003c/strong>：剩 \u003cstrong>8 幀\u003c/strong>。暫停中改倍率不會讓時間流逝；逐格的每一格固定是 1/60 遊戲秒，不受 ×0.25 影響，4 格就是 4 幀。恢復後遊戲時間以 ×0.25 前進，剩下的 8/60 遊戲秒需要 8/60 ÷ 0.25 ≈ \u003cstrong>0.53 真實秒\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>判讀重點\u003c/strong>：學生能分清「遊戲時間」與「真實時間」：硬直以遊戲時間倒數，暫停時不動，變速時等比變慢；逐格是直接把一幀的遊戲時間定成 1/60 秒。\u003c/li>\n\u003cli>\u003cstrong>可以追問\u003c/strong>：「如果沒有先按 \u003ccode>Space\u003c/code>，直接按小鍵盤 \u003ccode>.\u003c/code> 呢？」答：只會暫停，Step 為 0，硬直不減少。「按下 \u003ccode>.\u003c/code> 後、下一幀開始前又按了 \u003ccode>Space\u003c/code>？」答：那一幀沒有前進，Log 寫 \u003ccode>Step cancelled\u003c/code>，不計格數。\u003c/li>\n\u003c/ul>\u003ch4 id=\"reading-d103b75c\">把需求交給 AI 實作\u003c/h4>\u003cp>提示詞分兩段：\u003cstrong>設計先講使用者看到什麼，工程再把它轉成系統規格\u003c/strong>。工程提示詞沿用 week-08 實作題的方法：\u003cstrong>先定義資料與介面，再規劃 Init → Tick → End，最後接入遊戲流程\u003c/strong>，並要求 AI 先回覆規格、經確認後才改程式。\u003c/p>\u003ch5 id=\"reading-d5b81c76\">設計提需求\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># 暫停、變速與逐格除錯熱鍵\n## 玩家體驗\n教師在對戰中按一個鍵就能停住畫面、放慢或加快，並在停住時一次前進一個設計幀，看清楚硬直與出招時機；不必開 Console 打指令。\n\n## 規則\n- Space：暫停／恢復，和 Console 的 pause 是同一個暫停。\n- 小鍵盤 + / -：倍率在 ×0.125、×0.25、×0.5、×1、×2、×4 之間移動，到頂或到底停住；暫停中也能調，恢復後沿用。\n- 小鍵盤 .：暫停中前進剛好 1/60 遊戲秒，不受倍率與實際 FPS 影響；沒暫停時按下只暫停；按住不連發。\n- 右 Ctrl + F12：開關 Combat Debug；左 Ctrl + F12 與單獨 F12 不動作。\n- 每次按鍵都有約 2 秒的畫面訊息；Combat Debug 面板顯示倍率、是否暫停與這次暫停前進了幾格。\n- 暫停與變速不改變任何戰鬥結果；正式版（Shipping）沒有這些熱鍵。\n\n## 驗收畫面\n暫停後恢復、與 Console pause 混用、逐格 4 次後硬直剛好少 4 幀（×1 與 ×0.25 各一次）、沒暫停時按逐格、倍率按到兩端、暫停中改倍率後恢復、右 Ctrl+F12 開關與左 Ctrl+F12 無反應。\n\u003c/code>\u003c/pre>\u003ch5 id=\"reading-7456c4ba\">工程給提示詞\u003c/h5>\u003cpre>\u003ccode class=\"language-markdown\"># 目標\n依附上的「暫停、變速與逐格除錯熱鍵」設計需求，在本機格鬥玩家 Controller 加入非 Shipping 的除錯熱鍵。\n\n## 請依以下順序提出規格\n1. 定義資料與介面：熱鍵由哪個類別負責、要保存哪些逐格狀態與倍率檔位；面板如何讀取時間狀態。\n2. Init：在哪個時機綁定按鍵，如何確保暫停中仍收得到按鍵，以及正式版如何排除。\n3. Tick：逐格如何讓下一幀的遊戲時間剛好是 1/60 秒，再於哪個時機重新暫停、還原設定與計數；同一幀又被暫停時如何處理。\n4. End：PIE 在逐格途中結束時，如何還原被改過的時間設定。\n5. 接入與測試：如何與既有的暫停指令、Combat Debug 指令及面板共用狀態；列出對應設計驗收的測試案例。\n\n## 回覆方式\n先閱讀專案中相關的既有程式與資產，再回覆以上五項規格與要修改的檔案。完成後回報每個驗收案例的 PIE 結果，未實測的標明未驗證。\n\n## 施工方式\n開工前先跟我確認規格。之後依規格順序一次做一項，每完成一項，經我確認無誤後 commit，再做下一項。\n\u003c/code>\u003c/pre>\u003ch2 id=\"w10-3-10\">課堂實作\u003c/h2>\u003ch3 id=\"w10-3-11\">課堂實作 1｜鐵壁 CPU，找出還打得進去的攻略\u003c/h3>\u003ch4 id=\"reading-aa8b1caf\">題目\u003c/h4>\u003cp>在 \u003ccode>/Game/Fighting/AI/ST_FightingCpu\u003c/code> 把根參數 \u003ccode>DefenseChance\u003c/code> 改成 1.0，Compile 後存檔，讓 CPU 擋下每一次從空檔起手的攻擊。接著依課前預習 1 的攻略，找出至少兩種仍能打中 CPU 的方法，分享畫面實機展示，並用時間軸口頭說明為什麼成立；也要說明課前實作練習 1 的連打，為什麼在鐵壁 CPU 面前失效。\u003c/p>\u003ch4 id=\"reading-9e0b17b7\">參考答案\u003c/h4>\u003cp>\u003cstrong>兩種解法都繞過了防禦抽籤，不是抽籤剛好沒抽中\u003c/strong>：方法 1 趁 CPU 出招中，方法 2 趁 CPU 還在硬直中，這兩段時間 CPU 都沒有防禦資格。以下以 \u003ccode>DefenseChance\u003c/code> 1.0、60 FPS、CPU AI 開啟的 PIE 實測確認。\u003c/p>\u003col>\n\u003cli>\u003cp>\u003cstrong>改參數。\u003c/strong> 停止 PIE，雙擊開啟 \u003ccode>/Game/Fighting/AI/ST_FightingCpu\u003c/code>。在 StateTree 編輯器左側的 \u003cstrong>Parameters\u003c/strong> 找到 \u003ccode>DefenseChance\u003c/code>，把 0.5 改成 1.0。按工具列的 \u003cstrong>Compile\u003c/strong>，再按 \u003cstrong>Save\u003c/strong>。\u003cstrong>只改值、不編譯時，執行期仍讀到舊值\u003c/strong>（以腳本改值但未編譯，實測不生效）。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>確認鐵壁成立。\u003c/strong> 開 PIE，CPU 走近後按 \u003ccode>U\u003c/code>。不論重試幾次，CPU 都防住（實測 4 個亂數種子，抽到 0.348、0.531、0.623、0.714 全部防住；原本 0.5 時後三個不會防）。U→I 的 I 和 U 同一序列，也一起被防。打開 Combat Debug（右 \u003ccode>Ctrl\u003c/code>＋\u003ccode>F12\u003c/code>），CPU 面板的 \u003ccode>Roll\u003c/code> 每次都小於 1.0。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>練習 1 為什麼失效。\u003c/strong> 輕擊 Hitstun 即使是 80，第一記就被防，CPU 只吃 8 幀 Blockstun，第 30 幀就恢復；你的下一記在 CPU 回到 Neutral 後才起手，是新序列，CPU 又抽到防禦。實測連按 8 次全部被防。\u003cstrong>長 Hitstun 要先打中一次才有用，鐵壁 CPU 不給這個起點。\u003c/strong>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>方法 1：背牆防住後立刻 U（確反）。\u003c/strong> 先走到場地邊緣，讓背後貼著邊界牆，再按住後退（遠離 CPU 的方向）不放，等 CPU 走近出手。背後有牆時後退走不動，CPU 才打得到你；在場地中間按住後退，1P 會一路退開，CPU 的攻擊全部揮空（實測）。防住 CPU 的 U 後，1P 進入 \u003ccode>Blockstun\u003c/code>，解除後放開後退並按 \u003ccode>U\u003c/code>。\u003c/p>\n\u003cp>先算優勢幀。CPU 的 U 被防是 －29，站在防守方就是 \u003cstrong>＋29\u003c/strong>：以 CPU 起手為第 0 幀，你第 30 幀解除，CPU 第 59 幀才恢復。\u003cstrong>這 29 幀就是可以按的時間\u003c/strong>，因為按下時 CPU 還在 \u003ccode>Attacking\u003c/code>，這一波沒有抽防禦的資格。U 打到的時間可以晚於 CPU 恢復。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>防住的招式\u003c/th>\n\u003cth align=\"right\">你解除\u003c/th>\n\u003cth align=\"right\">CPU 恢復\u003c/th>\n\u003cth align=\"right\">你的優勢幀\u003c/th>\n\u003cth align=\"right\">按 U 會打中\u003c/th>\n\u003cth align=\"right\">按 U 會被防\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>U\u003c/td>\n\u003ctd align=\"right\">第 30 幀\u003c/td>\n\u003ctd align=\"right\">第 59 幀\u003c/td>\n\u003ctd align=\"right\">＋29\u003c/td>\n\u003ctd align=\"right\">第 30～58 幀\u003c/td>\n\u003ctd align=\"right\">第 59 幀起\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I\u003c/td>\n\u003ctd align=\"right\">第 35 幀\u003c/td>\n\u003ctd align=\"right\">第 59 幀\u003c/td>\n\u003ctd align=\"right\">＋24\u003c/td>\n\u003ctd align=\"right\">第 35～58 幀\u003c/td>\n\u003ctd align=\"right\">第 59 幀起\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>解除時立刻按 U，第 31 幀起手，第 53 幀打中；CPU 就算用 Link 接了 I，I 第 61 幀才會打到，也先被打斷。實測背牆時「一直按住後退」與「看到 CPU 出手才按後退」各 5 個種子，全部命中；這組在 \u003ccode>DefenseChance\u003c/code> 0.5 下測，確反時 CPU 正在出招、不抽防禦，結果與 1.0 無關。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>方法 2：踢頭的長硬直。\u003c/strong> 把練習 2 的設定套回：\u003ccode>DamageTable.csv\u003c/code> 右腳踢頭改成 \u003ccode>2,右腳踢頭,15,120,120\u003c/code>，Reimport \u003ccode>DT_Damage\u003c/code>。CPU 在 120 cm 內時出 6＋U，鐵壁 CPU 一定防住，但會進入 120 幀 Blockstun；1P 收招後的 U 起手時 CPU 仍在硬直、沒有防禦資格，所以打中（實測 2 個種子全中）。CPU 走近途中在約 135 cm 出腳時，CPU 還沒進入防禦距離，踢頭直接打中，U 同樣接得上（在 0.5 下實測；距離超過 120 cm 時不抽防禦，推定 1.0 相同）。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>口頭說明要點。\u003c/strong> 學生要說出：抽籤只在「新序列出現且 CPU 為 Neutral／Defending、距離 ≤ 120 cm」時發生；方法 1 時 CPU 正在 \u003ccode>Attacking\u003c/code>，方法 2 時 CPU 正在 \u003ccode>Blockstun\u003c/code>，都不符合抽籤條件。可以追問：「如果把 CPU 的 \u003ccode>WaitDuration\u003c/code> 縮短，方法 1 會不會受影響？」答：不會；確反發生在 CPU 這一招出完之前，和防禦後的等待無關。\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>還原。\u003c/strong> 停止 PIE，把 \u003ccode>DefenseChance\u003c/code> 改回 0.5，Compile、Save；\u003ccode>DamageTable.csv\u003c/code> 右腳踢頭改回 \u003ccode>2,右腳踢頭,15,18,12\u003c/code> 並 Reimport \u003ccode>DT_Damage\u003c/code>。也可以直接用版控還原 \u003ccode>ST_FightingCpu\u003c/code> 與 \u003ccode>DT_Damage\u003c/code>。\u003c/p>\n\u003c/li>\n\u003c/ol>\u003cp>教師備註：學生在 StateTree 編輯器 Compile、Save 的操作流程，以及 CSV Reimport 流程，沒有實際操作驗證；\u003ccode>DefenseChance\u003c/code> 1.0 的效果是以 \u003ccode>StateTreeService\u003c/code> 改值並編譯後，在 PIE 實測確認。CPU AI 開啟的確反實測由腳本在 1P 解除 Blockstun 的第一幀按 U；表中的按鍵範圍以 \u003ccode>DefenseChance\u003c/code> 1.0、腳本讓 CPU 站定出招測得，防住的命中幀依距離可能差 1 幀，範圍的結束點都是第 58 幀。第 59 幀起 CPU 回到待機，新一波才會抽防禦。\u003c/p>\u003c/article>\u003c/body>\u003c/html>","anchors":["w10-3-4","w10-3-5","w10-3-diagram-1","actor2","root-2","actor1","root-1","actor0","root-0","w10-3-diagram-1-computer","w10-3-diagram-1-database","w10-3-diagram-1-clock","w10-3-diagram-1-arrowhead","w10-3-diagram-1-crosshead","w10-3-diagram-1-filled-head","w10-3-diagram-1-sequencenumber","w10-3-diagram-1-solidTopArrowHead","w10-3-diagram-1-solidBottomArrowHead","w10-3-diagram-1-stickTopArrowHead","w10-3-diagram-1-stickBottomArrowHead","w10-3-diagram-1-drop-shadow","w10-3-6","w10-3-diagram-2","actor5","root-5","actor4","root-4","actor3","root-3","w10-3-diagram-2-computer","w10-3-diagram-2-database","w10-3-diagram-2-clock","w10-3-dia ","note":"本頁案例：U 打中 CPU，CPU 沒防住，扣血後還有血。","key":"打中的當下才查表，所以 Reimport 後，下一次打中就用新數值。","location":"FightingCharacter.cpp｜TryApplyHit()／QueueStun()／BeginStun()／HandleStunExpired()","lessonRefs":[{"href":"#w10-3-6","label":"追蹤路徑二｜步驟 5～7","hint":""}],"lanes":["攻擊方命中","受擊方","World 計時器"],"messages":[{"a":0,"b":0,"text":"① 讀 U 的 Damage 列\nTryGetDamage()","returned":false},{"a":0,"b":1,"text":"② 現在有防禦意圖嗎？\nEvaluateDefenseIntent()","returned":false},{"a":0,"b":1,"text":"③ 排入 12 幀挨打硬直\nQueueStun()","returned":false},{"a":1,"b":2,"text":"④ 12 ÷ 60＝0.2 秒後到期\nBeginStun() → SetTimer()","returned":false},{"a":2,"b":1,"text":"⑤ 到期，恢復可行動\nHandleStunExpired()","returned":false}],"steps":[{"title":"完整流程","detail":"打中的當下才查表，所以 Reimport 後，下一次打中就用新數值。","focus":[]}],"topicLabel":"流程與教案索引","overview":[{"title":"① 查資料","detail":"讀 U 的 Damage 列：傷害 10、Hitstun 12 幀。"},{"title":"② 判斷防禦、扣血","detail":"CPU 沒防住，扣 10 血後還有血。"},{"title":"③ 記下硬直","detail":"排入 12 幀挨打硬直，稍後才套用。"},{"title":"④ 開始倒數","detail":"套用硬直，設定 0.2 秒計時器。"},{"title":"⑤ 到期恢復","detail":"解除硬直，恢復可行動。"}]},{"page":6,"title":"流程：雙方同一幀互打，為什麼不會只算一邊？","demo":1,"kind":"sequence","note":"本頁案例：A、B 的攻擊在同一幀各自命中，雙方都沒防住。","key":"雙方先扣血，再套用硬直或擊倒，最後判勝負。","location":"FightingCharacter.cpp｜HandleWorldPostActorTick()，第 1381～1407 行","lessonRefs":[{"href":"#reading-ba2a7da0","label":"② 命中先問防禦意圖，再決定結果","hint":""},{"href":"#reading-fd519232","label":"程式流程圖","hint":""}],"lanes":["World 後段","角色 A","角色 B"],"messages":[{"a":0,"b":1,"text":"① 處理 A 打中 B\nTryApplyHit()","returned":false,"phase":1},{"a":0,"b":2,"text":"① 處理 B 打中 A\nTryApplyHit()","returned":false,"phase":1},{"a":0,"b":1,"text":"② 套用 A 的硬直或擊倒\nApplyPendingStun()","returned":false,"phase":2},{"a":0,"b":2,"text":"② 套用 B 的硬直或擊倒\nApplyPendingStun()","returned":false,"phase":2},{"a":0,"b":1,"text":"③ 判 A 的勝負\nResolveMatchOutcome()","returned":false,"phase":3},{"a":0,"b":2,"text":"③ 判 B 的勝負\nResolveMatchOutcome()","returned":false,"phase":3}],"steps":[{"title":"完整流程","detail":"雙方先扣血，再套用硬直或擊倒，最後判勝負。","focus":[]}],"topicLabel":"流程與教案索引","overview":[{"title":"① 先處理兩拳","detail":"A 打中 B，扣 B 的血；B 打中 A，扣 A 的血。先記下硬直或擊倒，暫時不改雙方狀態。"},{"title":"② 再改雙方狀態","detail":"兩拳都算完，再讓 A、B 進入各自的硬直或擊倒狀態。"},{"title":"③ 最後判勝負","detail":"若雙方都歸零，兩人都倒地，沒有勝方。"}]},{"page":7,"title":"從多個開關，改成一個戰鬥狀態","demo":1,"kind":"state-machine","key":"用一個值記目前狀態，決定何時切換，並處理切換時要做的事。","location":"FightingCharacter.cpp｜QueueStun() 2093／ApplyPendingStun() 2111／SetCombatState() 443","lessonRefs":[{"href":"#reading-a84a5f4c","label":"① 狀態與切換入口","hint":""},{"href":"#reading-ba2a7da0","label":"② 命中與排入結果","hint":""},{"href":"#reading-2846ed4a","label":"③ 進入硬直與到期","hint":""}],"comparison":[["week-09：分別記錄","bIsAttacking：正在攻擊？　bIsReacting：正在播反應？\n攻擊與反應各自設定、清理旗標。"],["week-10：集中表示","CombatState：目前是哪個戰鬥狀態？\n目前為 Attacking，切換後就是 Hitstun。"]],"note":"案例：B 正在出招，被 A 的 U 打中，沒防住，扣血後還有血。","columns":["時點","B 目前的狀態","程式處理"],"rows":[["被打中前","Attacking","B 正在出招。"],["QueueStun() 後","仍是 Attacking","記下待套用狀態 Hitstun 與 12 幀，還不改目前狀態。"],["ApplyPendingStun() 處理後","Hitstun","BeginStun() 停止原攻擊，經 SetCombatState() 切換狀態，設定計時器並播挨打動畫。"],["硬直到期","Neutral 或 Defending","解除硬直，依防禦意圖恢復可行動。"]],"question":"想一想：QueueStun(Hitstun, 12) 後，B 就已經是 Hitstun 了嗎？哪裡才真的改狀態？","steps":[{"title":"完整案例","detail":"從旗標到戰鬥狀態：記下待套用狀態，再由統一入口切換。","focus":[]}],"topicLabel":"流程與教案索引","supplement":{"title":"目前這個遊戲狀態機的設計壞味道","markdown":"# 目前這個遊戲狀態機的設計壞味道\n\n以下先檢視 week-10 的現有設計，再示範採用 State Pattern 的遊戲有限狀態機（Finite State Machine，FSM）。虛擬碼是改善方向，不是目前教材原始碼，也不是可直接貼入專案的完整實作。\n\n## 目前哪裡不好？\n\n1. **狀態放一起，規則還是散的。** 想知道一個狀態怎麼進、怎麼出、要做什麼，還得翻好幾個地方。\n2. **做事順序靠人記。** 先扣血、再改狀態、最後判勝負；有人順序弄錯，就可能出問題。\n\n### 例子：CanTransitionCombatState() 沒有集中管理切換規則\n\nweek-10 的 `AFightingCharacter::CanTransitionCombatState()`（`FightingCharacter.cpp` 第 433～440 行）只有這兩層判斷：\n\n```cpp\nif (From == ECombatState::KnockedOut || From == ECombatState::Victory)\n    return From == To;\nreturn true;\n```\n\n它只擋住「離開擊倒或勝利」，其餘切換大多放行。名稱像是負責所有切換資格，但哪些事件能讓角色出招、挨打或恢復，仍要去其他地方找。若把它當成狀態機的完整把關入口，這個設計就很糟：維護者很容易以為改這裡就夠了。\n\n`SetCombatState()` 也主要負責檢查、記錄與賦值；停止攻擊、清理反應、設定計時器與播放動畫，仍靠周邊流程安排。因此有統一寫入狀態的入口，還不足以讓規則與順序一致。\n\n## 改用 State Pattern：每個狀態管好自己的事\n\n保留目前七種狀態。每個狀態物件收齊四件事：**進入要做什麼、離開要清什麼、能接受哪些事件、允許哪些操作**。\n\n例如要改 Hitstun，就到 `HitstunState` 找這四件事。這裡的集中，是同一個狀態的規則放在一起；不需要把所有狀態塞進一個巨大的判斷函式。狀態物件只定義行為，每名角色的血量、硬直長度與計時器放在自己的 Context，避免多名角色共用狀態物件時互相影響。\n\n### 狀態機的唯一切換入口\n\n外部送入本幀輸入與事件；狀態機依目前狀態決定怎麼處理。真正切換只經過下面這個內部入口，外部不能自己指定新狀態：\n\n```text\n套用切換：\n  執行舊狀態的離開工作\n  更新目前狀態\n  執行新狀態的進入工作\n```\n\n### C++ 虛擬碼一：把切換順序關進 FSM\n\n```cpp\nstruct Change {\n    IState* Next = nullptr;  // 空值代表維持現況。\n    int Frames = 0;\n    bool Restart = false;\n};\n\nstruct IState {\n    virtual Change OnEvent(const Context&, const Event&) = 0;\n    virtual void Enter(Context&) = 0;\n    virtual void Exit(Context&) = 0;\n    virtual Permissions Allowed() const = 0;\n    virtual ~IState() = default;\n};\n\nclass CombatFSM {\npublic:\n    Permissions Allowed() const { return Current->Allowed(); }\n\nprivate:\n    friend class CombatSystem;  // 對戰流程負責投遞事件。\n    Context& Ctx;\n    IState* Current;\n\n    void Send(const Event& event) {\n        Change next = Current->OnEvent(Ctx, event);\n        if (!next.Next || (next.Next == Current && !next.Restart)) return;\n        Current->Exit(Ctx);\n        Current = next.Next;\n        Ctx.StunFrames = next.Frames;\n        Current->Enter(Ctx);\n    }\n};\n```\n\n`Send()` 是私有入口。輸入、動畫回呼與計時器只提交事件給對戰流程，不直接修改 `Current`。狀態回傳切換決定後，由 FSM 保證 Exit → 更新狀態 → Enter。需要重新進入同一狀態時，明確設定 Restart，不能一律因「狀態相同」而跳過。\n\n### C++ 虛擬碼二：Hitstun 的規則放在同一個狀態裡\n\n```cpp\nclass HitstunState : public IState {\npublic:\n    Change OnEvent(const Context& c, const Event& e) override {\n        if (e.Kind == Event::Hit) {  // 已結算、未防住的命中。\n            if (c.HP \u003c= 0) return { &States::KnockedOut };\n            if (e.Frames > 0) return { this, e.Frames, true };\n        }\n        if (e.Kind == Event::StunExpired)\n            return { c.WantsGuard ? &States::Defending : &States::Neutral };\n        return {};  // 動畫播完不解除硬直；0 幀新命中也不清掉舊硬直。\n    }\n\n    void Enter(Context& c) override {\n        c.CancelAttackAndCommands();\n        c.StartStunTimer(c.StunFrames);\n        c.PlayHitReaction();\n    }\n    void Exit(Context& c) override {\n        c.ClearStunTimerAndCallbacks();\n        c.FadeOutReaction();\n    }\n    Permissions Allowed() const override { return { false, false, false }; }\n};\n```\n\n權限依序代表移動、出招、防禦。其他系統查詢 `Allowed()`，再檢查落地等環境條件，不各自重寫戰鬥狀態的判斷。硬直中再被打會重新進入 Hitstun，重設計時並重播反應；血歸零則進 KnockedOut。`HitstunState` 不需要知道 A、B 哪一拳先算。\n\n## State Pattern 還不夠：雙方結算也要有唯一入口\n\nState Pattern 整理的是每個角色的狀態行為。同幀互打的先後順序，另由對戰流程統一安排。否則即使換成狀態物件，外部仍可能提早送出事件，讓其中一拳被取消。\n\n```cpp\nclass CombatSystem {\npublic:\n    void AdvanceFrame(const FrameInput& input) {\n        auto results = ResolveBothHits(input);\n        ApplyBothHealth(results);\n        A.FSM.Send(results.ToA);\n        B.FSM.Send(results.ToB);\n        DeliverMatchEvents(EvaluateMatchResult());\n    }\n\nprivate:\n    // 命中結算、扣血、事件投遞與判勝負，只能由上面的流程安排。\n    // ResolveBothHits / ApplyBothHealth / DeliverMatchEvents 等細節省略。\n};\n```\n\n對外只開放 `AdvanceFrame()`。它先算完雙方合法命中，再套用雙方扣血與狀態事件，最後判勝負。雙方都歸零就都倒下；單方勝出時，勝負事件交給對應狀態處理，Attacking 收到勝出結果仍要等本招完整收尾，才能進 Victory。\n\n## 套回 B 被 U 打中的例子\n\n1. B 正在 Attacking，被 A 的 U 打中。對戰流程先記下命中結果，B 仍能完成同一幀的攻擊結算。\n2. 雙方都算完後扣血。B 還有血，收到 12 幀受擊事件。\n3. `AttackingState` 接受受擊事件，回傳「轉到 Hitstun、12 幀」；FSM 統一執行舊狀態 Exit、新狀態 Enter。原攻擊的清理由 Attacking 的 Exit 與角色動作介面負責，允許安全重複清理。\n4. Hitstun 開始計時與播放反應。0.2 秒遊戲時間後收到到期事件，依防禦意圖恢復可行動。\n\n**兩個問題各有固定的解法：狀態規則放進各自的 State；雙方結算與切換順序收進不讓外部拆開呼叫的入口。**\n\n### 這段虛擬碼省略了什麼？\n\n`Context`、`Event`、`States` 與各角色的建構細節省略；其餘六個 State 仍需依目前規格補齊。FrameInput 也包含排入本幀的計時器、動畫等事件，示例僅展開命中結算主線。真正實作還要處理舊計時器／動畫事件的識別、零硬直、防禦續接、終態與生命週期，並驗證同幀雙倒等案例。這裡示範責任與入口如何設計，沒有宣稱這幾段已涵蓋完整遊戲。\n","html":"\u003c!doctype html>\u003chtml lang=\"zh-Hant\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cstyle>\n.paper pre.syntax-pre{background:#f5f7fa;border-color:#cedae5;color:#243746;font-family:Consolas,'Microsoft JhengHei',monospace;font-size:16px;line-height:1.7}\n.paper pre.syntax-pre code.syntax-code{background:none;color:#243746;padding:0;font:inherit}\n.syn-comment{color:#54705b}.syn-type{color:#006b73;font-weight:650}.syn-declaration{color:#174c99;font-weight:750;text-decoration:underline;text-underline-offset:3px}.syn-keyword{color:#8035a3;font-weight:650}.syn-string{color:#a23a26}.syn-number,.syn-constant{color:#865800}.syn-function{color:#795200}.syn-macro{color:#8035a3}.syn-prefix{color:#64717e}.syn-added{color:#1c7051;font-weight:650}.syn-removed{color:#ab3535;font-weight:650}\n*{box-sizing:border-box}body{margin:0;padding:24px;color:#19364e;background:#fff;font:20px/1.7 'Microsoft JhengHei','Segoe UI',sans-serif}article{max-width:1120px;margin:auto}h1{font-size:30px}h2{font-size:26px;color:#087481;margin-top:1.8em}h3{font-size:23px;margin-top:1.5em}pre{padding:18px;background:#f2f6f7;border-left:4px solid #087f8c;white-space:pre-wrap;overflow-wrap:anywhere;font:19px/1.6 Consolas,'Microsoft JhengHei',monospace}code{font-family:Consolas,'Microsoft JhengHei',monospace}p,li{overflow-wrap:anywhere}@media(max-width:800px){body{padding:14px}}\u003c/style>\u003c/head>\u003cbody>\u003carticle>\u003ch1>目前這個遊戲狀態機的設計壞味道\u003c/h1>\n\u003cp>以下先檢視 week-10 的現有設計，再示範採用 State Pattern 的遊戲有限狀態機（Finite State Machine，FSM）。虛擬碼是改善方向，不是目前教材原始碼，也不是可直接貼入專案的完整實作。\u003c/p>\n\u003ch2>目前哪裡不好？\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>狀態放一起，規則還是散的。\u003c/strong> 想知道一個狀態怎麼進、怎麼出、要做什麼，還得翻好幾個地方。\u003c/li>\n\u003cli>\u003cstrong>做事順序靠人記。\u003c/strong> 先扣血、再改狀態、最後判勝負；有人順序弄錯，就可能出問題。\u003c/li>\n\u003c/ol>\n\u003ch3>例子：CanTransitionCombatState() 沒有集中管理切換規則\u003c/h3>\n\u003cp>week-10 的 \u003ccode>AFightingCharacter::CanTransitionCombatState()\u003c/code>（\u003ccode>FightingCharacter.cpp\u003c/code> 第 433～440 行）只有這兩層判斷：\u003c/p>\n\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-cpp syntax-code\">\u003cspan class=\"syn-keyword\">if\u003c/span> (From == \u003cspan class=\"syn-type\">ECombatState\u003c/span>::KnockedOut || From == \u003cspan class=\"syn-type\">ECombatState\u003c/span>::Victory)\n    \u003cspan class=\"syn-keyword\">return\u003c/span> From == To;\n\u003cspan class=\"syn-keyword\">return\u003c/span> \u003cspan class=\"syn-keyword\">true\u003c/span>;\n\u003c/code>\u003c/pre>\n\u003cp>它只擋住「離開擊倒或勝利」，其餘切換大多放行。名稱像是負責所有切換資格，但哪些事件能讓角色出招、挨打或恢復，仍要去其他地方找。若把它當成狀態機的完整把關入口，這個設計就很糟：維護者很容易以為改這裡就夠了。\u003c/p>\n\u003cp>\u003ccode>SetCombatState()\u003c/code> 也主要負責檢查、記錄與賦值；停止攻擊、清理反應、設定計時器與播放動畫，仍靠周邊流程安排。因此有統一寫入狀態的入口，還不足以讓規則與順序一致。\u003c/p>\n\u003ch2>改用 State Pattern：每個狀態管好自己的事\u003c/h2>\n\u003cp>保留目前七種狀態。每個狀態物件收齊四件事：\u003cstrong>進入要做什麼、離開要清什麼、能接受哪些事件、允許哪些操作\u003c/strong>。\u003c/p>\n\u003cp>例如要改 Hitstun，就到 \u003ccode>HitstunState\u003c/code> 找這四件事。這裡的集中，是同一個狀態的規則放在一起；不需要把所有狀態塞進一個巨大的判斷函式。狀態物件只定義行為，每名角色的血量、硬直長度與計時器放在自己的 Context，避免多名角色共用狀態物件時互相影響。\u003c/p>\n\u003ch3>狀態機的唯一切換入口\u003c/h3>\n\u003cp>外部送入本幀輸入與事件；狀態機依目前狀態決定怎麼處理。真正切換只經過下面這個內部入口，外部不能自己指定新狀態：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">套用切換：\n  執行舊狀態的離開工作\n  更新目前狀態\n  執行新狀態的進入工作\n\u003c/code>\u003c/pre>\n\u003ch3>C++ 虛擬碼一：把切換順序關進 FSM\u003c/h3>\n\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-cpp syntax-code\">\u003cspan class=\"syn-keyword\">struct\u003c/span> Change {\n    \u003cspan class=\"syn-type\">IState\u003c/span>* \u003cspan class=\"syn-declaration\">Next\u003c/span> = \u003cspan class=\"syn-keyword\">nullptr\u003c/span>;  \u003cspan class=\"syn-comment\">// 空值代表維持現況。\u003c/span>\n    \u003cspan class=\"syn-type\">int\u003c/span> \u003cspan class=\"syn-declaration\">Frames\u003c/span> = \u003cspan class=\"syn-number\">0\u003c/span>;\n    \u003cspan class=\"syn-type\">bool\u003c/span> \u003cspan class=\"syn-declaration\">Restart\u003c/span> = \u003cspan class=\"syn-keyword\">false\u003c/span>;\n};\n\n\u003cspan class=\"syn-keyword\">struct\u003c/span> \u003cspan class=\"syn-type\">IState\u003c/span> {\n    \u003cspan class=\"syn-keyword\">virtual\u003c/span> Change \u003cspan class=\"syn-function\">OnEvent\u003c/span>(\u003cspan class=\"syn-keyword\">const\u003c/span> Context&amp;, \u003cspan class=\"syn-keyword\">const\u003c/span> Event&amp;) = \u003cspan class=\"syn-number\">0\u003c/span>;\n    \u003cspan class=\"syn-keyword\">virtual\u003c/span> \u003cspan class=\"syn-type\">void\u003c/span> \u003cspan class=\"syn-function\">Enter\u003c/span>(Context&amp;) = \u003cspan class=\"syn-number\">0\u003c/span>;\n    \u003cspan class=\"syn-keyword\">virtual\u003c/span> \u003cspan class=\"syn-type\">void\u003c/span> \u003cspan class=\"syn-function\">Exit\u003c/span>(Context&amp;) = \u003cspan class=\"syn-number\">0\u003c/span>;\n    \u003cspan class=\"syn-keyword\">virtual\u003c/span> Permissions \u003cspan class=\"syn-function\">Allowed\u003c/span>() \u003cspan class=\"syn-keyword\">const\u003c/span> = \u003cspan class=\"syn-number\">0\u003c/span>;\n    \u003cspan class=\"syn-keyword\">virtual\u003c/span> ~\u003cspan class=\"syn-type\">IState\u003c/span>() = default;\n};\n\n\u003cspan class=\"syn-keyword\">class\u003c/span> CombatFSM {\n\u003cspan class=\"syn-keyword\">public\u003c/span>:\n    Permissions \u003cspan class=\"syn-function\">Allowed\u003c/span>() \u003cspan class=\"syn-keyword\">const\u003c/span> { \u003cspan class=\"syn-keyword\">return\u003c/span> Current-&gt;\u003cspan class=\"syn-function\">Allowed\u003c/span>(); }\n\n\u003cspan class=\"syn-keyword\">private\u003c/span>:\n    friend \u003cspan class=\"syn-keyword\">class\u003c/span> CombatSystem;  \u003cspan class=\"syn-comment\">// 對戰流程負責投遞事件。\u003c/span>\n    Context&amp; Ctx;\n    \u003cspan class=\"syn-type\">IState\u003c/span>* \u003cspan class=\"syn-declaration\">Current\u003c/span>;\n\n    \u003cspan class=\"syn-type\">void\u003c/span> \u003cspan class=\"syn-function\">Send\u003c/span>(\u003cspan class=\"syn-keyword\">const\u003c/span> Event&amp; event) {\n        Change next = Current-&gt;\u003cspan class=\"syn-function\">OnEvent\u003c/span>(Ctx, event);\n        \u003cspan class=\"syn-keyword\">if\u003c/span> (!next.Next || (next.Next == Current &amp;&amp; !next.Restart)) \u003cspan class=\"syn-keyword\">return\u003c/span>;\n        Current-&gt;\u003cspan class=\"syn-function\">Exit\u003c/span>(Ctx);\n        Current = next.Next;\n        Ctx.StunFrames = next.Frames;\n        Current-&gt;\u003cspan class=\"syn-function\">Enter\u003c/span>(Ctx);\n    }\n};\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>Send()\u003c/code> 是私有入口。輸入、動畫回呼與計時器只提交事件給對戰流程，不直接修改 \u003ccode>Current\u003c/code>。狀態回傳切換決定後，由 FSM 保證 Exit → 更新狀態 → Enter。需要重新進入同一狀態時，明確設定 Restart，不能一律因「狀態相同」而跳過。\u003c/p>\n\u003ch3>C++ 虛擬碼二：Hitstun 的規則放在同一個狀態裡\u003c/h3>\n\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-cpp syntax-code\">\u003cspan class=\"syn-keyword\">class\u003c/span> HitstunState : \u003cspan class=\"syn-keyword\">public\u003c/span> \u003cspan class=\"syn-type\">IState\u003c/span> {\n\u003cspan class=\"syn-keyword\">public\u003c/span>:\n    Change \u003cspan class=\"syn-function\">OnEvent\u003c/span>(\u003cspan class=\"syn-keyword\">const\u003c/span> Context&amp; c, \u003cspan class=\"syn-keyword\">const\u003c/span> Event&amp; e) \u003cspan class=\"syn-keyword\">override\u003c/span> {\n        \u003cspan class=\"syn-keyword\">if\u003c/span> (e.Kind == Event::Hit) {  \u003cspan class=\"syn-comment\">// 已結算、未防住的命中。\u003c/span>\n            \u003cspan class=\"syn-keyword\">if\u003c/span> (c.\u003cspan class=\"syn-constant\">HP\u003c/span> &lt;= \u003cspan class=\"syn-number\">0\u003c/span>) \u003cspan class=\"syn-keyword\">return\u003c/span> { &amp;States::KnockedOut };\n            \u003cspan class=\"syn-keyword\">if\u003c/span> (e.Frames &gt; \u003cspan class=\"syn-number\">0\u003c/span>) \u003cspan class=\"syn-keyword\">return\u003c/span> { this, e.Frames, \u003cspan class=\"syn-keyword\">true\u003c/span> };\n        }\n        \u003cspan class=\"syn-keyword\">if\u003c/span> (e.Kind == Event::StunExpired)\n            \u003cspan class=\"syn-keyword\">return\u003c/span> { c.WantsGuard ? &amp;States::Defending : &amp;States::Neutral };\n        \u003cspan class=\"syn-keyword\">return\u003c/span> {};  \u003cspan class=\"syn-comment\">// 動畫播完不解除硬直；0 幀新命中也不清掉舊硬直。\u003c/span>\n    }\n\n    \u003cspan class=\"syn-type\">void\u003c/span> \u003cspan class=\"syn-function\">Enter\u003c/span>(Context&amp; c) \u003cspan class=\"syn-keyword\">override\u003c/span> {\n        c.\u003cspan class=\"syn-function\">CancelAttackAndCommands\u003c/span>();\n        c.\u003cspan class=\"syn-function\">StartStunTimer\u003c/span>(c.StunFrames);\n        c.\u003cspan class=\"syn-function\">PlayHitReaction\u003c/span>();\n    }\n    \u003cspan class=\"syn-type\">void\u003c/span> \u003cspan class=\"syn-function\">Exit\u003c/span>(Context&amp; c) \u003cspan class=\"syn-keyword\">override\u003c/span> {\n        c.\u003cspan class=\"syn-function\">ClearStunTimerAndCallbacks\u003c/span>();\n        c.\u003cspan class=\"syn-function\">FadeOutReaction\u003c/span>();\n    }\n    Permissions \u003cspan class=\"syn-function\">Allowed\u003c/span>() \u003cspan class=\"syn-keyword\">const\u003c/span> \u003cspan class=\"syn-keyword\">override\u003c/span> { \u003cspan class=\"syn-keyword\">return\u003c/span> { \u003cspan class=\"syn-keyword\">false\u003c/span>, \u003cspan class=\"syn-keyword\">false\u003c/span>, \u003cspan class=\"syn-keyword\">false\u003c/span> }; }\n};\n\u003c/code>\u003c/pre>\n\u003cp>權限依序代表移動、出招、防禦。其他系統查詢 \u003ccode>Allowed()\u003c/code>，再檢查落地等環境條件，不各自重寫戰鬥狀態的判斷。硬直中再被打會重新進入 Hitstun，重設計時並重播反應；血歸零則進 KnockedOut。\u003ccode>HitstunState\u003c/code> 不需要知道 A、B 哪一拳先算。\u003c/p>\n\u003ch2>State Pattern 還不夠：雙方結算也要有唯一入口\u003c/h2>\n\u003cp>State Pattern 整理的是每個角色的狀態行為。同幀互打的先後順序，另由對戰流程統一安排。否則即使換成狀態物件，外部仍可能提早送出事件，讓其中一拳被取消。\u003c/p>\n\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-cpp syntax-code\">\u003cspan class=\"syn-keyword\">class\u003c/span> CombatSystem {\n\u003cspan class=\"syn-keyword\">public\u003c/span>:\n    \u003cspan class=\"syn-type\">void\u003c/span> \u003cspan class=\"syn-function\">AdvanceFrame\u003c/span>(\u003cspan class=\"syn-keyword\">const\u003c/span> FrameInput&amp; input) {\n        \u003cspan class=\"syn-type\">auto\u003c/span> \u003cspan class=\"syn-declaration\">results\u003c/span> = \u003cspan class=\"syn-function\">ResolveBothHits\u003c/span>(input);\n        \u003cspan class=\"syn-function\">ApplyBothHealth\u003c/span>(results);\n        A.\u003cspan class=\"syn-constant\">FSM\u003c/span>.\u003cspan class=\"syn-function\">Send\u003c/span>(results.ToA);\n        B.\u003cspan class=\"syn-constant\">FSM\u003c/span>.\u003cspan class=\"syn-function\">Send\u003c/span>(results.ToB);\n        \u003cspan class=\"syn-function\">DeliverMatchEvents\u003c/span>(\u003cspan class=\"syn-function\">EvaluateMatchResult\u003c/span>());\n    }\n\n\u003cspan class=\"syn-keyword\">private\u003c/span>:\n    \u003cspan class=\"syn-comment\">// 命中結算、扣血、事件投遞與判勝負，只能由上面的流程安排。\u003c/span>\n    \u003cspan class=\"syn-comment\">// ResolveBothHits / ApplyBothHealth / DeliverMatchEvents 等細節省略。\u003c/span>\n};\n\u003c/code>\u003c/pre>\n\u003cp>對外只開放 \u003ccode>AdvanceFrame()\u003c/code>。它先算完雙方合法命中，再套用雙方扣血與狀態事件，最後判勝負。雙方都歸零就都倒下；單方勝出時，勝負事件交給對應狀態處理，Attacking 收到勝出結果仍要等本招完整收尾，才能進 Victory。\u003c/p>\n\u003ch2>套回 B 被 U 打中的例子\u003c/h2>\n\u003col>\n\u003cli>B 正在 Attacking，被 A 的 U 打中。對戰流程先記下命中結果，B 仍能完成同一幀的攻擊結算。\u003c/li>\n\u003cli>雙方都算完後扣血。B 還有血，收到 12 幀受擊事件。\u003c/li>\n\u003cli>\u003ccode>AttackingState\u003c/code> 接受受擊事件，回傳「轉到 Hitstun、12 幀」；FSM 統一執行舊狀態 Exit、新狀態 Enter。原攻擊的清理由 Attacking 的 Exit 與角色動作介面負責，允許安全重複清理。\u003c/li>\n\u003cli>Hitstun 開始計時與播放反應。0.2 秒遊戲時間後收到到期事件，依防禦意圖恢復可行動。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>兩個問題各有固定的解法：狀態規則放進各自的 State；雙方結算與切換順序收進不讓外部拆開呼叫的入口。\u003c/strong>\u003c/p>\n\u003ch3>這段虛擬碼省略了什麼？\u003c/h3>\n\u003cp>\u003ccode>Context\u003c/code>、\u003ccode>Event\u003c/code>、\u003ccode>States\u003c/code> 與各角色的建構細節省略；其餘六個 State 仍需依目前規格補齊。FrameInput 也包含排入本幀的計時器、動畫等事件，示例僅展開命中結算主線。真正實作還要處理舊計時器／動畫事件的識別、零硬直、防禦續接、終態與生命週期，並驗證同幀雙倒等案例。這裡示範責任與入口如何設計，沒有宣稱這幾段已涵蓋完整遊戲。\u003c/p>\n\u003c/article>\u003c/body>\u003c/html>"}},{"page":8,"title":"想一想：動作沒播完能動，播完了卻不能動？","demo":1,"kind":"timeline","key":"能不能動要看計時器，不是看動畫。","location":"FightingCharacter.cpp｜HandleReactionEnded()／HandleStunExpired()","lessonRefs":[{"href":"#reading-3016378a","label":"想一想","hint":""}],"max":30,"tracks":[{"label":"素材全長","bars":[{"a":0,"b":20,"text":"AM_Hitted 素材全長 20 幀","tone":"outline"}]},{"label":"Hitstun＝12","reveal":true,"bars":[{"a":0,"b":12,"text":"鎖定","tone":"hot"},{"a":12,"b":20,"text":"已能動","tone":"free"},{"a":20,"b":30,"text":"","tone":"free"}]},{"label":"Hitstun＝30","reveal":true,"bars":[{"a":0,"b":20,"text":"鎖定","tone":"hot"},{"a":20,"b":30,"text":"動作播完，還不能動","tone":"hot"}]}],"markers":[{"f":0,"text":"第 0 幀：CPU 被打中"},{"f":20,"text":"素材全長 20 幀"},{"f":12,"text":"① 第 12 幀恢復","reveal":true,"row":1,"startTrack":1},{"f":30,"text":"② 第 30 幀恢復","reveal":true,"row":1,"startTrack":1}],"steps":[{"title":"想一想｜從 CPU 被打中算第 0 幀","detail":"① Hitstun＝12：第 12 幀時，動畫素材還沒播到結尾，CPU 能動嗎？\n② Hitstun＝30：第 20 幀時，挨打動作播完了，CPU 能動嗎？","focus":[]},{"title":"對照程式","detail":"① 能：第 12 幀硬直到期，動畫開始淡出。② 還不能：第 20 幀仍在硬直，要到第 30 幀才恢復可行動。","focus":[],"reveal":true}],"topicLabel":"想一想"},{"page":9,"title":"設計提需求：Hitstun 與 Blockstun","demo":1,"kind":"prompt","key":"先說清楚參數放哪裡、何時使用，再和 AI 補齊邊界。","location":"無","lessonRefs":[{"href":"#reading-579f828","label":"設計提需求","hint":""}],"steps":[{"title":"本頁重點","detail":"先說清楚參數放哪裡、何時使用，再和 AI 補齊邊界。","focus":[]}],"topicLabel":"設計提需求","prompt":"# 每一招可以分別設定挨打硬直與防禦硬直\n\n## 玩家體驗\n我希望同一招打中對手和被對手防住時，\n對手不能行動的時間可以不同，而且每招都能分別調整。\n\n## 規則\n在 DamageTable 中，為每一招新增兩個參數：\n- Hitstun：對手沒防住、扣血後還有血時，進入挨打硬直的時間。\n- Blockstun：對手防住時，進入防禦硬直的時間；不扣血。\n兩者都是非負整數，單位為設計幀，60 幀等於 1 秒。\n\n硬直期間不能移動或出招，時間到了才能恢復。\n硬直長度由參數決定，與動畫長度無關。\n硬直中再次命中，依新那一擊重新計時，不累加。\n參數為 0 時，不新增硬直，也不播放該次反應動畫。\n\n## 驗收畫面\n以 U 為例：Hitstun＝12、Blockstun＝8。\n打中時挨打硬直 0.2 秒；防住時防禦硬直約 0.133 秒。\n修改資料並 Reimport 後，下一次命中要使用新值。","promptScroll":true},{"page":10,"title":"工程提示詞：依確認規格實作","demo":1,"kind":"prompt","key":"規格已確認，請 AI 先查專案、列施工計畫，再逐項實作。","location":"無","lessonRefs":[{"href":"#reading-5bf508a4","label":"工程給提示詞","hint":""}],"steps":[{"title":"本頁重點","detail":"規格已確認，請 AI 先查專案、列施工計畫，再逐項實作。","focus":[]}],"topicLabel":"工程提示詞","prompt":"# 目標\n依以下規格，讓玩家與 CPU 共用的角色支援\n由 DamageTable 驅動的 Hitstun 與 Blockstun。\n\n## 已確認的實作規格\n1. 資料與介面\n   DamageTable.csv／DT_Damage 新增 Hitstun、Blockstun，\n   皆為非負整數，單位為設計幀，秒數＝幀數 ÷ 60。\n   命中當下查表；沿用共用角色的防禦判斷與命中入口。\n\n2. Init\n   初始化硬直資料與計時器；\n   玩家、CPU 的移動與出招資格共用戰鬥狀態判斷。\n\n3. 命中與硬直處理\n   防住：不扣血，套用 Blockstun；沒防住且仍存活：套用 Hitstun。\n   HP 歸零維持擊倒規則，不先進 Hitstun。\n   硬直使用遊戲時間計時，到期後依防禦意圖恢復可行動。\n   再次命中以新值重算並重播反應；0 幀不新增硬直。\n   動畫播完不解除硬直；硬直到期時收掉尚未結束的反應動畫。\n\n4. End\n   角色結束或離開 PIE 時，清除硬直計時器與相關回呼。\n\n5. 接入與測試\n   驗證一般命中、防住、0 幀、再次命中、動畫長短不同、\n   暫停及 Reimport 生效，並回歸同幀互打與既有出招規則。\n\n## 回覆方式\n先閱讀相關程式與資產，列出修改檔案、實作計畫與待釐清事項。\n完成後逐案回報測試結果，未實測的標明未驗證。\n\n## 施工方式\n開工前先確認實作計畫。一次做一項，\n每項完成並經我確認後 commit，再做下一項。","promptScroll":true},{"page":11,"title":"情境需求：動作太快，怎麼停在想看的那一幀？","demo":2,"kind":"cards","key":"硬直只有 12 幀，要能一鍵暫停、一次走一幀，才看得清楚。","location":"FightingPlayerController.cpp｜SetupInputComponent()","lessonRefs":[{"href":"#reading-3e06a578","label":"設計需求","hint":""},{"href":"#reading-fe028964","label":"① 暫停中也收得到按鍵","hint":""}],"cards":[["想看的畫面","第 34 幀 CPU 恢復的那一刻。"],["原本的做法","開 Console 打 pause、slomo，動作早就過了。"],["UE 提供／專案自己定","UE 提供：暫停、調整時間倍率、限制每幀時間。專案自己定：有哪些倍率、逐格怎麼走、面板顯示什麼。"]],"note":"這些熱鍵只在開發版有，正式版沒有。","steps":[{"title":"本頁重點","detail":"硬直只有 12 幀，要能一鍵暫停、一次走一幀，才看得清楚。","focus":[]}],"topicLabel":"情境需求"},{"page":12,"title":"規則：四組熱鍵各做什麼？","demo":2,"kind":"diagram","key":"遊戲經過的時間＝真實經過的時間 × 倍率。×1 是原速。","location":"FightingPlayerController.cpp｜SetupInputComponent()／ToggleDebugPause()／StepDebugTimeScale()／ToggleCombatDebugHotkey()","lessonRefs":[{"href":"#reading-edaa6df","label":"② 倍率在六個檔位間移動","hint":""},{"href":"#reading-c845a3cb","label":"④ Combat Debug 切換與面板時間行","hint":""}],"steps":[{"title":"本頁重點","detail":"遊戲經過的時間＝真實經過的時間 × 倍率。×1 是原速。","focus":[]}],"topicLabel":"規則與算例","wide":true,"api":[["Space","暫停／恢復，和 Console pause 是同一個暫停。"],["小鍵盤 + -","＋加倍、－減半。讀目前倍率，選下一檔再套用到 World。"],["小鍵盤 .","暫停中前進 1/60 秒；沒暫停時按下只暫停。"],["右 Ctrl＋F12","開關 Combat Debug；左 Ctrl＋F12 與單獨 F12 不動作。"]],"supplement":{"title":"六檔倍率怎麼讀","markdown":"# 六檔倍率怎麼讀\n\n把手機碼表當成真實時間，把遊戲裡的硬直計時器當成遊戲時間。遊戲持續執行且倍率固定時，遊戲經過的時間＝真實經過的時間 × 倍率。\n\n| 檔位 | 真實經過 1 秒時，遊戲走了多久 | 遊戲走滿 1 秒要等多久 |\n|---|---:|---:|\n| ×0.125 | 0.125 秒 | 8 秒 |\n| ×0.25 | 0.25 秒 | 4 秒 |\n| ×0.5 | 0.5 秒 | 2 秒 |\n| ×1（原速） | 1 秒 | 1 秒 |\n| ×2 | 2 秒 | 0.5 秒 |\n| ×4 | 4 秒 | 0.25 秒 |\n\n## UE 怎麼讀取與套用倍率？\n\n1. **讀目前倍率。** `UGameplayStatics::GetGlobalTimeDilation(this)` 回傳這個 Controller 所在 World 目前設定的全域時間倍率。若目前是原速，讀到的就是 1.0。 [Epic Games API 文件](https://dev.epicgames.com/documentation/unreal-engine/API/Runtime/Engine/Kismet/UGameplayStatics/GetGlobalTimeDilation?application_version=5.5)\n2. **選下一檔。** `StepDebugTimeScale()` 拿讀到的倍率找最近檔位，再依按鍵往前或往後移一檔。從 ×1 按小鍵盤 − 會選到 ×0.5。\n3. **套用新倍率。** `UGameplayStatics::SetGlobalTimeDilation()` 把新倍率寫入同一個 World。下次再按小鍵盤 − 時，就從讀到的 ×0.5 選到 ×0.25。\n\n以下是套用新倍率的呼叫。\n\n```cpp\nUGameplayStatics::SetGlobalTimeDilation(this, DebugTimeScales[Target]);\n```\n\n- `this` 是呼叫函式的玩家 Controller。UE 用它找到目前遊玩的 World。\n- `DebugTimeScales[Target]` 是選好的倍率。若傳入 0.5，World 就以半速推進遊戲時間。使用該 World 遊戲時間的動畫和硬直計時器會一起放慢。\n\n檔位、加減鍵與兩端限制由本專案決定。UE 提供的 API 負責將指定倍率套用到 World。 [Epic Games API 文件](https://dev.epicgames.com/documentation/unreal-engine/API/Runtime/Engine/Kismet/UGameplayStatics/SetGlobalTimeDilation?application_version=5.5)\n\n## 讓整個 World 慢動作\n\n在 UE5 中，要讓一個 World 的遊戲時間放慢，可以呼叫 `UGameplayStatics::SetGlobalTimeDilation()`。`this` 可以是該 World 裡的 Actor 或 Controller，UE 用它找到要設定的 World。\n\n```cpp\n// 選下面其中一行，在需要切換速度的時機呼叫。\nUGameplayStatics::SetGlobalTimeDilation(this, 0.5f); // 半速\nUGameplayStatics::SetGlobalTimeDilation(this, 1.0f); // 恢復原速\n```\n\n這裡的「整個 World」指同一個 World 裡使用遊戲時間的系統。以教材為例，角色動畫和硬直計時器會一起放慢。一段從命中起算的 0.2 遊戲秒硬直，在半速下用手機碼表量，約要等 0.4 秒。\n\n教材把倍率整理成六個熱鍵檔位。`SetGlobalTimeDilation()` 接收選好的倍率，將它套用到 World。\n\n## 用硬直算一次\n\n假設硬直從命中起要倒數 0.2 遊戲秒。×0.5 時，每過 1 秒真實時間，遊戲只走 0.5 秒，所以碼表要走 0.2 ÷ 0.5＝0.4 秒。×2 時要等 0.2 ÷ 2＝0.1 秒。三種速度下，硬直都倒數相同的 0.2 遊戲秒。\n\n## 為什麼每按一次就加倍或減半？\n\n這六檔中，每往右一檔，倍率就是左邊那一檔的兩倍。例如從 ×0.25 按小鍵盤 + 到 ×0.5，再按一次到 ×1。按小鍵盤 − 則往另一個方向走，到兩端就停。\n\n如果先用指令設成 ×0.3，程式會先按倍數比例找最近檔位。×0.3 比 ×0.25 快 1.2 倍，×0.5 則比 ×0.3 快約 1.67 倍，因此以 ×0.25 為起點，再依按鍵移一檔。程式用 log2 把倍數比例換成可比較的距離。\n\n暫停時遊戲時間停止。逐格則是另一次操作，會讓遊戲時間固定前進 1/60 秒。","html":"\u003c!doctype html>\u003chtml lang=\"zh-Hant\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cstyle>\n.paper pre.syntax-pre{background:#f5f7fa;border-color:#cedae5;color:#243746;font-family:Consolas,'Microsoft JhengHei',monospace;font-size:16px;line-height:1.7}\n.paper pre.syntax-pre code.syntax-code{background:none;color:#243746;padding:0;font:inherit}\n.syn-comment{color:#54705b}.syn-type{color:#006b73;font-weight:650}.syn-declaration{color:#174c99;font-weight:750;text-decoration:underline;text-underline-offset:3px}.syn-keyword{color:#8035a3;font-weight:650}.syn-string{color:#a23a26}.syn-number,.syn-constant{color:#865800}.syn-function{color:#795200}.syn-macro{color:#8035a3}.syn-prefix{color:#64717e}.syn-added{color:#1c7051;font-weight:650}.syn-removed{color:#ab3535;font-weight:650}\n*{box-sizing:border-box}body{margin:0;padding:24px;color:#19364e;background:#fff;font:20px/1.7 'Microsoft JhengHei','Segoe UI',sans-serif}article{max-width:1120px;margin:auto}h1{font-size:30px}h2{font-size:26px;color:#087481;margin-top:1.8em}h3{font-size:23px;margin-top:1.5em}pre{padding:18px;background:#f2f6f7;border-left:4px solid #087f8c;white-space:pre-wrap;overflow-wrap:anywhere;font:19px/1.6 Consolas,'Microsoft JhengHei',monospace}code{font-family:Consolas,'Microsoft JhengHei',monospace}p,li{overflow-wrap:anywhere}@media(max-width:800px){body{padding:14px}}\u003c/style>\u003c/head>\u003cbody>\u003carticle>\u003ch1>六檔倍率怎麼讀\u003c/h1>\n\u003cp>把手機碼表當成真實時間，把遊戲裡的硬直計時器當成遊戲時間。遊戲持續執行且倍率固定時，遊戲經過的時間＝真實經過的時間 × 倍率。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>檔位\u003c/th>\n\u003cth align=\"right\">真實經過 1 秒時，遊戲走了多久\u003c/th>\n\u003cth align=\"right\">遊戲走滿 1 秒要等多久\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>×0.125\u003c/td>\n\u003ctd align=\"right\">0.125 秒\u003c/td>\n\u003ctd align=\"right\">8 秒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>×0.25\u003c/td>\n\u003ctd align=\"right\">0.25 秒\u003c/td>\n\u003ctd align=\"right\">4 秒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>×0.5\u003c/td>\n\u003ctd align=\"right\">0.5 秒\u003c/td>\n\u003ctd align=\"right\">2 秒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>×1（原速）\u003c/td>\n\u003ctd align=\"right\">1 秒\u003c/td>\n\u003ctd align=\"right\">1 秒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>×2\u003c/td>\n\u003ctd align=\"right\">2 秒\u003c/td>\n\u003ctd align=\"right\">0.5 秒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>×4\u003c/td>\n\u003ctd align=\"right\">4 秒\u003c/td>\n\u003ctd align=\"right\">0.25 秒\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>UE 怎麼讀取與套用倍率？\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>讀目前倍率。\u003c/strong> \u003ccode>UGameplayStatics::GetGlobalTimeDilation(this)\u003c/code> 回傳這個 Controller 所在 World 目前設定的全域時間倍率。若目前是原速，讀到的就是 1.0。 \u003ca href=\"https://dev.epicgames.com/documentation/unreal-engine/API/Runtime/Engine/Kismet/UGameplayStatics/GetGlobalTimeDilation?application_version=5.5\">Epic Games API 文件\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>選下一檔。\u003c/strong> \u003ccode>StepDebugTimeScale()\u003c/code> 拿讀到的倍率找最近檔位，再依按鍵往前或往後移一檔。從 ×1 按小鍵盤 − 會選到 ×0.5。\u003c/li>\n\u003cli>\u003cstrong>套用新倍率。\u003c/strong> \u003ccode>UGameplayStatics::SetGlobalTimeDilation()\u003c/code> 把新倍率寫入同一個 World。下次再按小鍵盤 − 時，就從讀到的 ×0.5 選到 ×0.25。\u003c/li>\n\u003c/ol>\n\u003cp>以下是套用新倍率的呼叫。\u003c/p>\n\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-cpp syntax-code\">\u003cspan class=\"syn-type\">UGameplayStatics\u003c/span>::\u003cspan class=\"syn-function\">SetGlobalTimeDilation\u003c/span>(this, DebugTimeScales[Target]);\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003ccode>this\u003c/code> 是呼叫函式的玩家 Controller。UE 用它找到目前遊玩的 World。\u003c/li>\n\u003cli>\u003ccode>DebugTimeScales[Target]\u003c/code> 是選好的倍率。若傳入 0.5，World 就以半速推進遊戲時間。使用該 World 遊戲時間的動畫和硬直計時器會一起放慢。\u003c/li>\n\u003c/ul>\n\u003cp>檔位、加減鍵與兩端限制由本專案決定。UE 提供的 API 負責將指定倍率套用到 World。 \u003ca href=\"https://dev.epicgames.com/documentation/unreal-engine/API/Runtime/Engine/Kismet/UGameplayStatics/SetGlobalTimeDilation?application_version=5.5\">Epic Games API 文件\u003c/a>\u003c/p>\n\u003ch2>讓整個 World 慢動作\u003c/h2>\n\u003cp>在 UE5 中，要讓一個 World 的遊戲時間放慢，可以呼叫 \u003ccode>UGameplayStatics::SetGlobalTimeDilation()\u003c/code>。\u003ccode>this\u003c/code> 可以是該 World 裡的 Actor 或 Controller，UE 用它找到要設定的 World。\u003c/p>\n\u003cpre class=\"syntax-pre\">\u003ccode class=\"language-cpp syntax-code\">\u003cspan class=\"syn-comment\">// 選下面其中一行，在需要切換速度的時機呼叫。\u003c/span>\n\u003cspan class=\"syn-type\">UGameplayStatics\u003c/span>::\u003cspan class=\"syn-function\">SetGlobalTimeDilation\u003c/span>(this, \u003cspan class=\"syn-number\">0.5f\u003c/span>); \u003cspan class=\"syn-comment\">// 半速\u003c/span>\n\u003cspan class=\"syn-type\">UGameplayStatics\u003c/span>::\u003cspan class=\"syn-function\">SetGlobalTimeDilation\u003c/span>(this, \u003cspan class=\"syn-number\">1.0f\u003c/span>); \u003cspan class=\"syn-comment\">// 恢復原速\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>這裡的「整個 World」指同一個 World 裡使用遊戲時間的系統。以教材為例，角色動畫和硬直計時器會一起放慢。一段從命中起算的 0.2 遊戲秒硬直，在半速下用手機碼表量，約要等 0.4 秒。\u003c/p>\n\u003cp>教材把倍率整理成六個熱鍵檔位。\u003ccode>SetGlobalTimeDilation()\u003c/code> 接收選好的倍率，將它套用到 World。\u003c/p>\n\u003ch2>用硬直算一次\u003c/h2>\n\u003cp>假設硬直從命中起要倒數 0.2 遊戲秒。×0.5 時，每過 1 秒真實時間，遊戲只走 0.5 秒，所以碼表要走 0.2 ÷ 0.5＝0.4 秒。×2 時要等 0.2 ÷ 2＝0.1 秒。三種速度下，硬直都倒數相同的 0.2 遊戲秒。\u003c/p>\n\u003ch2>為什麼每按一次就加倍或減半？\u003c/h2>\n\u003cp>這六檔中，每往右一檔，倍率就是左邊那一檔的兩倍。例如從 ×0.25 按小鍵盤 + 到 ×0.5，再按一次到 ×1。按小鍵盤 − 則往另一個方向走，到兩端就停。\u003c/p>\n\u003cp>如果先用指令設成 ×0.3，程式會先按倍數比例找最近檔位。×0.3 比 ×0.25 快 1.2 倍，×0.5 則比 ×0.3 快約 1.67 倍，因此以 ×0.25 為起點，再依按鍵移一檔。程式用 log2 把倍數比例換成可比較的距離。\u003c/p>\n\u003cp>暫停時遊戲時間停止。逐格則是另一次操作，會讓遊戲時間固定前進 1/60 秒。\u003c/p>\n\u003c/article>\u003c/body>\u003c/html>"},"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1440 212\" role=\"img\" aria-label=\"固定經過 1 秒真實時間，六個檔位分別推進 0.125、0.25、0.5、1、2、4 秒遊戲時間\">\u003cg font-family=\"Microsoft JhengHei, sans-serif\" fill=\"#19364e\" font-size=\"23\">\u003ctext x=\"720\" y=\"28\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"700\">每過 1 秒真實時間，遊戲走幾秒？\u003c/text>\u003ctext x=\"32\" y=\"37\" font-size=\"20\">遊戲秒\u003c/text>\u003cpath d=\"M 105 172 H 1400\" stroke=\"#bdcfd6\" />\u003ctext x=\"85\" y=\"179\" text-anchor=\"end\">0\u003c/text>\u003cpath d=\"M 105 144 H 1400\" stroke=\"#0b7180\" stroke-dasharray=\"8 6\"/>\u003ctext x=\"85\" y=\"151\" text-anchor=\"end\">1\u003c/text>\u003cpath d=\"M 105 116 H 1400\" stroke=\"#bdcfd6\" />\u003ctext x=\"85\" y=\"123\" text-anchor=\"end\">2\u003c/text>\u003cpath d=\"M 105 88 H 1400\" stroke=\"#bdcfd6\" />\u003ctext x=\"85\" y=\"95\" text-anchor=\"end\">3\u003c/text>\u003cpath d=\"M 105 60 H 1400\" stroke=\"#bdcfd6\" />\u003ctext x=\"85\" y=\"67\" text-anchor=\"end\">4\u003c/text>\u003crect x=\"158\" y=\"168.5\" width=\"108\" height=\"3.5\" fill=\"#6297a3\"/>\u003ctext x=\"212\" y=\"162.5\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#f6f9fa\" stroke-width=\"5\">0.125 秒\u003c/text>\u003ctext x=\"212\" y=\"203\" text-anchor=\"middle\" font-weight=\"400\">×0.125\u003c/text>\u003crect x=\"374\" y=\"165\" width=\"108\" height=\"7\" fill=\"#6297a3\"/>\u003ctext x=\"428\" y=\"159\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#f6f9fa\" stroke-width=\"5\">0.25 秒\u003c/text>\u003ctext x=\"428\" y=\"203\" text-anchor=\"middle\" font-weight=\"400\">×0.25\u003c/text>\u003crect x=\"590\" y=\"158\" width=\"108\" height=\"14\" fill=\"#6297a3\"/>\u003ctext x=\"644\" y=\"152\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#f6f9fa\" stroke-width=\"5\">0.5 秒\u003c/text>\u003ctext x=\"644\" y=\"203\" text-anchor=\"middle\" font-weight=\"400\">×0.5\u003c/text>\u003crect x=\"806\" y=\"144\" width=\"108\" height=\"28\" fill=\"#0b7180\"/>\u003ctext x=\"860\" y=\"138\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#f6f9fa\" stroke-width=\"5\">1 秒\u003c/text>\u003ctext x=\"860\" y=\"203\" text-anchor=\"middle\" font-weight=\"700\">×1（原速）\u003c/text>\u003crect x=\"1022\" y=\"116\" width=\"108\" height=\"56\" fill=\"#6297a3\"/>\u003ctext x=\"1076\" y=\"110\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#f6f9fa\" stroke-width=\"5\">2 秒\u003c/text>\u003ctext x=\"1076\" y=\"203\" text-anchor=\"middle\" font-weight=\"400\">×2\u003c/text>\u003crect x=\"1238\" y=\"60\" width=\"108\" height=\"112\" fill=\"#6297a3\"/>\u003ctext x=\"1292\" y=\"54\" text-anchor=\"middle\" paint-order=\"stroke\" stroke=\"#f6f9fa\" stroke-width=\"5\">4 秒\u003c/text>\u003ctext x=\"1292\" y=\"203\" text-anchor=\"middle\" font-weight=\"400\">×4\u003c/text>\u003c/g>\u003c/svg>","inlineExample":{"title":"讓整個 World 慢動作","description":"在 UE5 中，要讓一個 World 的遊戲時間放慢，可以呼叫 UGameplayStatics::SetGlobalTimeDilation()。this 可以是該 World 裡的 Actor 或 Controller，UE 用它找到要設定的 World。","code":"// 選下面其中一行，在需要切換速度的時機呼叫。\nUGameplayStatics::SetGlobalTimeDilation(this, 0.5f); // 半速\nUGameplayStatics::SetGlobalTimeDilation(this, 1.0f); // 恢復原速"}},{"page":13,"title":"算例：為什麼逐格那一幀剛好是 1/60 秒？","demo":2,"kind":"diagram","wide":true,"key":"SetPause 控制放行一幀。幀時間上下限讓這一幀前進 1/60 遊戲秒。","location":"FightingPlayerController.cpp｜StepDebugFrame()，第 140～151 行／Tick()，第 90～102 行","lessonRefs":[{"href":"#reading-df1d8cff","label":"③ 逐格：解除暫停一幀，再停回來","hint":""}],"api":[["×0.25、30 FPS","上下限 1/15，1/15 × 0.25 ＝ 1/60 秒。"],["×1、60 FPS","上下限 1/60，1/60 × 1 ＝ 1/60 秒。"],["為什麼不受影響","上下限一樣，結果就只有一種可能，所以 FPS 和倍率都不影響。"]],"steps":[{"title":"本頁重點","detail":"SetPause 控制放行一幀。幀時間上下限讓這一幀前進 1/60 遊戲秒。","focus":[]}],"topicLabel":"規則與算例","inlineExample":{"title":"用兩次 SetPause 放行一幀","description":"暫停中按逐格，程式先解除 ilter>\u003c/defs>\u003c/svg>"},{"page":16,"title":"想一想：逐格 4 次後，硬直還剩多少？","demo":2,"kind":"question","key":"遊戲時間和真實時間是兩件事。","location":"FightingPlayerController.cpp｜StepDebugFrame()／StepDebugTimeScale()","lessonRefs":[{"href":"#reading-6b559f4c","label":"想一想","hint":""}],"steps":[{"title":"想一想","detail":"U 打中 CPU，CPU 進入 12 幀 Hitstun。在命中那一幀按 Space 停住，按兩下小鍵盤 - 降到 ×0.25，再按 4 下小鍵盤 .。硬直還剩幾幀？按 Space 恢復後，還要多少真實秒？","focus":[]},{"title":"對照程式","detail":"剩 8 幀。逐格每格固定 1/60 遊戲秒，4 格就是 4 幀。恢復後要 8/60 ÷ 0.25 ≈ 0.53 真實秒。","focus":[]}],"topicLabel":"想一想"},{"page":17,"title":"設計提需求：暫停、變速與逐格除錯熱鍵","demo":2,"kind":"prompt","key":"除錯工具也是功能，驗收要能用數字判斷。","location":"無","lessonRefs":[{"href":"#reading-d5b81c76","label":"設計提需求","hint":""}],"steps":[{"title":"本頁重點","detail":"除錯工具也是功能，驗收要能用數字判斷。","focus":[]}],"topicLabel":"設計提需求","prompt":"# 暫停、變速與逐格除錯熱鍵\n## 玩家體驗\n教師在對戰中按一個鍵就能停住畫面、放慢或加快，並在停住時一次前進一個設計幀，看清楚硬直與出招時機；不必開 Console 打指令。\n\n## 規則\n- Space：暫停／恢復，和 Console 的 pause 是同一個暫停。\n- 小鍵盤 + / -：倍率在 ×0.125、×0.25、×0.5、×1、×2、×4 之間移動，到頂或到底停住；暫停中也能調，恢復後沿用。\n- 小鍵盤 .：暫停中前進剛好 1/60 遊戲秒，不受倍率與實際 FPS 影響；沒暫停時按下只暫停；按住不連發。\n- 右 Ctrl + F12：開關 Combat Debug；左 Ctrl + F12 與單獨 F12 不動作。\n- 每次按鍵都有約 2 秒的畫面訊息；Combat Debug 面板顯示倍率、是否暫停與這次暫停前進了幾格。\n- 暫停與變速不改變任何戰鬥結果；正式版（Shipping）沒有這些熱鍵。\n\n## 驗收畫面\n暫停後恢復、與 Console pause 混用、逐格 4 次後硬直剛好少 4 幀（×1 與 ×0.25 各一次）、沒暫停時按逐格、倍率按到兩端、暫停中改倍率後恢復、右 Ctrl+F12 開關與左 Ctrl+F12 無反應。"},{"page":18,"title":"工程提示詞：先談規格，確認後才實作","demo":2,"kind":"prompt","key":"先談規格，確認後才實作，一次做一項。","location":"無","lessonRefs":[{"href":"#reading-7456c4ba","label":"工程給提示詞","hint":""}],"steps":[{"title":"本頁重點","detail":"先談規格，確認後才實作，一次做一項。","focus":[]}],"topicLabel":"工程提示詞","prompt":"# 目標\n依附上的「暫停、變速與逐格除錯熱鍵」設計需求，在本機格鬥玩家 Controller 加入非 Shipping 的除錯熱鍵。\n\n## 請依以下順序提出規格\n1. 定義資料與介面：熱鍵由哪個類別負責、要保存哪些逐格狀態與倍率檔位；面板如何讀取時間狀態。\n2. Init：在哪個時機綁定按鍵，如何確保暫停中仍收得到按鍵，以及正式版如何排除。\n3. Tick：逐格如何讓下一幀的遊戲時間剛好是 1/60 秒，再於哪個時機重新暫停、還原設定與計數；同一幀又被暫停時如何處理。\n4. End：PIE 在逐格途中結束時，如何還原被改過的時間設定。\n5. 接入與測試：如何與既有的暫停指令、Combat Debug 指令及面板共用狀態；列出對應設計驗收的測試案例。\n\n## 回覆方式\n先閱讀專案中相關的既有程式與資產，再回覆以上五項規格與要修改的檔案。完成後回報每個驗收案例的 PIE 結果，未實測的標明未驗證。\n\n## 施工方式\n開工前先跟我確認規格。之後依規格順序一次做一項，每完成一項，經我確認無誤後 commit，再做下一項。"},{"page":19,"title":"規則回顧：CPU 何時抽防禦，何時根本不能防？","demo":3,"kind":"ladder","rows":[["你起手，出現新的攻擊序列","","","CPU 每一波只判斷這一次"],["CPU 能行動，而且距離 ≤ 120 cm？","否","這一波不抽，防不了","是"]],"last":"抽一次 DefenseChance，小於機率就準備，12 幀後正式防禦","key":"你起手時 CPU 只抽一次，而且當下要有資格才抽。","location":"FightingCharacter.cpp｜SubmitCommand()／StartAttack()；FightingCpuCharacter.cpp｜UpdateAIDefenseDecision()","lessonRefs":[{"href":"#w10-3-5","label":"追蹤路徑一","hint":"讀序列編號什麼時候加 1。"},{"href":"#w10-3-6","label":"追蹤路徑二","hint":"讀步驟 1～4 的資格與抽籤。"}],"api":[["CPU 出招中","正在 Attacking，沒有抽籤資格。"],["CPU 硬直中","正在 Blockstun 或 Hitstun，沒有抽籤資格。"],["距離超過 120 cm","超出 DefenseDistance，不抽籤。"]],"note":"Link 接出的招序列編號不變，不算新一波。","steps":[{"title":"本頁重點","detail":"你起手時 CPU 只抽一次，而且當下要有資格才抽。","focus":[]}],"topicLabel":"規則與算例"},{"page":20,"title":"課堂實作 1：鐵壁 CPU，找出還打得進去的攻略","demo":3,"kind":"cards","key":"","location":"/Game/Fighting/AI/ST_FightingCpu｜DefenseChance；FightingCpuCharacter.cpp｜UpdateAIDefenseDecision()","lessonRefs":[{"href":"#reading-aa8b1caf","label":"題目","hint":""},{"href":"#reading-9e0b17b7","label":"參考答案","hint":""}],"cardIntro":["第 1 步｜設定鐵壁 CPU","把 DefenseChance 設成 1.0，先 Compile 再 Save。進 PIE 後用 CPUDefense auto。","CPUDefense on 會強制防禦，提示 2 就不成立。"],"cardsHeading":"第 2 步｜找出兩種破解方法","cards":[["提示 1｜確反","讓 CPU 先出招。\n你擋住後，趁它還在收招時反擊。"],["提示 2｜拉長防禦硬直","在 DamageTable.csv 拉長踢頭的 Blockstun。",{"sequence":"踢頭被擋 → 等自己收完招 → 再按 U","detail":"直接接成連招仍會被擋。收完再按 U 才算新一輪，CPU 還在硬直就來不及防。","headers":["踢頭硬直","U 的實測結果","CPU 血量"],"rows":[["12 幀","被擋","100 → 100"],["120 幀","打中","100 → 90（扣 10）"]]}]],"note":"實機展示兩種打法，用時間軸說明為什麼有效，以及練習 1 的連打為什麼失效。","steps":[{"title":"本頁重點","detail":"","focus":[]}],"topicLabel":"課堂實作"}];

function scale(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1600,(innerHeight-56)/900))}
function wrap(s,max=34){if(s.includes('\n'))return s.split('\n');let a=[],l='',w=0;for(const c of s){const n=c.charCodeAt(0)>255?2:1;if(w+n>max){a.push(l);l='';w=0}l+=c;w+=n}if(l)a.push(l);return a}
function sequence(s){const xs=s.lanes.map((_,i)=>85+i*(880/(s.lanes.length-1)));return `<svg viewBox="0 0 1050 520" role="img" aria-label="${esc(s.title)}"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#087f8c"/></marker></defs>${s.lanes.map((n,i)=>`<rect x="${xs[i]-80}" y="4" width="160" height="42" rx="6" fill="#e3f1ed"/><text x="${xs[i]}" y="33" text-anchor="middle" font-size="24">${esc(n)}</text><path class="lifeline" d="M${xs[i]} 48V515"/>`).join('')}${s.messages.map((m,i)=>{const a=xs[m.a],b=xs[m.b],y=112+i*(s.messages.length>5?68:82),self=a===b,tx=self?Math.min(a+22,600):(a+b)/2,lines=wrap(m.text,self?36:34);return `<g class="message phase-${m.phase??0} ${!s.overview&&i===stepIndex?'active':''}" data-phase="${m.phase??0}" data-message="${i}"><rect x="${self?Math.min(a+8,585):Math.max(5,tx-245)}" y="${y-52}" width="${self?440:490}" height="${lines.length>1?52:28}" rx="4" fill="transparent"/><text x="${tx}" y="${y-29}" text-anchor="${self?'start':'middle'}">${lines.map((l,j)=>`<tspan x="${tx}" dy="${j?25:0}">${esc(l)}</tspan>`).join('')}</text><path d="${self?`M${a} ${y}h45v18h-45`:`M${a} ${y}H${b}`}" marker-end="url(#arrow)" ${m.returned?'stroke-dasharray="7 5"':''}/></g>`}).join('')}</svg>`}
function lessonLink(r){return `<a href="${esc(r.href)}" data-lesson="${esc(r.href.slice(1))}">${esc(r.label)} →</a>`}
function discussion(s){return s.discussion?`<div class="discussion"><p>${esc(s.discussion.question)}</p><a href="#discussion-answer-${s.page}" data-answer aria-expanded="false" aria-controls="discussion-answer-${s.page}">看解答 →</a><div id="discussion-answer-${s.page}" hidden><p>${esc(s.discussion.answer)}</p>${s.discussion.source?`<p class="discussion-source">${esc(s.discussion.source)}</p>`:''}</div></div>`:''}
function side(s,st){const r=st.lessonRef??s.lessonRefs?.[0];return `<aside class="side">${r&&(s.kind==='sequence'||!s.api)?`<div class="lesson-card"><h2>看完整實作</h2>${lessonLink(r)}${r.hint?`<p>${esc(r.hint)}</p>`:''}</div>`:''}${s.api?s.api.map(a=>`<div class="api-item"><h2>${esc(a[0])}</h2><p>${esc(a[1])}</p></div>`).join(''):''}<p class="note">${esc(s.note??'')}</p></aside>`}
function timeline(s,st){const left=190,right=1520,x=f=>left+f*(right-left)/s.max,show=t=>!t.reveal||st.reveal,h=s.tracks.length*84+74;
 const tracks=s.tracks.map((t,i)=>{const y=62+i*84;if(!show(t))return `<text x="20" y="${y+43}" class="tl-label">${esc(t.label)}</text><rect x="${left}" y="${y}" width="${right-left}" height="62" rx="6" class="tl-hidden"/>`;return `<text x="20" y="${y+43}" class="tl-label">${esc(t.label)}</text>`+t.bars.map(b=>`<rect x="${x(b.a)}" y="${y}" width="${x(b.b)-x(b.a)}" height="62" rx="6" class="tl-${b.tone}"/><text x="${(x(b.a)+x(b.b))/2}" y="${y+41}" text-anchor="middle" class="tl-text tl-text-${b.tone}">${esc(b.text)}</text>`).join('')}).join('');
 const marks=(s.markers??[]).filter(m=>!m.reveal||st.reveal).map(m=>`<path d="M${x(m.f)} ${m.startTrack===undefined?42:62+m.startTrack*84}V${h-8}" class="tl-mark"/><text x="${Math.min(x(m.f),right-4)}" y="${30+(m.row??0)*28}" text-anchor="${m.f===s.max?'end':m.f===0?'start':'middle'}" class="tl-mark-text">${esc(m.text)}</text>`).join('');
 return `<svg class="tl-svg" viewBox="0 0 1560 ${h}" role="img" aria-label="${esc(s.title)}">${tracks}${marks}</svg>`}
function view(s){const st=s.steps[stepIndex];
 if(s.kind==='state-machine')return `<div class="state-machine content"><div class="state-comparison">${s.comparison.map(c=>`<article><h2>${esc(c[0])}</h2><p>${esc(c[1])}</p></article>`).join('')}</div><p class="state-premise">${esc(s.note)}</p><table class="state-case"><thead><tr>${s.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="state-question">${esc(s.question)}</p></div>`;
 if(s.kind==='sequence'&&s.overview)return `<div class="sequence-overview content"><p class="overview-premise">${esc(s.note)}</p><div class="overview-body">${sequence(s)}<aside class="overview-points">${s.overview.map((point,i)=>`<article class="overview-point phase-${s.messages.some(m=>m.phase)?i+1:0}"><h2>${esc(point.title)}</h2><p>${esc(point.detail)}</p></article>`).join('')}</aside></div></div>`;
 if(s.kind==='sequence')return `<div class="seq-layout content">${sequence(s)}${side(s,st).replace('<p class="note">','<p class="step-detail">'+esc(st.detail)+'</p><p class="note">')}</div>`;
 if(s.kind==='prompt')return `<pre class="prompt${s.promptScroll?' prompt-scroll':''}"${s.promptScroll?' tabindex="0" aria-label="提示詞內容，可上下捲動"':''}>${esc(s.prompt)}</pre>`;
 if(s.kind==='question')return '<div class="question content"><h2>'+esc(st.title)+'</h2><p>'+esc(st.detail)+'</p></div>';
 if(s.kind==='ladder')return `<div class="diagram-layout content"><div class="ladder">${s.rows.map(r=>`<div class="ladder-row"><div class="ladder-q">${esc(r[0])}</div>${r[2]?`<span class="ladder-yes">${esc(r[1])} →</span><div class="ladder-out">${esc(r[2])}</div>`:''}</div><div class="ladder-down">↓ ${esc(r[3])}</div>`).join('')}<div class="ladder-last">${esc(s.last)}</div>${discussion(s)}</div><aside class="diagram-side">${s.api.map(a=>`<article class="term-card"><h2>${esc(a[0])}</h2><p>${esc(a[1])}</p></article>`).join('')}${s.note?`<p class="note">${esc(s.note)}</p>`:''}</aside></div>`;
 if(s.kind==='diagram'){
  const example=s.inlineExample;
  const intro=example?`<section class="diagram-example"><h2>${esc(example.title)}</h2><p>${esc(example.description)}</p><pre><code>${esc(example.code)}</code></pre></section>`:'';
  const cards=s.api.map(a=>`<article class="term-card"><h2>${esc(a[0])}</h2><p>${esc(a[1])}</p></article>`).join('');
  return `<div class="diagram-layout content ${s.wide?'wide':''}${example?' has-example':''}">${intro}<figure class="diagram">${s.svg}</figure><aside class="diagram-side">${cards}${s.note?`<p class="note">${esc(s.note)}</p>`:''}</aside></div>`;
 }
 if(s.kind==='timeline')return `<div class="tl-layout content">${timeline(s,st)}${s.cards?`<div class="tl-cards">${s.cards.map(c=>`<article class="term-card"><h2>${esc(c[0])}</h2><p>${esc(c[1])}</p></article>`).join('')}</div>`:`<div class="tl-prompt"><strong>${esc(st.title)}</strong><p>${esc(st.detail)}</p></div>`}</div>`;
 const headingTag=s.cardsHeading?'h3':'h2';
 const cards='<div class="cards content" style="grid-template-columns:repeat('+s.cards.length+',minmax(0,1fr))">'+s.cards.map(([title,body,comparison])=>{
  const extra=comparison?`<p><strong>${esc(comparison.sequence)}</strong></p><p>${esc(comparison.detail)}</p>
   <table class="card-comparison"><thead><tr>${comparison.headers.map(label=>`<th scope="col">${esc(label)}</th>`).join('')}</tr></thead>
   <tbody>${comparison.rows.map(row=>`<tr>${row.map(cell=>`<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'';
  return `<article class="card"><${headingTag}>${esc(title)}</${headingTag}><p>${esc(body)}</p>${extra}</article>`;
 }).join('')+'</div>';
 const note=s.note?`<p class="note">${esc(s.note)}</p>`:'';
 if(s.cardIntro){
  const [title,body,warning]=s.cardIntro;
  return `<div class="card-wrap grouped-cards"><section class="card-intro"><h2>${esc(title)}</h2><p>${esc(body)}</p><p class="card-warning">${esc(warning)}</p></section><section class="card-group"><h2>${esc(s.cardsHeading)}</h2>${cards}</section>${note}</div>`;
 }
 return note?`<div class="card-wrap">${cards}${note}</div>`:cards}
function render(){const s=slideData[page];$('stage').className='stage '+(s.kind==='prompt'?'prompt-page ':'')+(s.steps.length===1?'static-page ':'')+($('instant').checked?' instant':'');$('title').textContent=s.title;$('eyebrow').textContent=sectionLabel(s);$('key').innerHTML=esc(s.key)+(s.supplement?`<br><a href="#supplement-slide-${s.page}" data-supplement>${esc(s.supplement.title)} →</a>`:'');$('location').innerHTML=`${s.lessonRefs?.length?`<div class="lesson-index">教案索引：${s.lessonRefs.map(lessonLink).join('　／　')}</div>`:''}<div>程式定位：${esc(s.location)}</div>`;$('pageCount').textContent=`${page+1} / ${slideData.length}`;$('pages').value=page;$('prevPage').disabled=page===0;$('nextPage').disabled=page===slideData.length-1;$('steps').innerHTML=s.steps.map((st,i)=>`<option value="${i}">${i+1} / ${s.steps.length}｜${esc(st.title)}</option>`).join('');$('steps').value=stepIndex;$('previous').disabled=stepIndex===0;$('next').disabled=stepIndex===s.steps.length-1;for(const id of ['play','replay','steps'])$(id).disabled=s.steps.length===1;$('compare').hidden=!s.steps[stepIndex].compare;$('back').hidden=!returnPoint;$('controls').hidden=s.steps.length===1&&!s.steps[0].compare&&!returnPoint;
 $('visual').innerHTML=view(s);scale();}
function setStep(n,manual=true){if(manual)stop();stepIndex=Math.max(0,Math.min(n,slideData[page].steps.length-1));render()}
function pageFromHash(){const match=/^#slide-(\d+)$/.exec(location.hash),number=match?Number(match[1]):0;return Number.isSafeInteger(number)&&number>=1&&number<=slideData.length?number-1:0}
function syncSlideHash(replace=false){const hash='#slide-'+(page+1);if(location.hash!==hash)history[replace?'replaceState':'pushState'](null,'',hash)}
function applySlideHash(){stop();page=pageFromHash();stepIndex=0;returnPoint=null;syncSlideHash(true);render()}
function setPage(n){stop();page=Math.max(0,Math.min(n,slideData.length-1));stepIndex=0;returnPoint=null;render();syncSlideHash()}
$('pages').innerHTML=sections.map((_,demo)=>{const items=slideData.map((s,index)=>({s,index})).filter(({s})=>s.demo===demo);return `<optgroup label="${esc(sectionLabel(items[0].s))}">${items.map(({s,index})=>`<option value="${index}">${index+1}｜${esc(s.topicLabel)}｜${esc(s.title.replace(/^(情境需求|規則與算例|規則回顧|算例|規則|流程|想一想|設計提需求|工程提示詞|課堂實作(?: \d+)?)：/,''))}</option>`).join('')}</optgroup>`}).join('');
$('pages').onchange=e=>setPage(+e.target.value);$('prevPage').onclick=()=>setPage(page-1);$('nextPage').onclick=()=>setPage(page+1);$('steps').onchange=e=>setStep(+e.target.value);$('previous').onclick=()=>setStep(stepIndex-1);$('next').onclick=()=>setStep(stepIndex+1);$('replay').onclick=()=>setStep(0);
$('play').onclick=()=>{if(timer){stop();return}if(stepIndex===slideData[page].steps.length-1)setStep(0);$('play').textContent='暫停';timer=setInterval(()=>{if(stepIndex===slideData[page].steps.length-1){stop();return}setStep(stepIndex+1,false)},2400)};
$('instant').onchange=()=>{$('stage').classList.toggle('instant',$('instant').checked)};
let readerReady=null,readerFocus=null,readerAnchor=null,readerKind='lesson';
function openSupplement(link){
 stop();readerReady=null;readerKind='supplement';readerFocus=link;
 $('lessonTitle').textContent=slideData[page].supplement.title;
 $('lessonFrame').title='同檔補充閱讀';
 document.querySelector('.syntax-legend').hidden=true;
 $('lessonFrame').onload=()=>{$('lessonFrame').contentDocument.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();$('lessonPanel').close()}})};
 $('lessonFrame').srcdoc=slideData[page].supplement.html;
 if(!$('lessonPanel').open)$('lessonPanel').showModal();
}
async function openLesson(anchor,link){
 if(readerKind!=='lesson'){readerReady=null;readerKind='lesson'}
 $('lessonFrame').title='同檔完整教案閱讀';
 document.querySelector('.syntax-legend').hidden=false;
 stop();readerAnchor=anchor;readerFocus=link;
 $('lessonTitle').textContent='完整實作｜'+link.textContent.replace(/\s*→$/,'');
 if(!$('lessonPanel').open)$('lessonPanel').showModal();
 if(!readerReady){readerReady=new Promise(resolve=>{$('lessonFrame').onload=()=>{const doc=$('lessonFrame').contentDocument;doc.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();$('lessonPanel').close()}});resolve()}});$('lessonFrame').srcdoc=embeddedLesson.html}
 await readerReady;if(!$('lessonPanel').open)return;
 const target=$('lessonFrame').contentDocument.getElementById(readerAnchor);
 if(!target)throw Error('找不到內嵌教案段落：'+readerAnchor);
 for(let p=target.parentElement;p;p=p.parentElement)if(p.tagName==='DETAILS')p.open=true;
 target.scrollIntoView({block:'start',behavior:'instant'});
}
$('stage').addEventListener('click',e=>{const answerLink=e.target.closest('a[data-answer]');if(answerLink){e.preventDefault();const answer=$(answerLink.getAttribute('aria-controls'));answer.hidden=!answer.hidden;answerLink.setAttribute('aria-expanded',String(!answer.hidden));answerLink.textContent=answer.hidden?'看解答 →':'收起解答 ↑';return}const supplementLink=e.target.closest('a[data-supplement]');if(supplementLink){e.preventDefault();openSupplement(supplementLink);return}const link=e.target.closest('a[data-lesson]');if(link){e.preventDefault();openLesson(link.dataset.lesson,link)}});
$('closeLesson').onclick=()=>$('lessonPanel').close();
$('lessonPanel').addEventListener('close',()=>{stop();readerFocus?.focus({preventScroll:true})});
$('compare').onclick=()=>{const t=slideData[page].steps[stepIndex].compare;stop();returnPoint={page,stepIndex};page=t.page-1;stepIndex=t.step;render();syncSlideHash()};$('back').onclick=()=>{stop();({page,stepIndex}=returnPoint);returnPoint=null;render();syncSlideHash()};
addEventListener('hashchange',applySlideHash);
addEventListener('resize',scale);addEventListener('keydown',e=>{if($('lessonPanel').open||/SELECT|BUTTON|INPUT/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();stepIndex<slideData[page].steps.length-1?setStep(stepIndex+1):setPage(page+1)}if(e.key==='ArrowLeft'){e.preventDefault();stepIndex?setStep(stepIndex-1):setPage(page-1)}});addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});applySlideHash();
</script></body></html>
